# Decision ledger (REVIEW3 §6): owner answers that are a config value, so "answered but never applied" (641, N2-1) turns
# into a red build instead of a surprise on the live server.
#
# One entry per answer id:
#   id            answer id (quoted), as on the answers pages / docs/OWNER_ANSWERS_REVIEW3.md
#   answer        what the owner decided, in one line
#   module        the module that owns the setting
#   file / path   the typed config file and setting path (plugins/PhoenixSkyblock/<file>)
#   value         the decided value (scalar settings), or
#   item          a value that must be IN a list setting (list settings such as afk keys.milestones)
#   migrate-from  the old code default. At startup a one-time migration (common DecisionMigrations, applied ids are kept in
#                 plugins/PhoenixSkyblock/decisions-applied.yml) sets the decided value in an existing live file ONLY while
#                 the live value still equals this old default; a value the owner set himself is never touched. For a list
#                 setting the old item is replaced by the new one.
#   check         false = documentation only (no typed setting yet, or a file that is not ours). Default true: the unit test
#                 DecisionLedgerTest checks the code default against value/item.
#
# This file is bundled into the plugin jar as decisions.yml (plugin/build.gradle.kts). Add new answers at the end; never
# reuse or edit an applied entry's migrate-from (the migration of an id runs once per server).
decisions:
  - id: "641"
    answer: "Stacked spawners add 1 mob per spawner per spawn (was 4; spawners made 4x the money the balance sheet expects)"
    module: stacking
    file: stacking.yml
    path: spawners.mobs-per-spawner
    value: 1.0
    migrate-from: 4.0

  - id: "R3-15"
    answer: "The AFK pool never gives Blaze keys; the 8 h milestone is a Cinder key"
    module: afk
    file: afk.yml
    path: keys.milestones
    item: "480:cinder:1"
    migrate-from: "480:blaze:1"

  - id: "N2-1"
    answer: "Unlimited island joins per season (0 = unlimited). join-cooldown-hours was read by no code and is removed on load (principle 1, ISL-R3)"
    module: islands
    file: islands.yml
    path: members.max-joins-per-season
    value: 0
    migrate-from: 3

  - id: "R3-22"
    answer: "Full satchel: drops go to the inventory, then /box; the warning shows at most every 3 s"
