# Decision ledger (REVIEW3 §6): owner answers that are a config value, so "answered but never applied" (641, N2-1) turns
# into a red build instead of a surprise on the live server.
#
# One entry per answer id:
#   id            answer id (quoted), as on the answers pages / docs/OWNER_ANSWERS_REVIEW3.md
#   answer        what the owner decided, in one line
#   module        the module that owns the setting
#   file / path   the typed config file and setting path (plugins/PhoenixSkyblock/<file>)
#   value         the decided value (scalar settings), or
#   item          a value that must be IN a list setting (list settings such as afk keys.milestones)
#   migrate-from  the old code default. At startup a one-time migration (common DecisionMigrations, applied ids are kept in
#                 plugins/PhoenixSkyblock/decisions-applied.yml) sets the decided value in an existing live file ONLY while
#                 the live value still equals this old default; a value the owner set himself is never touched. For a list
#                 setting the old item is replaced by the new one.
#   check         false = documentation only (no typed setting yet, or a file that is not ours). Default true: the unit test
#                 DecisionLedgerTest checks the code default against value/item.
#
# This file is bundled into the plugin jar as decisions.yml (plugin/build.gradle.kts). Add new answers at the end; never
# reuse or edit an applied entry's migrate-from (the migration of an id runs once per server).
decisions:
  - id: "641"
    answer: "Stacked spawners add 1 mob per spawner per spawn (was 4; spawners made 4x the money the balance sheet expects)"
    module: stacking
    file: stacking.yml
    path: spawners.mobs-per-spawner
    value: 1.0
    migrate-from: 4.0

  - id: "R3-15"
    answer: "The AFK pool never gives Blaze keys; the 8 h milestone is a Cinder key"
    module: afk
    file: afk.yml
    path: keys.milestones
    item: "480:cinder:1"
    migrate-from: "480:blaze:1"

  - id: "N2-1"
    answer: "Unlimited island joins per season (0 = unlimited). join-cooldown-hours (24 live) is read by no code: open question"
    module: islands
    file: islands.yml
    path: members.max-joins-per-season
    value: 0
    migrate-from: 3

  - id: "R3-22"
    answer: "Full satchel: drops go to the inventory, then /box; the warning shows at most every 3 s"
    module: depths
    file: depths.yml
    path: satchel.full-warning-ms
    value: 3000
    migrate-from: 1500

  - id: "R3-9b"
    answer: "Helpers can't read DMs in /logs; DMs are their own audit category, kept as short as chat"
    module: core
    file: audit.yml
    path: retention.short-categories
    item: "dm"
    # migrated by AuditConfig version 2 (ValueChange), not here

  - id: "R3-40"
    answer: "Money notes: soft limit 20 notes a minute instead of a 10 s cooldown (notes.withdraw-cooldown-seconds removed)"
    module: economy
    file: economy.yml
    path: notes.max-per-minute
    value: 20

  - id: "R3-40b"
    answer: "Cashed money_notes rows are purged 90 days after they were cashed (async, batched)"
    module: economy
    file: economy.yml
    path: notes.purge-redeemed-days
    value: 90

  - id: "F12"
    answer: "Hoppers move 64 items every 8 ticks"
    module: server
    file: spigot.yml
    check: false
    note: "Not a plugin config: set in the tracked server/spigot.yml (world-settings.default.hopper-amount 64, ticks-per.hopper-transfer 8, ticks-per.hopper-check 8) and server/config/paper-world-defaults.yml (hopper.cooldown-when-full true, disable-move-event false); update-vps.sh rsyncs server/ to the live server. Checked by stacking HopperTransferTest"

  - id: "R3-5b"
    answer: "Crystals can never be transferred (hard rule in code); shard notes on"
    module: economy
    file: economy.yml
    path: notes.currencies
    value: [money, shards]
    migrate-from: [money]

  - id: "R3-6"
    answer: "/eco changes up to $1T apply at once and are flagged; bigger ones wait for an owner/admin Allow (10 min)"
    module: economy
    file: economy.yml
    path: eco.approve-above.money
    value: 1000000000000

  - id: "R3-6b"
    answer: "A waiting /eco change is dropped after 10 minutes"
    module: economy
    file: economy.yml
    path: eco.pending-minutes
    value: 10

  - id: "R3-39"
    answer: "/eco can't target your own account or an account sharing your IP"
    module: economy
    file: economy.yml
    path: eco.block-same-ip
    value: true

  - id: "R3-41"
    answer: "Bank: the 2% withdrawal fee is the only rule; no free minutes, no lost interest"
    module: economy
    file: bank.yml
    path: withdraw.free-minutes
    value: 0
    migrate-from: 10

  - id: "R3-28"
    answer: "A system-detected dupe of a unique item trade-blocks the holders for 24 h automatically (ends by itself)"
    module: moderation
    file: moderation.yml
    path: dupe-trade-block.hours
    value: 24

  - id: "R3-38"
    answer: "Trade value hints: AH median only with 5+ different sellers and buyers, same-IP pairs ignored"
    module: trade
