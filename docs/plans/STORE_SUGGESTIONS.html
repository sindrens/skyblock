<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Suggestions</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--text:#e8eaf0;--muted:#9aa1b2;--line:#2a2f3a;--yes:#2fbf71;--no:#e05050;--other:#e0a030;--accent:#ff7a1a}
@media (prefers-color-scheme: light){:root{--bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#5b6170;--line:#e1e4ea}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
main{max-width:820px;margin:0 auto}
h1{font-size:22px;margin:4px 0}
p.lead{color:var(--muted);margin:0 0 16px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.q h2{font-size:16px;margin:0 0 4px}
.q p{margin:0 0 10px;color:var(--muted)}
.q .why{font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button.sel.yes{background:var(--yes);border-color:var(--yes);color:#fff}
button.sel.no{background:var(--no);border-color:var(--no);color:#fff}
button.sel.other{background:var(--other);border-color:var(--other);color:#fff}
textarea{width:100%;margin-top:8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);padding:8px;font:inherit;display:none}
.out{position:sticky;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:16px}
.out button{background:var(--accent);border-color:var(--accent);color:#fff}
pre{white-space:pre-wrap;font-size:13px;color:var(--muted);margin:8px 0 0}
</style>
</head>
<body>
<main>
<h1>Store, cosmetics, masteries, Black Market: suggestions</h1>
<p class="lead">From your answers I wrote the plan (STORE_RANKS_PLAN.md). These are the open points and my suggestions. Click Yes, No or Other on each, then "Copy my answers" and paste it to me. Nothing is built before that.</p>
<div id="list"></div>
<div class="out"><button id="copy">Copy my answers</button> <span id="done" style="color:var(--muted)"></span><pre id="preview"></pre></div>
</main>
<script>
const Q=[["Q6: what may be traded?", "You picked Other on 'nothing bought is tradeable' without a note. Option: cosmetics bought with credits (tags, skins, cosmetic crates) can be withdrawn as items and traded / sold on the auction house; ranks, boosters, pass and profile slots stay on your account.", "Suggested: yes, cosmetics tradeable, the rest bound. (Other: tell me which.)"], ["Server-wide boosters", "Sell +50% / Shards x2 / Tool XP x2 for everyone online, 30 or 60 min (300 / 500 credits). Your name in the boss bar ('Thanks Steve!').", "Suggested: yes. Safe under Mojang's rules (helps everyone), very popular."], ["Cosmetic crate", "A crate with only cosmetics (tags, skins, break effects, trails), never keys, money or boosters. 150 credits a key, also earned now and then.", "Suggested: yes."], ["Break effects", "A particle/sound when your hoe or pickaxe breaks a block (sparks, petals, flames, hearts ...). Only looks. 300-800 credits.", "Suggested: yes. Fits our grind game."], ["Particle trails and auras", "A trail behind you, an aura around you. Only looks.", "Suggested: yes (part of Cosmetics v2)."], ["More tool skins", "10 new skins for hoe, pickaxe, rod and sword (looks only), 250-1,500 credits.", "Suggested: yes."], ["Chat and name colours", "Gradient name colours and chat colours for everyone (ranks already get some for free).", "Suggested: yes."], ["Make your own tag", "Type your own tag (staff approve it first), 1,500 credits.", "Suggested: yes."], ["Island cosmetics", "Island border colour, island name colour, a welcome hologram for visitors, island particles.", "Suggested: yes."], ["Rename tokens", "Rename your island / change your /nick colour once.", "Suggested: yes, cheap (50-100)."], ["Pass tier skip", "Skip one battle pass tier (the pass is cosmetic only), 100 credits.", "Suggested: yes."], ["Gift to a friend", "Buy a rank, the pass or a cosmetic for another player.", "Suggested: yes."], ["Extra /pv vault and loadout slot", "One more vault or loadout preset above your rank.", "Suggested: yes (convenience)."], ["Eclipse key for credits", "The crates sell the Eclipse key for 400 credits today, but our rule says keys are earned only.", "Suggested: remove it (keys earned only); the cosmetic crate replaces it."], ["Supporter wall", "A hologram at spawn thanking this month's supporters (names only, no amounts).", "Suggested: yes."], ["Cosmetic types", "Particles, trails, auras, break effects, kill effects, wings/back items, hats, pets that only follow you, chat bubbles. You design, I build the system and placeholders.", "Suggested: yes, the system first, the items as your designs come."], ["Cosmetic points", "Earned by playing (playtime, achievements, quests, votes), from the monthly rank chest and the cosmetic crate. Spent to upgrade a cosmetic (level 1-10: more particles, colours, a sound, then its perk).", "Suggested: yes."], ["Perks only where it's not competitive", "Perks like speed work on your island, at spawn and in the hub, not at /farm, /mine, /pve or KOTH. That keeps Mojang's rules safe even for paid cosmetics.", "Suggested: yes."], ["Or: perks only on earned cosmetics", "Cosmetics with perks can't be bought with credits, only earned or upgraded with cosmetic points; bought ones are looks only.", "Suggested: no (the first option is simpler). Pick one of these two."], ["Monthly rank chest", "Each month: cosmetic points (Hatchling 100 ... Immortal 1,000) + an exclusive monthly tag; later a monthly cosmetic.", "Suggested: yes."], ["Swift Hands", "Faster block breaking for members everywhere.", "Suggested: yes."], ["Beast Tamer", "More animal drops and faster breeding on the island.", "Suggested: yes."], ["Green Thumb", "+% crops at /farm for members.", "Suggested: yes."], ["Prospector", "+% ores at /mine for members.", "Suggested: yes."], ["Deep Waters", "+% catches at /fish for members.", "Suggested: yes."], ["Monster Hunter", "+% money and loot at /pve for members.", "Suggested: yes."], ["Shard Sense", "+% shards in every area for members.", "Suggested: yes."], ["Quick Learner", "+% tool XP for members.", "Suggested: yes."], ["Booster Bank", "Island boosters last longer.", "Suggested: yes."], ["Team Spirit", "+% everything when 2 or more members are in the same area.", "Suggested: yes. Makes teams fun."], ["Shard bundles", "Farming / mining / fishing / combat shards for money (a big money sink).", "Suggested: yes."], ["Island boosters", "Island sell +50% or shards x2 for 30 min, for crystals.", "Suggested: yes."], ["Personal boosters", "Sell / tool XP / shards boosters for money or crystals.", "Suggested: yes."], ["Lucky Clover and Fertilizer", "The new hoe items (from the hoe plan) now and then.", "Suggested: yes."], ["Mystery Box", "A random rare: a key, a booster, a shard bundle or a cosmetic, for crystals.", "Suggested: yes."], ["Upgrade voucher", "-20% off your island's next upgrade.", "Suggested: yes."], ["Black Market skins", "Tool skins only sold here (looks), for crystals.", "Suggested: yes."], ["Out: Elytra, Wardrobe Tome (small)", "Elytra is cheap to get anyway; the small tome is not worth a slot (the Greater Tome stays).", "Suggested: yes, remove both."], ["Personal and island boosters", "Bought with in-game money and crystals (shop, Black Market), earned from crates, KOTH, the pass. Not for credits.", "Suggested: yes (Mojang-safe)."], ["Server-wide boosters", "Bought with credits in the store (B1) and sometimes from events.", "Suggested: yes."], ["KOTH prize", "2 Conqueror keys + 500 crystals (as now) + an island booster: sell +50% for 30 min for the whole island.", "Suggested: yes."], ["gg rules", "1 earned credit per gg per purchase, no daily limit; the buyer and players on the buyer's IP get none.", "Suggested: yes."]];
const H={"0": "A. One open answer", "1": "B. More things to sell in the credit shop (Tebex stays credit packs only)", "15": "C. Cosmetics v2 (your designs later): perks and cosmetic points", "20": "D. New island masteries (they boost every island member)", "30": "E. Black Market v8 (new offers; keeps: Disenchant Scroll, T5 spawners, Island Charter, set tokens, Mythic book)", "38": "F. Boosters: who can buy what", "40": "G. KOTH and gg"};
const ans={};
const list=document.getElementById('list');
Q.forEach((q,i)=>{
 if(H[i]){const h=document.createElement('h3');h.textContent=H[i];h.style.margin='22px 0 8px';list.appendChild(h);}
 const d=document.createElement('div');d.className='q';
 d.innerHTML=`<h2>${i+1}. ${q[0]}</h2><p>${q[1]}</p><p class="why">${q[2]}</p><div class="btns"><button data-v="yes">Yes</button><button data-v="no">No</button><button data-v="other">Other</button></div><textarea placeholder="Your note"></textarea>`;
 const ta=d.querySelector('textarea');
 d.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  d.querySelectorAll('button').forEach(x=>x.className='');
  b.className='sel '+b.dataset.v; ans[i]={v:b.dataset.v,n:ta.value};
  ta.style.display=b.dataset.v==='other'?'block':'none'; render();
 });
 ta.oninput=()=>{if(ans[i]){ans[i].n=ta.value;render();}};
 list.appendChild(d);
});
function text(){return Q.map((q,i)=>`${i+1}. ${q[0]}: ${ans[i]?ans[i].v.toUpperCase()+(ans[i].n?' ('+ans[i].n+')':''):'-'}`).join('\n');}
function render(){document.getElementById('preview').textContent=text();}
document.getElementById('copy').onclick=async()=>{
 try{await navigator.clipboard.writeText(text());document.getElementById('done').textContent='Copied.';}
 catch(e){document.getElementById('done').textContent='Select the text below and copy it.';}
};
render();
</script>
</body>
</html>
