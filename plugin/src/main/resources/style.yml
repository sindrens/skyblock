# Phoenix Skyblock style (docs/UI_STYLE.md). Used by every message, menu, item and HUD.
# In messages: <c:brand>text</c:brand>, <rarity:epic>, <pillar:mining>, <cur:money>, <area:home>, <tag:crate>, <sym:money>, <grad:phoenix>text</grad>, <prefix>, <notice>
# Each color: "<hex> <legacy fallback for Bedrock>". Legacy names: black dark_blue dark_green dark_aqua dark_red
# dark_purple gold gray dark_gray blue green aqua red light_purple yellow white
# Reload: /skyblock reload core

# Owner 3 Nov 2026: each feature's messages start with its own short label (<prefix>); 'prefix' is for the rest.
prefix: "<c:ember>»</c:ember> "
# System notices to everyone (plan chat look, 4 Nov 2026): <notice><c:text>Items on the ground are cleared in <c:value>60s</c:value>.
# The gradient word PHOENIX and an arrow; the text after it is gray with white values.
notice: "<bold><c:brand>PHOENIX</c:brand></bold> <c:muted>»</c:muted> "
prefixes:
  islands: "<c:island><bold>Island</bold></c:island> <c:muted>»</c:muted> "
  progression: "<c:island><bold>Island</bold></c:island> <c:muted>»</c:muted> "
  production: "<c:island><bold>Island</bold></c:island> <c:muted>»</c:muted> "
  guide: "<c:you><bold>Kindle</bold></c:you> <c:muted>»</c:muted> "
  islandtools: "<c:you><bold>Tools</bold></c:you> <c:muted>»</c:muted> "
  economy: "<c:money><bold>Money</bold></c:money> <c:muted>»</c:muted> "
  shop: "<c:money><bold>Shop</bold></c:money> <c:muted>»</c:muted> "
  auction: "<c:money><bold>Auction</bold></c:money> <c:muted>»</c:muted> "
  trade: "<c:money><bold>Trade</bold></c:money> <c:muted>»</c:muted> "
  depths: "<c:mine><bold>Depths</bold></c:mine> <c:muted>»</c:muted> "
  crates: "<c:reward><bold>Crates</bold></c:reward> <c:muted>»</c:muted> "
  enchants: "<c:skill><bold>Enchants</bold></c:skill> <c:muted>»</c:muted> "
  skills: "<c:skill><bold>Skills</bold></c:skill> <c:muted>»</c:muted> "
  quests: "<c:reward><bold>Contracts</bold></c:reward> <c:muted>»</c:muted> "
  milestones: "<c:reward><bold>Milestones</bold></c:reward> <c:muted>»</c:muted> "
  achievements: "<c:reward><bold>Achievements</bold></c:reward> <c:muted>»</c:muted> "
  collection: "<c:reward><bold>Collection</bold></c:reward> <c:muted>»</c:muted> "
  blackmarket: "<c:money><bold>Black Market</bold></c:money> <c:muted>»</c:muted> "
  social: "<c:people><bold>Social</bold></c:people> <c:muted>»</c:muted> "
  moderation: "<c:server><bold>Server</bold></c:server> <c:muted>»</c:muted> "
  staff: "<c:brand><bold>Staff</bold></c:brand> <c:muted>»</c:muted> "
  essentials: "<c:server><bold>Server</bold></c:server> <c:muted>»</c:muted> "
  profiles: "<c:value><bold>Profile</bold></c:value> <c:muted>»</c:muted> "
  shardblock: "<c:you><bold>Shards</bold></c:you> <c:muted>»</c:muted> "
  cosmetics: "<c:skill><bold>Cosmetics</bold></c:skill> <c:muted>»</c:muted> "
  wardrobe: "<c:skill><bold>Wardrobe</bold></c:skill> <c:muted>»</c:muted> "
  rewards: "<c:reward><bold>Rewards</bold></c:reward> <c:muted>»</c:muted> "
  pass: "<c:reward><bold>Pass</bold></c:reward> <c:muted>»</c:muted> "
  perks: "<c:store><bold>Perks</bold></c:store> <c:muted>»</c:muted> "
  boosters: "<c:event><bold>Boosters</bold></c:event> <c:muted>»</c:muted> "
  stacking: "<c:you><bold>Stacker</bold></c:you> <c:muted>»</c:muted> "
  afk: "<c:server><bold>AFK</bold></c:server> <c:muted>»</c:muted> "
  box: "<c:server><bold>Box</bold></c:server> <c:muted>»</c:muted> "
  tutorial: "<c:you><bold>Tutorial</bold></c:you> <c:muted>»</c:muted> "
  chat: "<c:server><bold>Chat</bold></c:server> <c:muted>»</c:muted> "
  npcs: "<c:server><bold>Server</bold></c:server> <c:muted>»</c:muted> "
  menus: "<c:server><bold>Server</bold></c:server> <c:muted>»</c:muted> "
  pack: "<c:server><bold>Server</bold></c:server> <c:muted>»</c:muted> "
  logs: "<c:brand><bold>Staff</bold></c:brand> <c:muted>»</c:muted> "

colors:
  # Phoenix Skyblock core (V2 palette, owner approved 2026-10-30)
  brand: "#FF5555 red"         # Look v2 (owner 7 Nov 2026): flat red, the PHOENIX of the scoreboard and chat
  frame: "#D1202F dark_red"        # frames and borders (the old dark brand red)
  brand_bright: "#FF5A4D red"
  ember: "#FF8C1A gold"
  flame: "#FFD21A yellow"
  charcoal: "#2B2B2B black"
  parchment: "#E8DCC0 white"
  text: "#E0E0E0 gray"
  muted: "#A0A0A0 dark_gray"
  locked: "#5E5E66 dark_gray"      # empty progress dots, locked entries
  value: "#FFFFFF white"
  action: "#FFE135 yellow"
  # Status
  success: "#4DFF6A green"
  error: "#FF3B3B red"
  warning: "#FFB020 gold"
  info: "#3DC8FF aqua"
  enchant: "#D17AFF light_purple"
  # Lore and HUD (V2): "| Header" sections, bar-prefixed lines, price lines, leaderboard places
  header: "#FF5555 red"
  bar: "#555555 dark_gray"         # Look v2: neutral lore bars (the scoreboard rows use their block colour)
  buy: "#4DFF88 green"
  sell: "#FF5A5A red"
  top1: "#FFD21A yellow"
  top2: "#E6E6E6 white"
  top3: "#FF9A3D gold"
  # SkybornMC network (from the logo)
  sky_frost: "#E4EBF0 white"
  sky_ice: "#9FC6E8 aqua"
  sky_blue: "#6CA1D6 blue"
  sky_steel: "#49649E dark_blue"
  sky_cloud: "#FBFCFF white"
  steel: "#5AB4E5 aqua"            # steel sky (I9 section 8)
  # Look v2 (owner 7 Nov 2026, docs/plans/LOOK_V2.md): one colour per feature, each one of Bedrock's 16 colours.
  label: "#AAAAAA gray"            # scoreboard and menu labels (small caps)
  you: "#FFAA00 gold"
  island: "#55FF55 green"
  farm: "#FFFF55 yellow"
  mine: "#55FFFF aqua"
  fish: "#5555FF blue"
  pve: "#FF5555 red"
  event: "#FF55FF light_purple"
  spawn: "#55FFFF aqua"
  store: "#55FFFF aqua"
  server: "#55FFFF aqua"
  money: "#55FF55 green"
  reward: "#FFFF55 yellow"
  skill: "#FF55FF light_purple"
  people: "#5555FF blue"

currencies:
  money: "#55FF55 green"
  crystals: "#FF55FF light_purple"  # Look v2: crystals light purple (credits are aqua)
  shards: "#FFAA00 gold"        # Farming Shards (Look v2: gold)
  mining_shards: "#55FFFF aqua" # Mining Shards (Look v2: aqua)
  fishing_shards: "#5555FF blue" # Fishing Shards (Look v2: blue)
  combat_shards: "#FF5555 red"  # Combat Shards (Look v2: red)
  credits: "#55FFFF aqua"       # card C1 (Look v2: aqua; the old <cur:gems> and <cur:credits_earned> fall back to this)

# Event tags in chat: one colour each, never clickable (G1-R1-01). Written <tag:crate><bold>[Crate]</bold></tag>
tag:
  crate: "#FFD21A yellow"     # flame gold
  store: "#FF2D3F red"        # brand red
  market: "#4DFF88 green"     # money green
  event: "#FF8C1A gold"       # ember orange
  booster: "#5AB4E5 aqua"     # steel sky

rarity:
  common: "#F2F2F2 white"
  uncommon: "#4DFF6A green"
  rare: "#3DA5FF blue"
  epic: "#C05CFF dark_purple"
  legendary: "#FFB414 gold"
  mythic: "#FF4FD8 light_purple"
  special: "#FF2D3F red"

pillar:
  mining: "#D0D8E4 gray"
  foraging: "#7CFF4D green"
  farming: "#FFE04D yellow"
  combat: "#FF4D4D red"
  conquest: "#FF9A3D gold"
  fishing: "#3DD8FF aqua"

# Menu meaning colours (I9 section 8): <area:money>Shop</area:money>. Names in menus take the colour of what they do.
area:
  money: "#4DFF88 green"      # Shop, Sell, Bank, Auction House, prices
  reward: "#FFD21A yellow"    # Rewards, Daily, Crates, ready counts
  move: "#FF8C1A gold"        # Travel, Back and page arrows, timers, Events
  depths: "#5AB4E5 aqua"      # The Depths, info, crystals
  skills: "#B36BFF dark_purple"  # Skills, Enchanter, Wardrobe, Forge, Collection
  people: "#3DA5FF blue"      # Friends, Members, Parties, Visit
  home: "#7CFF4D green"       # Home, Island
  danger: "#FF3B3B red"       # delete, reset, disband, leave only
  neutral: "#FFFFFF white"    # Settings, Help, Rules, Profiles
  locked: "#5E5E66 dark_gray" # locked entries

# Gradients: color names from 'colors' or hex values. Bedrock shows the first color only.
gradients:
  # Look v2 (owner 7 Nov 2026, "no gradients in text"): every gradient is one flat colour (two equal stops) until the
  # resource pack draws the logo.
  phoenix: ["#FF5555", "#FF5555"]
  flame: ["#FFAA00", "#FFAA00"]
  skyborn: ["#55FFFF", "#55FFFF"]
  legendary: ["#FFAA00", "#FFAA00"]
  mythic: ["#FF55FF", "#FF55FF"]

symbols:
  money: "$"
  crystals: "◆"
  credits: "✦"                  # card C1 (pack glyph U+E204 in I7); <sym:gems> and <sym:credits_earned> fall back to this
  shards: "✧"
  mining_shards: "✧"
  fishing_shards: "✧"
  combat_shards: "✧"
  sparkle: "✦"
  arrow: "»"
  bullet: "▸"
  dot: "·"
  check: "✔"
  cross: "✘"
  star: "★"
  sword: "⚔"
  pickaxe: "⛏"
  heart: "❤"
  time: "⌛"
  line: "│"

# Only these symbols (plus normal letters) are allowed in messages; anything else is reported at load
# because Bedrock may not show it. Add a symbol here only after testing it on a Bedrock client.
bedrock-safe-symbols: "✦ ✧ ◆ ● ▸ ▶ ★ ✔ ✘ ⚔ ⛏ ❤ ⌛ » « │ · •"
