values:
  dash: "<c:muted>-"   # "—" would need a Bedrock test first (style.yml bedrock-safe-symbols)
  money: "<cur:money><sym:money><value>"
  crystals: "<cur:crystals><sym:crystals> <value>"
  credits: "<cur:credits><sym:credits> <value>"
  island: "<c:value>Lv <level></c:value> <c:muted>#<position>"
  island-no-rank: "<c:value>Lv <level>"
  island-here: "<c:value><value>"
  objective: "<c:text>Next: <c:value><value>"
  objective-default: "<c:text>Next: <c:value>Explore /menu"
  # Progress line (<progress:key>): filled dots flame, empty dots the same dot in locked gray (UI_STYLE §4.1).
  progress: "<c:flame><filled></c:flame><c:locked><empty></c:locked> <c:value><percent>%"
  progress-filled: "●"
  progress-empty: "●"
  # Timer line (<timer>): <label> from the module that runs it ("Booster: +50% Sell"), <time> such as 37m or 2h 15m.
  timer: "<c:text><label></c:text> <c:ember><time></c:ember>"
