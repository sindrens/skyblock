  default:
    title: "<bold><gradient:#FF2D3F:#FF6A1A:#FFC21A>PHOENIX SKYBLOCK</gradient></bold>"
    lines:
      - "<soft-blank>"   # blank line under the title, only while the board is short (scoreboard.blank-under-title-max-lines)
      - " <bold><c:header>| You</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Rank:</c:text> <rank>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      # Owner 4 Nov 2026: Farming Shards (red) and Mining Shards (gray-blue) on one row.
      - " <c:bar>|</c:bar> <c:text>Shards:</c:text> <cur:shards><sym:shards> <ph:shards_formatted></cur:shards> <c:muted>·</c:muted> <cur:mining_shards><sym:mining_shards> <ph:mining_shards_formatted>"
      - "if:crystals_owned| <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - "if:credits_owned| <c:bar>|</c:bar> <c:text>Credits:</c:text> <credits>"
      - " <bold><c:header>| Island</c:header></bold>"
      - "if:island_level| <c:bar>|</c:bar> <c:text>Level:</c:text> <island>"
      - "if:objective| <c:bar>|</c:bar> <objective>"
      - "if:island_level| <c:bar>|</c:bar> <progress:island_level_progress>"
      - "if:board_timer| <c:bar>|</c:bar> <timer>"
      - " <c:sky_ice>play.skybornmc.net"

