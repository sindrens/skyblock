      - " <c:you>│</c:you> <c:label><sc>Rank:</sc></c:label> <rank>"
      - " <c:you>│</c:you> <c:label><sc>Money:</sc></c:label> <money>"
      # Owner 4 Nov 2026: Farming Shards (red) and Mining Shards (gray-blue) on one row.
      - " <c:you>│</c:you> <c:label><sc>Shards:</sc></c:label> <cur:shards><sym:shards> <ph:shards_formatted></cur:shards> <c:muted>·</c:muted> <cur:mining_shards><sym:mining_shards> <ph:mining_shards_formatted>"
