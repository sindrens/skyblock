# Perks messages: /craft, /ec, /hat, /nick, /setnick, /realname, /trash, /repair, /sudo.
# MiniMessage + style tags (style.yml). Placeholders are written as <name>. Reload: /skyblock reload perks
# Format (docs/UI_STYLE.md §3): success = <c:success><sym:check></c:success> + gray text, error = <c:error><sym:cross></c:error>
# + gray text with the fix, values in <c:value>.

craft:
  title: "<c:text>Crafting"

hat:
  done: "<prefix><c:success><sym:check></c:success> <c:text>You're wearing <c:value><item></c:value>."
  empty-hand: "<prefix><c:error><sym:cross></c:error> <c:text>Hold the item you want to wear."
  blocked: "<prefix><c:error><sym:cross></c:error> <c:value><item></c:value> <c:text>can't be worn as a hat."
  binding: "<prefix><c:error><sym:cross></c:error> <c:text>Your helmet has Curse of Binding. It can't come off."

nick:
  set: "<prefix><c:success><sym:check></c:success> <c:text>Nickname set to <nick><c:text>. Remove it with <c:value>/nick off</c:value>."
  set-other: "<prefix><c:success><sym:check></c:success> <c:text>Set <c:value><player></c:value>'s nickname to <nick><c:text>."
  set-by-staff: "<prefix><c:text>Staff set your nickname to <nick><c:text>."
  removed: "<prefix><c:success><sym:check></c:success> <c:text>Nickname removed."
  removed-other: "<prefix><c:success><sym:check></c:success> <c:text>Removed <c:value><player></c:value>'s nickname."
  removed-by-staff: "<prefix><c:text>Staff removed your nickname."
  none: "<prefix><c:error><sym:cross></c:error> <c:text>You don't have a nickname."
  none-other: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has no nickname."
  cooldown: "<prefix><c:error><sym:cross></c:error> <c:text>You can change it again in <c:value><time></c:value>."
  too-short: "<prefix><c:error><sym:cross></c:error> <c:text>Use at least <c:value><min></c:value> letters (colors don't count)."
  too-long: "<prefix><c:error><sym:cross></c:error> <c:text>Use at most <c:value><max></c:value> letters (colors don't count)."
  too-long-raw: "<prefix><c:error><sym:cross></c:error> <c:text>Too much formatting. Keep it simpler."
  invalid-chars: "<prefix><c:error><sym:cross></c:error> <c:text>Use only letters, numbers and <c:value>_</c:value>. No magic text."
  no-format: "<prefix><c:error><sym:cross></c:error> <c:text>Your rank can't use colors. Use letters, numbers and _ only."
  no-hex: "<prefix><c:error><sym:cross></c:error> <c:text>Your rank can use <c:value>&</c:value> colors, not hex colors or gradients."
  reserved: "<prefix><c:error><sym:cross></c:error> <c:text>Nicknames can't contain <c:value><word></c:value>."
  # Owner answer 304: the chat filter refused the nickname.
  filtered: "<prefix><c:error><sym:cross></c:error> <c:text>That nickname is blocked by the chat filter. Pick another one."
  is-player: "<prefix><c:error><sym:cross></c:error> <c:text>That's another player's name. Pick your own."
  taken: "<prefix><c:error><sym:cross></c:error> <c:value><nick></c:value> <c:text>is already taken."
  error: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't save your nickname. Try again in a moment."
  reset-rank: "<prefix><c:text>Your nickname was removed: your rank no longer has nicknames."
  reset-colors: "<prefix><c:text>Your nickname lost its colors: your rank no longer has them."

realname:
  found: "<prefix><c:value><nick></c:value> <c:text>is <c:value><player></c:value> <status><c:text>."
  none: "<prefix><c:error><sym:cross></c:error> <c:text>Nobody is called <c:value><nick></c:value>."
  online: "<c:success>(online)"
  offline: "<c:muted>(offline)"

trash:
  title: "Trash"
  info:
    name: "<c:value><bold>Trash</bold>"
    lore:
      - "<c:text>Put items you don't need in"
      - "<c:text>the slots above."
      - ""
      - "<c:error>Anything left inside is gone"
      - "<c:error>for good when you close this."
  destroyed: "<prefix><c:success><sym:check></c:success> <c:text>Destroyed <c:value><amount></c:value> item(s)."
  destroyed-custom: "<prefix><c:warning><sym:cross></c:warning> <c:text>This included <c:value><amount></c:value> custom item(s)."

repair:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Repaired <c:value><amount></c:value> item(s)."
  done-other: "<prefix><c:success><sym:check></c:success> <c:text>Repaired <c:value><amount></c:value> item(s) of <c:value><player></c:value>."
  done-by-staff: "<prefix><c:text>Staff repaired <c:value><amount></c:value> of your items."
  nothing-hand: "<prefix><c:error><sym:cross></c:error> <c:text>That item isn't damaged (custom tools never break)."
  nothing-all: "<prefix><c:error><sym:cross></c:error> <c:text>Nothing there needs repairing."
  console-needs-player: "<prefix><c:error><sym:cross></c:error> <c:text>Name a player: <c:value>/repair all Steve</c:value>"
  no-permission-others: "<prefix><c:error><sym:cross></c:error> <c:text>You can only repair your own items."

sudo:
  chat-done: "<prefix><c:success><sym:check></c:success> <c:value><player></c:value> <c:text>said: <c:value><line>"
  command-done: "<prefix><c:success><sym:check></c:success> <c:value><player></c:value> <c:text>ran <c:value>/<line>"
  command-failed: "<prefix><c:error><sym:cross></c:error> <c:value>/<line></c:value> <c:text>failed or doesn't exist for <c:value><player></c:value>."
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't sudo yourself."
  exempt: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is protected from sudo."
  higher-rank: "<prefix><c:error><sym:cross></c:error> <c:text>You can't sudo <c:value><player></c:value>: same or higher rank."
  blocked: "<prefix><c:error><sym:cross></c:error> <c:value>/<command></c:value> <c:text>can't be used with sudo."
  empty: "<prefix><c:error><sym:cross></c:error> <c:text>Add a command, or <c:value>c:</c:value> and a chat message."

# /freerank: free lowest rank after 30 min playtime, then pick 1 of 3 tags. Kept forever.
freerank:
  too-early: "<prefix><c:error><sym:cross></c:error> <c:text>Play <c:value><minutes> min</c:value> <c:text>first. <c:value><time></c:value> <c:text>left."
  claimed: "<prefix><c:success><sym:check></c:success> <c:text>You're now <c:ember>Ember</c:ember><c:text>! Pick your tag."
  tag-picked: "<prefix><c:success><sym:check></c:success> <c:text>Tag <tag> <c:text>is yours. Wear it with <click:run_command:'/tags'><hover:show_text:'<c:text>Open your tags'><c:action>/tags</c:action></hover></click>."
  done: "<prefix><c:error><sym:cross></c:error> <c:text>You already claimed your free rank."
  disabled: "<prefix><c:error><sym:cross></c:error> <c:text>The free rank is off right now."
  unavailable: "<prefix><c:error><sym:cross></c:error> <c:text>The free rank can't be given right now. Try again later."
  no-tags: "<prefix><c:error><sym:cross></c:error> <c:text>No tags to pick right now. Use <c:value>/freerank</c:value> <c:text>again later."
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong. Nothing was used up, try again."
  busy: "<prefix><c:muted>One moment..."
  menu:
    title: "Pick your tag"
    tag:
      name: "<tag>"
      lore: ["<c:text>Free with your rank.", "<c:text>Yours forever.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to pick"]
