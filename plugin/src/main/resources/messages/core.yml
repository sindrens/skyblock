# Core messages (MiniMessage + style tags from style.yml). Placeholders are written as <name>.
# Edit freely; /skyblock reload core applies changes. New keys are added automatically on updates.

reload:
  done-all: "<prefix><c:success><sym:check></c:success> <c:text>Reloaded everything."
  done-one: "<prefix><c:success><sym:check></c:success> <c:text>Reloaded <c:value><target></c:value>."
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>Reload failed: <c:value><list></c:value>. Check the console."
  unknown: "<prefix><c:error><sym:cross></c:error> <c:text>No module <c:value><target></c:value>. Pick one of: <c:value><list>"

config:
  problems-header: "<prefix><c:warning><sym:cross></c:warning> <c:text>Config problems <c:muted>(the old values stay active):"
  problem: " <c:muted>•</c:muted> <c:text><problem>"
  list-header: "<prefix><c:text>Config files <c:muted>(click one to view):"
  list-ok: " <c:muted><sym:bullet></c:muted> <click:run_command:'/skyblock config <name>'><hover:show_text:'<c:text>Show the settings of <name>.yml'><c:value><name>.yml</c:value></hover></click> <c:success><sym:check></c:success>"
  list-problems: " <c:muted><sym:bullet></c:muted> <click:run_command:'/skyblock config <name>'><hover:show_text:'<c:text>Show the settings of <name>.yml'><c:value><name>.yml</c:value></hover></click> <c:warning><sym:cross> <count> problem(s)"
  unknown: "<prefix><c:error><sym:cross></c:error> <c:text>No config <c:value><name></c:value>. See the list with <c:value>/skyblock config</c:value>."
  header: "<prefix><c:value><file> <c:muted>(active values):"
  line-default: " <hover:show_text:'<c:text><desc><newline><c:muted>Default: <default>'><c:text><path></c:text></hover><c:muted>:</c:muted> <c:value><value>"
  line-changed: " <hover:show_text:'<c:text><desc><newline><c:muted>Default: <default>'><c:text><path></c:text></hover><c:muted>:</c:muted> <c:flame><value>"
  join-notice: "<prefix><c:warning><sym:cross></c:warning> <c:value><count></c:value> <c:text>config problem(s). <click:run_command:'/skyblock config'><hover:show_text:'<c:text>Runs /skyblock config'><c:action>[View]</c:action></hover></click>"

modules:
  header: "<prefix><c:text>Modules:"
  none: "<prefix><c:text>No modules yet."
  enabled: " <c:value><id></c:value> <c:success>on"
  failed: " <c:value><id></c:value> <c:error>failed"
  other: " <c:value><id></c:value> <c:muted><state>"

worlds:
  header: "<prefix><c:text>Worlds <c:muted>(click one to teleport):"
  loaded: " <c:muted><sym:bullet></c:muted> <click:run_command:'/skyblock tp <name>'><hover:show_text:'<c:text>Teleport to <name>'><c:value><name></c:value></hover></click> <c:muted><sym:dot></c:muted> <c:text><players> players, <chunks> chunks"
  not-loaded: " <c:muted><sym:bullet></c:muted> <c:value><name></c:value> <c:muted><sym:dot> not loaded"
  teleported: "<prefix><c:success><sym:check></c:success> <c:text>Teleported to <c:value><world></c:value>."
  teleport-failed: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't teleport to <c:value><world></c:value>. Try again."

style:
  header: "<prefix><c:text>Style preview <c:muted>(hover a color for its name and Bedrock color):"
  section: " <c:muted><sym:bullet></c:muted> <c:value><name>:</c:value> <colors>"
  symbols: " <c:muted><sym:bullet></c:muted> <c:value>Symbols:</c:value> <c:text><symbols>"
  gradients: " <c:muted><sym:bullet></c:muted> <c:value>Gradients:</c:value> <grad:phoenix>Phoenix fire</grad> <c:muted><sym:dot></c:muted> <grad:flame>Flame</grad> <c:muted><sym:dot></c:muted> <grad:skyborn>SkybornMC</grad> <c:muted><sym:dot></c:muted> <grad:legendary>Legendary</grad> <c:muted><sym:dot></c:muted> <grad:mythic>Mythic</grad>"
  formats: " <c:muted><sym:bullet></c:muted> <c:value>Formats:</c:value> <cur:money><money></cur:money> <c:muted><sym:dot></c:muted> <cur:money><big-money></cur:money> <c:muted><sym:dot></c:muted> <cur:crystals><sym:crystals> <number></cur:crystals> <c:muted><sym:dot></c:muted> <c:value><duration>"
  samples-header: " <c:muted><sym:bullet></c:muted> <c:value>Message types:"
  sample-success: "   <c:success><sym:check></c:success> <c:text>Island created."
  sample-error: "   <c:error><sym:cross></c:error> <c:text>You need <cur:money>$5,000</cur:money> more. Sell items with <c:value>/sell</c:value>."
  sample-warning: "   <c:warning>This can't be undone."
  sample-info: "   <c:text>Tip: open <c:value>/menu</c:value> to see everything."
  sample-action: "   <c:action>[Click to teleport]"
  title:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    subtitle: "<c:text>Style preview <c:muted><sym:dot></c:muted> <grad:skyborn>SkybornMC</grad>"
    fade-in: 10
    stay: 50
    fade-out: 15
  action-bar: "<c:ember><sym:sparkle></c:ember> <c:text>Action bar preview <c:muted><sym:dot></c:muted> <cur:money>$1.2M</cur:money>"
