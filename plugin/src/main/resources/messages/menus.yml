# Menu (GUI) framework texts. MiniMessage + style tags (style.yml). Lore can be a list (one line per entry).
# Rules (docs/UI_STYLE.md section 5, docs/design/GUI_DESIGN.md):
#  - Item names: one color word + white value, never italic. Lore: description in <c:text>, an empty line, then the
#    action line "<bold><c:action>» CLICK</c:action></bold> <c:text>to ...". Only Bedrock-safe symbols.
#  - Titles are dark gray on the light chest background with a red marker; keep crumbs short (whole title max ~32).
# Reload: /skyblock reload core

error: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong. Try again; staff can see why in the console."

# Chest titles. <crumbs> = "Island » Upgrades", <suffix> = page indicator or nothing.
title:
  format: "<c:brand><sym:bullet></c:brand> <#3F3F3F><crumbs></#3F3F3F><suffix>"
  separator: " <#8B8B8B>»</#8B8B8B> "
  page: " <#8B8B8B>(<page>/<pages>)</#8B8B8B>"
  # Used when a menu's own title text is missing or empty (an empty chest title shows "Large Chest" on Bedrock).
  fallback: "Phoenix Skyblock"

# The standard buttons (GUI_DESIGN section 1): 6 rows: 45 Back, 48 ?, 49 Close, 50 Main menu, 52/53 pages.
# 3 rows: 18 Back, 22 Close. The main menu shows Help & guides on 50 instead of Main menu.
frame:
  back:
    name: "<c:ember><sym:arrow></c:ember> <c:value>Back"
    lore: ["<c:text>Back to the last menu.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to go back"]
  close:
    name: "<c:error><sym:cross></c:error> <c:value>Close"
    lore: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to close"]
  main-menu:
    name: "<c:ember><sym:bullet></c:ember> <c:value>Main menu"
    lore:
      - "<c:text>Every feature in one place."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open the main menu"
  help:
    name: "<c:info>Help & guides"
    lore:
      - "<c:text>Every feature, step by step."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open help"
  # "?" (what is this): the menu's own short guide is the lore (infoKey), then this footer.
  info:
    name: "<c:info><bold>?</bold></c:info> <c:value>What is this?"
    footer:
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>for the full guide"
  previous:
    name: "<c:ember><sym:arrow></c:ember> <c:value>Previous page"
    lore: ["<c:text>Go to page <c:value><page></c:value> of <c:value><pages></c:value>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to go back a page"]
  next:
    name: "<c:value>Next page</c:value> <c:ember><sym:arrow>"
    lore: ["<c:text>Go to page <c:value><page></c:value> of <c:value><pages></c:value>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>for the next page"]

loading:
  name: "<c:ember><sym:time></c:ember> <c:value>Loading..."
  lore: ["<c:text>Fetching the latest data."]
error-item:
  name: "<c:error><sym:cross> Couldn't load this"
  lore: ["<c:text>Close the menu and open it again.", "<c:text>Still broken? Tell staff."]
error-retry:
  name: "<c:error><sym:cross> Couldn't load this"
  lore: ["<c:text>Still broken after a retry? Tell staff.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to try again"]
empty:
  name: "<c:text>Nothing here yet"
  lore: ["<c:muted>This list fills up as you play."]

# One look for every state (GUI_DESIGN section 3). <name> = the feature, <hint> = how to unlock it.
state:
  locked:
    name: "<c:locked><sym:cross> <name>"
    lore: ["", "<c:locked>Locked"]
    actionbar: "<c:error><sym:cross></c:error> <c:text>Locked: <hint>"

# Tabs (row 0). The selected tab glints.
tab:
  selected: ["", "<c:flame><sym:check> You are here"]
  action: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to view"]

# Pick lists (GUI_DESIGN section 5, G9): a small list instead of a button that cycles one way. One click picks.
pick:
  info: ["<c:text>Pick one. The menu you came from", "<c:text>shows the new choice right away."]
  selected: ["", "<c:flame><sym:check> Selected"]
  action: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to pick"]
  # Under the current value on the button that opens a pick list.
  open: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"]

toggle:
  "on": ["", "<c:text>Status: <c:success><sym:check> On"]
  "off": ["", "<c:text>Status: <c:error><sym:cross> Off"]
  action: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to switch"]

# Confirm screen (GUI_DESIGN section 4): green 10-12, the details in the middle (13), red 14-16, Back 18, Close 22.
# Two-step confirms (disband, delete profile, permanent ban) swap the sides on the second screen.
confirm:
  crumb: "Are you sure?"
  # <step>/<steps> after the title of a two-step confirm.
  step: " <#8B8B8B>(<step>/<steps>)</#8B8B8B>"
  shown:
    name: "<c:warning>Please confirm"
    lore: []
  details-top: ["<c:text>This will:"]
  "yes":
    name: "<c:success><sym:check> Confirm"
    lore: ["<c:text>Read the middle item first.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to confirm"]
  "no":
    name: "<c:error><sym:cross> Cancel"
    lore: ["<c:text>Nothing will change.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to cancel"]
  second:
    warning: ["", "<c:error><sym:cross></c:error> <c:warning>Last check: this can't be undone."]
    "yes":
      name: "<c:success><sym:check> Yes, do it"
      lore: ["<c:text>The buttons swapped sides.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to confirm for good"]

# GUI-5: the Bedrock popup of a chat offer (TPA, invites, trades, links, staff alerts). Button texts get <command>
# (with the slash) and the offer's own placeholders; <left> = time until it expires.
offer:
  expired: "<prefix><c:error><sym:cross></c:error> <c:text>That request expired or was already answered."
  expired-item:
    name: "<c:error><sym:cross> Expired"
    lore: ["<c:text>This request ended, so there", "<c:text>is nothing to answer now."]
  button:
    accept:
      name: "<c:success><sym:check> Accept"
      lore: ["<c:muted>Runs <command>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to accept"]
    decline:
      name: "<c:error><sym:cross> Decline"
      lore: ["<c:muted>Runs <command>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to decline"]
    allow:
      name: "<c:success><sym:check> Allow"
      lore: ["<c:muted>Runs <command>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to allow"]
    deny:
      name: "<c:error><sym:cross> Deny"
      lore: ["<c:muted>Runs <command>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to deny"]
    teleport:
      name: "<c:value>Teleport"
      lore: ["<c:muted>Runs <command>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to go there"]
    run:
      name: "<c:success><command>"
      lore: ["<c:muted>Runs <command>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to run it"]

number:
  crumb: "Choose an amount"
  info:
    - "<c:text>Use <c:error>-</c:error> and <c:success>+</c:success> to change it,"
    - "<c:text>or type an exact amount in chat."
  minus:
    name: "<c:error>- <step>"
    lore: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to remove <step>"]
  plus:
    name: "<c:success>+ <step>"
    lore: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to add <step>"]
  value:
    name: "<c:value><value>"
    lore: ["<c:text>Selected: <c:flame><compact></c:flame>", "", "<c:text>Min <c:value><min></c:value> <c:muted><sym:dot></c:muted> Max <c:value><max>"]
  set-min:
    name: "<c:value>Minimum"
    lore: ["<c:text>Set the amount to <c:value><min></c:value>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to set"]
  set-max:
    name: "<c:value>Maximum"
    lore: ["<c:text>Set the amount to <c:value><max></c:value>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to set"]
  custom:
    name: "<c:value>Type an amount"
    lore: ["<c:text>Write the exact amount in chat.", "<c:text>Examples: <c:value>1500</c:value>, <c:value>1.5k</c:value>, <c:value>2M", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to type"]
  confirm:
    name: "<c:success><sym:check> Confirm</c:success> <c:value><value>"
    lore: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to confirm"]
  ask: "<prefix><c:text>Type an amount from <c:value><min></c:value> to <c:value><max></c:value> in chat. <c:muted>(<cancel> to cancel, <seconds>s)"
  invalid: "<prefix><c:error><sym:cross></c:error> <c:text>Not an amount. Use <c:value><min></c:value> to <c:value><max></c:value>, like 1500 or 1.5k."

players:
  crumb: "Choose a player"
  info: ["<c:text>Everyone online right now.", "<c:text>Click a head to choose them."]
  entry:
    name: "<c:value><player>"
    lore: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"]
  empty:
    name: "<c:text>No other players online"
    lore: ["<c:muted>Try again when your friends are on."]
  offline: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>just left."
  # Search (GUI-4b): shown when the list is longer than one page.
  search:
    name: "<c:value>Search"
    lore: ["<c:text>Find a player by part", "<c:text>of their name.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to search"]
  search-on:
    name: "<c:value>Search: <search>"
    lore: ["<c:text>Only names with this text.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to search again"]
  search-clear:
    name: "<c:value>Show everyone"
    lore: ["<c:text>Clear the search.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to show all"]
  empty-search:
    name: "<c:text>Nobody found"
    lore: ["<c:muted>No online name has that text."]
  # Chat prompt: <max>, <cancel>, <seconds>
  search-prompt: "<prefix><c:text>Type part of a name. <c:muted>(max <max>, <cancel> to stop, <seconds>s)"
  # Bedrock form popup. <max>
  search-prompt-form:
    title: "Find a player"
    label: "<c:text>Part of the name:"

prompt:
  cancelled: "<prefix><c:text>Cancelled. Nothing changed."
  timeout: "<prefix><c:error><sym:cross></c:error> <c:text>Time's up. Nothing changed."
  too-long: "<prefix><c:error><sym:cross></c:error> <c:text>Too long. Max <c:value><max></c:value> characters, try again."
