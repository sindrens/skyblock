# Menu (GUI) framework texts. MiniMessage + style tags (style.yml). Lore can be a list (one line per entry).
# Rules (docs/UI_STYLE.md section 5):
#  - Item names: one color word + white value, never italic. Lore: description in <c:text>, an empty line, then the
#    action line "<bold><c:action>» CLICK</c:action></bold> <c:text>to ...". Only Bedrock-safe symbols.
#  - Titles are dark gray on the light chest background with a red marker; keep crumbs short (whole title max ~32).
# Reload: /skyblock reload core

error: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong. Try again; staff can see why in the console."

# Chest titles. <crumbs> = "Island » Upgrades", <suffix> = page indicator or nothing.
title:
  format: "<c:brand><sym:bullet></c:brand> <#3F3F3F><crumbs></#3F3F3F><suffix>"
  separator: " <#8B8B8B>»</#8B8B8B> "
  page: " <#8B8B8B>(<page>/<pages>)</#8B8B8B>"
  # Used when a menu's own title text is missing or empty (an empty chest title shows "Large Chest" on Bedrock).
  fallback: "Phoenix Skyblock"

frame:
  back:
    name: "<c:ember><sym:arrow></c:ember> <c:value>Back"
    lore: ["<c:text>Back to the last menu.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to go back"]
  close:
    name: "<c:error><sym:cross></c:error> <c:value>Close"
    lore: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to close"]
  help:
    name: "<c:info>Help & guides"
    lore:
      - "<c:text>Every feature, step by step."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open help"
  info:
    name: "<c:info>About this menu"
    footer:
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>for the full guide"
  previous:
    name: "<c:ember><sym:arrow></c:ember> <c:value>Previous page"
    lore: ["<c:text>Go to page <c:value><page></c:value> of <c:value><pages></c:value>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to go back a page"]
  next:
    name: "<c:value>Next page</c:value> <c:ember><sym:arrow>"
    lore: ["<c:text>Go to page <c:value><page></c:value> of <c:value><pages></c:value>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>for the next page"]

loading:
  name: "<c:ember><sym:time></c:ember> <c:value>Loading..."
  lore: ["<c:text>Fetching the latest data."]
error-item:
  name: "<c:error><sym:cross> Couldn't load this"
  lore: ["<c:text>Close the menu and open it again.", "<c:text>Still broken? Tell staff."]
empty:
  name: "<c:text>Nothing here yet"
  lore: ["<c:muted>This list fills up as you play."]

toggle:
  "on": ["", "<c:text>Status: <c:success><sym:check> On"]
  "off": ["", "<c:text>Status: <c:error><sym:cross> Off"]
  action: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to switch"]

confirm:
  crumb: "Are you sure?"
  shown:
    name: "<c:warning>Please confirm"
    lore: ["<c:text>See the details on the green button."]
  "yes":
    name: "<c:success><sym:check> Confirm"
    lore-top: ["<c:text>This will:"]
    lore: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to confirm"]
  "no":
    name: "<c:error><sym:cross> Cancel"
    lore: ["<c:text>Nothing will change.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to cancel"]

number:
  crumb: "Choose an amount"
  info:
    - "<c:text>Use <c:error>-</c:error> and <c:success>+</c:success> to change it,"
    - "<c:text>or type an exact amount in chat."
  minus:
    name: "<c:error>- <step>"
    lore: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to remove <step>"]
  plus:
    name: "<c:success>+ <step>"
    lore: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to add <step>"]
  value:
    name: "<c:value><value>"
    lore: ["<c:text>Selected: <c:flame><compact></c:flame>", "", "<c:text>Min <c:value><min></c:value> <c:muted><sym:dot></c:muted> Max <c:value><max>"]
  set-min:
    name: "<c:value>Minimum"
    lore: ["<c:text>Set the amount to <c:value><min></c:value>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to set"]
  set-max:
    name: "<c:value>Maximum"
    lore: ["<c:text>Set the amount to <c:value><max></c:value>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to set"]
  custom:
    name: "<c:value>Type an amount"
    lore: ["<c:text>Write the exact amount in chat.", "<c:text>Examples: <c:value>1500</c:value>, <c:value>1.5k</c:value>, <c:value>2M", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to type"]
  confirm:
    name: "<c:success><sym:check> Confirm</c:success> <c:value><value>"
    lore: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to confirm"]
  ask: "<prefix><c:text>Type an amount from <c:value><min></c:value> to <c:value><max></c:value> in chat. <c:muted>(<cancel> to cancel, <seconds>s)"
  invalid: "<prefix><c:error><sym:cross></c:error> <c:text>Not an amount. Use <c:value><min></c:value> to <c:value><max></c:value>, like 1500 or 1.5k."

players:
  crumb: "Choose a player"
  info: ["<c:text>Everyone online right now.", "<c:text>Click a head to choose them."]
  entry:
    name: "<c:value><player>"
    lore: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"]
  empty:
    name: "<c:text>No other players online"
    lore: ["<c:muted>Try again when your friends are on."]
  offline: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>just left."

prompt:
  cancelled: "<prefix><c:text>Cancelled. Nothing changed."
  timeout: "<prefix><c:error><sym:cross></c:error> <c:text>Time's up. Nothing changed."
  too-long: "<prefix><c:error><sym:cross></c:error> <c:text>Too long. Max <c:value><max></c:value> characters, try again."
