# Custom item texts (MiniMessage + style tags). Lore is generated from these formats; never edit lore on items.
# {placeholders} are filled by the plugin; <placeholders> are used in chat messages.
# Layout follows docs/UI_STYLE.md §4: max ~36 visible characters per line, Bedrock-safe symbols only.

lore:
  # V2 look (owner approved 2026-10-30): bold rarity name, red "| Header" sections with bar-prefixed rows,
  # green Buy / red Sell price lines, bold "» ACTION" lines last, bold rarity footer. No italics.
  name: "<rarity:{rarity}><bold>{name}"
  description: "<c:text>{text}"
  stats: "<bold><c:header>| Stats</c:header></bold>"
  stat: "<c:bar>| </c:bar><c:text>{label}: </c:text><c:value>{value}"
  section: "<bold><c:header>| {title}</c:header></bold>"
  section-row: "<c:bar>| </c:bar><c:text>{label}: </c:text><c:value>{value}"
  section-line: "<c:bar>| </c:bar><c:text>{text}"
  info: "Information"
  enchants: "<bold><c:header>| Enchants</c:header></bold>"
  perk-slots: "<bold><c:header>| Perk Slots</c:header></bold> <c:value>{used}/{total}"
  enchant: "<c:bar>| </c:bar><c:enchant>{name}"
  empty-slot: "<c:bar>| </c:bar><c:locked>Empty slot"
  buy-price: "<bold><c:buy>| Buy Price: </c:buy><c:value>{price}</c:value></bold>{unit}"
  sell-price: "<bold><c:sell>| Sell Price: </c:sell><c:value>{price}</c:value></bold>{unit}"
  price-each: " <c:muted>each"
  afford: "<c:text>You can afford: <c:value>{amount}"
  progress: "<c:text>Progress: <c:value>{current}</c:value><c:muted> / </c:muted><c:value>{max}"
  progress-bar: "<c:flame>{filled}</c:flame><c:locked>{empty}</c:locked> <c:muted>{percent}%"
  progress-bar-filled: "●"
  progress-bar-empty: "●"
  rewards: "<bold><c:header>| Rewards</c:header></bold>"
  reward: "<rarity:{rarity}>★ {name}</rarity:{rarity}> <c:muted>(x{amount})</c:muted> <c:bar>|</c:bar> <c:value>{chance}%"
  quest-reward: "<c:success><bold>[+]</bold></c:success> <c:text>{reward}"
  action: "<bold><c:action>» {input}</c:action></bold> <c:text>{text}"
  level: "<c:text>Lv <c:value>{level}</c:value> {bar} <c:value>{percent}%"
  level-bar: "<c:flame>{filled}</c:flame><c:locked>{empty}</c:locked>"
  level-bar-filled: "●"
  level-bar-empty: "●"
  footer: "<rarity:{rarity}><bold>{rarity-name} {type-name}"

# Holograms (crates, leaderboards; V2 look). Shared formats for every module that spawns one.
# {title} name, {rarity} rarity id, {place} 1-3, {player} name, {value} score (already formatted).
hologram:
  title: "<rarity:{rarity}><bold>{title}"
  right-click: "<bold><c:action>Right-Click: </c:action></bold><c:text>Open"
  left-click: "<bold><c:action>Left-Click: </c:action></bold><c:text>View Rewards"
  leaderboard-title: "<bold><c:header>{title}"
  top1: "<bold><c:top1>#1</c:top1></bold> <c:value>{player}</c:value> <c:muted><sym:dot></c:muted> {value}"
  top2: "<bold><c:top2>#2</c:top2></bold> <c:value>{player}</c:value> <c:muted><sym:dot></c:muted> {value}"
  top3: "<bold><c:top3>#3</c:top3></bold> <c:value>{player}</c:value> <c:muted><sym:dot></c:muted> {value}"
  place: "<c:muted>#{place}</c:muted> <c:value>{player}</c:value> <c:muted><sym:dot></c:muted> {value}"

rarity:
  common: "COMMON"
  uncommon: "UNCOMMON"
  rare: "RARE"
  epic: "EPIC"
  legendary: "LEGENDARY"
  mythic: "MYTHIC"
  special: "SPECIAL"

type:
  tool: "TOOL"
  armor: "ARMOR"
  set-piece: "SET PIECE"
  collector: "COLLECTOR"
  crate-key: "CRATE KEY"
  pet-egg: "PET EGG"
  pet: "PET"
  consumable: "CONSUMABLE"
  material: "MATERIAL"
  note: "NOTE"
  spawner: "SPAWNER"
  cosmetic: "COSMETIC"
  enchant-book: "BOOK"
  scroll: "SCROLL"
  menu: ""

dupe:
  alert: "<c:error><bold>DUPE</bold></c:error> <c:value><item></c:value> <c:muted>(<uuid>)</c:muted> <c:text>found <c:value><count>x</c:value> from <c:value><source></c:value>. All copies are flagged."
  holder: " <c:muted><sym:bullet></c:muted> <c:text><where>"

give:
  given: "<prefix><c:success><sym:check></c:success> <c:text>Gave <c:value><amount>x <item></c:value> to <c:value><player></c:value>."
  received: "<prefix><c:success><sym:check></c:success> <c:text>You got <c:value><amount>x <item></c:value>."
  unknown: "<prefix><c:error><sym:cross></c:error> <c:text>No item <c:value><id></c:value>. Press Tab to see them all."
  inventory-full: "<prefix><c:warning><sym:cross></c:warning> <c:text>Inventory full. The rest was dropped at <c:value><player></c:value>'s feet."
