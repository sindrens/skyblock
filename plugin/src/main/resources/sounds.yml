# Named sounds: "<sound id> <volume 0-10> <pitch 0.5-2>". Sound ids: https://minecraft.wiki/w/Sounds.json
# Vanilla+ (owner 2 Nov 2026): soft bundle sounds for menus, a bell for notices, quieter clicks.
# Reload: /skyblock reload core
success: "minecraft:entity.experience_orb.pickup 0.6 1.4"
error: "minecraft:block.note_block.bass 0.6 0.75"
warning: "minecraft:block.note_block.pling 0.6 0.8"
click: "minecraft:ui.button.click 0.25 1.5"
menu-open: "minecraft:item.bundle.insert 0.7 1.2"
menu-close: "minecraft:item.bundle.remove_one 0.5 1.1"
page: "minecraft:item.book.page_turn 0.7 1.2"
level-up: "minecraft:entity.player.levelup 0.7 1.0"
unlock: "minecraft:ui.toast.challenge_complete 0.5 1.0"
teleport: "minecraft:entity.enderman.teleport 0.4 1.35"
money: "minecraft:block.amethyst_block.chime 0.8 1.5"
notify: "minecraft:block.note_block.bell 0.5 1.5"
enchant: "minecraft:block.enchantment_table.use 0.7 1.0"
# Owner 3 Nov 2026: shards found with an island tool (quiet, high)
shard: "minecraft:block.amethyst_cluster.hit 0.4 1.8"

# Owner 4 Nov 2026: island tool levels (quiet), the max level, a prestige, a Shard Pouch (Lucky)
tool-level-up: "minecraft:entity.player.levelup 0.35 1.4"
tool-max: "minecraft:ui.toast.challenge_complete 0.45 1.2"
tool-prestige: "minecraft:ui.toast.challenge_complete 0.6 0.9"
tool-lucky: "minecraft:block.amethyst_block.chime 0.6 1.2"
