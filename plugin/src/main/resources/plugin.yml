name: PhoenixSkyblock
version: '${version}'
main: net.skybornmc.skyblock.SkyblockPlugin
api-version: '26.3'
description: Phoenix Skyblock core (SkybornMC network)
website: https://skybornmc.net
authors: [SlickyMatt]
softdepend: [LuckPerms, floodgate]
permissions:
  skyblock.admin.modules:
    description: View module status
    default: op
  skyblock.admin.reload:
    description: Reload all module configs
    default: op
  skyblock.admin.worlds:
    description: List worlds and teleport between them (/skyblock worlds, /skyblock tp)
    default: op
  skyblock.staff.unban:
    description: Unban players or IP addresses (/unban)
    default: op
  skyblock.staff.notify:
    description: See staff actions (unbans, punishments) in chat
    default: op
