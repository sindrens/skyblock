name: PhoenixSkyblock
version: '${version}'
main: net.skybornmc.skyblock.SkyblockPlugin
api-version: '26.3'
description: Phoenix Skyblock core (SkybornMC network)
website: https://skybornmc.net
authors: [SlickyMatt]
softdepend: [LuckPerms, floodgate, PlaceholderAPI, FastAsyncWorldEdit]
# Core/plugin-level permissions only. Module permissions live in modules/<id>/src/main/resources/permissions/<id>.yml
# and are registered when the module enables (see CLAUDE.md "Adding a module").
permissions:
  skyblock.admin.modules:
    description: View module status
    default: op
  skyblock.admin.reload:
    description: Reload all module configs
    default: op
  skyblock.admin.worlds:
    description: List worlds and teleport between them (/skyblock worlds, /skyblock tp)
    default: op
  skyblock.staff.notify:
    description: See staff actions (unbans, punishments) in chat
    default: op
  skyblock.staff.visible:
    description: Always visible to players while not vanished (ignores their Show players choice and the AFK pool hiding)
    default: op
  skyblock.cooldown.bypass:
    description: Skip command cooldowns
    default: op
  skyblock.admin.config:
    description: Use the in-game config editor (/admin) for normal settings
    default: op
  skyblock.owner.config:
    description: Edit owner-level settings in /admin (economy, season)
    default: op
