name: PhoenixSkyblock
version: '${version}'
main: net.skybornmc.skyblock.SkyblockPlugin
api-version: '26.3'
description: Phoenix Skyblock core (SkybornMC network)
website: https://skybornmc.net
authors: [SlickyMatt]
softdepend: [LuckPerms, floodgate, PlaceholderAPI]
permissions:
  skyblock.admin.modules:
    description: View module status
    default: op
  skyblock.admin.reload:
    description: Reload all module configs
    default: op
  skyblock.admin.worlds:
    description: List worlds and teleport between them (/skyblock worlds, /skyblock tp)
    default: op
  skyblock.staff.unban:
    description: Unban players or IP addresses (/unban)
    default: op
  skyblock.staff.notify:
    description: See staff actions (unbans, punishments) in chat
    default: op
  skyblock.cooldown.bypass:
    description: Skip command cooldowns
    default: op
  # --- Essentials (teleports + staff tools) ---
  skyblock.player.spawn:
    description: Teleport to spawn (/spawn)
    default: true
  skyblock.player.tpa:
    description: Send and answer teleport requests (/tpa, /tpahere, /tpaccept, /tpdeny, /tpcancel)
    default: true
  skyblock.staff.teleport.bypass:
    description: No warmup, cooldown or teleport restrictions
    default: op
  skyblock.staff.tp:
    description: Teleport to players (/tp)
    default: op
  skyblock.staff.tp.others:
    description: Teleport a player to another player (/tp <player> <target>)
    default: op
  skyblock.staff.tphere:
    description: Teleport a player to you (/tphere)
    default: op
  skyblock.staff.tppos:
    description: Teleport to coordinates (/tppos)
    default: op
  skyblock.staff.top:
    description: Teleport to the highest block (/top)
    default: op
  skyblock.staff.back:
    description: Return to the previous location or death point (/back)
    default: op
  skyblock.staff.home:
    description: Staff homes (/home, /sethome, /delhome)
    default: op
  skyblock.staff.gamemode:
    description: Use /gm (each mode needs its own permission below)
    default: op
  skyblock.staff.gamemode.creative:
    description: Creative mode (/gm c, /gmc)
    default: op
  skyblock.staff.gamemode.survival:
    description: Survival mode (/gm s, /gms)
    default: op
  skyblock.staff.gamemode.spectator:
    description: Spectator mode (/gm sp, /gmsp)
    default: op
  skyblock.staff.gamemode.adventure:
    description: Adventure mode (/gm a, /gma)
    default: op
  skyblock.staff.gamemode.others:
    description: Change other players' game mode
    default: op
  skyblock.staff.fly:
    description: Toggle flying (/fly)
    default: op
  skyblock.staff.fly.others:
    description: Toggle flying for others
    default: op
  skyblock.staff.speed:
    description: Set fly/walk speed (/speed)
    default: op
  skyblock.staff.god:
    description: God mode (/god)
    default: op
  skyblock.staff.god.others:
    description: God mode for others
    default: op
  skyblock.staff.heal:
    description: Heal (/heal)
    default: op
  skyblock.staff.heal.others:
    description: Heal others
    default: op
  skyblock.staff.feed:
    description: Feed (/feed)
    default: op
  skyblock.staff.feed.others:
    description: Feed others
    default: op
  skyblock.staff.clear:
    description: Clear your inventory (/clear)
    default: op
  skyblock.staff.clear.others:
    description: Clear other players' inventories (asks to confirm, logged)
    default: op
  skyblock.staff.invsee:
    description: View player inventories (/invsee)
    default: op
  skyblock.staff.invsee.edit:
    description: Edit player inventories (every change logged)
    default: op
  skyblock.staff.ecsee:
    description: View player ender chests (/ecsee)
    default: op
  skyblock.staff.ecsee.edit:
    description: Edit player ender chests (every change logged)
    default: op
  skyblock.staff.vanish:
    description: Vanish (/vanish)
    default: op
  skyblock.staff.vanish.others:
    description: Vanish other staff
    default: op
  skyblock.staff.vanish.see:
    description: See vanished staff
    default: op
  skyblock.staff.give:
    description: Give vanilla items (/i, /give)
    default: op
  skyblock.staff.time:
    description: Set the time (/time)
    default: op
  skyblock.staff.weather:
    description: Set the weather (/weather)
    default: op
  skyblock.staff.skull:
    description: Get player heads (/skull)
    default: op
  skyblock.staff.more:
    description: Fill the held stack (/more)
  skyblock.social.msg:
    description: Send private messages (/msg, /r)
    default: true
  skyblock.social.ignore:
    description: Ignore players (/ignore, /unignore)
    default: true
  skyblock.social.afk:
    description: Mark yourself AFK (/afk)
    default: true
  skyblock.social.list:
    description: See online players (/list)
    default: true
  skyblock.social.ping:
    description: See ping (/ping)
    default: true
  skyblock.social.playtime:
    description: See play time (/playtime)
    default: true
  skyblock.social.seen:
    description: See when a player was last online (/seen)
    default: true
  skyblock.social.links:
    description: Link commands (/discord, /store, /vote, /website, /rules)
    default: true
  skyblock.staff.socialspy:
    description: See all private messages (/socialspy)
    default: op
  skyblock.staff.whois:
    description: Player info (/whois)
    default: op
  skyblock.staff.whois.ip:
    description: See addresses and alt accounts in /whois
    default: op
  skyblock.staff.seen.details:
    description: See UUID and platform in /seen
    default: op
  skyblock.staff.broadcast:
    description: Server announcements (/broadcast)
    default: op
  skyblock.staff.unignorable:
    description: Private messages can't be ignored
  # --- perks module (rank perks: donor ranks get these in Phase 11; ops/staff for now) ---
  skyblock.perks.craft:
    description: Open a crafting table anywhere (/craft)
    default: op
  skyblock.perks.enderchest:
    description: Open your ender chest anywhere (/ec)
    default: op
  skyblock.perks.hat:
    description: Wear the held item as a hat (/hat)
    default: op
  skyblock.perks.nick:
    description: Set your own nickname, letters/numbers only (/nick)
    default: op
  skyblock.perks.nick.color:
    description: Use & color codes in your nickname
    default: op
  skyblock.perks.nick.hex:
    description: Use hex colors and gradients in your nickname
    default: op
  skyblock.perks.nick.bypass:
    description: Ignore the reserved-word list for nicknames
    default: op
  skyblock.perks.trash:
    description: Open the trash can (/trash), donators
    default: op
  skyblock.staff.nick.others:
    description: Set or remove other players' nicknames (/setnick)
    default: op
  skyblock.staff.realname:
    description: See the real name behind a nickname (/realname)
    default: op
  skyblock.staff.repair:
    description: Repair your own vanilla items (/repair)
    default: op
  skyblock.staff.repair.others:
    description: Repair other players' vanilla items (/repair <mode> <player>)
    default: op
  skyblock.admin.sudo:
    description: Run commands or chat as another player (/sudo), owner only, fully logged
    default: false
  skyblock.sudo.exempt:
    description: Can't be targeted by /sudo
    default: op
  # --- M1.1 join flow + spawn protection ---
  skyblock.join.message:
    description: Shows a join/quit message for this player (ranks and staff only)
    default: false
  skyblock.build.spawn:
    description: Can build in protected worlds after turning on /build
    default: op
  skyblock.admin.setspawn:
    description: Set the spawn point (/setspawn)
  skyblock.chat.color:
    description: Use classic & colors (&0-&9, &a-&f) in chat
    default: false
  skyblock.chat.format:
    description: Use & formats (&l bold, &o italic, &n underline, &m strike) in chat
    default: false
  skyblock.chat.hex:
    description: Use hex colors (&#RRGGBB) in chat
    default: false
  skyblock.chat.links:
    description: Post links and server addresses in chat
    default: op
  skyblock.chat.item:
    description: Show your held item in chat with [item]
    default: true
  skyblock.chat.bypass:
    description: Bypass chat lock, slow mode, rate limit and filters
    default: op
  skyblock.staff.chat:
    description: Staff chat (/sc)
    default: op
  skyblock.staff.chat.manage:
    description: Chat moderation (/chat clear|lock|slow, /clearchat, /mutechat)
    default: op
  skyblock.staff.tab:
    description: See TPS and ping in the tab footer
    default: op
  # --- menus module ---
  skyblock.menu:
    description: Open the main menu (/menu) and use the menu item
    default: true
  skyblock.help:
    description: Open the help menu (/help)
    default: true
  skyblock.settings:
    description: Change your own settings (/settings)
    default: true
  skyblock.staff.punish.warn:
    description: Warn players (/warn)
    default: op
  skyblock.staff.punish.kick:
    description: Kick players (/kick)
    default: op
  skyblock.staff.punish.mute:
    description: Mute players (/mute, /tempmute)
    default: op
  skyblock.staff.punish.ban:
    description: Ban players (/ban, /tempban)
    default: op
  skyblock.staff.punish.ipban:
    description: IP bans (/ipban, -ip flag)
    default: op
  skyblock.staff.punish.unmute:
    description: Unmute players (/unmute)
    default: op
  skyblock.staff.punish.unwarn:
    description: Remove warnings (/unwarn)
    default: op
  skyblock.staff.punish.silent:
    description: Punish silently (-s flag)
    default: op
  skyblock.staff.punish.gui:
    description: Punish with templates (/punish)
    default: op
  skyblock.staff.punish.history:
    description: View punishment history (/history)
    default: op
  skyblock.staff.punish.alts:
    description: View accounts sharing an IP (/alts) and alt alerts
    default: op
  skyblock.staff.punish.exempt:
    description: Can't be punished (except by staff with exempt.bypass)
    default: false
  skyblock.staff.punish.exempt.bypass:
    description: Can punish exempt staff
    default: op
  skyblock.staff.punish.max.helper:
    description: Punishment length tier 'helper' (moderation.yml limits.max-duration)
    default: false
  skyblock.staff.punish.max.mod:
    description: Punishment length tier 'mod' (moderation.yml limits.max-duration)
    default: false
  skyblock.staff.punish.max.admin:
    description: Punishment length tier 'admin' (moderation.yml limits.max-duration)
  # --- M1.9 staff mode, freeze, inspect, reports ---
  skyblock.staff.mode:
    description: Staff mode (/staff)
    default: op
  skyblock.staff.freeze:
    description: Freeze players (/freeze, /unfreeze) and see frozen chat
    default: op
  skyblock.staff.freeze.exempt:
    description: Can't be frozen
    default: op
  skyblock.staff.inspect:
    description: Inspect players (/inspect)
    default: op
  skyblock.staff.reports:
    description: See, claim and close reports (/reports) and get report alerts
    default: op
  skyblock.player.report:
    description: Report players (/report)
    default: true
  skyblock.report.bypass-cooldown:
    description: No cooldown between reports
  skyblock.staff.logs:
    description: Open the staff log viewer (/logs); which categories show depends on skyblock.staff.logs.category.*
    default: op
  skyblock.staff.logs.category.*:
    description: See every log category in /logs
    default: op
  skyblock.staff.logs.staff:
    description: Search what staff members did (/logs staff)
    default: op
  skyblock.staff.logs.export:
    description: Export logs as CSV (/logs export, export buttons)
    default: op
  skyblock.staff.logs.teleport:
    description: Teleport to the place of a log entry
    default: op
