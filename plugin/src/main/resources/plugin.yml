name: PhoenixSkyblock
version: '${version}'
main: net.skybornmc.skyblock.SkyblockPlugin
api-version: '26.3'
description: Phoenix Skyblock core (SkybornMC network)
website: https://skybornmc.net
authors: [SlickyMatt]
softdepend: [LuckPerms, floodgate, PlaceholderAPI]
permissions:
  skyblock.admin.modules:
    description: View module status
    default: op
  skyblock.admin.reload:
    description: Reload all module configs
    default: op
  skyblock.admin.worlds:
    description: List worlds and teleport between them (/skyblock worlds, /skyblock tp)
    default: op
  skyblock.staff.unban:
    description: Unban players or IP addresses (/unban)
    default: op
  skyblock.staff.notify:
    description: See staff actions (unbans, punishments) in chat
    default: op
  skyblock.cooldown.bypass:
    description: Skip command cooldowns
    default: op
  skyblock.social.msg:
    description: Send private messages (/msg, /r)
    default: true
  skyblock.social.ignore:
    description: Ignore players (/ignore, /unignore)
    default: true
  skyblock.social.afk:
    description: Mark yourself AFK (/afk)
    default: true
  skyblock.social.list:
    description: See online players (/list)
    default: true
  skyblock.social.ping:
    description: See ping (/ping)
    default: true
  skyblock.social.playtime:
    description: See play time (/playtime)
    default: true
  skyblock.social.seen:
    description: See when a player was last online (/seen)
    default: true
  skyblock.social.links:
    description: Link commands (/discord, /store, /vote, /website, /rules)
    default: true
  skyblock.staff.socialspy:
    description: See all private messages (/socialspy)
    default: op
  skyblock.staff.whois:
    description: Player info (/whois)
    default: op
  skyblock.staff.whois.ip:
    description: See addresses and alt accounts in /whois
    default: op
  skyblock.staff.seen.details:
    description: See UUID and platform in /seen
    default: op
  skyblock.staff.broadcast:
    description: Server announcements (/broadcast)
    default: op
  skyblock.staff.unignorable:
    description: Private messages can't be ignored
    default: op
