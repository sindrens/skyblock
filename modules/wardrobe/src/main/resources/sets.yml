# Wardrobe sets (docs/plans/WARDROBE.md §2). Every value is a default the owner can change (WD1-WD4).
# Written from the jar on first start; sets that are new in an update are added to an existing file.
# Turn a set off with "enabled: false" instead of deleting it (owned copies stay, shown gray, no bonus).
#
# name: max 16 characters (Bedrock). short-name: max 12 (pieces are "<short-name> Helm/Cuirass/Greaves/Boots").
# activity: mining, foraging, farming, combat, fishing, conquest, selling, skills, gathering, all (menu filter group).
# tier: 1-4 (I uncommon, II rare, III epic, IV legendary). Tier IV sets can't be merged.
# enabled-from: a feature that must exist first (conquest, fishing); listed in wardrobe.yml → features.available.
# look.base: leather, chainmail, iron, gold, diamond, netherite. dye: #RRGGBB (leather only).
#   trim-pattern / trim-material: vanilla ids. upgraded-trim-material: used from set level 10 (W2).
# source.type: money, crystals, gems (account Sigil + one claim per profile per season), crate (Set Tokens only).
#   price: whole units. crates: where tokens can come from (for the crates plan; shown as "Also from").
# gate: any one part is enough. wing: any|mining|foraging|combat|farming|fishing + tier (Depths tier in that wing),
#   any-skill: any skill at this level, skill + skill-level: one skill at a level.
# bonuses.two / bonuses.four: values at 1x (set level 25). family: a bonus family (sell, crystals, extra_drops, speed,
#   skill_xp, tool_xp, rare_finds, mob_damage, damage_reduction, crop_growth, conquest). activities: where it counts
#   (empty = everywhere): mining, foraging, farming, combat, fishing, sell, envoy_luck, capture_speed, conquest_xp,
#   death_loss, crop_growth. text: key under bonus-text in messages/wardrobe.yml.
# Reload: /skyblock reload wardrobe

