# ---------------------------------------------------------------- items
piece:
  fallback-name: "<rarity:uncommon>Set Piece"
  unknown: "This set no longer exists."
  subtitle: "<c:muted>Set piece · Tier {tier}"
  set: "<c:text>Set: {set}"
  merged: "<c:text>Merged with <c:value>{set}"
  action-input: "/wardrobe"
  action-text: "to take it off"

token:
  fallback-name: "<rarity:rare>Set Token"
  name: "<rarity:{rarity}>Token: {set}"
  unknown: "This set no longer exists."
  subtitle: "<c:muted>Set Token · Tier {tier}"
  description: "Adds this set to your wardrobe. Tradeable until redeemed."
  tradeable: "<c:muted>Trade it or sell it on /ah."
  action-input: "Right-click"
  action-text: "to redeem"

# ---------------------------------------------------------------- menus
menu:
  title: "Wardrobe"
  click: ["<c:action><sym:bullet> Click to open"]
  main:
    info: ["<c:text>Every set in the game. Buy", "<c:text>a set once, wear it any time.", "<c:text>2 and 4 pieces give bonuses."]
    click: ["<c:action><sym:bullet> Click to open"]
    empty:
      name: "<c:muted>No sets here"
      lore: ["<c:text>Try another filter."]
    filter:
      name: "<c:value>Filter: <filter>"
      lore: ["<c:text>Show only some sets.", "", "<c:action><sym:bullet> Click to switch"]
    worn:
      name: "<c:value>Worn now"
      lore: ["<c:text>Your active set bonuses.", ""]
      none: ["<c:muted>Wear 2 pieces of a set."]
      line: "<c:ember>▸</c:ember> <c:text><text>"
      line-capped: "<c:ember>▸</c:ember> <c:text><text> <c:warning>(capped)"
    chest:
      name: "<c:value>Wardrobe Chest"
      lore: ["<c:text>Keep tools, books and tokens", "<c:text>safe. Space: <c:value><size></c:value>", "", "<c:action><sym:bullet> Click to open"]
    loadouts:
      name: "<c:muted>Loadouts <dark_gray>(Coming soon)"
      lore: ["<c:text>Swap armor and tools in", "<c:text>one click. Coming soon."]
  set:
    subtitle: "<c:muted><activity> · Tier <tier>"
    info: ["<c:text>Wear pieces one by one or all", "<c:text>at once. 2 and 4 pieces give", "<c:text>bonuses. Sets stay yours."]
    piece:
      not-owned: ["<c:error><sym:cross> Not owned"]
      worn: ["<c:success><sym:check> Worn", "", "<c:action><sym:bullet> Click to take off"]
      wear: ["<c:text>In your wardrobe.", "", "<c:action><sym:bullet> Click to wear"]
    wear-all:
      name: "<c:success>Wear all"
      lore: ["<c:text>Put on all 4 pieces.", "", "<c:action><sym:bullet> Click to wear"]
    take-off-all:
      name: "<c:error>Take all off"
      lore: ["<c:text>The pieces stay yours.", "", "<c:action><sym:bullet> Click to take off"]
    bonuses:
      name: "<c:value>Bonuses"
      lore: ["<c:text>Values at your set level.", ""]
      two: "<c:muted>2 pieces"
      four: "<c:muted>4 pieces"
      line: "<c:ember>▸</c:ember> <c:text><text>"
    level:
      name: "<c:value>Set level <level>"
      lore: ["<c:text>Bonus: <c:value><multiplier>x"]
    level-off:
      name: "<c:value>Set level"
      lore: ["<c:text>Set levels come soon.", "<c:text>Bonus now: <c:value><multiplier>x"]
    enchants:
      name: "<c:muted>Enchants <dark_gray>(Coming soon)"
      lore: ["<c:text>Armor enchants come soon."]
    redeem:
      name: "<c:success>Redeem token"
      lore: ["<c:text>You carry a token for this", "<c:text>set.", "", "<c:action><sym:bullet> Click to redeem"]
    buy:
      name: "<c:success>Buy"
      lore: ["<c:text>Price: <c:value><price>", "<c:text>Goes into your wardrobe.", "", "<c:action><sym:bullet> Click to buy"]
    claim:
      name: "<c:success>Claim"
      lore: ["<c:text>You own this Sigil: claim", "<c:text>the set here for free.", "", "<c:action><sym:bullet> Click to claim"]
    state:
      name: "<c:value>How to get it"
  chest:
    title: "Chest"
    info: ["<c:text>Unique items only: tools,", "<c:text>enchant books, scrolls and", "<c:text>tokens. Safe per profile."]
    empty:
      name: "<c:muted>Your chest is empty"
      lore: ["<c:text>Use Store an item below."]
    take: ["<c:action><sym:bullet> Click to take out"]
    store:
      name: "<c:value>Store an item"
      lore: ["<c:text>Pick a tool, book or token", "<c:text>from your inventory.", "<c:muted>Fits now: <count>", "", "<c:action><sym:bullet> Click to choose"]
    space:
      name: "<c:value>Space <used>/<size>"
      lore: ["<c:text>Ranks can add more space."]
  store:
    title: "Store"
    info: ["<c:text>Click an item to put it in", "<c:text>your Wardrobe Chest."]
    empty:
      name: "<c:muted>Nothing fits"
      lore: ["<c:text>Only tools, enchant books,", "<c:text>scrolls and tokens fit."]
    click: ["<c:action><sym:bullet> Click to store"]
  staff:
    title: "Wardrobe of <player>"
    info: ["<c:text>Sets of this player's active", "<c:text>profile. Admins can give and", "<c:text>remove sets. All logged."]
    empty:
      name: "<c:muted>No sets"
      lore: ["<c:text>This profile owns no set."]
    entry: ["<c:text>From: <c:value><origin>", "<c:text>Since: <c:value><date>", "<c:text>Level: <c:value><level>"]
    remove-click: ["", "<c:action><sym:bullet> Click to remove"]
    chest:
      name: "<c:value>Wardrobe Chest"
      lore: ["<c:text>Items stored: <c:value><count>"]
    give-set:
      name: "<c:success>Give a set"
      lore: ["<c:text>Add a set to this profile.", "", "<c:action><sym:bullet> Click to pick"]
    give-token:
      name: "<c:success>Give a token"
      lore: ["<c:text>Give a Set Token item.", "<c:text>The player must be online.", "", "<c:action><sym:bullet> Click to pick"]
    pick-set: "Give set"
    pick-token: "Give token"
    pick-set-click: ["<c:action><sym:bullet> Click to give"]
    pick-token-click: ["<c:action><sym:bullet> Click to give a token"]

