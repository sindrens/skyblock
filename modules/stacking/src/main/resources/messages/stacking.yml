# Stacking: stacked mobs, items and spawners, island entity limits. MiniMessage + style tags (style.yml).
# <mob> is the translated mob name (shown in each player's language, Bedrock too).
# Reload: /skyblock reload stacking

# Names above stacks (owner S8, S15: white name + gold count). <name> <count>
mob-name: "<c:value><name></c:value> <c:ember>x<count>"
item-name: "<c:value><name></c:value> <c:ember>x<count>"

# Things you can't do with a stack of mobs.
stack:
  no-name-tag: "<prefix><c:error><sym:cross></c:error> <c:text>You can't name a stack. Name a single mob."
  no-leash: "<prefix><c:error><sym:cross></c:error> <c:text>You can't leash a stack."
  no-tame: "<prefix><c:error><sym:cross></c:error> <c:text>You can't tame a stack."
  no-saddle: "<prefix><c:error><sym:cross></c:error> <c:text>You can't saddle a stack."
  no-ride: "<prefix><c:error><sym:cross></c:error> <c:text>You can't ride a stack."
  no-shear: "<prefix><c:error><sym:cross></c:error> <c:text>You can't shear this stack."

# Breeding a stack (owner S10): one food item breeds one pair. <babies> <count> <time> <max>
breed:
  done: "<c:success><sym:check></c:success> <c:text>Bred <c:value><babies></c:value>. Stack: <c:value><count></c:value>"
  cooldown: "<prefix><c:error><sym:cross></c:error> <c:text>These animals need a rest. Try again in <c:value><time></c:value>."
  full: "<prefix><c:error><sym:cross></c:error> <c:text>This stack is full (<c:value><max></c:value>)."

# Island entity limits (owner SK2). <limit> <what>
limit:
  reached: "<prefix><c:error><sym:cross></c:error> <c:text>Island limit reached: <c:value><limit> <what></c:value>."
  kind:
    armor-stands: "armor stands"
    item-frames: "item frames"
    minecarts: "minecarts"
    boats: "boats"
    villagers: "villagers"
    displays: "displays"

# Hopper counter (owner F13): staff alert when one chunk has more hoppers than hoppers.alert-above (no hard cap).
# Permission skyblock.stacking.hopper-alerts. <count> <threshold> <island> <owner> <world> <x> <y> <z> <chunk-x> <chunk-z>
# Java gets a clickable [Teleport] (/tppos); Bedrock can't click chat, so it sees the coordinates and the command.
hoppers:
  alert: "<c:warning>[Hoppers]</c:warning> <c:value><count></c:value> <c:text>hoppers in one chunk <c:muted>(alert above <threshold>)</c:muted> <c:text>on <c:value><island></c:value> <c:text>of <c:value><owner></c:value> <c:muted><sym:dot> <world> <x> <y> <z></c:muted> <click:run_command:'/tppos <x> <y> <z> <world>'><hover:show_text:'<c:text>Runs /tppos <x> <y> <z> <world>'><c:action>[Teleport]</c:action></hover></click>"
  alert-bedrock: "<c:warning>[Hoppers]</c:warning> <c:value><count></c:value> <c:text>hoppers in one chunk <c:muted>(alert above <threshold>)</c:muted> <c:text>on <c:value><island></c:value> <c:text>of <c:value><owner></c:value><c:text>. Go there: <c:value>/tppos <x> <y> <z> <world>"
  # GUI-5: the Bedrock popup (Bedrock can't click chat). Same placeholders as the alert.
  popup:
    title: "Hopper alert"
    name: "<c:warning><count> hoppers</c:warning> <c:text>in one chunk"
    lore: ["<c:text>On <c:value><island></c:value> <c:text>of <c:value><owner>", "<c:muted><world> <x> <y> <z>", "<c:muted>Alert above <threshold>"]
  no-island: "no island"
  no-owner: "unknown"

# Spawner blocks. <mob> <amount> <count> <left> <max>
spawner:
  placed: "<prefix><c:success><sym:check></c:success> <c:value><mob></c:value> <c:text>spawner placed. Add more of the same kind (max <c:value><max></c:value>)."
  added: "<prefix><c:success><sym:check></c:success> <c:text>Added <c:value><amount></c:value>. <c:value><mob></c:value> <c:text>spawners: <c:value><count>/<max></c:value>"
  removed: "<prefix><c:success><sym:check></c:success> <c:text>Took <c:value><amount></c:value>. <c:value><left></c:value> <c:text>left in the block."
  removed-all: "<prefix><c:success><sym:check></c:success> <c:text>Took all <c:value><amount></c:value> <c:value><mob></c:value> <c:text>spawners."
  full: "<prefix><c:error><sym:cross></c:error> <c:text>This spawner is full (<c:value><max></c:value>). Masteries raise the limit."
  wrong-type: "<prefix><c:error><sym:cross></c:error> <c:text>This spawner holds <c:value><mob></c:value>. Place yours somewhere else."
  none-in-inventory: "<prefix><c:error><sym:cross></c:error> <c:text>You have no <c:value><mob></c:value> <c:text>spawners."
  only-islands: "<prefix><c:error><sym:cross></c:error> <c:text>Spawners only work on your island."
  disabled-type: "<prefix><c:error><sym:cross></c:error> <c:text>This spawner type is turned off. Ask staff."
  busy: "<prefix><c:error><sym:cross></c:error> <c:text>One moment, this spawner is being saved."
  error: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong. Your spawners are safe; try again."
  # The spawner item (custom item, lore built by the item framework). {mob} {tier} {rarity}
  item:
    name: "<rarity:{rarity}>{mob} Spawner"
    name-unknown: "<c:text>Spawner"
    subtitle: "<c:muted>Spawner <sym:dot> Tier {tier}"
    description: "Place it on your island. Stack more of the same kind in one block."
    mob: "<c:text>Mob <c:value>{mob}"
    tier: "<c:text>Tier <c:value>{tier}"
    action-place-input: "Place"
    action-place: "on your island"
    action-menu-input: "USE"
    action-menu: "the block with an empty hand to manage it"

# /spawner give (staff). <player> <amount> <mob> <tier>
give:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Gave <c:value><player></c:value> <c:value><amount>x <mob></c:value> <c:text>spawner (tier <tier>)."
  received: "<prefix><c:success><sym:check></c:success> <c:text>You got <c:value><amount>x <mob></c:value> <c:text>spawner."

# R3-13b: staff restore of frozen spawners (/inspect → Frozen spawners). <player> <amount> <mob> <id> <reason> <world> <x> <y> <z> <date>
frozen:
  title: "Frozen spawners of <player>"
  info: ["<c:text>Stacked spawners this player placed", "<c:text>whose block was lost (crash, world", "<c:text>edit). Restore sends them to the", "<c:text>player's /box. Logged."]
  empty:
    name: "<c:muted>No frozen spawners"
    lore: ["<c:text>Nothing waits for this player."]
  entry:
    name: "<c:value><amount>x <mob></c:value> <c:text>spawner"
    lore:
      - "<c:text>Frozen <c:value>#<id></c:value> <c:muted>(<reason>)"
      - "<c:text>At <c:value><world> <x> <y> <z></c:value>"
      - "<c:text>Since <c:value><date></c:value>"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to restore"
  confirm-crumb: "Restore spawners"
  confirm-details:
    - "<c:text>Sends <c:value><amount>x <mob></c:value> <c:text>spawner"
    - "<c:text>to <c:value><player></c:value><c:text>'s /box. Logged."
  restored: "<prefix><c:success><sym:check></c:success> <c:text>Restored <c:value><amount>x <mob></c:value> <c:text>spawner to their /box. Logged."
  returned: "<prefix><c:success><sym:check></c:success> <c:text>Staff gave back <c:value><amount>x <mob></c:value> <c:text>spawner. Take it from /box."
  already: "<prefix><c:error><sym:cross></c:error> <c:text>That spawner was already restored or cleared."
  no-box: "<prefix><c:error><sym:cross></c:error> <c:text>The item box is off, so nothing can be restored right now."
  no-owner: "<prefix><c:error><sym:cross></c:error> <c:text>Nobody is known as the placer. Use /spawner give after checking the logs."
  unknown-type: "<prefix><c:error><sym:cross></c:error> <c:value><mob></c:value> <c:text>spawners are no longer in stacking.yml. Use /spawner give."
  no-permission: "<prefix><c:error><sym:cross></c:error> <c:text>Only admins can restore frozen spawners."

# Spawner menu (owner S28). <mob> <tier> <count> <max> <rate> <multiplier> <next> <carried> <range> <absolute-max> <status>
menu:
  title: "Spawner"
  info: ["<c:text>Manage this stacked spawner:", "<c:text>add or take spawners and see", "<c:text>how fast it spawns."]
  status:
    active: "<c:success>Running"
    paused: "<c:warning>Paused <c:muted>(no player near)"
    busy: "<c:muted>Saving..."
  spawner:
    name: "<c:value><mob></c:value> <c:text>Spawner"
    lore:
      - "<c:text>Tier <c:value><tier>"
      - "<c:text>Stacked <c:value><count>/<max>"
      - "<c:text>Output <c:value><rate></c:value> <c:text>mobs/min"
      - "<c:text>Next spawn in <c:value><next>s"
      - "<c:text>Status <status>"
      - ""
      - "<c:text>Tier <tier> on this island: <c:value><tier-count>"
      - "<c:text>= <c:value><effective></c:value> <c:text>at full output."
      - "<c:text>Next one works at <c:value><next-percent>%</c:value><c:text>."
      - ""
      - "<c:muted>Runs while a player is within"
      - "<c:muted><range> blocks. Light is not needed."
  add-one:
    name: "<c:success>Add 1"
    lore: ["<c:text>Adds one <c:value><mob></c:value> <c:text>spawner", "<c:text>from your inventory.", "<c:text>You carry <c:value><carried>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to add"]
  add-all:
    name: "<c:success>Add all"
    lore: ["<c:text>Adds every <c:value><mob></c:value> <c:text>spawner", "<c:text>you carry, up to the limit.", "<c:text>You carry <c:value><carried>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to add"]
  take-one:
    name: "<c:error>Take 1"
    lore: ["<c:text>Takes one spawner into", "<c:text>your inventory.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to take"]
  take-all:
    name: "<c:error>Take all"
    lore: ["<c:text>Takes all <c:value><count></c:value> <c:text>spawners.", "<c:text>The block disappears.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to take"]
  # Confirm before Take all removes the block (details on the middle item, GUI_DESIGN §4).
  take-all-confirm:
    crumb: "Take all spawners?"
    details: ["<c:text>Put all <c:value><count></c:value> <c:text>spawners in your", "<c:text>inventory. The block disappears."]
  upgrades:
    name: "<c:ember>Limit <max> <sym:dot> Speed x<multiplier>"
    lore:
      - "<c:text>Limit <c:value><max></c:value> <c:muted>(up to <absolute-max>)"
      - "<c:text>Speed <c:value>x<multiplier>"
