      fade-in: 10
      stay: 30
    two:
      title: "<c:brand>The Gatehouse"
      subtitle: "<c:text>Every portal starts here"
      fade-in: 5
      stay: 30
    three:
      title: "<c:brand>Your Island"
      subtitle: "<c:text>Walk into this portal"
      fade-in: 5
      stay: 30
  island:
    one:
      title: "<c:brand>Welcome home"
      subtitle: "<c:text>This island is yours"
      fade-in: 10
      stay: 40
    two:
      title: "<c:brand>Grow it"
      subtitle: "<c:text>Crops, trees and a generator"
      fade-in: 5
      stay: 30
  depths:
    one:
      title: "<c:brand>The Depths"
      subtitle: "<c:text>Mine, sell, forge, repeat"
      fade-in: 10
      stay: 40
    two:
      title: "<c:brand>Mine Tier 1"
      subtitle: "<c:text>Blocks grow back for you"
      fade-in: 5
      stay: 30
  market:
    one:
      title: "<c:brand>Market Square"
      subtitle: "<c:text>Shop, sell, bank, auction"
      fade-in: 10
      stay: 40
    two:
      title: "<c:brand>Sell and trade"
      subtitle: "<c:text>Talk to every NPC here"
      fade-in: 5
      stay: 30

# ---------------------------------------------------------------- TU5 Pip, the companion only you see
pip:
  name: "<c:flame>Pip"
  tag: "<c:flame>Pip</c:flame> <c:muted><sym:dot></c:muted> <c:text><line>"
  chat: "<c:flame><bold>Pip</bold></c:flame> <c:muted>»</c:muted> <c:text><line>"
  lines:
    portal: "Your island is past the gate. Follow me!"
    arrive: "Look! This island is all yours."
    chest: "Everything you need to start is in here."
    crop: "Right-click dirt with your hoe, then plant."
    menu: "The star in your hotbar opens everything."
    depths: "Open the menu, then The Depths."
    mine: "Break the ore. It grows back for you only."
    sell: "Open your satchel and press Sell all."
    forge: "The Forge turns loot into better tools."
    help: "Right-click the Guide. Every NPC helps."
    bank: "Keep your money safe in the bank."
    finish: "You did it! Fly high, friend."
    idle: "Still there? Your next step is waiting."

# NPCs say a short line for your tutorial step when you click them: npc-lines.<step>.<npc role>.
