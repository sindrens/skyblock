  # Action bar when an enchant procs. <enchant> <amount>
  proc:
    area: "<c:flame><bold><enchant>!</bold></c:flame> <c:text>+<amount> blocks"
    items: "<c:flame><bold><enchant>!</bold></c:flame> <c:text>+<amount> items"
    shards: "<c:flame><bold><enchant>!</bold></c:flame> <c:text>+<amount>"
    cash: "<c:flame><bold><enchant>!</bold></c:flame> <c:text>+<amount>"
    progress: "<c:flame><bold><enchant>!</bold></c:flame> <c:text>+<amount> progress"
    basket: "<c:flame><bold><enchant>!</bold></c:flame> <c:text>+<amount> items"
    # Chat (rare). <enchant> <crate>
    key: "<prefix><c:flame><sym:star></c:flame> <c:value><enchant></c:value> <c:text>found a <c:value><crate> Key</c:value><c:text>! Open it in</c:text> <c:action>/crates</c:action><c:text>."
  key-title:
    title: "<grad:flame><bold>KEY FOUND!"
    subtitle: "<c:text>+1 <c:value><crate> Key"
    fade-in: 5
    stay: 40
    fade-out: 15
  menu:
    crumb: "Enchants"
    info:
      - "<c:text>Your own enchants: only you"
      - "<c:text>have them, on any island."
      - "<c:muted>They work at /farm and /mine."
    area:
      hoe: "/farm"
      pickaxe: "/mine"
    # <tool>
    header:
      name: "<bold><area:skills><tool> enchants"
      # <area> <shards> <balance>
      lore:
        - "<c:text>They work at <c:value><area></c:value> <c:text>with this tool."
        - ""
        - "<c:bar>| </c:bar><c:text>Your <shards>: </c:text><balance>"
    # <amount> <next>
    amount:
      name: "<bold><area:neutral>Buy <amount> at a time"
      lore:
        - "<c:text>A click on an enchant buys"
        - "<c:value><amount></c:value> <c:text>levels (or what is left)."
        - ""
        - "<bold><c:action>» CLICK</c:action></bold> <c:text>for <c:value><next></c:value> <c:text>at a time"
    # <name> <level>
    name: "<bold><area:skills><name> <c:value><level>"
    name-new: "<bold><area:skills><name>"
    name-locked: "<bold><area:locked><name>"
    # <level> <cap> <max>: the cap rises every prestige
    level-cap: "<c:bar>| </c:bar><c:text>Level: </c:text><c:value><level></c:value><c:muted>/<cap> (max <max>)"
    locked-level:
      - ""
      - "<c:error><sym:cross> Locked: tool level <level>"
      - "<c:muted>Your tool is level <have>."
    locked-prestige:
      - ""
      - "<c:error><sym:cross> Locked: prestige <prestige>"
    capped:
      - ""
      - "<c:warning>At your cap: <cap>"
      - "<c:muted>Prestige the tool for +20 levels."
    # <level> <max>
    level: "<c:bar>| </c:bar><c:text>Level: </c:text><c:value><level></c:value><c:muted>/<max>"
    # <now> <next>
    chance: "<c:bar>| </c:bar><c:text>Chance: </c:text><c:value><now></c:value> <c:muted>» <next>"
    chance-max: "<c:bar>| </c:bar><c:text>Chance: </c:text><c:value><now>"
    effect: "<c:bar>| </c:bar><c:text>Gives: </c:text><c:value><now></c:value> <c:muted>» <next>"
    effect-max: "<c:bar>| </c:bar><c:text>Gives: </c:text><c:value><now>"
    # <seconds>
    cooldown: "<c:bar>| </c:bar><c:muted>At most once every <seconds> s"
    # What one proc gives. {value} {crate}
    gives:
      area: "{value} blocks"
      extra_items: "+{value} items"
      shards: "{value} shards"
      cash: "{value}x sell price"
      progress: "+{value} progress"
      skill_xp: "+{value}% skill XP"
      key: "a {crate} Key"
      echo: "+{value}% shards for a while"
      streak_shards: "up to +{value}% shards"
      streak_xp: "up to +{value}% tool XP"
      basket: "1 of every unlocked item"
      pity: "after {value} blocks"
    max:
      - ""
      - "<c:success><sym:check> Highest level"
    # <amount> <cost>
    price:
      - "<c:bar>| </c:bar><c:text>Price (<amount>): </c:text><cost>"
    # Java only. <cost10> <cost100>
    hint:
      - "<c:muted>Shift-click: x10 (<cost10><c:muted>)"
      - "<c:muted>Right-click: x100 (<cost100><c:muted>)"
    # <amount>
    buy:
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to buy <amount>"
