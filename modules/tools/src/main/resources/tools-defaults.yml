# Auto-smelt (ability auto_smelt): dropped item -> smelted item.
smelt:
  raw_iron: iron_ingot
  raw_gold: gold_ingot
  raw_copper: copper_ingot
  iron_ore: iron_ingot
  gold_ore: gold_ingot
  copper_ore: copper_ingot
  ancient_debris: netherite_scrap
  cobblestone: stone
  sand: glass
