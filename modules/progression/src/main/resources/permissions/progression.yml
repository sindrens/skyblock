# Permissions of the progression module. Registered when the module enables, removed when it disables.
# Format: the permissions section of a plugin.yml (description, default: true|false|op|not op; missing = op).
# LuckPerms grants for these nodes: server/permissions/progression.txt. Commands: docs/commands/progression.md.
#
# M5.1 (pillars) has no command. M5.2: /is level and /is top (sub-commands of the islands module's /is, menus here).
# M5.3: the challenge book is a button in /is level (no new command). M5.4: /is upgrade (sub-command of /is).
# Planned nodes (PHASE-5 plan), added with their milestones:
#   skyblock.progression.admin.view   (mod)       /isadmin progression M5.10
#   skyblock.progression.admin.edit   (admin)     /isadmin progression M5.10
skyblock.progression.level:
  description: Use /is level and the island menu's level button (M5.2) - your island level, its sources and the pillars
  default: true
skyblock.progression.recalculate:
  description: Use the Recalculate button in /is level (M5.2) - full block worth rescan, island members only, 10 min cooldown per island
  default: true
skyblock.progression.top:
  description: Use /is top (M5.2/M5.7) - island leaderboards by level, weekly gain, value and pillar, solo and team
  default: true
skyblock.progression.top.hidden:
  description: Your islands never show on the island leaderboards or the Hall of Heroes boards (M5.7, staff islands are hidden like /baltop, owner 576); remembered while offline
  default: false
skyblock.progression.tasks:
  description: Open the challenge book from /is level (M5.3) - island tasks, shared progress, hand in items (members only)
  default: true
skyblock.progression.upgrade:
  description: Use /is upgrade, /is masteries and the Upgrades buttons (M5.4/M5.5) - island upgrades and masteries; buying also needs the island permission Upgrades (leader always, admin by default)
  default: true
