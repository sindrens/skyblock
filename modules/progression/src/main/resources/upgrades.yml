# Island upgrades (Phase 5, M5.4): /is upgrade, the Upgrades button in the island menu and in /is level.
# Edit here, then: /skyblock reload progression. Settings: upgrades-settings.yml. Texts: messages/progression.yml.
#
# A level needs every task that lists its key upgrade.<id>.<level> (tasks.yml) and money from the ISLAND BANK only
# (owner 169; no 2% fee, the period's interest is kept). Level and payment are saved in one database transaction.
# Only members with the island permission "Upgrades" buy (leader always; admin on by default).
# Every key inside 'upgrades' is one upgrade (no other settings belong in this file). New upgrades from an update are
# added automatically: turn one off with "enabled: false" instead of deleting it.
#
# upgrades.<id>:
#   tab:      island | economy | depths | production
#   icon:     item id; order: position in its tab (lower first)
#   effect:   what the value does (fixed per upgrade, see below); effects whose feature does not exist yet show
#             "Coming soon" and can't be bought: island-vault, fuel-tank, mob-loot, crop-growth, harvest-yield,
#             generator, and mine-fortune / lumberjack / xp-boost until the Depths roll and skill XP read them
#   enabled:  false = not shown, not bought (bought levels keep working)
#   levels:   one entry per level, in order:
#     tier:            task tier of the level (island level points: upgrades-settings.yml -> level-points)
#     cost:            money from the island bank
#     value:           the effect at this level (not added up): island-size border width in chunks (odd),
#                      member-slots slots WITH the leader, warp-slots warps, island-vault storage rows,
#                      entity-limits +%, bank-capacity / bank-interest bank level, sell-bonus / mine-fortune /
#                      lumberjack / xp-boost / spawner-rate / mob-loot / crop-growth / harvest-yield +%,
#                      spawner-stack spawners per block, generator / fuel-tank tier
#     min-island-level: island level needed as well (optional, 0 = none)
#
# Prices: tools/gen_upgrades_catalog.py from the balance model (ECONOMY_BALANCE.md 4.2 and 5.2); tuned in M5.9.

