# Island masteries (Phase 5, M5.5): /is masteries and the Masteries tab of /is upgrade.
# Edit here, then: /skyblock reload progression. Settings (Ascension too): masteries-settings.yml.
# Texts: messages/progression.yml.
#
# A rank needs its pillar level or island level, every task that lists its key mastery.<id>.<rank> (tasks.yml) and
# money from the ISLAND BANK only (owner 169). Rank and payment are saved in one database transaction. Only members
# with the island permission "Upgrades" buy (leader always; admin on by default).
# Every key inside 'masteries' is one mastery (no other settings belong in this file). New masteries from an update are
# added automatically: turn one off with "enabled: false" instead of deleting it.
# Masteries whose feature does not exist yet are hidden and can't be bought (GUI-2 hide-unbuilt rule): timber and
# swift-hands (the Depths roll and break speed read only the tool), fuel-efficiency (Phase 7), beast-tamer (no
# breeding hook), angler (no fishing yet). Their prices and tasks stay here for later.
#
# masteries.<id>:
#   icon:      item id; order: position in the tab (lower first)
#   effect:    what the value does (fixed per mastery): timber, swift-hands, warrior (+% PvE damage, never in PvP),
#              deep-pockets (+% satchel size), crystal-rush (+% crystals), lucky-strike (+% rare finds),
#              fuel-efficiency, beast-tamer, angler, homestead (extra shared island homes), wings (island fly for
#              everyone on the island), treasury (bank fee step: 2% -> 1.5% -> 1.0% -> 0.5%),
#              market-contacts (+% sell prices, inside the +300% sell cap), farm-mastery / mine-mastery / fish-mastery / combat-mastery (+value levels
#              on the members' /farm hoe or /mine pickaxe enchant cap)
#   pillar:    pillar whose level the ranks need (mining, foraging, farming, combat), or leave out
#   requires-maxed: upgrade ids that must be fully upgraded first (Market Contacts: sell_multiplier)
#   enabled:   false = not shown, not bought (bought ranks keep working)
#   ranks:     one entry per rank, in order:
#     tier:         price tier (island level points: upgrades-settings.yml -> level-points)
#     cost:         money from the island bank
#     value:        the effect at this rank (not added up)
#     pillar-level: level of the pillar above needed (optional, 0 = none)
#     island-level: island level needed (optional, 0 = none)
#
# Prices: tools/gen_masteries_catalog.py from the balance model (ECONOMY_BALANCE.md 5.2, 5.4, 5.5); tuned in M5.9.

