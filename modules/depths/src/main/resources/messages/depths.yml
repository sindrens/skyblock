# The Depths: per-player resource blocks (M4.3). MiniMessage + style tags (style.yml). Placeholders: <name>.
# Reload: /skyblock reload depths

# Action bar when breaking a non-resource block or placing a block inside a region.
protected: "<c:error><sym:cross> You can only mine resource blocks here."

alert:
  fast-break: "<c:muted>[Depths]</c:muted> <c:value><player></c:value> <c:warning>broke <block> too fast</c:warning> <c:muted>(<actual> ms, needs at least <min> ms of <expected> ms with <tool>) <sym:dot> <count> flags in <seconds> s"
  no-start: "<c:muted>[Depths]</c:muted> <c:value><player></c:value> <c:warning>broke <block> without starting to mine it</c:warning> <c:muted>(needs <expected> ms with <tool>) <sym:dot> <count> flags in <seconds> s"

debug:
  header: "<prefix><c:text>Depths debug for <c:value><player></c:value>"
  region: " <c:ember><sym:bullet></c:ember> <c:text>Region at feet: <c:value><region></c:value> <c:muted>(<world> <min> to <max>, <resources> resource blocks, from <source>)"
  no-region: " <c:ember><sym:bullet></c:ember> <c:text>Region at feet: <c:muted>none in <world>"
  target-plain: " <c:ember><sym:bullet></c:ember> <c:text>Looking at <c:value><block></c:value> <c:muted>(not a resource block here)"
  target-resource: " <c:ember><sym:bullet></c:ember> <c:text>Looking at <c:value><block></c:value> <c:success>resource</c:success> <c:muted>(depleted: <depleted>, respawn <seconds> s)"
  target-depleted: " <c:ember><sym:bullet></c:ember> <c:text>Looking at <c:value><block></c:value> <c:warning>depleted for this player</c:warning> <c:muted>(shows <depleted>, respawn <seconds> s)"
  depleted: " <c:ember><sym:bullet></c:ember> <c:text>Depleted for <player>: <c:value><count></c:value> <c:muted><sym:dot> all players: <total> (<players> tracked)"
  timers: " <c:ember><sym:bullet></c:ember> <c:text>Timers pending: <c:value><timers></c:value> <c:muted><sym:dot> pool <capacity>, wheel <slots> ticks <sym:dot> regions: <regions>"
  perf: " <c:ember><sym:bullet></c:ember> <c:text>Break handling: avg <c:value><avg> ms</c:value> <c:muted><sym:dot> max <max> ms <sym:dot> <breaks> breaks"
  flags: " <c:ember><sym:bullet></c:ember> <c:text>Fast-break flags for <player>: <c:value><window></c:value> <c:muted>in window <sym:dot> <total> this session <sym:dot> <all> on the server"

# Zones (M4.1): layout from zones.yml, /depths generate, /depths tp, boss portal.
zones:
  skill:
    mining: "<pillar:mining>Mining"
    foraging: "<pillar:foraging>Foraging"
    combat: "<pillar:combat>Combat"
    farming: "<pillar:farming>Farming"
    fishing: "<pillar:fishing>Fishing"
  no-world: "<prefix><c:error><sym:cross> The world <c:value><world></c:value> is not loaded. Check worlds.yml, then <c:action>/skyblock reload depths</c:action>."
  generate:
    start: "<prefix><c:text>Building <c:value><parts></c:value> placeholder part(s) in <c:value><world></c:value> <c:muted>(max <blocks> blocks per tick, progress on your action bar)"
    skipped-built: "<prefix><c:warning>Skipped, marked <c:value>built: true</c:value> in zones.yml (builder work is never overwritten): <c:value><zones>"
    nothing: "<prefix><c:warning>Nothing to build: everything selected is marked <c:value>built: true</c:value> in zones.yml."
    busy: "<prefix><c:error><sym:cross> A Depths build is already running <c:muted>(part <done>/<total>, <percent>%)</c:muted>. Wait until it is done."
    progress: "<c:ember><sym:pickaxe></c:ember> <c:text>Depths build <c:value><percent>%</c:value> <c:muted><sym:dot> part <done>/<total>: <part> <sym:dot> <changed> blocks changed"
    progress-console: "<c:muted>[Depths]</c:muted> <c:text>Build <c:value><percent>%</c:value> <c:muted><sym:dot> part <done>/<total>: <part> <sym:dot> <changed> blocks changed"
    bad-block: "<prefix><c:warning><part>: '<block>' is not a valid block in zones.yml, <c:value><used></c:value> is used instead."
    bad-biome: "<prefix><c:warning><part>: biome '<biome>' is unknown, the biome is left as it is."
    done: "<prefix><c:success><sym:check> Placeholder build done: <c:value><parts></c:value> part(s), <c:value><changed></c:value> blocks changed in <seconds> s."
  tp:
    done: "<prefix><c:text>Teleported to <c:value><name></c:value> <c:muted>(<zone>)"
    failed: "<prefix><c:error><sym:cross> Could not teleport to <c:value><zone></c:value>."
  portal:
    boss: "<c:ember><sym:sword></c:ember> <c:text>Entering the <c:value><name></c:value>"
    back: "<c:ember><sym:arrow></c:ember> <c:text>Back to <c:value><name></c:value>"
    locked: "<c:error><sym:cross> <skill> <required> needed <c:muted>(<level>/<required>)"
