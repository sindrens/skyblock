    icon: grass_block
    slot: 21
    description: "<c:text>Grow and show off your island."
    boost: crystals
  combat:
    name: "<c:flame>Combat"
    icon: iron_sword
    slot: 22
    description: "<c:text>Clear out the monsters."
    boost: mob_damage
  economy:
    name: "<c:flame>Economy"
    icon: emerald
    slot: 23
    description: "<c:text>Sell, trade and get rich."
    boost: ah_slots
  gear:
    name: "<c:flame>Gear"
    icon: smithing_table
    slot: 24
    description: "<c:text>Tools, enchants and sets."
    boost: tool_xp
  social:
