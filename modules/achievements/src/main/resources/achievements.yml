# Achievements (F3). Edit here, then: /skyblock reload achievements. Settings: achievements-settings.yml.
# Texts around them (menu, unlock toast): messages/achievements.yml.
#
# Progress is per profile; a reward title goes to the account (all profiles) when any profile finishes the last tier.
# New achievements from an update are added to this file automatically: turn one off with "enabled: false" instead of
# deleting it. Every key inside 'categories' and 'achievements' is one entry (no other settings belong in this file).
#
# categories.<id>:   name, icon (item id), slot (inner slot of the 6-row menu: 10-12, 14-16, 19-25, 28-34, 37-43;
#                    13 is the summary), description, boost (what the category's boost points give, see below)
#
# Boost points (AC2): every finished tier gives points (achievements-settings.yml -> points.*, default 1/2/3/5/8).
# A category's points feed its boost, each point adds a step up to a small cap (boosts.* in achievements-settings.yml):
#   skill_xp     skill XP family           tool_xp      custom tool XP family
#   mob_damage   damage to mobs (never PvP) rare_finds   rare finds family
#   crystals     crystals family           ah_slots     +1/+2 auction listing slots at point thresholds
#   none         no boost
# Personal achievements never boost sell prices or money (owner RTA-39).
# achievements.<id>:
#   name:        shown name (MiniMessage, max 24 visible characters)
#   description: 1-3 lines (max 36 visible characters each)
#   icon:        item id
#   category:    a category id
#   metric:      what is counted (list below)
#   goals:       one goal per tier, rising, e.g. [10, 100, 1000] (max 10 tiers). One goal = a one-step achievement.
#   title:       reward title for the last tier: an id from tags-titles.yml, or {id, display, rarity}: the title is
#                added to tags-titles.yml when it does not exist yet (an existing title is never changed). Optional.
#   hidden:      true = shown as ??? until the first tier is done (secret achievements)
#   enabled:     false = not shown, not counted
#
# Metrics (per profile; every value only goes up):
#   playtime_minutes      minutes online                     stacked_kills       mobs killed from stacks
#   items_sold            items sold (/sell, satchel)        money_earned        money earned by selling
#   enchants_applied      books applied to tools             trades_completed    finished /trade trades
#   islands_visited       islands visited (1 per island/day) best_sale           biggest single sale
#   best_stack_kill       most mobs killed from a stack at once
#   skill_mining, skill_foraging, skill_combat, skill_farming, skill_fishing   skill level
#   skill_total           sum of the open skills' levels     skill_best          highest skill level
#   island_blocks_mined, island_logs_chopped, island_crops_harvested, island_blocks_placed, island_mobs_killed
#                         your own all-time island stats (/is stats)
#   island_visitors       unique visitors of your island, all time
#   wardrobe_sets_owned   sets owned                         wardrobe_best_level highest set level
#   tool_best_level       highest custom tool level          tool_best_prestige  highest tool prestige
#   balance_peak          most money held at once
#
# island-achievements.<id> (AC3): progress shared by every member of the island (coop players and visitors never count).
#   Same keys as achievements, without category. team-only: true = only team islands (solo islands don't see it).
#   The last tier's title goes to every member who has been on the island island.title-min-days (default 3) days.
#   Finished tiers give island points: island boosts (production, island crystals, island XP, fuel) and island level
#   points (achievements-settings.yml -> island.*).
# Island metrics:
#   island_level          the island level                   likes               likes received
#   crops_harvested, blocks_mined, logs_chopped, mobs_killed   all members together (all-time /is stats)
#   visitors              unique visitors, all time          team_active         members active the same day (best day)

categories:
  skills:
    name: "<c:flame>Skills"
    icon: experience_bottle
    slot: 20
    description: "<c:text>Level up your skills."
    boost: skill_xp
  island:
