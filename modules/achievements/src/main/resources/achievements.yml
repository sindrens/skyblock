    icon: grass_block
    slot: 21
    description: "<c:text>Grow and show off your island."
  combat:
    name: "<c:flame>Combat"
    icon: iron_sword
    slot: 22
    description: "<c:text>Clear out the monsters."
  economy:
    name: "<c:flame>Economy"
    icon: emerald
    slot: 23
    description: "<c:text>Sell, trade and get rich."
  gear:
    name: "<c:flame>Gear"
    icon: smithing_table
    slot: 24
    description: "<c:text>Tools, enchants and sets."
  social:
    name: "<c:flame>Exploring"
    icon: compass
    slot: 31
    description: "<c:text>Play, visit and explore."

