# Permissions of the NPC and hologram module. Registered when the module enables, removed when it disables.
# Format: the permissions section of a plugin.yml (description, default: true|false|op|not op; missing = op).
# LuckPerms grants for these nodes: server/permissions/npcs.txt. Commands: docs/commands/npcs.md.
# Clicking NPCs and holograms needs no permission (the command an NPC runs checks its own permission).
skyblock.admin.npcs:
  description: Staff tools for NPCs and holograms (/skyblock npcs list, tp, respawn; staff hub entry).
  default: op
