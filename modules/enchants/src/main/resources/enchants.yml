# Custom enchants (Phase E, docs/plans/ENCHANTS.md §6). Every number here is a default the owner can change.
# Names and effect texts are in messages/enchants.yml → enchant.<id>.name / .effect ({key} = the number at that level).
# Costs, fees, rolls and caps are in enchanter.yml. Reload: /skyblock reload enchants
#
# Keys per enchant:
#   rarity:        common, uncommon, rare, epic, legendary, mythic (mythic = prestige slot only, one level)
#   max-level:     1-10 (levels show as Roman numerals)
#   tools:         pickaxe, axe, hoe, sword, rod, helmet, chestplate, leggings, boots, or "tools" / "armor" for all
#   slot-cost:     perk slots it takes (1, or 2 for the two Legendary area enchants)
#   conflicts:     conflict groups: a tool holds only one enchant per group (mythics are always in group "mythic")
#   pools:         book pools it drops from (mining, foraging, farming, combat, fishing, stacks); none for mythics
#   min-tier:      lowest tier of the pool's wing it drops from (fishing: band A = 1, B = 2, C = 3, D = 4)
#   family:        bonus family of the effect (sell, crystals, extra_drops, speed, skill_xp, tool_xp, rare_finds, area,
#                  mob_damage, damage_reduction, health); families add up and are capped once (enchanter.yml → caps)
#   passive:       which values list is a flat percent of the family (reported to the bonus service right away)
#   values:        one number per level for each key, used by the effect and the effect text
#   params:        constant numbers (cooldowns, radius, yield …)
#   pvp-percent:   strength in the warzone and duels in percent of the normal value (0 = no effect there)
#   weight:        chance weight inside its rarity when a pool picks an enchant (default 1)
#   enabled:       false = kill switch: stays on items (shown as off), does nothing, can't be applied or rolled

