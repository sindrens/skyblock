# Enchants (Phase E, docs/plans/ENCHANTS.md): books, the Enchanter, guide. MiniMessage + style tags (style.yml).
# Book lore uses {placeholders} (filled by the plugin); chat and menus use <placeholders>.
# Enchant effects: {key} = the enchant's number at that level (enchants.yml → values / params). Keep effects short:
# they must fit two lore lines of ~32 characters at every level.
# Reload: /skyblock reload enchants

error: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong. Try again in a moment."
unavailable: "<prefix><c:error><sym:cross></c:error> <c:text>The Enchanter is closed right now. Try again later."
busy: "<c:warning>Wait a moment, saving your enchant..."
inventory-full: "<prefix><c:warning><sym:cross></c:warning> <c:text>Inventory full. The rest dropped at your feet."
not-enough: "<prefix><c:error><sym:cross></c:error> <c:text>You need <c:value><sym:crystals> <cost></c:value>. You have <c:value><sym:crystals> <have></c:value>."
tool-gone: "<prefix><c:error><sym:cross></c:error> <c:text>Tool not found. Put it in your inventory."
book-gone: "<prefix><c:error><sym:cross></c:error> <c:text>Book not found. Put it in your inventory."
enchant-gone: "<prefix><c:error><sym:cross></c:error> <c:text>That enchant is not on the tool any more."
unknown-enchant: "<prefix><c:error><sym:cross></c:error> <c:text>This enchant does not exist any more. Ask staff."
no-scroll: "<prefix><c:error><sym:cross></c:error> <c:text>You need a Disenchant Scroll. Get one in the Book shop."
confiscated: "<prefix><c:error><sym:cross></c:error> <c:text>That item was a copy. It was taken and staff were told."
staff-confiscated: "<c:error><bold>DUPE</bold></c:error> <c:value><player></c:value> <c:text>used a copied <c:value><book></c:value> <c:muted>(<id>)</c:muted><c:text>. Taken."
undone: "<prefix><c:warning><sym:cross></c:warning> <c:text>Something moved, so nothing changed. Your crystals are back."

# Armor enchants on wardrobe set pieces (E5). <enchant> name, <minutes> cooldown.
armor:
  unavailable: "<prefix><c:error><sym:cross></c:error> <c:text>Armor enchants need the wardrobe. Try again later."
  entry-gone: "<prefix><c:error><sym:cross></c:error> <c:text>That set is not in your wardrobe any more."
  enchant-gone: "<prefix><c:error><sym:cross></c:error> <c:text>That enchant is not on the piece any more."
  piece-changed: "<prefix><c:error><sym:cross></c:error> <c:text>That set changed meanwhile, so nothing happened. Open it again."
  rebirth: "<prefix><c:success><sym:check></c:success> <c:enchant><enchant></c:enchant> <c:text>saved you! Ready again in <c:value><minutes> min</c:value>."

applied: "<prefix><c:success><sym:check></c:success> <c:enchant><enchant></c:enchant> <c:text>is on your <c:value><tool></c:value><c:text>. Paid <c:value><sym:crystals> <cost></c:value>."
upgraded: "<prefix><c:success><sym:check></c:success> <c:text>Now <c:enchant><enchant></c:enchant><c:text>. Paid <c:value><sym:crystals> <cost></c:value>."
combined: "<prefix><c:success><sym:check></c:success> <c:text>You made <c:enchant><enchant></c:enchant><c:text>. Paid <c:value><sym:crystals> <cost></c:value>."
removed: "<prefix><c:success><sym:check></c:success> <c:enchant><enchant></c:enchant> <c:text>came off as a book."
shattered: "<prefix><c:success><sym:check></c:success> <c:enchant><enchant></c:enchant> <c:text>shattered. You got <c:value><sym:crystals> <refund></c:value> back."
rolled: "<prefix><c:success><sym:check></c:success> <c:text>You got <book><c:text>! Paid <c:value><sym:crystals> <cost></c:value>."
scroll-bought: "<prefix><c:success><sym:check></c:success> <c:text>You bought a Disenchant Scroll for <c:value><sym:crystals> <cost></c:value>."

roll:
  limit: "<prefix><c:error><sym:cross></c:error> <c:text>No rolls of this kind left today. New ones tomorrow."
  closed: "<prefix><c:error><sym:cross></c:error> <c:text>This roll is closed right now."
  tier: "<prefix><c:error><sym:cross></c:error> <c:text>Needs <pool> tier <c:value><tier></c:value>."
  empty: "<prefix><c:error><sym:cross></c:error> <c:text>No book can come from this roll yet."

# Chat when a rule blocks something (<other> enchant, <level> tool level, <tools> tool types, <max> max level).
rule:
  ok: "<prefix><c:success><sym:check></c:success>"
  disabled: "<prefix><c:error><sym:cross></c:error> <c:text>This enchant is turned off for now."
  wrong-tool: "<prefix><c:error><sym:cross></c:error> <c:text>Only for: <c:value><tools></c:value>."
  already-on-tool: "<prefix><c:error><sym:cross></c:error> <c:text>The tool already has it. Use Upgrade."
  conflict: "<prefix><c:error><sym:cross></c:error> <c:text>Conflicts with <c:value><other></c:value>."
  slot-locked: "<prefix><c:error><sym:cross></c:error> <c:text>That slot opens at tool <c:value>Lv <level></c:value>."
  slot-used: "<prefix><c:error><sym:cross></c:error> <c:text>That slot is full."
  needs-two-slots: "<prefix><c:error><sym:cross></c:error> <c:text>Needs 2 free slots next to each other."
  prestige-only: "<prefix><c:error><sym:cross></c:error> <c:text>Mythics go in the prestige slot only."
  level-gate: "<prefix><c:error><sym:cross></c:error> <c:text>Needs tool <c:value>Lv <level></c:value> for that level."
  max-level: "<prefix><c:error><sym:cross></c:error> <c:text>Already max level (<max>)."
  not-a-pair: "<prefix><c:error><sym:cross></c:error> <c:text>Needs the same enchant at the same level."
  mythic-only-slot: "<prefix><c:error><sym:cross></c:error> <c:text>The mythic slot takes Mythic enchants only."
  # Armor (E5): <level> is a set level.
  armor-level-gate: "<prefix><c:error><sym:cross></c:error> <c:text>Needs set <c:value>Lv <level></c:value> for that level."
  armor-slot-locked: "<prefix><c:error><sym:cross></c:error> <c:text>That slot opens at set <c:value>Lv <level></c:value>."
  wrong-piece: "<prefix><c:error><sym:cross></c:error> <c:text>Only for: <c:value><tools></c:value>."
  already-on-piece: "<prefix><c:error><sym:cross></c:error> <c:text>The piece already has it. Upgrade it instead."
  mythic-slot-only: "<prefix><c:error><sym:cross></c:error> <c:text>Mythics go in the chestplate's mythic slot only."

# The same as one red lore line in menus.
why:
  ok: "<c:success><sym:check> Fits"
  disabled: "<c:error><sym:cross> Turned off for now"
  wrong-tool: "<c:error><sym:cross> Only for: <tools>"
  already-on-tool: "<c:error><sym:cross> Already on this tool"
  conflict: "<c:error><sym:cross> Conflicts with <other>"
  slot-locked: "<c:error><sym:cross> Slot opens at Lv <level>"
  slot-locked-prestige: "<c:error><sym:cross> Prestige the tool first"
  slot-used: "<c:error><sym:cross> Slot is full"
  needs-two-slots: "<c:error><sym:cross> Needs 2 free slots"
  prestige-only: "<c:error><sym:cross> Prestige slot only"
  level-gate: "<c:error><sym:cross> Needs tool Lv <level>"
  max-level: "<c:error><sym:cross> Max level (<max>)"
  not-a-pair: "<c:error><sym:cross> Not the same enchant and level"
  mythic-only-slot: "<c:error><sym:cross> Mythic enchants only"
  armor-level-gate: "<c:error><sym:cross> Needs set Lv <level>"
  armor-slot-locked: "<c:error><sym:cross> Slot opens at set Lv <level>"
  wrong-piece: "<c:error><sym:cross> Only for: <tools>"
  already-on-piece: "<c:error><sym:cross> Already on this piece"
  mythic-slot-only: "<c:error><sym:cross> Mythic slot only"
  set-gone: "<c:error><sym:cross> Set not found"
  needs-pair: "<c:error><sym:cross> Needs a second <book>"
  tool-gone: "<c:error><sym:cross> Tool not found"
  unknown: "<c:error><sym:cross> Unknown enchant"

prestige-prefix: "★ "
disabled-suffix: " (off)"

rarity:
  common: "Common"
  uncommon: "Uncommon"
  rare: "Rare"
  epic: "Epic"
  legendary: "Legendary"
  mythic: "Mythic"

target:
  all-tools: "All tools"
  all-armor: "All armor"
  pickaxe: "Pickaxe"
  axe: "Axe"
  hoe: "Hoe"
  sword: "Sword"
  rod: "Rod"
  helmet: "Helmet"
  chestplate: "Chestplate"
  leggings: "Leggings"
  boots: "Boots"

pool:
  mining: "Mining"
  foraging: "Foraging"
  farming: "Farming"
  combat: "Combat"
  fishing: "Fishing"
  stacks: "Island stacks"

# Book and scroll items (lore formats use {placeholders}).
book:
  fallback-name: "<rarity:common>Enchant Book"
  name: "<rarity:{rarity}>{name}"
  subtitle: "<c:muted>Enchant Book · {targets}"
  details: "<c:muted>Details"
  max-level: " <c:enchant>▸ <c:text>Max level <c:value>{value}"
  slot-cost: " <c:enchant>▸ <c:text>Slot cost <c:value>{value}"
  prestige-slot: " <c:enchant>▸ <c:text>Prestige slot only"
  conflicts: " <c:enchant>▸ <c:text>Conflicts <c:value>{value}"
  armor: "<c:muted>For wardrobe set pieces"
  disabled: "<c:error>Turned off for now"
  unknown: "This enchant does not exist any more."
  action-input: "Use at"
  action-text: "/enchanter"
# Stacked mobs (E3, ENCHANTS §7): action bar when an area enchant kills mobs of other stacks (<enchant> name + level,
# <count> mobs), chat when a book drops from stacked mobs (<book> colored name).
drop:
  book: "<prefix><c:success><sym:check></c:success> <c:text>You found <book><c:text>!"
  first: "<prefix><c:success><sym:check></c:success> <c:text>First find! You got <book><c:text>."
  pity: "<prefix><c:success><sym:check></c:success> <c:text>Your luck turned! You got <book><c:text>."
  mini-boss: "<prefix><c:success><sym:check></c:success> <c:text>The mini-boss dropped <book><c:text>!"

proc:
  area: "<c:enchant><enchant></c:enchant> <c:muted>·</c:muted> <c:value>+<count></c:value> <c:text>blocks"
  geode: "<c:enchant><enchant></c:enchant> <c:muted>·</c:muted> <c:value>+<sym:crystals> <count></c:value>"
  gilded: "<c:enchant><enchant></c:enchant> <c:muted>·</c:muted> <c:value>x2</c:value> <c:text>drop"
  haste: "<c:enchant><enchant></c:enchant> <c:muted>·</c:muted> <c:value>+<percent>%</c:value> <c:text>speed"
  momentum: "<c:enchant><enchant></c:enchant> <c:muted>·</c:muted> <c:value><stacks>/<max></c:value> <c:text>stacks"
  nova: "<c:enchant><enchant></c:enchant> <c:muted>·</c:muted> <c:value><count></c:value> <c:text>mobs hit"

stack:
  sweep: "<c:enchant><enchant></c:enchant> <c:muted>·</c:muted> <c:value>+<count></c:value> <c:text>mobs"
  wrath: "<c:enchant><enchant></c:enchant> <c:muted>·</c:muted> <c:value>+<count></c:value> <c:text>mobs"
  book: "<prefix><c:success><sym:check></c:success> <c:text>The stack dropped <book><c:text>!"

scroll:
  name: "<rarity:rare>Disenchant Scroll"
  subtitle: "<c:muted>Scroll"
  description: "Takes an enchant off a tool as a book."

# ---------------------------------------------------------------------------------------------------------- menus
menu:
  title: "Enchanter"
  text-line: "<c:text><text>"
  click: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"]
  tool-gone:
    name: "<c:error>Tool not found"
    lore: ["<c:text>Put it in your inventory", "<c:text>and open the menu again."]
  mode:
    apply: "Apply a book"
    upgrade: "Upgrade"
    remove: "Remove"
    combine: "Combine books"
    armor: "Armor"
  main:
    info: ["<c:text>Put enchant books on custom", "<c:text>tools, then level them up with", "<c:text>crystals. Never a fail chance."]
    apply:
      name: "<c:value>Apply a book"
      lore: ["<c:text>Put a book in a free slot", "<c:text>of a custom tool.", "<c:muted>Books with you: <books>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose a tool"]
    upgrade:
      name: "<c:value>Upgrade"
      lore: ["<c:text>Raise an enchant on a tool", "<c:text>with crystals or a book.", "<c:muted>Tools with you: <tools>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose a tool"]
    combine:
      name: "<c:value>Combine books"
      lore: ["<c:text>Two equal books make one", "<c:text>book a level higher.", "<c:muted>Books with you: <books>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
    remove:
      name: "<c:value>Remove"
      lore: ["<c:text>With a scroll you keep the", "<c:text>book. Without, it shatters.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose a tool"]
    armor:
      name: "<c:value>Armor"
      lore: ["<c:text>Enchant the pieces of the sets", "<c:text>in your wardrobe.", "<c:muted>Sets you own: <sets>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose a set"]
    armor-off:
      name: "<c:muted>Armor"
      lore: ["<c:text>Armor enchants need the", "<c:text>wardrobe. Closed right now."]
    shop:
      name: "<c:value>Book shop"
      lore: ["<c:text>Random books and Disenchant", "<c:text>Scrolls for crystals.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
    guide:
      name: "<c:value>Enchant guide"
      lore: ["<c:text>Every enchant, what it does", "<c:text>and where it drops.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
    crystals:
      name: "<cur:crystals><sym:crystals> <crystals></cur:crystals> <c:text>crystals"
      lore: ["<c:muted>Earn crystals on your island", "<c:muted>and in The Depths."]
    next-book:
      name: "<c:value>Next guaranteed book"
      lore: ["<c:text>Mine <c:value><mining></c:value> <c:muted>blocks", "<c:text>Forest <c:value><foraging></c:value> <c:muted>logs", "<c:text>Combat <c:value><combat></c:value> <c:muted>kills", "", "<c:muted>Books also drop by luck.", "<c:muted>Use the right custom tool."]
      closed: "off"
      none: "-"
  tools:
    info: ["<c:text>Pick one of the custom tools", "<c:text>in your inventory."]
    empty:
      name: "<c:muted>No custom tools"
      lore: ["<c:text>Get one at <c:value>/forge</c:value><c:text>.", "<c:text>Vanilla tools can't get these."]
    entry: ["<c:muted>Lv <level> · slots <used>/<slots>"]
    click:
      apply: ["<bold><c:action>» CLICK</c:action></bold> <c:text>to pick a slot"]
      upgrade: ["<bold><c:action>» CLICK</c:action></bold> <c:text>to pick an enchant"]
      remove: ["<bold><c:action>» CLICK</c:action></bold> <c:text>to pick an enchant"]
  slots:
    info:
      apply: ["<c:text>Pick a free slot for the book.", "<c:text>Slots open at Lv 5, 15, 30, 45.", "<c:text>Slot 5 opens with prestige."]
      upgrade: ["<c:text>Pick the enchant to upgrade."]
      remove: ["<c:text>Pick the enchant to remove."]
    covered:
      name: "<c:muted>Slot <slot>"
      lore: ["<c:text>Used by <c:enchant><enchant></c:enchant> <c:text>(2 slots)"]
    filled:
      name: "<enchant>"
      unknown: "<c:error><enchant>"
      lore: ["<c:muted>Slot <slot> · put in <sym:crystals> <invested>"]
      click:
        apply: ["", "<c:muted>Slot is full"]
        upgrade: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to upgrade"]
        remove: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to remove"]
    disabled: ["<c:error>Turned off for now"]
    empty:
      apply:
        name: "<c:value>Slot <slot>"
        lore: ["<c:muted><sym:bullet> Empty slot", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to pick a book"]
      other:
        name: "<c:value>Slot <slot>"
        lore: ["<c:muted><sym:bullet> Empty slot"]
    prestige-empty:
      apply:
        name: "<c:flame><sym:star> Prestige slot"
        lore: ["<c:muted><sym:bullet> Empty slot", "<c:text>Fits Mythic enchants too.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to pick a book"]
      other:
        name: "<c:flame><sym:star> Prestige slot"
        lore: ["<c:muted><sym:bullet> Empty slot"]
    prestige-locked:
      name: "<c:muted><sym:star> Prestige slot"
      lore: ["<c:error><sym:cross> <c:text>Prestige the tool to open"]
    locked:
      name: "<c:muted>Slot <slot>"
      lore: ["<c:error><sym:cross> <c:text>Opens at Lv <level>", "<c:muted>Now Lv <have>"]
  # Armor tab (E5): enchants go on the sets in your wardrobe, not on vanilla armor.
  armor:
    info: ["<c:text>Your wardrobe sets. Armor", "<c:text>enchants go on their pieces,", "<c:text>never on vanilla armor."]
    empty:
      name: "<c:muted>No sets yet"
      lore: ["<c:text>Get a set in <c:value>/wardrobe</c:value><c:text>,", "<c:text>then enchant its pieces here."]
    name: "<set>"
    entry: ["<c:muted>Set Lv <level> · <enchants> enchant(s)"]
    worn: ["<c:muted>Wearing <count>/4 pieces"]
    click: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to see the pieces"]
  armor-entry:
    info: ["<c:text>Each row is a piece and its", "<c:text>slots. Slot 2 and the mythic", "<c:text>slot open with the set level.", "<c:text>Gray = dormant: works again", "<c:text>when the set level is high", "<c:text>enough."]
    gone:
      name: "<c:error>Set not found"
      lore: ["<c:text>It is not in your wardrobe", "<c:text>any more. Go back."]
    set:
      name: "<set>"
      lore: ["<c:text>Set Lv <c:value><level>", "<c:muted>Slot 2 at Lv <second>", "<c:muted>Mythic slot at Lv <mythic>", "<c:muted>Higher levels allow higher", "<c:muted>enchant levels."]
    filled:
      lore: ["<c:muted>Slot <slot> · put in <sym:crystals> <invested>"]
      click: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to upgrade or remove"]
    dormant: ["<c:warning>Dormant: no effect until", "<c:warning>set Lv <level>"]
    empty:
      name: "<c:value>Slot <slot>"
      lore: ["<c:muted><sym:bullet> Empty slot", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to pick a book"]
    mythic-empty:
      name: "<c:flame><sym:star> Mythic slot"
      lore: ["<c:muted><sym:bullet> Empty slot", "<c:text>Fits Mythic armor enchants.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to pick a book"]
    locked:
      name: "<c:muted>Slot <slot>"
      lore: ["<c:error><sym:cross> <c:text>Opens at set Lv <level>", "<c:muted>Now Lv <have>"]
    mythic-locked:
      name: "<c:muted><sym:star> Mythic slot"
      lore: ["<c:error><sym:cross> <c:text>Opens at set Lv <level>", "<c:muted>Now Lv <have>"]
  armor-books:
    info: ["<c:text>Books that fit this slot are", "<c:text>at the top. The others say", "<c:text>why not."]
    empty:
      name: "<c:muted>No enchant books"
      lore: ["<c:text>Armor books drop in The", "<c:text>Depths combat zones."]
  armor-enchant:
    info: ["<c:text>Upgrade with crystals or a", "<c:text>book. A scroll gives the book", "<c:text>back; shatter destroys it."]
    now: ["<c:muted><piece>", "<c:muted>Max <max> · set allows <gate>", "<c:muted>Put in: <sym:crystals> <invested>"]
  books:
    info: ["<c:text>Books that fit are at the top.", "<c:text>The others say why not."]
    crumb: "Slot <slot>"
    empty:
      name: "<c:muted>No enchant books"
      lore: ["<c:text>Find books in The Depths or", "<c:text>roll one in the Book shop."]
    fits: ["<c:success><sym:check> Fits", "<c:text>Costs <c:value><sym:crystals> <cost>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to apply"]
  upgrade:
    info: ["<c:text>Crystals raise it one level.", "<c:text>A book of the same level is", "<c:text>cheaper but uses the book."]
    name: "<enchant>"
    now: ["<c:muted>Max <max> · this tool allows <gate>"]
    crystals:
      name: "<c:value>Upgrade with crystals"
      lore: ["<c:text>To <next>", "<c:text>Costs <c:value><sym:crystals> <cost>"]
    book:
      name: "<c:value>Upgrade with a book"
      none: ["<c:error><sym:cross> <c:text>No <book> <c:text>book", "<c:muted>with you."]
      lore: ["<c:text>Uses <book>", "<c:text>To <next>", "<c:text>Costs <c:value><sym:crystals> <cost>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"]
  remove:
    info: ["<c:text>A scroll gives you the book", "<c:text>back. Shatter destroys it."]
    name: "<enchant>"
    now: ["<c:muted>Put in: <sym:crystals> <invested>"]
    scroll:
      name: "<c:value>Remove with a scroll"
      lore: ["<c:text>You get <enchant> <c:text>back", "<c:text>as a book. Uses 1 scroll.", "<c:muted>Scrolls with you: <scrolls>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"]
    no-scroll:
      name: "<c:muted>Remove with a scroll"
      lore: ["<c:error><sym:cross> <c:text>No Disenchant Scroll", "<c:muted>Buy one in the Book shop."]
    scroll-unknown:
      name: "<c:muted>Remove with a scroll"
      lore: ["<c:error><sym:cross> <c:text>Unknown enchant: shatter only"]
    shatter:
      name: "<c:error>Shatter"
      lore: ["<c:error>Destroys <enchant><c:error>.", "<c:text>You get <c:value><sym:crystals> <refund></c:value> <c:text>back.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"]
  combine:
    info: ["<c:text>Two books of the same enchant", "<c:text>and level make one book a", "<c:text>level higher."]
    empty:
      name: "<c:muted>No enchant books"
      lore: ["<c:text>Find books in The Depths or", "<c:text>roll one in the Book shop."]
    hint:
