# Permissions of the essentials module. Registered when the module enables, removed when it disables.
# Format: the permissions section of a plugin.yml (description, default: true|false|op|not op; missing = op).
# LuckPerms grants for these nodes: server/permissions/essentials.txt. Commands: docs/commands/essentials.md.
skyblock.player.spawn:
  description: Teleport to spawn (/spawn)
  default: true
skyblock.player.tpa:
  description: Send and answer teleport requests (/tpa, /tpahere, /tpaccept, /tpdeny, /tpcancel)
  default: true
skyblock.staff.teleport.bypass:
  description: No warmup, cooldown or teleport restrictions
  default: op
skyblock.staff.tp:
  description: Teleport to players (/tp)
  default: op
skyblock.staff.tp.others:
  description: Teleport a player to another player (/tp <player> <target>)
  default: op
skyblock.staff.tphere:
  description: Teleport a player to you (/tphere)
  default: op
skyblock.staff.tppos:
  description: Teleport to coordinates (/tppos)
  default: op
skyblock.staff.top:
  description: Teleport to the highest block (/top)
  default: op
skyblock.staff.back:
  description: Return to the previous location or death point (/back)
  default: op
skyblock.staff.home:
  description: Staff homes (/home, /sethome, /delhome)
  default: op
skyblock.staff.gamemode:
  description: Use /gm (each mode needs its own permission below)
  default: op
skyblock.staff.gamemode.creative:
  description: Creative mode (/gm c, /gmc)
  default: op
skyblock.staff.gamemode.survival:
