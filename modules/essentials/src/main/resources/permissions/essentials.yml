  default: op
skyblock.staff.gamemode.adventure:
  description: Adventure mode (/gm a, /gma)
  default: op
skyblock.staff.gamemode.others:
  description: Change other players' game mode
  default: op
skyblock.staff.fly:
  description: Toggle flying (/fly)
  default: op
skyblock.staff.fly.others:
  description: Toggle flying for others
  default: op
skyblock.staff.speed:
  description: Set fly/walk speed (/speed)
  default: op
skyblock.staff.god:
  description: God mode (/god)
  default: op
skyblock.staff.god.others:
  description: God mode for others
  default: op
skyblock.staff.heal:
  description: Heal (/heal)
  default: op
skyblock.staff.heal.others:
  description: Heal others
  default: op
skyblock.staff.feed:
  description: Feed (/feed)
  default: op
skyblock.staff.feed.others:
  description: Feed others
  default: op
skyblock.staff.clear:
  description: Clear your inventory (/clear)
  default: op
