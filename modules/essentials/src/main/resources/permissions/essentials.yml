skyblock.staff.invsee.edit:
  description: Edit player inventories (every change logged)
  default: op
skyblock.staff.ecsee:
  description: View player ender chests (/ecsee)
  default: op
skyblock.staff.ecsee.edit:
  description: Edit player ender chests (every change logged)
  default: op
skyblock.staff.vanish:
  description: Vanish (/vanish)
  default: op
skyblock.staff.vanish.others:
  description: Vanish other staff
  default: op
skyblock.staff.vanish.see:
  description: See vanished staff
  default: op
skyblock.staff.give:
  description: Give vanilla items (/i, /give)
