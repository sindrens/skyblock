# Permissions of the logs module. Registered when the module enables, removed when it disables.
# Format: the permissions section of a plugin.yml (description, default: true|false|op|not op; missing = op).
# LuckPerms grants for these nodes: server/permissions/logs.txt. Commands: docs/commands/logs.md.
skyblock.staff.logs:
  description: Open the staff log viewer (/logs); which categories show depends on skyblock.staff.logs.category.*
  default: op
# One node per audit category (AuditCategory key; checked in code as skyblock.staff.logs.category.<key>).
# A new AuditCategory needs a node here too (LogsPermissionsTest). Grants per rank: server/permissions/logs.txt.
skyblock.staff.logs.category.*:
  description: See every log category in /logs
  default: op
  children:
    skyblock.staff.logs.category.economy: true
    skyblock.staff.logs.category.trade: true
    skyblock.staff.logs.category.auction: true
    skyblock.staff.logs.category.island: true
    skyblock.staff.logs.category.punishment: true
    skyblock.staff.logs.category.staff: true
    skyblock.staff.logs.category.config: true
    skyblock.staff.logs.category.command: true
    skyblock.staff.logs.category.chat: true
    skyblock.staff.logs.category.dm: true
    skyblock.staff.logs.category.item: true
    skyblock.staff.logs.category.auth: true
    skyblock.staff.logs.category.world: true
    skyblock.staff.logs.category.tutorial: true
    skyblock.staff.logs.category.crates: true
    skyblock.staff.logs.category.boosters: true
    skyblock.staff.logs.category.rewards: true
    skyblock.staff.logs.category.quests: true
    skyblock.staff.logs.category.collection: true
    skyblock.staff.logs.category.pass: true
    skyblock.staff.logs.category.blackmarket: true
    skyblock.staff.logs.category.production: true
skyblock.staff.logs.category.economy:
  description: See money between players (pay, bank, sell) in /logs
  default: op
skyblock.staff.logs.category.trade:
  description: See trades in /logs
  default: op
skyblock.staff.logs.category.auction:
