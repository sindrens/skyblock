  default: op
skyblock.staff.logs.category.staff:
  description: See staff actions in /logs
  default: op
skyblock.staff.logs.category.config:
  description: See config changes in /logs
  default: op
skyblock.staff.logs.category.command:
  description: See commands players ran in /logs
  default: op
skyblock.staff.logs.category.chat:
  description: See public chat in /logs
  default: op
skyblock.staff.logs.category.dm:
