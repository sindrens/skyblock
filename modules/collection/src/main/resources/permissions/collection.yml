# Permissions of the collection module (PHASE-10 M10.10). Registered when the module enables, removed when it disables.
# Format: the permissions section of a plugin.yml (description, default: true|false|op|not op; missing = op).
# LuckPerms grants for these nodes: server/permissions/collection.txt. Commands: docs/commands/collection.md.
skyblock.collection.use:
  description: Open /collection (your collection log); finds are recorded for everyone
  default: true
