# Titles and tags (/tags, /titles). Edit here or in-game: /tags -> Edit (staff).
# display: MiniMessage with style tags (<c:ember>, <grad:phoenix>...) or & codes.
# Tags: write only the name in its colors (no brackets); cosmetics.yml -> tag.format puts it in muted ( ) after the name.
# rarity: common, uncommon, rare, epic, legendary, mythic, special.
# source: how to get it, shown on locked entries.
# secret: titles only, shown as "???" until earned.
# season-persistent: kept when a new season starts (owner decision: yes for all).
#
# Titles are EARNED: other modules grant them through the achievements hook (Cosmetics#grantTitle).
# Tags are OWNED: won from crates or bought in the store as a tag item (right-click to redeem), or given by staff.
# Reload: /skyblock reload cosmetics

