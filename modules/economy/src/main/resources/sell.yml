# =====================================================================================================================
#  SELL PRICES (M3.4)  -  DRAFT: THE OWNER APPROVES THESE PRICES BEFORE LAUNCH (docs/ECONOMY_BALANCE.md §12).
# =====================================================================================================================
# Base price per item for /sell (and later the satchel, AFK pool, auto-sell chests). Whole money units.
# Defaults come from docs/ECONOMY_BALANCE.md (BAL2): §4.1 island products (crops, generator drops), §4.3 spawner mob loot,
# §3.1/§3.2 Depths drops. The live price is base x a dynamic multiplier (40%..150%, economy.yml -> sell.dynamic.*),
# x1.25 for the daily Hot Item; the player's sell bonus (+300% cap) comes on top.
#
# Format:
#   categories.<category>.<vanilla item id>: <price>
#   custom-items.<category>.<custom item id>: <price>        (custom items are NEVER priced as the vanilla item they are)
#   <id>: { price: 82, sellable: false }                    (keeps the price but switches selling off)
# Category names are shown from messages/economy.yml -> sell.category.<category> (missing = the id).
# Items not listed here can't be sold. Unique items (custom tools, enchant books, money notes, set pieces) can never be
# sold, even if listed. New entries in a plugin update are added to this file automatically; to remove an item, set
# sellable: false (a deleted entry comes back on the next update).
#
# Rules used for the defaults (keep them when changing prices, see ECONOMY_BALANCE §8 and docs/OPEN_QUESTIONS.md):
#  - No item sells for more than what it is crafted/smelted from (no ingots above raw ore, no storage blocks, no sugar,
#    paper, sticks, bone meal, dyes, seeds); those are simply not listed.
#  - Island items sell for half the Depths item of the same tier (the Depths stay the main money place).
# Reload: /skyblock reload economy
config-version: 2

categories:
  # Island generator drops (ECONOMY_BALANCE §4.1: one tier below the Depths ore, half its price).
  ores:
    cobblestone: 1
    coal: 10
    raw_copper: 14
    raw_iron: 18
    raw_gold: 25
    redstone: 33
    lapis_lazuli: 45
    diamond: 61
    # Off until villager trading is limited: fletchers turn free sticks into emeralds (docs/OPEN_QUESTIONS.md).
    emerald: { price: 82, sellable: false }

  # Island crops by Farming unlock tier (ECONOMY_BALANCE §4.1).
