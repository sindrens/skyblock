  # Spawner mob loot (ECONOMY_BALANCE §4.3: island price of Depths tier 1/3/5/7/9 per item, ~1.5 items per mob).
  mob-loot:
    # Spawner tier 1 (pig, cow, chicken, sheep, rabbit): $10
    porkchop: 10
    cooked_porkchop: 10
    beef: 10
    cooked_beef: 10
    chicken: 10
    cooked_chicken: 10
    mutton: 10
    cooked_mutton: 10
    rabbit: 10
    cooked_rabbit: 10
    leather: 10
    feather: 10
    rabbit_hide: 10
    rabbit_foot: 10
    # Spawner tier 2 (zombie, skeleton, spider, slime): $18. Arrows are not listed: 1 feather crafts 4 arrows.
    rotten_flesh: 18
    bone: 18
    string: 18
    spider_eye: 18
    slime_ball: 18
    # Spawner tier 3 (creeper, witch, drowned, husk): $33
    gunpowder: 33
    glowstone_dust: 33
    # Spawner tier 4 (blaze, enderman, guardian, piglin): $61
    blaze_rod: 61
    ender_pearl: 61
    prismarine_shard: 61
