# Permissions of the economy module. Registered when the module enables, removed when it disables.
# Format: the permissions section of a plugin.yml (description, default: true|false|op|not op; missing = op).
# LuckPerms grants for these nodes: server/permissions/economy.txt. Commands: docs/commands/economy.md.
skyblock.economy.balance:
  description: See your balances (/bal)
  default: true
skyblock.economy.balance.others:
  description: See other players' balances (/bal <player>)
  default: true
skyblock.economy.baltop:
  description: See the richest players (/baltop)
  default: true
skyblock.economy.pay:
  description: Pay other players (/pay)
  default: true
skyblock.economy.transactions:
  description: See your own transaction history (/transactions)
  default: true
skyblock.economy.withdraw:
  description: Turn money into a tradeable money note (/withdraw); redeeming a note needs no permission
  default: true
skyblock.economy.sell:
  description: Sell items to the server at live prices (/sell, /sell hand, /sell all)
  default: true
skyblock.economy.bank:
  description: Use your personal bank and your island's bank (/bank, the island menu's Bank button); island bank rights come from the island role (bank-deposit, bank-withdraw, bank-history)
  default: true
skyblock.admin.economy:
  description: Change balances (/eco give|take|set|reset) and make money notes (/eco note); admins and owner, always logged and staff-alerted. Includes the economy dashboard.
  default: op
  children:
    skyblock.staff.economy.dashboard: true
skyblock.admin.economy.approve-own:
  description: Allow your own waiting /eco change over the limit (owner, R3-6)
  default: op
skyblock.admin.economy.approve:
  description: Allow or deny a waiting /eco change above the limit (owner R3-6, $1T for money) with the chat buttons, /eco allow|deny or the pending list in /eco admin; never your own request
  default: op
skyblock.owner.economy:
  description: Old node for /eco (before admins got it); still grants skyblock.admin.economy
  default: op
  children:
    skyblock.admin.economy: true
skyblock.staff.economy.alerts:
  description: Get a chat alert when staff change a balance or make a note with /eco
  default: op
skyblock.staff.economy.dashboard:
  description: Open the economy dashboard and alert evidence (/eco admin [alert]); review or dismiss alerts and file punishment suggestions from them (M3.8)
  default: op
skyblock.staff.economy.flagged:
  description: A staff account (owner answer 334). Staff play normally, but their big transfers (pay, trade) are shown to admins as a staff-transfer alert
  default: false
skyblock.staff.economy.sell.view:
  description: Look up live sell prices and list the recipes behind derived prices (/eco sell price, /eco sell dump-recipes; ECON-SELL-SHOP-AH A6)
  default: op
skyblock.staff.economy.sell.reset:
  description: Put an item's (or every item's) live sell price back to base (/eco sell reset <item|all> <reason>; always logged as sell_reset)
  default: op
  children:
    skyblock.staff.economy.sell.view: true
skyblock.staff.economy.anomalies:
  description: Get economy anomaly alerts in chat (fast earning, big or repeated transfers, many notes cashed, sell spikes, balance jumps, inflation) with [Open] and [Punish]
  default: op
skyblock.credit.bal:
  description: See your credits with the bought/earned split, or another player's total (/credit, /credit bal [player]; card C1)
  default: true
skyblock.credit.shop:
  description: The credit shop (/credit shop, /store, /creditshop; owner 7 Nov 2026), gifts (/credit gift) and the credit history (/credit history)
  default: true
skyblock.credit.pay:
  description: Send bought credits to another player (/credit pay <player> <amount>, confirm screen, receipt)
  default: true
skyblock.credit.grant:
  description: /credit grant and /storegrant (Tebex, CREDIT-SHOP 5.2). Console only and never granted to anyone; admin and owner get an explicit false in server/permissions/economy.txt.
  default: false
skyblock.credit.chargeback:
  description: /credit chargeback <player> <transaction> (Tebex chargeback or refund, CREDIT-SHOP 5.3). Takes back at most the player's bought credits of that transaction; the console can always run it.
  default: false
skyblock.economy.credits.grant:
  description: Create or set BOUGHT credits by hand (/eco give|set|reset <player> credits, ledger reason admin_buy). Owner only (C1-R1-18); admins get an explicit false in server/permissions/economy.txt. Earned credits (credits_earned) stay with skyblock.admin.economy.
  default: op
skyblock.economy.eco.self:
  description: Use /eco give|take|set|reset and /eco note on your OWN account (admin and owner, owner 31 Oct 2026; the config switch eco.allow-self turns it off). Bought credits still need skyblock.economy.credits.grant, changes above the limit still wait for ANOTHER owner or admin, and every own-account change is flagged (audit eco_flagged + eco_self, staff alert). Other accounts on your address stay refused.
  default: false
