# Crates and reward tables (PHASE-10-REWARDS.md M10.1, owner decisions CA1-CA7). Every number is a default.
# Written to plugins/PhoenixSkyblock/crates.yml on first start; crates that are new in the jar are added to an existing
# file, rewards of an existing crate never (your tables and odds stay as you edited them). Reload: /skyblock reload crates
#
# Per crate (plain keys): rarity (color), icon (a vanilla block), order in /crates,
#   pity (opens without a top-band reward before the next one is forced into it; 0 = off; ~2.5x the average gap),
#   hidden (not shown in /crates, e.g. Conqueror until KOTH), fallback-crystals (crystal value of rewards that are not
#   live yet, x crystal-growth^(tier-1)).
# rewards: a catalog LIST, one map per reward. Never put plain settings inside it.
#   id      unique per crate (names in messages/crates.yml -> rewards.<crate>.<id>)
#   type    money | crystals | key | enchant-book | scroll | set-token | spawner | item | tag | title | fuel | booster |
#           global-booster | coming-soon
#   chance  percent (used as a weight; the preview shows the real share)
#   top     true = top band (counts for pity, marked with a star)
#   money: minutes (of reference income at your tier) · crystals: base · key/scroll/set-token/spawner/item: amount
#   key: crate · enchant-book: pool (rarity), level · set-token: sets (one picked at random) · spawner: tier (random type)
#   item: material (a vanilla item, or custom:<id> of a custom item such as custom:shard_block) · tag/title: ids (one you don't own; all owned = its crystal value) · fuel: minutes
#   booster / global-booster (M10.2): booster (sell | skill_xp | tool_xp | crystals), percent, minutes, amount. Personal
#           boosters are always bound to the opener; global ones are bound when opened with a bound key (and by default
#           always: boosters.yml -> global.always-bound). Without the boosters module they pay their crystal value.
#   coming-soon: a reward whose system is not built yet; it pays its crystal value until then. icon: optional item shown
#                in the preview. Since catalog-version 3 (7 Nov 2026) no crate has one: items that are not made yet stay
#                out of the tables until they exist (their chance went to crystals, which is what they paid).
#   fallback: crystal base of this reward instead of the crate's fallback-crystals; rarity: color of this reward.
#   band (tiered crates only, e.g. Eclipse): common | mid | rare | jackpot; the crate's draw: says how many of each band
#           one open gives. A tiered crate has no pity.

# ECON-SHARDS: shards are only found in shard blocks (no 'shards' rewards); premium spawners are sold by the Black Market.
