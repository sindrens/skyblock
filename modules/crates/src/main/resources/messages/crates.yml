# Crates (PHASE-10 M10.1): /crates [crate]. MiniMessage + style tags (style.yml). Reload: /skyblock reload crates
# Amount placeholders (<amount>, <keys>, <count>) are plain text like $2,480 or 12; they are colored here.
# Reward names may contain <amount> (pouch value at your tier, fuel time, crystal value) and <key> (the key name).

error: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong. Nothing was taken; try again soon."
loading: "<prefix><c:error><sym:cross></c:error> <c:text>Crates are still loading. Try again in a moment."
frozen: "<prefix><c:error><sym:cross></c:error> <c:text>You can't open crates while frozen."
staff-mode: "<prefix><c:error><sym:cross></c:error> <c:text>You can't open crates in staff mode."
switching: "<prefix><c:error><sym:cross></c:error> <c:text>Wait until your profile switch is done."
unknown-crate: "<prefix><c:error><sym:cross></c:error> <c:text>No crate <c:value><input></c:value><c:text>. Try: <c:value><crates>"
coming-soon: "<prefix><c:error><sym:cross></c:error> <c:text>This crate is coming soon."
busy: "<prefix><c:error><sym:cross></c:error> <c:text>Your last crate is still opening. One moment."
changed: "<prefix><c:error><sym:cross></c:error> <c:text>Your keys just changed. Nothing was taken; click again."
no-keys: "<prefix><c:error><sym:cross></c:error> <c:text>You have no <key><c:text>. Get keys from voting, quests, the AFK pool and daily rewards."
# Internal: shows a MiniMessage name from this file (do not change).
