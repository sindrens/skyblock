open:
  single: "<prefix><c:success><sym:check></c:success> <crate><c:text>: <reward>"
  single-top: "<prefix><c:flame><sym:star></c:flame> <crate><c:text>: you won <reward><c:text>!"
  fallback-note: "<c:muted>Not live yet, so you got its crystal value: <cur:crystals><amount></cur:crystals><c:muted>."
  pity-fired: "<c:muted>Your luck meter was full: a top reward for sure."
  summary-header: "<prefix><c:success><sym:check></c:success> <c:text>You opened <c:value><count></c:value> <crate><c:text>s:"
  summary-line: " <c:muted><sym:bullet></c:muted> <reward> <c:muted>x<times>"
  summary-line-top: " <c:flame><sym:star></c:flame> <reward> <c:muted>x<times>"
  summary-more: " <c:muted>... and <more> more (see the summary screen)."
  grant-failed: "<prefix><c:error><sym:cross></c:error> <c:text>A reward could not be handed out. Staff were told and will fix it."
  fallback-name: "<reward> <c:muted>(</c:muted><cur:crystals><amount></cur:crystals><c:muted>)"
  won-tag: "<c:text>Tag <name>"
  won-title: "<c:text>Title <name>"
  with-count: "<reward> <c:muted>(x<count>)"

menu:
  title: "Crates"
  info:
    - "<c:text>Open crates with your keys."
    - "<c:text>Click a crate to see every"
    - "<c:text>reward and its chance. Opening uses"
    - "<c:text>untradeable keys first."
    - "<c:muted>Java: right-click opens 1, shift-click more."
  loading:
    name: "<c:muted>Loading your keys..."
    lore: []
  empty:
    name: "<c:muted>No crates yet"
    lore: ["<c:text>No crate is set up right now."]
  summary:
    name: "<c:flame><sym:star></c:flame> <c:value>Your keys"
    lore:
      - "<c:muted>Keys belong to this profile."
      - ""
    line: "<key><c:text>: <c:value><keys>"
    line-tradeable: "<key><c:text>: <c:value><keys></c:value> <c:muted>(<tradeable> tradeable)"
  crate:
    lore:
      - "<c:text>Keys: <c:value><keys></c:value> <c:muted>(<tradeable> tradeable)"
      - "<c:text>Luck meter: <c:value><pity>/<max></c:value> <c:muted><sym:dot> top rewards <top>%"
      - ""
    lore-no-pity:
      - "<c:text>Keys: <c:value><keys></c:value> <c:muted>(<tradeable> tradeable)"
      - ""
    actions:
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to see rewards and open"
    actions-bedrock:
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to see rewards and open"
    coming-soon:
      - "<c:locked>Coming soon"
      - "<c:muted>Keys come from KOTH captures."
  # R3-18: key fragments -> keys. lore: <have> <need> <key>; actions: <keys> <need>
  fragments:
    name: "<rarity:legendary>Key Fragments"
    lore:
      - "<c:text>You carry: <c:value><have></c:value> <c:muted>fragments"
      - "<c:text><need> fragments make 1 <key><c:text>."
      - "<c:muted>Found while mining and chopping in"
      - "<c:muted>Depths tier 11+. Tradeable."
      - ""
    actions:
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to combine <need> into 1 key"
      - "<c:muted>Java: shift-click combines all (<keys> keys)"
    actions-bedrock:
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to combine <need> into 1 key"
    actions-none:
      - "<c:locked>You need <need> fragments in your inventory."

preview:
  info:
    - "<c:text>Every reward with its chance."
    - "<c:flame><sym:star></c:flame> <c:text>marks the top rewards. When your"
    - "<c:text>luck meter is full, the next open"
    - "<c:text>gives one for sure."
  gone:
    name: "<c:muted>This crate is not available"
    lore: []
  status:
    - "<c:text>Keys: <c:value><keys></c:value> <c:muted>(<tradeable> tradeable)"
    - "<c:text>Luck meter: <c:value><pity>/<max></c:value> <c:muted><sym:dot> top rewards <top>%"
    - ""
    - "<c:muted>Untradeable keys are used first."
    - "<c:muted>What they give can't be traded."
  status-no-pity:
    - "<c:text>Keys: <c:value><keys></c:value> <c:muted>(<tradeable> tradeable)"
    - ""
    - "<c:muted>Untradeable keys are used first."
    - "<c:muted>What they give can't be traded."
  open-one:
    name: "<c:success>Open 1"
    lore: ["<c:text>Uses 1 <key><c:text>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
  open-bulk:
    name: "<c:success>Open <bulk>"
    lore: ["<c:text>Opens up to <c:value><bulk></c:value> <c:text>at once and", "<c:text>shows one summary.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
  open-all:
    name: "<c:success>Open all (<all>)"
    lore: ["<c:text>Opens all your keys, up to", "<c:value><max></c:value> <c:text>per click.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
  no-keys:
    name: "<c:locked>No keys"
    lore: ["<c:text>You have no <key><c:text>.", "<c:muted>Vote, do quests, AFK in the pool", "<c:muted>or claim daily rewards."]
  # M10.4 key items: <key> = key name, <tradeable> = tradeable keys, <max> = most per withdraw.
  withdraw-one:
    name: "<c:value>Withdraw 1 key"
    lore:
      - "<c:text>Turns 1 tradeable <key><c:text> into an item"
      - "<c:text>you can trade or sell on <c:value>/ah</c:value><c:text>."
      - "<c:text>Tradeable: <c:value><tradeable>"
      - ""
      - "<c:muted>USE the item to put the key back."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to withdraw 1"
  withdraw-amount:
    name: "<c:value>Withdraw an amount"
    lore:
      - "<c:text>Choose how many tradeable keys"
      - "<c:text>become items (up to <c:value><max></c:value><c:text>)."
      - "<c:muted>What doesn't fit goes to /box."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"
  withdraw-none:
    name: "<c:locked>No tradeable keys"
    lore:
      - "<c:text>Only tradeable keys can become"
      - "<c:text>items (quests, pass, events, fragments)."
      - "<c:muted>Keys from votes, the AFK pool and"
      - "<c:muted>daily rewards stay on this profile."
  withdraw-title: "Withdraw <key>"
  line: "<reward> <c:muted>(x<count>)</c:muted> <c:muted>|</c:muted> <c:value><chance>%"
  line-top: "<c:flame><sym:star></c:flame> <reward> <c:muted>(x<count>)</c:muted> <c:muted>|</c:muted> <c:value><chance>%"
  coming-soon:
    - ""
    - "<c:locked>Coming soon."
    - "<c:muted>Until then it pays <cur:crystals><amount></cur:crystals><c:muted>."
  cosmetic:
    - ""
    - "<c:muted>Always one you don't own yet."
    - "<c:muted>Own them all: its crystal value."
  pouch:
    - ""
    - "<c:muted>Grows with your Depths tier."

result:
  title: "Opened <count>"
  info:
    - "<c:text>Everything you just won."
    - "<c:text>Items are in your inventory or"
    - "<c:text>your <c:value>/box</c:value><c:text>; money and crystals"
    - "<c:text>are on your balance."
  summary:
    - "<c:text>Opened: <c:value><count></c:value>"
    - "<c:text>Top rewards: <c:value><top>"
    - "<c:text>Luck meter now: <c:value><pity>/<max>"
  line: ["<c:text>Won <c:value><times></c:value><c:text>x"]
  line-top: ["<c:flame><sym:star></c:flame> <c:text>Top reward, won <c:value><times></c:value><c:text>x"]
  more:
    name: "<c:muted>And <more> more"
    lore: ["<c:text>See the chat summary."]

# Staff: /crates admin give|take|view (P10-41, admin only, logged). <key> = key name, <amount>/<has>/<left> = numbers,
# <kind> = admin.kind.bound / admin.kind.tradeable, <profile> = profile name, <command>/<time> come from the confirm.
admin:
  given: "<prefix><c:success><sym:check></c:success> <c:text>Gave <c:value><amount></c:value> <kind> <key><c:text> to <c:value><player></c:value> <c:muted>(<profile>). Logged."
  received: "<prefix><c:success><sym:check></c:success> <c:text>Staff gave you <c:value><amount></c:value> <kind> <key><c:text>. Open them with <click:run_command:'/crates'><c:value>/crates</c:value></click><c:text>."
  taken: "<prefix><c:success><sym:check></c:success> <c:text>Took <c:value><amount></c:value> <key><c:text> from <c:value><player></c:value> <c:muted>(<profile>: <bound> bound, <tradeable> tradeable, <left> left). Logged."
  not-enough: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has only <c:value><has></c:value> <key><c:text> on <profile>, not <amount>. Nothing was taken."
  unknown-player: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has never joined. Check the spelling (Bedrock names start with a dot)."
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>That did not work. Nothing changed; try again soon."
  confirm-give: "<prefix><c:text>Give <c:value><amount></c:value> <key><c:text> to <c:value><player></c:value>? <click:run_command:'/<command> confirm'><hover:show_text:'<c:text>Runs /<command> confirm'><c:action>[Confirm]</c:action></hover></click> <c:muted>or type /<command> confirm within <time>."
  confirm-take: "<prefix><c:text>Take <c:value><amount></c:value> <key><c:text> from <c:value><player></c:value>? <click:run_command:'/<command> confirm'><hover:show_text:'<c:text>Runs /<command> confirm'><c:action>[Confirm]</c:action></hover></click> <c:muted>or type /<command> confirm within <time>."
  profile-default: "Profile <slot>"
  kind:
    bound: "<c:muted>bound</c:muted>"
    tradeable: "<c:value>tradeable</c:value>"
  view:
    header: "<prefix><c:text>Keys of <c:value><player></c:value> <c:muted>(<profile>)"
    header-active: "<prefix><c:text>Keys of <c:value><player></c:value> <c:muted>(<profile>, active)"
    line: " <c:muted><sym:bullet></c:muted> <key><c:text>: <c:value><bound></c:value> <c:text>bound, <c:value><tradeable></c:value> <c:text>tradeable <c:muted><sym:dot> pity <pity>/<max>"
    line-no-pity: " <c:muted><sym:bullet></c:muted> <key><c:text>: <c:value><bound></c:value> <c:text>bound, <c:value><tradeable></c:value> <c:text>tradeable"
    none: " <c:muted>No keys and no pity on this profile."
  menu:
    title: "Keys of <player>"
    info:
      - "<c:text>Keys and pity of one profile."
      - "<c:text>Change them with"
      - "<c:value>/crates admin give</c:value> <c:text>or"
      - "<c:value>/crates admin take</c:value><c:text>."
    loading:
      name: "<c:muted>Loading keys..."
      lore: []
    failed:
      name: "<c:error>Could not load the keys"
      lore: ["<c:text>Close the menu and try again."]
    profile:
      name: "<c:value><profile>"
      lore:
        - "<c:text>The profile shown."
    profile-switch:
      name: "<c:value><profile> <c:muted>(<profiles> profiles)"
      lore:
        - "<c:text>The profile shown."
        - ""
        - "<bold><c:action>» CLICK</c:action></bold> <c:text>to pick a profile"
    # Pick list of the profiles. <profile>
    profile-pick: "<c:value><profile>"
    profile-crumb: "Profile"
    crate:
      - "<c:text>Bound keys: <c:value><bound>"
      - "<c:text>Tradeable keys: <c:value><tradeable>"
      - "<c:text>Pity: <c:value><pity>/<max>"
      - ""
      - "<c:muted><profile>"
    crate-no-pity:
      - "<c:text>Bound keys: <c:value><bound>"
      - "<c:text>Tradeable keys: <c:value><tradeable>"
      - ""
      - "<c:muted><profile>"

# R3-18: key fragments -> keys (the Key Fragments button in /crates).
fragments:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Combined <c:value><fragments></c:value> <c:text>fragments into <c:value><keys>x</c:value> <key><c:text>."
  not-enough: "<prefix><c:error><sym:cross></c:error> <c:text>You have <c:value><have></c:value> <c:text>fragments in your inventory; <c:value><need></c:value> <c:text>make a key."
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>That didn't work. Your fragments are back (inventory or /box). Try again."
  busy: "<prefix><c:error><sym:cross></c:error> <c:text>Wait a moment, your last combine is still running."
  disabled: "<prefix><c:error><sym:cross></c:error> <c:text>Combining key fragments is turned off right now."

# ------------------------------------------------------------------ M10.3 physical crates and animations
# Clicking a crate block at the crate yard without a key (the rewards open too). <key> = key name.
physical:
  no-keys: "<prefix><c:error><sym:cross></c:error> <c:text>You have no <key><c:text>. Get keys: <c:value>/vote</c:value><c:text>, <c:value>/daily</c:value><c:text>, playtime and the AFK pool."

# Hologram above each crate block (V2, UI_STYLE 6.4b). <crate> = crate name in its rarity color.
hologram:
  lines:
    - "<bold><crate>"
    - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
    - "<bold><c:action>Sneak-click: </c:action></bold><c:text>View rewards"
  coming-soon:
    - "<bold><crate>"
    - "<c:locked>Coming soon"

# The crate yard key board (build hologram key_board, placed by the npcs module). how: one line each.
# odds-line: <crate> = crate name, <top> = chance of a top reward (star) in percent.
key-board:
  title: "<c:flame><bold>Crate Keys"
  how:
    - "<c:text>Vote <c:value>/vote</c:value> <c:muted><sym:dot></c:muted> <c:text>Daily <c:value>/daily"
    - "<c:text>Playtime, AFK pool and quests"
  odds-header: "<c:muted>Chance of a <c:flame><sym:star></c:flame><c:muted> top reward:"
  odds-line: "<crate> <c:value><top>%"
  footer: "<c:text>Open anywhere: <c:value>/crates"

# B40 spinner (Open 1 in the menus). <reward> = what you won.
spinner:
  info:
    - "<c:text>Your reward is already decided"
    - "<c:text>and saved; this is only the show."
    - "<c:text>Click the row to skip. Turn it off:"
    - "<c:value>/settings</c:value> <c:muted><sym:dot></c:muted> <c:text>Fast crate opening"
  marker:
    name: "<c:flame><sym:star></c:flame> <c:value>Rolling..."
    lore: ["<bold><c:action>» CLICK</c:action></bold> <c:text>to skip"]
  won:
    name: "<c:success><sym:check></c:success> <c:text>You won <reward>"
    lore: ["<c:muted>It is in your inventory, /box or balance."]
  won-top:
    name: "<c:flame><sym:star></c:flame> <c:text>Top reward: <reward>"
    lore: ["<c:muted>It is in your inventory, /box or balance."]
  fallback-lore:
    - "<c:muted>Not live yet: you got <cur:crystals><amount></cur:crystals><c:muted>."

# In-world show at a pedestal. title: to the opener (Bedrock may not show the floating reward).
# label: above the floating reward for everyone nearby; <player> = the opener.
world:
  title:
    title: "<reward>"
    subtitle: "<crate>"
    fade-in: 5
    stay: 40
    fade-out: 15
  title-top:
    title: "<c:flame><sym:star></c:flame> <reward>"
    subtitle: "<c:text>Top reward from the <crate>"
    fade-in: 5
    stay: 50
    fade-out: 15
  label:
    - "<reward>"
    - "<c:muted><player>"
  label-top:
    - "<c:flame><sym:star></c:flame> <reward>"
    - "<c:muted><player>"

# Global chat line for a top reward of the big crates (crates-settings.yml -> broadcast.crates). Java: hover the reward
# to see the item. <player>, <crate>, <reward>, <more> = other top rewards of the same bulk open.
broadcast:
  top: "<prefix><c:flame><sym:star></c:flame> <c:value><player></c:value> <c:text>won <reward> <c:text>from the <crate><c:text>!"
  top-many: "<prefix><c:flame><sym:star></c:flame> <c:value><player></c:value> <c:text>won <reward> <c:text>and <c:value><more></c:value> <c:text>more top rewards from the <crate><c:text>!"
  hover:
    - "<c:text>From the <crate>"
    - "<c:muted>Chance: <chance>%"

# /settings switch (Gameplay).
settings:
  fast-crate-opening:
    name: "Fast crate opening"
    lore:
      - "<c:text>Skip the crate spin and the"
      - "<c:text>build-up at the crate yard:"
      - "<c:text>see your reward at once."

# ------------------------------------------------------------------ M10.4 key items
# <key> = key name, <amount> = number of key items, <box> = how many went to /box.
key-items:
  withdrawn: "<prefix><c:success><sym:check></c:success> <c:text>Withdrew <c:value><amount>x</c:value> <key><c:text>. USE one to put it back on your keys."
  withdrawn-box: "<prefix><c:success><sym:check></c:success> <c:text>Withdrew <c:value><amount>x</c:value> <key><c:text> (<c:value><box></c:value> <c:text>in <c:value>/box</c:value><c:text>). USE one to put it back on your keys."
  none: "<prefix><c:error><sym:cross></c:error> <c:text>You have no tradeable <key><c:text>. Keys from votes, the AFK pool and daily rewards stay on this profile."
  busy: "<prefix><c:error><sym:cross></c:error> <c:text>Wait a moment, your last key item is still being handled."
  disabled: "<prefix><c:error><sym:cross></c:error> <c:text>Withdrawing keys is turned off right now."
  refunded: "<prefix><c:muted><sym:time></c:muted> <c:text>Your profile changed before the key items were made: <c:value><amount>x</c:value> <key><c:text> went back to the profile they came from."
  redeemed: "<prefix><c:success><sym:check></c:success> <key><c:text> is back on this profile. Open it with <click:run_command:'/crates'><c:value>/crates</c:value></click><c:text>."
  other-profile: "<prefix><c:error><sym:cross></c:error> <c:text>You withdrew this key on your other profile. Put it back there, or trade it to another player."
  unknown-crate: "<prefix><c:error><sym:cross></c:error> <c:text>This key's crate doesn't exist any more. Keep the item and ask staff."
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>That didn't work. Your key item is back (inventory or /box). Try again."
  copy: "<prefix><c:error><sym:cross></c:error> <c:text>This key item was already used, so it is a copy. It was taken and staff were told."
  # The key item itself. {crate} = crate name, {player} = who withdrew it, {id} = short item id.
  item:
    name-unknown: "<rarity:rare>Crate Key"
    subtitle: "<c:muted>Crate Key <sym:dot> Tradeable"
    description: "Use it to put the key back on your keys. Can be traded."
    info-title: "Information"
    crate: "<c:text>Opens: {crate}"
    withdrawn-by: "<c:text>Withdrawn by: <c:value>{player}"
    id: "<c:muted>ID {id}"
    action-input: "USE"
    action-text: "to put it on your keys"
