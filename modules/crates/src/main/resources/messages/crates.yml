open:
  single: "<prefix><c:success><sym:check></c:success> <crate><c:text>: <reward>"
  single-top: "<prefix><c:flame><sym:star></c:flame> <crate><c:text>: you won <reward><c:text>!"
  fallback-note: "<c:muted>Not live yet, so you got its crystal value: <cur:crystals><amount></cur:crystals><c:muted>."
  pity-fired: "<c:muted>Your pity counter guaranteed a top reward."
  summary-header: "<prefix><c:success><sym:check></c:success> <c:text>You opened <c:value><count></c:value> <crate><c:text>s:"
  summary-line: " <c:muted><sym:bullet></c:muted> <reward> <c:muted>x<times>"
  summary-line-top: " <c:flame><sym:star></c:flame> <reward> <c:muted>x<times>"
  summary-more: " <c:muted>... and <more> more (see the summary screen)."
  grant-failed: "<prefix><c:error><sym:cross></c:error> <c:text>A reward could not be handed out. Staff were told and will fix it."
  fallback-name: "<reward> <c:muted>(</c:muted><cur:crystals><amount></cur:crystals><c:muted>)"
  won-tag: "<c:text>Tag <name>"
  won-title: "<c:text>Title <name>"
  with-count: "<reward> <c:muted>(x<count>)"

menu:
  title: "Crates"
  info:
    - "<c:text>Open crates with your keys."
    - "<c:text>Left-click a crate to see every"
    - "<c:text>reward and its chance. Opening uses"
    - "<c:text>bound keys first."
  loading:
    name: "<c:muted>Loading your keys..."
    lore: []
  empty:
    name: "<c:muted>No crates yet"
    lore: ["<c:text>Crates open soon."]
  summary:
    name: "<c:flame><sym:star></c:flame> <c:value>Your keys"
    lore:
      - "<c:muted>Keys belong to this profile."
      - ""
    line: "<key><c:text>: <c:value><keys>"
    line-tradeable: "<key><c:text>: <c:value><keys></c:value> <c:muted>(<tradeable> tradeable)"
  crate:
    lore:
      - "<c:text>Keys: <c:value><keys></c:value> <c:muted>(<tradeable> tradeable)"
      - "<c:text>Pity: <c:value><pity>/<max></c:value> <c:muted><sym:dot> top rewards <top>%"
      - ""
    lore-no-pity:
      - "<c:text>Keys: <c:value><keys></c:value> <c:muted>(<tradeable> tradeable)"
      - ""
    actions:
      - "<bold><c:action>» LEFT-CLICK</c:action></bold> <c:text>see rewards"
      - "<bold><c:action>» RIGHT-CLICK</c:action></bold> <c:text>open 1"
      - "<bold><c:action>» SHIFT-CLICK</c:action></bold> <c:text>open <bulk>"
    actions-bedrock:
      - "<bold><c:action>» TAP</c:action></bold> <c:text>see rewards and open"
    coming-soon:
      - "<c:locked>Coming soon"
      - "<c:muted>Keys come from KOTH captures."

preview:
  info:
    - "<c:text>Every reward with its chance."
    - "<c:flame><sym:star></c:flame> <c:text>marks the top rewards: the pity"
    - "<c:text>counter guarantees one after a"
    - "<c:text>streak of bad luck."
  gone:
    name: "<c:muted>This crate is not available"
    lore: []
  status:
    - "<c:text>Keys: <c:value><keys></c:value> <c:muted>(<tradeable> tradeable)"
    - "<c:text>Pity: <c:value><pity>/<max></c:value> <c:muted><sym:dot> top rewards <top>%"
    - ""
    - "<c:muted>Bound keys are used first. Loot"
    - "<c:muted>from a bound key is bound too."
  status-no-pity:
    - "<c:text>Keys: <c:value><keys></c:value> <c:muted>(<tradeable> tradeable)"
    - ""
    - "<c:muted>Bound keys are used first. Loot"
    - "<c:muted>from a bound key is bound too."
  open-one:
    name: "<c:success>Open 1"
    lore: ["<c:text>Uses 1 <key><c:text>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
  open-bulk:
    name: "<c:success>Open <bulk>"
    lore: ["<c:text>Opens up to <c:value><bulk></c:value> <c:text>at once and", "<c:text>shows one summary.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
  open-all:
    name: "<c:success>Open all (<all>)"
    lore: ["<c:text>Opens all your keys, up to", "<c:value><max></c:value> <c:text>per click.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
  no-keys:
    name: "<c:locked>No keys"
    lore: ["<c:text>You have no <key><c:text>.", "<c:muted>Vote, do quests, AFK in the pool", "<c:muted>or claim daily rewards."]
  line: "<reward> <c:muted>(x<count>)</c:muted> <c:muted>|</c:muted> <c:value><chance>%"
  line-top: "<c:flame><sym:star></c:flame> <reward> <c:muted>(x<count>)</c:muted> <c:muted>|</c:muted> <c:value><chance>%"
  coming-soon:
    - ""
    - "<c:locked>Coming soon."
    - "<c:muted>Until then it pays <cur:crystals><amount></cur:crystals><c:muted>."
  cosmetic:
    - ""
    - "<c:muted>Always one you don't own yet."
    - "<c:muted>Own them all: its crystal value."
  pouch:
    - ""
    - "<c:muted>Grows with your Depths tier."

