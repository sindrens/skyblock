# Permissions of the boosters module (PHASE-10 M10.2). Registered when the module enables, removed when it disables.
# Format: the permissions section of a plugin.yml (description, default: true|false|op|not op; missing = op).
# LuckPerms grants for these nodes: server/permissions/boosters.txt. Commands: docs/commands/boosters.md.
skyblock.boosters.use:
  description: Start booster items and open /boosters (running, banked, owned and global boosters)
  default: true
skyblock.boosters.thanks:
  description: Thank global boosters with /thanks or by saying thanks in chat (1 earned credit to the starter, RW2)
  default: true
