# Worlds module: /skyblock builds (paste and wire the finished builds). MiniMessage + style tags (style.yml).
# Reload: /skyblock reload worlds
# Format (docs/UI_STYLE.md §3): prefix only on replies, success/error marks + gray text, values in <c:value>, clicks in <c:action>.

builds:
  "yes": "yes"
  "no": "no"
  folder-problem: "<prefix><c:warning><sym:cross></c:warning> <c:text><problem>"
  none: "<prefix><c:error><sym:cross></c:error> <c:text>No builds found in <c:value><folder></c:value>. Put the .schem + .yml files there (worlds.yml: builds.folder)."
  header: "<prefix><c:text>Builds in <c:value><folder></c:value> <c:muted>(<valid> of <count> ready, details: /skyblock builds info id)"
  line-ok: " <c:success><sym:check></c:success> <c:value><id></c:value> <c:muted><sym:dot> <world> <sym:dot> <blocks> blocks <sym:dot></c:muted> <state>"
  line-template: " <c:success><sym:check></c:success> <c:value><id></c:value> <c:muted><sym:dot> <world> template (apply only) <sym:dot></c:muted> <state>"
  line-error: " <c:error><sym:cross></c:error> <c:value><id></c:value> <c:muted><sym:dot> <world> <sym:dot></c:muted> <c:error><errors> error(s)</c:error> <c:muted>(/skyblock builds info <id>)"
  layout-ok: " <c:ember><sym:bullet></c:ember> <c:text>Depths layout: <c:value><zones></c:value> <c:text>zones planned"
  layout-missing: " <c:ember><sym:bullet></c:ember> <c:muted>No depths_layout.yml: Depths builds can't update zones.yml"
  state:
    new: "<c:muted>new"
    pasted: "<c:warning>pasted"
    applied: "<c:success>applied"
  unknown: "<prefix><c:error><sym:cross></c:error> <c:text>No build <c:value><id></c:value>. Builds: <c:muted><list>"
  busy: "<prefix><c:error><sym:cross></c:error> <c:text>A paste is running (<c:value><id></c:value>). Wait for it to finish."
  no-fawe: "<prefix><c:error><sym:cross></c:error> <c:text>FastAsyncWorldEdit isn't running, so builds can't be pasted. Install it and restart."
  has-errors: "<prefix><c:error><sym:cross></c:error> <c:text>Build <c:value><id></c:value> has <c:value><errors></c:value> error(s). See <c:value>/skyblock builds info <id></c:value>."
  template: "<prefix><c:error><sym:cross></c:error> <c:text><c:value><id></c:value> is a template for the <c:value><world></c:value> world and is never pasted. Use <c:value>/skyblock builds apply <id></c:value>."
  no-world: "<prefix><c:error><sym:cross></c:error> <c:text>World <c:value><world></c:value> of <c:value><id></c:value> isn't loaded. Check worlds.yml."
  info:
    header: "<prefix><c:text>Build <c:value><id></c:value>:"
    schematic: " <c:ember><sym:bullet></c:ember> <c:text>Schematic: <c:value><file></c:value> <c:muted>(Sponge v<version>, data <data>)"
    world: " <c:ember><sym:bullet></c:ember> <c:text>World: <c:value><world></c:value> <c:muted><sym:dot></c:muted> <c:text>origin <c:value><origin>"
    area: " <c:ember><sym:bullet></c:ember> <c:text>Paste area: <c:value><area></c:value> <c:muted>(<chunks> chunks, build bounds <bounds>)"
    blocks: " <c:ember><sym:bullet></c:ember> <c:text>Blocks: <c:value><blocks></c:value> <c:muted><sym:dot> writes <write> <sym:dot> air <air> <sym:dot> biomes <biomes>"
    spawn: " <c:ember><sym:bullet></c:ember> <c:text>Player spawn: <c:value><position></c:value> <c:muted>yaw <yaw>"
    points: " <c:ember><sym:bullet></c:ember> <c:text>Spots: <c:muted><list>"
    regions: " <c:ember><sym:bullet></c:ember> <c:text>Regions: <c:muted><list>"
    template: " <c:ember><sym:bullet></c:ember> <c:text>Template: never pasted; apply makes it the island schematic of /is create"
    depths-gate: " <c:ember><sym:bullet></c:ember> <c:text>The Gate of the Depths: apply sets the Depths spawn and updates zones.yml"
    depths-zone: " <c:ember><sym:bullet></c:ember> <c:text>Depths zone <c:value><zone></c:value><c:text>: apply wires it into zones.yml"
    pasted: " <c:ember><sym:bullet></c:ember> <c:text>Pasted <c:value><at></c:value> by <c:value><by></c:value> <c:muted>(<details>)"
    applied: " <c:ember><sym:bullet></c:ember> <c:text>Applied <c:value><at></c:value> by <c:value><by>"
    no-problems: " <c:success><sym:check></c:success> <c:text>No problems."
    error: " <c:error><sym:cross></c:error> <c:text><problem>"
    warning: " <c:warning><sym:cross></c:warning> <c:muted><problem>"
  confirm:
    button: "<c:action>[Confirm]"
    hover: "<c:text>Runs <c:value><command>"
    line: "<prefix><button> <c:muted>or type <command> within <seconds> s"
    missing: "<prefix><c:error><sym:cross></c:error> <c:text>Nothing to confirm. Run <c:value><command></c:value> first to see what it does."
    expired: "<prefix><c:error><sym:cross></c:error> <c:text>That preview expired. Run <c:value><command></c:value> again."
  paste:
    preview: "<prefix><c:warning>Paste <c:value><id></c:value><c:warning> into <c:value><world></c:value><c:warning>?</c:warning> <c:text>Origin <c:value><origin></c:value><c:text>, area <c:value><area></c:value> <c:muted>(<chunks> chunks)</c:muted><c:text>, <c:value><blocks></c:value> <c:text>blocks written <c:muted>(air <air>, biomes <biomes>, <warnings> warning(s))</c:muted><c:text>. This replaces what is there and can't be undone."
    backup: "<prefix><c:warning><sym:cross></c:warning> <c:text>Back up the <c:value><world></c:value> world folder first (stop the server or /save-all, then copy it)."
    loading: "<prefix><c:text>Loading <c:value><chunks></c:value> chunks for <c:value><id></c:value>..."
    loading-progress: "<prefix><c:muted><id>: <done>/<total> chunks loaded"
    pasting: "<prefix><c:text>Pasting <c:value><id></c:value> <c:muted>(<chunks> chunks held, FAWE works in the background)"
    progress: "<prefix><c:muted><id>: pasting for <time>..."
    done: "<prefix><c:success><sym:check></c:success> <c:text>Pasted <c:value><id></c:value> in <c:value><time></c:value> <c:muted>(<blocks> blocks changed)</c:muted><c:text>. Next: <c:value>/skyblock builds apply <id>"
    failed: "<prefix><c:error><sym:cross></c:error> <c:text>Pasting <c:value><id></c:value> failed: <c:muted><reason></c:muted><c:text>. See the console log."
  paste-all:
    nothing: "<prefix><c:error><sym:cross></c:error> <c:text>No build is ready to paste. See <c:value>/skyblock builds"
    preview: "<prefix><c:warning>Paste all <c:value><count></c:value><c:warning> builds in this order?"
    line: " <c:muted><step>.</c:muted> <c:value><id></c:value> <c:muted><sym:dot> <world> <sym:dot> <area> <sym:dot> <blocks> blocks"
    skipped: " <c:error><sym:cross></c:error> <c:text>Skipped (errors or world missing): <c:muted><list>"
    total: "<prefix><c:text>Total: <c:value><blocks></c:value> <c:text>blocks, one build after the other. It can't be undone."
    step: "<prefix><c:text>Build <c:value><step></c:value>/<c:value><count></c:value><c:text>: <c:value><id>"
    done: "<prefix><c:success><sym:check></c:success> <c:text>All <c:value><count></c:value> builds pasted in <c:value><time></c:value><c:text>. Next: apply each one (/skyblock builds apply id)."
    stopped: "<prefix><c:error><sym:cross></c:error> <c:text>Stopped at <c:value><id></c:value> <c:muted>(<done> of <count> done)</c:muted><c:text>. Fix it, then paste the rest one by one."
  apply:
    header: "<prefix><c:text>Applying <c:value><id></c:value><c:text>:"
    not-pasted: " <c:warning><sym:cross></c:warning> <c:text>Not pasted on this server yet: the metadata is wired anyway. Paste it with <c:value>/skyblock builds paste <id>"
    points: " <c:success><sym:check></c:success> <c:text>Saved <c:value><points></c:value> <c:text>spots and <c:value><regions></c:value> <c:text>regions to <c:value><file>"
    points-failed: " <c:error><sym:cross></c:error> <c:text>Couldn't save <c:value><file></c:value> <c:muted>(spots kept until restart, see the console)"
    spawn: " <c:success><sym:check></c:success> <c:text>Spawn of <c:value><world></c:value> <c:text>is now <c:value><position></c:value> <c:muted>yaw <yaw> (worlds.yml)"
    spawn-failed: " <c:error><sym:cross></c:error> <c:text>Couldn't set the spawn of <c:value><world></c:value> <c:muted>(not in worlds.yml or not saved)"
    regions-covered: " <c:success><sym:check></c:success> <c:text><c:value><count></c:value> <c:text>protected region(s): the whole <c:value><world></c:value> <c:text>world is already protected"
    regions-stored: " <c:warning><sym:cross></c:warning> <c:text><c:value><count></c:value> <c:text>protected region(s) in <c:value><world></c:value> <c:text>stored for later (no region protection there yet)"
    portals-stored: " <c:warning><sym:cross></c:warning> <c:text><c:value><count></c:value> <c:text>portal(s) stored (portals are off: worlds.yml portals.enabled)"
    portals: " <c:success><sym:check></c:success> <c:text><c:value><count></c:value> <c:text>portal(s) active: <c:muted><list>"
    stored: " <c:ember><sym:bullet></c:ember> <c:text>Stored for later modules: <c:muted><list>"
    depths: " <c:success><sym:check></c:success> <c:text>Depths zones.yml updated: <c:value><changes></c:value> <c:text>change(s) <c:muted>(backup <backup>, module reloaded)"
    depths-change: "   <c:muted><sym:dot> <change>"
    depths-problem: "   <c:warning><sym:cross></c:warning> <c:muted><problem>"
    depths-failed: " <c:error><sym:cross></c:error> <c:text>Depths zones not updated: <c:muted><reason>"
    depths-missing: " <c:error><sym:cross></c:error> <c:text>The depths module isn't running: zones.yml not updated"
    depths-no-layout: " <c:warning><sym:cross></c:warning> <c:text>No <c:value><file></c:value> <c:text>in the builds folder: zones.yml not updated"
    island: " <c:success><sym:check></c:success> <c:text>New islands now use <c:value><name></c:value> <c:muted>(was <old>; existing islands don't change)"
    island-copied: " <c:warning><sym:cross></c:warning> <c:text>Copied to <c:value><folder></c:value><c:text>, but the islands module isn't running: set islands.yml creation.schematic to <c:value><name>"
    island-failed: " <c:error><sym:cross></c:error> <c:text>Island schematic not changed: <c:muted><reason>"
    done: "<prefix><c:success><sym:check></c:success> <c:text>Applied <c:value><id></c:value><c:text>."

# Build portals (PORTALS): step into a portal of an applied build to travel. <target> = the portal's target name.
portals:
  destination: "<target>"
  # Title on arrival: portals.title.<target> if it exists, else portals.title.default.
  title:
    default:
      title: "<c:value><bold><target></bold>"
      subtitle: ""
      fade-in: 5
      stay: 30
      fade-out: 10
    spawn:
      title: "<grad:phoenix><bold>Phoenix Citadel</bold></grad>"
      subtitle: "<c:text>Spawn"
      fade-in: 5
      stay: 30
      fade-out: 10
    depths:
      title: "<c:ember><bold>The Depths</bold>"
      subtitle: "<c:text>Mine, chop and fight"
      fade-in: 5
      stay: 30
      fade-out: 10
    warzone:
      title: "<c:error><bold>Warzone</bold>"
      subtitle: "<c:text>PvP is on here"
      fade-in: 5
      stay: 30
      fade-out: 10
  closed: "<prefix><c:error><sym:cross></c:error> <c:text>This portal isn't open yet. Soon!"
  no-world: "<prefix><c:error><sym:cross></c:error> <c:text>This portal can't open right now. Try again soon, or tell staff."
  not-built: "<prefix><c:error><sym:cross></c:error> <c:text>The <c:value><target></c:value> isn't built yet. Soon!"
  unknown: "<prefix><c:error><sym:cross></c:error> <c:text>This portal doesn't lead anywhere yet."
  frozen: "<prefix><c:error><sym:cross></c:error> <c:text>You're frozen by staff and can't use portals."
  combat-wait: "<c:warning>In combat:</c:warning> <c:text>the portal takes you in <c:value><seconds> s</c:value>. Stay inside."
  combat-left: "<prefix><c:error><sym:cross></c:error> <c:text>You left the portal. Step in again to travel."
  no-islands: "<prefix><c:error><sym:cross></c:error> <c:text>Islands aren't available right now. Try again soon."
  warzone-only: "<prefix><c:error><sym:cross></c:error> <c:text>The warzone can only be entered through its portal in the castle gatehouse."

# World protection + region flags (DEPTHSPROT): one action bar line per denial (worlds.yml protection.message-cooldown-millis).
protection:
  build: "<c:error><sym:cross></c:error> <c:text>This area is protected. You can't build here."
  interact: "<c:error><sym:cross></c:error> <c:text>You can't use that here."
  containers: "<c:error><sym:cross></c:error> <c:text>Containers here are decoration."
  workstations: "<c:error><sym:cross></c:error> <c:text>This one is decoration. Talk to the NPCs instead."
  entity-edit: "<c:error><sym:cross></c:error> <c:text>Decorations here can't be changed."
  fire: "<c:error><sym:cross></c:error> <c:text>You can't light fires here."
  explosions: "<c:error><sym:cross></c:error> <c:text>Explosions can't break blocks here."
  pve-dealt: "<c:error><sym:cross></c:error> <c:text>This is a safe zone. Step out to fight."
  pve-taken: "<c:text>Safe zone: mobs can't hurt you here."
  mob-target: "<c:text>Safe zone: mobs ignore you here."
  ender-pearl: "<c:error><sym:cross></c:error> <c:text>Ender pearls don't work here."
  wind-charge: "<c:error><sym:cross></c:error> <c:text>Wind charges don't work here."
  bypass-hint: "<c:muted>Protected area <sym:dot> switch to </c:muted><c:value>creative</c:value><c:muted> to edit</c:muted>"
