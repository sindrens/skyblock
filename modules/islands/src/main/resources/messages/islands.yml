  word:
    allowed: "allowed"
    denied: "denied"
  header:
    name: "<c:flame><bold><perm>"
    lore:
      - "<c:text>Lets a role <c:value><action></c:value>."
  role:
    name: "<c:value><bold><role>"
    lore-edit:
      - "<c:text>Click a block in this row"
      - "<c:text>to switch a permission."
    lore-locked:
      - "<c:muted>You can't change this row."
  cell:
    name: "<c:value><role></c:value> <c:muted>·</c:muted> <c:value><perm>"
    lore:
      - "<c:text><role>s may <action>?"
    allowed:
      - "<c:success><sym:check> Allowed"
    denied:
      - "<c:error><sym:cross> Denied"
    default:
      - "<c:muted>Server default"
    changed:
      - "<c:muted>Changed by your island (default: <default>)"
    click-deny:
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to deny"
    click-allow:
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to allow"
    locked:
      - "<c:muted>Only the Leader, an Admin or a Mod can change this."
    locked-mod:
      - "<c:muted>Only the Leader and Admins can change Mod permissions."
    locked-admin:
      - "<c:muted>Only the Leader can change Admin permissions."
    locked-management:
      - "<c:muted>You can only give this right if you have it."
    not-applicable:
      - "<c:muted>This role can never have this."
  names:
    break: "Break"
    place: "Place"
    interact: "Doors & buttons"
    containers: "Containers"
    redstone: "Redstone"
    animals: "Animals"
    villagers: "Villagers"
    pickup: "Pick up items"
    drop: "Drop items"
    armor-stands: "Armor stands"
    vehicles: "Vehicles"
    fire: "Fire"
    ender-pearls: "Ender pearls"
    spawners: "Spawners"
    hurt-monsters: "Hurt monsters"
    settings: "Island settings"
    notes-read: "Read notes"
    notes-write: "Write notes"
    notes-manage: "Manage notes"
    bank-deposit: "Bank deposit"
    bank-withdraw: "Bank withdraw"
    bank-history: "Bank history"

# ---------------------------------------------------------------- M2.7 lifecycle (/is disband) and staff tools (/isadmin)
# Owner answer 591: told to every member whose profile was reset by a disband or an island reset.
reset-profile:
  you: "<prefix><c:warning><sym:cross></c:warning> <c:text>Your profile on <c:value><island></c:value> was reset: money, inventory and ender chest. <c:muted>Staff keep a backup if this was a mistake."

disband:
  leader-only: "<prefix><c:error><sym:cross></c:error> <c:text>Only the island Leader can disband. <c:muted>Members can</c:muted> <click:run_command:'/is leave'><hover:show_text:'<c:text>Leave the island'><c:action>[Leave]</c:action></hover></click>"
  busy: "<prefix><c:error><sym:cross></c:error> <c:text>Your island is being built or removed. Try again soon."
  # Owner answer 141: an island with other members can't be disbanded. <members> = other members.
  has-members: "<prefix><c:error><sym:cross></c:error> <c:text>Your island still has <c:value><members></c:value> other member(s). Make one of them Leader first: <click:suggest_command:'/is transfer '><hover:show_text:'<c:text>Pick a new Leader'><c:action>[Transfer]</c:action></hover></click>"
  crumb: "Disband island"
  shown:
    name: "<c:error><bold>Disband <island>"
    lore:
      - "<c:text>Deletes your island for good."
  details:
    - "<c:error>Your island and everything on it is"
    - "<c:error>deleted forever, its bank money too."
    - "<c:error>This profile is reset: its money,"
    - "<c:error>inventory and ender chest are taken."
    - "<c:text>You can create a new island right away."
  cancelled: "<prefix><c:text>Your island stays. Nothing changed."
  done-now: "<prefix><c:success><sym:check></c:success> <c:value><island></c:value> <c:text>was disbanded. <click:run_command:'/is'><hover:show_text:'<c:text>Create a new island'><c:action>[Create one]</c:action></hover></click>"
  notify: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>disbanded <c:value><island></c:value>. Join another island or <click:run_command:'/is'><hover:show_text:'<c:text>Create your own island'><c:action>[Create one]</c:action></hover></click>"
  notify-coop: "<prefix><c:text>Your coop on <c:value><island></c:value> ended: the island was removed."

admin:
  crumb: "Island admin"
  not-found: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>isn't on any island. Use the name of an island's Leader or member."
  busy: "<prefix><c:error><sym:cross></c:error> <c:text>That island is being built or removed. Try again soon."
  changed: "<prefix><c:error><sym:cross></c:error> <c:text>The island changed meanwhile, nothing was done. Check <c:value>/isadmin info</c:value>."
  cancelled: "<prefix><c:text>Cancelled. Nothing changed."
  state:
    used: "Used"
    clearing: "Clearing"
    free: "Free"
  info:
    header: "<c:brand><st>        </st></c:brand> <c:flame><bold><island></bold></c:flame> <c:brand><st>        </st>"
    lines:
      - "<c:text>Leader: <c:value><owner></c:value> <c:muted>(<owner-uuid>)"
      - "<c:text>Type: <c:value><type></c:value> <c:muted>· season <season>"
      - "<c:text>Slot: <c:value>#<slot></c:value> <c:muted>· grid <grid-x>, <grid-z> · center <center-x>, <center-z>"
      - "<c:text>Size: <c:value><size>x<size></c:value> chunks <c:muted>(max <max>)"
      - "<c:text>Members: <c:value><members>/<slots></c:value> <c:muted>· coop <coops>"
      - "<c:text>Created: <c:value><created></c:value> <c:muted>· home <home>"
      - "<c:muted>Id: <id>"
    member: " <c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:muted>· <role> · joined <date>"
    coop: " <c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:muted>· <role>"
    # Owner answer 293: shown when staff hid the island from the visit browser. <note>
    hidden: "<c:warning>Hidden from the visit browser</c:warning> <c:muted>· note: <note>"
    actions: "<click:run_command:'/isadmin tp <owner>'><hover:show_text:'<c:text>Teleport to this island'><c:action>[Teleport]</c:action></hover></click> <click:run_command:'/isadmin slots'><hover:show_text:'<c:text>Open the slot grid'><c:action>[Slots]</c:action></hover></click> <click:suggest_command:'/isadmin setsize <owner> '><hover:show_text:'<c:text>Change the border size'><c:action>[Size]</c:action></hover></click>"
    home-none: "not built yet"
    type-solo: "Solo"
    type-team: "Team"
  # Owner answer 293: /isadmin hide <island> [note] and /isadmin unhide <island>. <island> <note>
  hide:
    done: "<prefix><c:success><sym:check></c:success> <c:value><island></c:value> <c:text>is hidden from the visit browser. <c:muted>Note: <note>"
    already: "<prefix><c:error><sym:cross></c:error> <c:value><island></c:value> <c:text>is already hidden. Use <c:value>/isadmin unhide</c:value> to show it again."
    failed: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't save that. Try again."
  unhide:
