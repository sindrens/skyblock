      - "<c:text>Stats of your island and its members."
      - "<c:text>Today: <c:value><today>"
      - "<c:text>This week: since <c:value><week></c:value> <c:muted>(Monday)"
      - "<c:muted>Saved every <flush> seconds."
  category:
    blocks_mined: "Blocks mined"
    logs_chopped: "Logs chopped"
    crops_harvested: "Crops harvested"
    blocks_placed: "Blocks placed"
    generator_output: "Generator output"
    mobs_killed: "Mobs killed"
    items_sold: "Items sold"
    money_earned: "Money earned"
    visitors: "Visitors"
    playtime: "Time on the island"
    koth_time: "KOTH time"
    bosses_killed: "Bosses killed"
  item:
    name: "<c:flame><bold><category>"
    lore:
      - "<c:text>All time: <c:value><total>"
