# ---------------------------------------------------------------- M2.4 visiting, warps and showcase
# /settings toggles (category Social) for island members.
settings:
  island-visit-attempts:
    name: "<c:flame>Locked island visits"
    lore: ["<c:text>Tell me when someone tries to", "<c:text>visit my island while it's locked."]
  island-visitor-arrivals:
    name: "<c:flame>Visitor arrivals"
    lore: ["<c:text>Tell me when someone arrives", "<c:text>on my island."]
  island-visitor-departures:
    name: "<c:flame>Visitor departures"
    lore: ["<c:text>Tell me when a visitor leaves", "<c:text>my island."]
  island-note-alerts:
    name: "<c:flame>New island notes"
    lore: ["<c:text>Tell me when someone adds", "<c:text>a note to my island."]
  island-notes-scoreboard:
    name: "<c:flame>Next note on scoreboard"
    lore: ["<c:text>Show the newest open island", "<c:text>note on my scoreboard."]
  island-chat-spy:
    name: "<c:flame>Island chat spy"
    lore: ["<c:text>Staff: see every island's", "<c:text>chat messages."]

visit:
  no-island: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>doesn't have an island."
  not-ready: "<prefix><c:error><sym:cross></c:error> <c:value><island></c:value> <c:text>isn't built yet. Try again later."
  unsafe: "<prefix><c:error><sym:cross></c:error> <c:text>No safe spot to land on <c:value><island></c:value>. Try again later."
  banned: "<prefix><c:error><sym:cross></c:error> <c:text>You're banned from <c:value><island></c:value>."
  locked: "<prefix><c:error><sym:cross></c:error> <c:value><island></c:value> <c:text>is locked. Only its members can enter."
  join-banned: "<prefix><c:error><sym:cross></c:error> <c:text>You're banned from <c:value><island></c:value>, so you were sent to spawn."
  join-own-profile: "<prefix><c:error><sym:cross></c:error> <c:value><island></c:value> <c:text>belongs to your other profile, so you were sent to spawn."
  own-profile: "<prefix><c:error><sym:cross></c:error> <c:value><island></c:value> <c:text>belongs to your other profile. You can't visit it from this one."
  join-locked: "<prefix><c:error><sym:cross></c:error> <c:value><island></c:value> <c:text>is locked, so you were sent to spawn."
  welcome: "<c:ember><sym:bullet></c:ember> <c:text>Visiting <c:value><island></c:value>"

lock:
  not-allowed: "<prefix><c:error><sym:cross></c:error> <c:text>Only the Leader, Admins and Mods can do that."
  already: "<prefix><c:error><sym:cross></c:error> <c:text>Your island is already locked. <click:run_command:'/is unlock'><hover:show_text:'<c:text>Open your island to visitors'><c:action>[Unlock]</c:action></hover></click>"
  done: "<prefix><c:success><sym:check></c:success> <c:text>Island locked. Only members can enter now."
  visitors-sent: "<prefix><c:value><count></c:value> <c:text>visitor(s) sent to spawn."
  sent-off: "<prefix><c:error><sym:cross></c:error> <c:value><island></c:value> <c:text>was locked, so you were sent to spawn."
unlock:
  already: "<prefix><c:error><sym:cross></c:error> <c:text>Your island is already open to visitors."
  done: "<prefix><c:success><sym:check></c:success> <c:text>Island unlocked. Visitors can come again."

expel:
  not-allowed: "<prefix><c:error><sym:cross></c:error> <c:text>Only the Leader, Admins and Mods can send visitors off."
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't expel yourself."
  member: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is on your island team. Use <c:value>/is kick</c:value> or <c:value>/is uncoop</c:value>."
  not-here: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>isn't on your island."
  done: "<prefix><c:success><sym:check></c:success> <c:value><player></c:value> <c:text>was sent to spawn."
  you: "<prefix><c:error><sym:cross></c:error> <c:text>You were sent off <c:value><island></c:value>."

ban:
  not-allowed: "<prefix><c:error><sym:cross></c:error> <c:text>Only the Leader, Admins and Mods can ban players."
  unknown: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has never joined. Check the spelling."
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't ban yourself."
  member: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is a member. Kick them first with <c:value>/is kick</c:value>."
  coop: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is coop. End it first with <c:value>/is uncoop</c:value>."
  already: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is already banned."
  limit: "<prefix><c:error><sym:cross></c:error> <c:text>Your island has the max bans (<c:value><max></c:value>). Unban someone first."
  done: "<prefix><c:success><sym:check></c:success> <c:value><player></c:value> <c:text>is banned from your island."
  you: "<prefix><c:error><sym:cross></c:error> <c:text>You were banned from <c:value><island></c:value>."
unban:
  not-banned: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>isn't banned from your island."
  done: "<prefix><c:success><sym:check></c:success> <c:value><player></c:value> <c:text>can visit your island again."
  you: "<prefix><c:text>You can visit <c:value><island></c:value> again."

rate:
  stars: "<prefix><c:error><sym:cross></c:error> <c:text>Pick <c:value>1</c:value> to <c:value><max></c:value> stars."
  own: "<prefix><c:error><sym:cross></c:error> <c:text>You can't rate your own island."
  not-visited: "<prefix><c:error><sym:cross></c:error> <c:text>Visit <c:value><island></c:value> before you rate it."
  already: "<prefix><c:text>You already gave <c:value><island></c:value> <c:flame><stars> <sym:star></c:flame>."
  done: "<prefix><c:success><sym:check></c:success> <c:text>You gave <c:value><island></c:value> <c:flame><stars>/<max> <sym:star></c:flame>."
  changed: "<prefix><c:success><sym:check></c:success> <c:text>Changed your rating for <c:value><island></c:value> from <c:value><old></c:value> to <c:flame><stars> <sym:star></c:flame>."

# Owner answer 292: rating and liking need playtime, and only a few accounts from one address may vote per island.
vote:
  new-player: "<prefix><c:error><sym:cross></c:error> <c:text>You can rate and like islands after <c:value><minutes> minutes</c:value> of playtime."
  ip-limit: "<prefix><c:error><sym:cross></c:error> <c:text>Too many accounts from your connection already voted for <c:value><island></c:value> <c:muted>(max <max>)</c:muted><c:text>."

like:
  own: "<prefix><c:error><sym:cross></c:error> <c:text>You can't like your own island."
  not-visited: "<prefix><c:error><sym:cross></c:error> <c:text>Visit <c:value><island></c:value> before you like it."
  already: "<prefix><c:error><sym:cross></c:error> <c:text>You already liked <c:value><island></c:value> today. Come back tomorrow."
  done: "<prefix><c:success><sym:heart></c:success> <c:text>You liked <c:value><island></c:value>."

warp:
  # Shown as "Teleporting to ..." by the teleport warmup.
  destination: "<warp> on <island>"
  # Examples suggested by tab completion of /is setwarp when the island has no warps yet (comma-separated).
  name-hints: "shop,farm,parkour,spawn"
  not-allowed: "<prefix><c:error><sym:cross></c:error> <c:text>Only the Leader, Admins and Mods can manage warps."
  name-empty: "<prefix><c:error><sym:cross></c:error> <c:text>Give the warp a name."
  # Owner answer 304: the chat filter refused the warp name.
  name-filtered: "<prefix><c:error><sym:cross></c:error> <c:text>That warp name is blocked by the chat filter. Pick another one."
  name-long: "<prefix><c:error><sym:cross></c:error> <c:text>Warp names can be up to <c:value><max></c:value> characters."
  name-chars: "<prefix><c:error><sym:cross></c:error> <c:text>Warp names can only use letters, numbers, <c:value>_</c:value> and <c:value>-</c:value>."
  bad-category: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>isn't a category. Use one of: <c:value><choices></c:value>."
  outside: "<prefix><c:error><sym:cross></c:error> <c:text>Stand inside your island's border to set a warp."
  unsafe: "<prefix><c:error><sym:cross></c:error> <c:text>Not safe here. Stand on solid ground with room above you."
  full: "<prefix><c:error><sym:cross></c:error> <c:text>Your island has all <c:value><slots></c:value> warps. Delete one first with <c:value>/is delwarp</c:value>."
  created: "<prefix><c:success><sym:check></c:success> <c:text>Warp <c:value><warp></c:value> set. <c:muted>(<category>, <count>/<slots>)"
