    - "<c:success>Lime</c:success> <c:text>= allowed, <c:error>red</c:error> <c:text>= denied. Click to switch."
    - "<c:text>The <c:value>Leader</c:value> can always do everything."
    - "<c:muted>Admins change Mod and lower, Mods Member and lower."
