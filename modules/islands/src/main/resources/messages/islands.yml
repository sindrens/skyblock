# Islands (/is). MiniMessage + style tags (style.yml). Placeholders in <angle> brackets. Reload: /skyblock reload islands

# Shown wherever the island has no custom name yet (<owner> = the owner's name).
default-name: "<owner>'s Island"

no-island: "<prefix><c:error><sym:cross> You don't have an island yet. <click:run_command:'/is'><hover:show_text:'<c:text>Create your island'><c:action>[Create one]</c:action></hover></click>"

create:
  menu:
    crumb: "Create your island"
    shown:
      name: "<c:flame><bold>Your own island"
      lore:
        - "<c:text>A small meadow in the sky,"
        - "<c:text>all yours to build on."
        - ""
        - "<c:text>Start size: <c:value><size>x<size> chunks</c:value> <c:muted>(<blocks>x<blocks> blocks)"
    details:
      - "<c:text>Creates your <c:value>solo island</c:value> and"
      - "<c:text>takes you there. Free."
      - "<c:text>Border: <c:value><size>x<size></c:value> chunks, grows to <c:value><max>x<max></c:value>."
  started: "<prefix><c:ember><sym:time></c:ember> <c:text>Building your island, one moment..."
  busy: "<prefix><c:text>Your island is being built. You'll be teleported when it's ready."
  already: "<prefix><c:error><sym:cross> You already have an island. Use <click:run_command:'/is home'><c:action>/is home</c:action></click>."
  cooldown: "<prefix><c:error><sym:cross> You disbanded an island recently. You can create a new one in <c:value><time></c:value>."
  cancelled: "<prefix><c:text>No problem. Type <click:run_command:'/is'><c:action>/is</c:action></click> <c:text>when you're ready."
  build-failed: "<prefix><c:error><sym:cross> Something went wrong while building your island. Try <c:value>/is</c:value> again in a moment or tell a staff member."
  title:
    title: "<grad:phoenix><bold>YOUR ISLAND</bold></grad>"
    subtitle: "<c:text>Rise from the ashes"
    fade-in: 10
    stay: 60
    fade-out: 20
  welcome: "<prefix><c:success><sym:check> <c:text>Welcome to your island! Your starter chest is right in front of you."
  objective: "<c:brand><sym:bullet></c:brand> <c:text>Next: <c:value>Open your starter chest</c:value> <c:muted>· then <click:run_command:'/menu'><c:action>/menu</c:action></click>"

home:
  destination: "your island"
  arrived: "<c:ember><sym:bullet></c:ember> <c:text>Welcome home"
  moved-safe: "<prefix><c:warning>Your home wasn't safe, so you were taken to the nearest safe spot. <c:muted>Set a new one with <c:value>/is sethome</c:value>."
  rescued: "<prefix><c:warning>Your island had no safe spot left, so a block was placed under your home."
  rebuilding: "<prefix><c:text>Your island wasn't finished last time. Building it now..."

sethome:
  done: "<prefix><c:success><sym:check> <c:text>Island home set where you stand."
  not-allowed: "<prefix><c:error><sym:cross> Only the leader, admins and mods can move the home."
  outside: "<prefix><c:error><sym:cross> Stand inside your island's border to set the home."
  height: "<prefix><c:error><sym:cross> The home must be between <c:value>Y <min></c:value> and <c:value>Y <max></c:value>."
  unsafe: "<prefix><c:error><sym:cross> This spot isn't safe. Stand on solid ground with room above you, away from water and lava."

# Protection (action bar, at most one message per protection.message-cooldown-ms). <action> = one of the actions below.
protection:
  own-profile: "<c:error><sym:cross> <c:text>This island belongs to your other profile: you can't do anything here."
  visitor: "<c:error><sym:cross> <c:text>You're visiting: you can't <action> here."
  role: "<c:error><sym:cross> <c:text>Your island role can't <action>."
  outside: "<c:error><sym:cross> <c:text>You can only build inside an island's border."
  height: "<c:error><sym:cross> <c:text>You can only build between <c:value>Y <min></c:value> and <c:value>Y <max></c:value>."
  pvp: "<c:error><sym:cross> <c:text>PvP is off on islands."
  portal: "<c:error><sym:cross> <c:text>Portals don't work on islands."
  border: "<c:error><sym:cross> <c:text>That's the edge of the island."
  actions:
    break: "break blocks"
    place: "place blocks"
    interact: "use doors, buttons and levers"
    containers: "open containers"
    redstone: "change redstone"
    animals: "touch animals"
    villagers: "trade with villagers"
    pickup: "pick up items"
    drop: "drop items"
    armor-stands: "use armor stands and item frames"
    vehicles: "use boats and minecarts"
    fire: "light fires"
    ender-pearls: "teleport here"
    spawners: "change spawners"
    hurt-monsters: "hurt monsters"
    settings: "change the island settings"
    notes-read: "read the island notes"
    notes-write: "add notes, tick them and change their own"
    notes-manage: "change, pin and delete anyone's notes"

bypass:
  "on": "<prefix><c:warning><sym:bullet></c:warning> <c:text>Island bypass <c:value>on</c:value>: you can build and open everything on every island. <c:muted>Logged. /is bypass to turn it off."
  "off": "<prefix><c:success><sym:check> <c:text>Island bypass <c:value>off</c:value>."

void:
  rescued: "<c:ember><sym:bullet></c:ember> <c:text>Caught you! Back on solid ground."

starter:
  # The 4 lines of the starter island's sign (Bedrock-safe, max ~15 characters each).
  sign:
    - ""
    - "<c:ember>Open"
    - "<c:brand><bold>/menu"
    - ""

placeholder:
  level-none: "-"

error:
  island-gone: "<prefix><c:error><sym:cross> That island doesn't exist anymore."
  database: "<prefix><c:error><sym:cross> The island data couldn't be loaded or saved. Try again in a moment."
  world: "<prefix><c:error><sym:cross> The island world <c:value><world></c:value> isn't loaded. Tell a staff member."
  teleport: "<prefix><c:error><sym:cross> Couldn't teleport you to your island. Try again."

# ---------------------------------------------------------------- M2.3 members and roles
# Role names (also used in the permission matrix rows).
role:
  leader: "Leader"
  admin: "Admin"
  mod: "Mod"
  member: "Member"
  coop: "Coop"
  visitor: "Visitor"
  leader-only: "<prefix><c:error><sym:cross> Only the island leader can do that."
  admin-only: "<prefix><c:error><sym:cross> Only the leader and admins can change roles."

menu:
  crumb: "Island"

member:
  busy: "<prefix><c:text>One moment, your last island action is still being saved."
  not-found: "<prefix><c:error><sym:cross> <c:value><player></c:value> isn't a member of your island."
  changed: "<prefix><c:error><sym:cross> That member changed meanwhile. Check <click:run_command:'/is members'><c:action>/is members</c:action></click> and try again."

invite:
  not-allowed: "<prefix><c:error><sym:cross> Only the leader, admins and mods can invite players."
  self: "<prefix><c:error><sym:cross> You can't invite yourself."
  own-profile: "<prefix><c:error><sym:cross> <c:value><player></c:value>'s other profile is on this island. Their profiles can't share one."
  already-member: "<prefix><c:error><sym:cross> <c:value><player></c:value> is already on your island."
  has-island: "<prefix><c:error><sym:cross> <c:value><player></c:value> already has an island. They have to leave it before they can join yours."
  full: "<prefix><c:error><sym:cross> Your island is full (<c:value><slots></c:value> members). Member Slots upgrades come later."
  too-many: "<prefix><c:error><sym:cross> Your island already has <c:value><max></c:value> open invites. Wait until some are answered or expire."
  target-blocked: "<prefix><c:error><sym:cross> <c:value><player></c:value> can't join islands right now."
  target-season-limit: "<prefix><c:error><sym:cross> <c:value><player></c:value> already joined <c:value><max></c:value> islands this season, the most allowed."
  target-cooldown: "<prefix><c:error><sym:cross> <c:value><player></c:value> changed islands recently and can join again in <c:value><time></c:value>."
  sent: "<prefix><c:success><sym:check> <c:text>Invite sent to <c:value><player></c:value>. <c:muted>It expires in <time>."
  now-team: "<prefix><c:warning><sym:star></c:warning> <c:text>Your island is now a <c:value>Team Island</c:value>. <c:muted>It competes on the team leaderboard from now on."
  received: "<prefix><c:ember><sym:star></c:ember> <c:value><player></c:value> <c:text>invited you to <c:value><island></c:value> <c:muted>(<members>/<slots> members)</c:muted><newline><click:run_command:'/is accept <from>'><hover:show_text:'<c:text>Join <island>'><c:success>[Accept]</c:success></hover></click> <click:run_command:'/is deny <from>'><hover:show_text:'<c:text>Decline the invite'><c:error>[Deny]</c:error></hover></click> <c:muted>Expires in <time>."
  expired-inviter: "<prefix><c:muted>Your island invite to <c:value><player></c:value> expired."
  expired-target: "<prefix><c:muted>Your invite to <c:value><island></c:value> expired."
  solo:
    crumb: "Make it a Team Island?"
    shown:
      name: "<c:warning><bold>Invite <player>"
      lore:
        - "<c:text>Inviting makes your island a"
        - "<c:value>Team Island</c:value> <c:text>forever."
    details:
      - "<c:warning>Inviting makes your island a"
      - "<c:warning><bold>Team Island forever.</bold>"
      - "<c:text>Solo and team islands are on"
      - "<c:text>separate leaderboards."
      - ""
      - "<c:text>It stays a team island even if"
      - "<c:text>everyone leaves later."
      - "<c:muted>Want help without that? Use /is coop."
    cancelled: "<prefix><c:text>No invite sent. Your island stays a <c:value>solo island</c:value>. <c:muted>Tip: <click:suggest_command:'/is coop '><c:action>/is coop</c:action></click> <c:muted>lets a friend help while you're online."

accept:
  none: "<prefix><c:error><sym:cross> You have no island invites right now."
  none-from: "<prefix><c:error><sym:cross> You have no invite from <c:value><player></c:value>'s island."
  has-island: "<prefix><c:error><sym:cross> You already have an island. Leave it first to join another one."
  own-profile: "<prefix><c:error><sym:cross> One of your other profiles is (or was) on this island. Your profiles can't share one."
  expired: "<prefix><c:error><sym:cross> That invite expired. Ask for a new one."
  full: "<prefix><c:error><sym:cross> That island is full (<c:value><slots></c:value> members)."
  blocked: "<prefix><c:error><sym:cross> You can't join islands right now."
  season-limit: "<prefix><c:error><sym:cross> You already joined <c:value><max></c:value> islands this season, the most allowed."
  cooldown: "<prefix><c:error><sym:cross> You changed islands recently. You can join another island in <c:value><time></c:value>."
  joined: "<prefix><c:success><sym:check> <c:text>You joined <c:value><island></c:value>! <click:run_command:'/is home'><c:action>[Go there]</c:action></click> <click:run_command:'/is members'><c:action>[Members]</c:action></click>"
  title:
    title: "<grad:phoenix><bold>NEW ISLAND</bold></grad>"
    subtitle: "<c:text>Welcome to <c:value><island>"
    fade-in: 10
    stay: 50
    fade-out: 20

deny:
  done: "<prefix><c:text>You declined the invite to <c:value><island></c:value>."
  notify: "<prefix><c:muted><player> declined your island invite."

kick:
  self: "<prefix><c:error><sym:cross> You can't kick yourself. Use <c:value>/is leave</c:value>."
  not-allowed: "<prefix><c:error><sym:cross> You can't kick <c:value><player></c:value>. <c:muted>You can only kick players with a lower role."
  crumb: "Kick member"
  shown:
    name: "<c:error><bold>Kick <player>"
    lore:
      - "<c:text>Removes <c:value><player></c:value> from your island."
  details:
    - "<c:text><c:value><player></c:value> is removed from your island"
    - "<c:text>and sent to spawn if they're on it."
    - "<c:text>XP they earned stays with the island."
  done: "<prefix><c:success><sym:check> <c:value><player></c:value> <c:text>was removed from your island."
  you: "<prefix><c:error><sym:cross> <c:text>You were removed from <c:value><island></c:value> by <c:value><player></c:value>."
  you-reason: "<prefix><c:error><sym:cross> <c:text>You were removed from <c:value><island></c:value>. Reason: <c:value><reason></c:value>"

leave:
  leader: "<prefix><c:error><sym:cross> The leader can't leave. Hand the island over first with <click:suggest_command:'/is transfer '><c:action>/is transfer</c:action></click>."
  crumb: "Leave island"
  shown:
    name: "<c:error><bold>Leave <island>"
    lore:
      - "<c:text>You stop being a member."
  details:
    - "<c:text>You leave <c:value><island></c:value>."
    - "<c:text>XP you earned stays with the island."
    - "<c:warning>You can join another island <c:value><time></c:value>"
    - "<c:warning>after you joined this one.</c:warning>"
  done: "<prefix><c:text>You left <c:value><island></c:value>. <c:muted>You can join another island in <time>, or create your own with</c:muted> <click:run_command:'/is'><c:action>/is</c:action></click>."
  done-free: "<prefix><c:text>You left <c:value><island></c:value>. <c:muted>You can join another island now, or create your own with</c:muted> <click:run_command:'/is'><c:action>/is</c:action></click>."

promote:
  not-possible: "<prefix><c:error><sym:cross> <c:value><player></c:value> can't be promoted by you. <c:muted>The leader promotes Member → Mod → Admin; admins promote members to mod."
  done: "<prefix><c:success><sym:check> <c:value><player></c:value> <c:text>is now a <c:value><role></c:value>."
  you: "<prefix><c:success><sym:star> <c:text>You are now a <c:value><role></c:value> on your island <c:muted>(by <player>)</c:muted>."

demote:
  not-possible: "<prefix><c:error><sym:cross> <c:value><player></c:value> can't be demoted by you. <c:muted>The leader demotes admins and mods; admins demote mods."
  done: "<prefix><c:success><sym:check> <c:value><player></c:value> <c:text>is now a <c:value><role></c:value>."
  you: "<prefix><c:warning><sym:bullet></c:warning> <c:text>You are now a <c:value><role></c:value> on your island <c:muted>(by <player>)</c:muted>."

transfer:
  not-possible: "<prefix><c:error><sym:cross> You can only hand the island to one of its members."
  crumb: "Transfer island"
  shown:
    name: "<c:warning><bold>Make <player> the leader"
    lore:
      - "<c:text>Step 1 of 2"
  details:
    - "<c:value><player></c:value> <c:text>becomes the island leader."
    - "<c:text>You become an <c:value>Admin</c:value>."
    - "<c:muted>One more confirmation follows."
  final:
    crumb: "Are you really sure?"
    shown:
      name: "<c:error><bold>Final step: <player> leads"
      lore:
        - "<c:text>Step 2 of 2"
    details:
      - "<c:error>This can't be undone by you."
      - "<c:text>Only <c:value><player></c:value> <c:text>can give it back."
  done: "<prefix><c:success><sym:check> <c:value><player></c:value> <c:text>is now the island leader. You are an <c:value>Admin</c:value>."
  you: "<prefix><c:success><sym:star> <c:text>You are now the leader of <c:value><island></c:value> <c:muted>(from <player>)</c:muted>."
  title:
    title: "<grad:phoenix><bold>ISLAND LEADER</bold></grad>"
    subtitle: "<c:text>The island is yours now"
    fade-in: 10
    stay: 50
    fade-out: 20

coop:
  not-allowed: "<prefix><c:error><sym:cross> Only the leader, admins and mods can coop players."
  self: "<prefix><c:error><sym:cross> You can't coop yourself."
  own-profile: "<prefix><c:error><sym:cross> <c:value><player></c:value>'s other profile is on this island, so they can't be cooped."
  member: "<prefix><c:error><sym:cross> <c:value><player></c:value> is already a member of your island."
  already: "<prefix><c:error><sym:cross> <c:value><player></c:value> is already coop on your island."
  full: "<prefix><c:error><sym:cross> Your island already has <c:value><max></c:value> coop players."
  blocked: "<prefix><c:error><sym:cross> <c:value><player></c:value> can't be cooped right now."
  not-coop: "<prefix><c:error><sym:cross> <c:value><player></c:value> isn't coop on your island."
  done: "<prefix><c:success><sym:check> <c:value><player></c:value> <c:text>is coop on your island while you or another manager is online. <c:muted>No XP, no bank, your island stays as it is."
  you: "<prefix><c:ember><sym:star></c:ember> <c:value><player></c:value> <c:text>made you coop on <c:value><island></c:value>: you can help build there while its leader, an admin or a mod is online."
  removed: "<prefix><c:success><sym:check> <c:value><player></c:value> <c:text>is no longer coop on your island."
  you-removed: "<prefix><c:muted>You are no longer coop on <c:value><island></c:value>."
  you-removed-reason: "<prefix><c:muted>You are no longer coop on <c:value><island></c:value>. Reason: <c:value><reason></c:value>"
  ended: "<prefix><c:muted>Your coop on <c:value><island></c:value> ended: its leader, admins and mods went offline."

# Sent to the island's online members on every member change.
notify:
  invited: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>invited <c:value><target></c:value> to the island."
  joined: "<c:success><sym:bullet></c:success> <c:value><player></c:value> <c:text>joined the island! <c:muted>(<members>/<slots>)"
  left: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>left the island."
  kicked: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>was removed from the island <c:muted>(by <by>)</c:muted>."
  promoted: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>is now a <c:value><role></c:value> <c:muted>(by <by>)</c:muted>."
  demoted: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>is now a <c:value><role></c:value> <c:muted>(by <by>)</c:muted>."
  transferred: "<c:ember><sym:star></c:ember> <c:value><player></c:value> <c:text>is the new island leader <c:muted>(from <by>)</c:muted>."
  cooped: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>is coop on the island <c:muted>(by <by>)</c:muted>."
  uncooped: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>is no longer coop on the island."
  still-team: "<prefix><c:muted>Your island stays a Team Island even with only you on it: solo and team leaderboards are kept apart for fairness."
  # M2.4 visiting (arrival, departure and attempts are /settings toggles for each member)
  arrived: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>is visiting your island."
  departed: "<c:muted><sym:bullet> <player> left your island."
  attempt: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>tried to visit, but your island is locked. <click:run_command:'/is unlock'><hover:show_text:'<c:text>Open your island to visitors'><c:action>[Unlock]</c:action></hover></click>"
  locked: "<c:ember><sym:bullet></c:ember> <c:text>The island was locked <c:muted>(by <by>)</c:muted>."
  unlocked: "<c:ember><sym:bullet></c:ember> <c:text>The island is open to visitors again <c:muted>(by <by>)</c:muted>."
  expelled: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>was sent off the island <c:muted>(by <by>)</c:muted>."
  banned: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>was banned from the island <c:muted>(by <by>)</c:muted>."
  unbanned: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>can visit the island again <c:muted>(by <by>)</c:muted>."
  liked: "<c:ember><sym:heart></c:ember> <c:value><player></c:value> <c:text>liked your island!"
  # ISL2
  setting: "<c:ember><sym:bullet></c:ember> <c:value><setting></c:value> <c:text>is now <c:value><value></c:value> <c:muted>(by <by>)</c:muted>."
  warp-gone: "<c:ember><sym:bullet></c:ember> <c:text>Warp <c:value><warp></c:value> was removed: its sign is gone."

members:
  crumb: "Members"
  notes:
    name: "<c:flame><bold>Island notes"
    lore:
      - "<c:text>Your island's shared to-do list."
      - ""
      - "<c:action>Click to open"
  info:
    - "<c:text>Everyone on your island and their role."
    - "<c:text>Click a head for actions."
    - "<c:muted>Leader > Admin > Mod > Member. Coop players are"
    - "<c:muted>temporary and only help while you're online."
  empty:
    name: "<c:muted>Nobody here"
    lore:
      - "<c:text>Invite friends with <c:value>/is invite"
  summary:
    name: "<c:flame><bold><island>"
    lore-solo:
      - "<c:text>Type: <c:value>Solo island"
      - "<c:text>Members: <c:value><members>/<slots>"
      - "<c:text>Coop: <c:value><coops>/<max-coops>"
      - ""
      - "<c:muted>Inviting someone makes it a Team Island."
    lore-team:
      - "<c:text>Type: <c:value>Team island"
      - "<c:text>Members: <c:value><members>/<slots></c:value> <c:muted>(up to <max-slots> with upgrades)"
      - "<c:text>Coop: <c:value><coops>/<max-coops>"
  entry:
    name: "<c:value><player></c:value> <c:muted>· <role>"
    name-leader: "<c:flame><sym:star></c:flame> <c:value><player></c:value> <c:muted>· <role>"
    role:
      - "<c:text>Role: <c:value><role>"
    joined:
      - "<c:text>Joined: <c:value><date>"
    invited-by:
      - "<c:text>Invited by: <c:value><inviter>"
    coop:
      - "<c:text>Temporary trust, no XP, no bank."
    online:
      - "<c:success>● Online"
    offline:
      - "<c:muted>● Offline"
    click:
      - "<c:action>Click for actions"
  invite:
    name: "<c:flame><bold>Invite a player"
    crumb: "Invite"
    lore:
      - "<c:text>Pick an online player without"
      - "<c:text>an island. Members: <c:value><members>/<slots>"
      - ""
      - "<c:action>Click to choose"
    lore-full:
      - "<c:error>Your island is full (<members>/<slots>)."
  invites:
    name: "<c:flame><bold>Invites"
    lore:
      - "<c:text>Invites you got and invites"
      - "<c:text>your island sent. Open: <c:value><count>"
      - ""
      - "<c:action>Click to open"
  settings:
    name: "<c:flame><bold>Island settings"
    lore:
      - "<c:text>Spawning, fire, explosions,"
      - "<c:text>weather, time and more."
      - ""
      - "<c:action>Click to open"
  permissions:
    name: "<c:flame><bold>Permissions"
    lore-edit:
      - "<c:text>What each role may do on your island."
      - ""
      - "<c:action>Click to edit"
    lore-view:
      - "<c:text>What each role may do on your island."
      - "<c:muted>Only the leader, admins and mods can change it."
      - ""
      - "<c:action>Click to view"

actions:
