# Islands (/is). MiniMessage + style tags (style.yml). Placeholders in <angle> brackets. Reload: /skyblock reload islands
# Format (docs/UI_STYLE.md §3): prefix only on replies, success/error marks + gray text, values in <c:value>, clicks in <c:action>.
# Roles (ISL2): Leader > Admin > Mod > Member, plus Coop (temporary) and Visitor.

# Shown wherever the island has no custom name yet (<owner> = the owner's name).
default-name: "<owner>'s Island"

no-island: "<prefix><c:error><sym:cross></c:error> <c:text>You don't have an island yet. <click:run_command:'/is'><hover:show_text:'<c:text>Create your island'><c:action>[Create one]</c:action></hover></click>"

create:
  menu:
    crumb: "Create your island"
    shown:
      name: "<c:flame><bold>Your own island"
      lore:
        - "<c:text>A small meadow in the sky,"
        - "<c:text>all yours to build on."
        - ""
        - "<c:text>Start size: <c:value><size>x<size> chunks</c:value> <c:muted>(<blocks>x<blocks> blocks)"
    details:
      - "<c:text>Creates your <c:value>solo island</c:value> and"
      - "<c:text>takes you there. Free."
      - "<c:text>Border: <c:value><size>x<size></c:value> chunks, grows to <c:value><max>x<max></c:value>."
  started: "<prefix><c:muted><sym:time></c:muted> <c:text>Building your island, one moment..."
  # PORTALS (owner answer 159): the island portal at spawn creates the island without the confirm menu.
  portal-title:
    title: "<grad:phoenix><bold>Creating your island...</bold></grad>"
    subtitle: "<c:text>One moment"
    fade-in: 5
    stay: 40
    fade-out: 10
  # Phase P7: staff blocked joining/creating islands (coop-block punishment). <time> = time left.
  blocked: "<prefix><c:error><sym:cross></c:error> <c:text>Staff blocked you from creating or joining islands for <c:value><time></c:value>."
  blocked-perm: "<prefix><c:error><sym:cross></c:error> <c:text>Staff blocked you from creating or joining islands."
  busy: "<prefix><c:text>Your island is still being built. You'll be teleported when it's ready."
  already: "<prefix><c:error><sym:cross></c:error> <c:text>You already have an island. <click:run_command:'/is home'><hover:show_text:'<c:text>Go to your island'><c:action>[Go home]</c:action></hover></click>"
  cancelled: "<prefix><c:text>No island yet. <click:run_command:'/is'><hover:show_text:'<c:text>Create your island'><c:action>[Create one]</c:action></hover></click> <c:muted>(when you're ready)"
  build-failed: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't build your island. Try <c:value>/is</c:value> again soon, or tell staff."
  title:
    title: "<grad:phoenix><bold>YOUR ISLAND</bold></grad>"
    subtitle: "<c:text>Rise from the ashes"
    fade-in: 10
    stay: 60
    fade-out: 20
  welcome: "<prefix><c:success><sym:check></c:success> <c:text>Welcome to your island! Your starter chest is right in front of you."
  objective: "<c:ember><sym:bullet></c:ember> <c:text>Next: <c:value>Open your starter chest</c:value> <c:muted>· then</c:muted> <click:run_command:'/menu'><hover:show_text:'<c:text>Open the menu'><c:action>[Menu]</c:action></hover></click>"

home:
  destination: "your island"
  arrived: "<c:ember><sym:bullet></c:ember> <c:text>Welcome home"
  moved-safe: "<prefix><c:warning><sym:cross></c:warning> <c:text>Your home wasn't safe, so you're at the nearest safe spot. Set a new one with <c:value>/is sethome</c:value>."
  rescued: "<prefix><c:warning><sym:cross></c:warning> <c:text>No safe spot was left, so a block was placed under your home."
  rebuilding: "<prefix><c:text>Your island wasn't finished last time. Building it now..."

sethome:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Island home set here."
  not-allowed: "<prefix><c:error><sym:cross></c:error> <c:text>Only the Leader, Admins and Mods can move the home."
  outside: "<prefix><c:error><sym:cross></c:error> <c:text>Stand inside your island's border to set the home."
  height: "<prefix><c:error><sym:cross></c:error> <c:text>The home must be between <c:value>Y <min></c:value> and <c:value>Y <max></c:value>."
  unsafe: "<prefix><c:error><sym:cross></c:error> <c:text>Not safe here. Stand on solid ground with room above, away from water and lava."

# Protection (action bar, at most one message per protection.message-cooldown-ms). <action> = one of the actions below.
protection:
  own-profile: "<c:error><sym:cross></c:error> <c:text>This island belongs to your other profile. You can't do anything here."
  visitor: "<c:error><sym:cross></c:error> <c:text>You're visiting: you can't <action> here."
  role: "<c:error><sym:cross></c:error> <c:text>Your island role can't <action>."
  outside: "<c:error><sym:cross></c:error> <c:text>You can only build inside an island's border."
  height: "<c:error><sym:cross></c:error> <c:text>You can only build between <c:value>Y <min></c:value> and <c:value>Y <max></c:value>."
  pvp: "<c:error><sym:cross></c:error> <c:text>PvP is off on islands."
  portal: "<c:error><sym:cross></c:error> <c:text>Portals don't work on islands."
  border: "<c:error><sym:cross></c:error> <c:text>That's the edge of the island."
  actions:
    break: "break blocks"
    place: "place blocks"
    interact: "use doors, buttons and levers"
    containers: "open containers"
    redstone: "change redstone"
    animals: "touch animals"
    villagers: "trade with villagers"
    pickup: "pick up items"
    drop: "drop items"
    armor-stands: "use armor stands and item frames"
    vehicles: "use boats and minecarts"
    fire: "light fires"
    ender-pearls: "teleport here"
    spawners: "change spawners"
    hurt-monsters: "hurt monsters"
    settings: "change the island settings"
    notes-read: "read the island notes"
    notes-write: "add notes, tick them and change their own"
    notes-manage: "change, pin and delete anyone's notes"
    bank-deposit: "put money in the island bank"
    bank-withdraw: "take money out of the island bank"
    bank-history: "see the island bank history"

bypass:
  "on": "<prefix><c:warning><sym:cross></c:warning> <c:text>Island bypass <c:value>on</c:value>: you can build and open everything on every island. <c:muted>(logged, /is bypass to stop)"
  "off": "<prefix><c:success><sym:check></c:success> <c:text>Island bypass <c:value>off</c:value>."

void:
  rescued: "<c:ember><sym:bullet></c:ember> <c:text>Caught you! Back on solid ground."

starter:
  # The 4 lines of the starter island's sign (Bedrock-safe, max ~15 characters each).
  sign:
    - ""
    - "<c:ember>Open"
    - "<c:brand><bold>/menu"
    - ""

placeholder:
  level-none: "-"

error:
  island-gone: "<prefix><c:error><sym:cross></c:error> <c:text>That island doesn't exist anymore."
  database: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't load or save the island data. Try again soon."
  world: "<prefix><c:error><sym:cross></c:error> <c:text>The island world <c:value><world></c:value> isn't loaded. Tell staff."

# ---------------------------------------------------------------- M2.3 members and roles
# Role names (also used in the permission matrix rows).
role:
  leader: "Leader"
  admin: "Admin"
  mod: "Mod"
  member: "Member"
  coop: "Coop"
  visitor: "Visitor"
  leader-only: "<prefix><c:error><sym:cross></c:error> <c:text>Only the island Leader can do that."
  admin-only: "<prefix><c:error><sym:cross></c:error> <c:text>Only the Leader and Admins can change roles."

menu:
  crumb: "Island"
  # M2.5 island menu (/is with an island)
  info:
    - "<c:text>Everything about your island."
    - "<c:text>Click a button to open it."
    - "<c:muted>Gray buttons come later."
  island:
    name: "<c:flame><bold><island>"
    lore:
      - "<c:text>Your role: <c:value><role>"
      - "<c:text>Leader: <c:value><leader>"
      - "<c:text>Type: <c:value><type>"
      - "<c:text>Members: <c:value><members>/<slots>"
      - "<c:text>Size: <c:value><size>x<size></c:value> <c:muted>blocks"
      - "<c:text>Warps: <c:value><warps>/<warp-slots>"
      - "<c:text>Level: <c:value><level>"
      - "<c:text>Created: <c:value><created>"
    locked:
      - "<c:error><sym:cross> Locked"
    open:
      - "<c:success><sym:check> Open to visitors"
    solo: "Solo island"
    team: "Team island"
  home:
    name: "<c:flame><bold>Home"
    lore:
      - "<c:text>Go to your island home."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to teleport"
  members:
    name: "<c:flame><bold>Members"
    lore:
      - "<c:text>Members: <c:value><members>/<slots>"
      - "<c:text>Coop: <c:value><coops>"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
  permissions:
    name: "<c:flame><bold>Permissions"
    lore-edit:
      - "<c:text>What each role may do."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to change"
    lore-view:
      - "<c:text>What each role may do."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to look"
  warps:
    name: "<c:flame><bold>Warps"
    lore:
      - "<c:text>Your island warps: <c:value><warps>/<slots>"
      - "<c:muted>Set one with /is setwarp shop"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
  visitors:
    name: "<c:flame><bold>Visitors"
    lore-open:
      - "<c:success><sym:check> Open to visitors"
      - "<c:text>Visitors here now: <c:value><visitors>"
      - "<c:text>Banned players: <c:value><bans>"
    lore-locked:
      - "<c:error><sym:cross> Locked: members only"
      - "<c:text>Visitors here now: <c:value><visitors>"
      - "<c:text>Banned players: <c:value><bans>"
    click-lock:
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to lock"
    click-unlock:
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to unlock"
    click-view:
      - "<c:muted>The Leader, Admins and Mods can lock it."
  settings:
    name: "<c:flame><bold>Settings"
    lore-edit:
      - "<c:text>Spawning, fire, weather, time"
      - "<c:text>and more for your island."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to change"
    lore-view:
      - "<c:text>Spawning, fire, weather, time"
      - "<c:text>and more for your island."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to look"
  invites:
    name: "<c:flame><bold>Invites"
    lore:
      - "<c:text>Open invites: <c:value><count>"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
  notes:
    name: "<c:flame><bold>Island notes"
    lore:
      - "<c:text>Your island's shared to-do list."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
    lore-locked:
      - "<c:text>Your island's shared to-do list."
      - "<c:muted>Your role can't read the notes."
  chat:
    name-off: "<c:flame><bold>Island chat</bold></c:flame> <c:muted>· off"
    name-on: "<c:success><bold>Island chat</bold></c:success> <c:muted>· on"
    lore-off:
      - "<c:text>Your chat goes to everyone."
      - "<c:muted>One message: /is chat hi"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to talk to your island"
    lore-on:
      - "<c:text>Your chat goes to your island."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to talk to everyone again"
  chat-colors:
    name: "<c:flame><bold>Chat colors"
    lore-edit:
      - "<c:text>Pick a color for each role"
      - "<c:text>in island chat."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
    lore-view:
      - "<c:text>The color of each role"
      - "<c:text>in island chat. <c:muted>(the Leader picks)"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to look"
  visit:
    name: "<c:flame><bold>Visit islands"
    lore:
      - "<c:text>Browse other islands and warps."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
  stats:
    name: "<c:flame><bold>Island stats"
    lore:
      - "<c:text>Blocks, crops, mobs, playtime and"
      - "<c:text>more: today, this week and all time."
      - "<c:text>See what every member added."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
  stats-off:
    name: "<c:muted>Island stats"
    lore:
      - "<c:muted>Not available right now"
  bank:
    name: "<c:value>Island bank"
    lore:
      - "<c:text>Shared money of the island."
      - "<c:text>Earns interest every 8 hours."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
  bank-off:
    name: "<c:muted>Island bank"
    lore:
      - "<c:muted>Not available right now"
  upgrades:
    name: "<c:muted>Upgrades"
    lore:
      - "<c:muted>Coming soon"
  disband:
    name: "<c:error><bold>Disband island"
    lore:
      - "<c:text>Delete your island for good."
      - "<c:muted>Only when nobody else is on it."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to disband"
  leave:
    name: "<c:error><bold>Leave island"
    lore:
      - "<c:text>Leave this island."
      - "<c:muted>You confirm first."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to leave"

# ---------------------------------------------------------------- M2.5 island chat (/is chat)
chat:
  toggle-on: "<prefix><c:success><sym:check></c:success> <c:text>Island chat <c:value>on</c:value>. Your chat goes to your island. <click:run_command:'/is chat'><hover:show_text:'<c:text>Talk to everyone again'><c:action>[Off]</c:action></hover></click>"
  toggle-off: "<prefix><c:success><sym:check></c:success> <c:text>Island chat <c:value>off</c:value>. Your chat goes to everyone."
  toggle-off-profile: "<prefix><c:text>Island chat <c:value>off</c:value>: you switched profile."
  off-no-island: "<prefix><c:error><sym:cross></c:error> <c:text>You're not on an island anymore. Island chat is off."
  muted: "<prefix><c:error><sym:cross></c:error> <c:text>You're muted. See <c:value>/mypunishments</c:value>."
  filtered: "<prefix><c:error><sym:cross></c:error> <c:text>Blocked by the chat filter."
  # One island chat line for members. Parts: <role> <name> (in the role color), <message>, <island>.
  line: "<c:ember>[Island]</c:ember> <role> <name> <c:muted>»</c:muted> <c:text><message>"
  # The copy staff spies (and the console) see.
  spy-line: "<c:muted>[Spy] [<island>]</c:muted> <role> <name> <c:muted>»</c:muted> <c:text><message>"
  colors:
    crumb: "Chat colors"
    info:
      - "<c:text>The color of each role in island chat."
      - "<c:text>The Leader clicks a role to change it."
    summary:
      name: "<c:flame><bold>Island chat colors"
      lore-edit:
        - "<c:text>Click a role for the next color."
        - "<c:muted><count> colors to pick from."
      lore-view:
        - "<c:text>You can look, not change."
        - "<c:muted>The Leader picks the colors."
    role:
      name: "<role>"
      lore:
        - "<c:text>Color: <c:value><color>"
      click:
        - "<bold><c:action>» CLICK</c:action></bold> <c:text>for <next>"
      locked:
        - "<c:muted>Only the Leader can change it."
    changed: "<prefix><c:success><sym:check></c:success> <c:text>Chat color changed: <role>"
    leader-only: "<prefix><c:error><sym:cross></c:error> <c:text>Only the island Leader can change chat colors."
    no-palette: "<prefix><c:error><sym:cross></c:error> <c:text>No chat colors are set up. Tell staff."

# ---------------------------------------------------------------- M2.5 /is info [player]
info:
  body:
    - "<c:ember>» <c:value><island></c:value> <c:muted>(<type>, <state>)"
    - "<c:text>Leader: <c:value><leader>"
    - "<c:text>Members (<count>): <c:value><members>"
    - "<c:text>Size: <c:value><size>x<size></c:value> <c:text>· Level: <c:value><level></c:value> <c:text>· Warps: <c:value><warps>"
    - "<c:text>Created: <c:value><created></c:value> <c:text>· You: <c:value><role>"
  open: "open"
  locked: "locked"

member:
  busy: "<prefix><c:text>One moment, your last island action is still saving."
  not-found: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>isn't a member of your island."
  changed: "<prefix><c:error><sym:cross></c:error> <c:text>That member changed meanwhile. Check <click:run_command:'/is members'><hover:show_text:'<c:text>Open the member list'><c:action>[Members]</c:action></hover></click> <c:text>and try again."

invite:
  not-allowed: "<prefix><c:error><sym:cross></c:error> <c:text>Only the Leader, Admins and Mods can invite players."
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't invite yourself."
  # F1: the player turned "Island invites" off in /settings.
  disabled: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>doesn't accept island invites."
  own-profile: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value><c:text>'s other profile is on this island. Profiles can't share one."
  already-member: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is already on your island."
  has-island: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>already has an island. They must leave it first."
  full: "<prefix><c:error><sym:cross></c:error> <c:text>Your island is full (<c:value><slots></c:value> members). Member Slots upgrades come later."
  too-many: "<prefix><c:error><sym:cross></c:error> <c:text>Your island has <c:value><max></c:value> open invites. Wait until some are answered or expire."
  target-blocked: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>can't join islands at the moment."
  target-season-limit: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>already joined <c:value><max></c:value> islands this season, the max."
  sent: "<prefix><c:success><sym:check></c:success> <c:text>Invite sent to <c:value><player></c:value>. <c:muted>(expires in <time>)"
  now-team: "<prefix><c:warning><sym:star></c:warning> <c:text>Your island is now a <c:value>Team Island</c:value>. <c:muted>It's on the team leaderboard from now on."
  received: "<prefix><c:value><player></c:value> <c:text>invited you to <c:value><island></c:value>. <c:muted>(<members>/<slots> members)</c:muted><newline><click:run_command:'/is accept <from>'><hover:show_text:'<c:text>Join <island>'><c:action>[Accept]</c:action></hover></click> <click:run_command:'/is deny <from>'><hover:show_text:'<c:text>Decline the invite'><c:action>[Deny]</c:action></hover></click> <c:muted>(expires in <time>)"
  expired-inviter: "<prefix><c:muted>Your island invite to <player> expired."
  expired-target: "<prefix><c:muted>Your invite to <island> expired."
  solo:
    crumb: "Make it a Team Island?"
    shown:
      name: "<c:warning><bold>Invite <player>"
      lore:
        - "<c:text>Inviting makes your island a"
        - "<c:value>Team Island</c:value> <c:text>forever."
    details:
      - "<c:warning>Inviting makes your island a"
      - "<c:warning><bold>Team Island forever.</bold>"
      - "<c:text>Solo and team islands are on"
      - "<c:text>separate leaderboards."
      - ""
      - "<c:text>It stays a team island even if"
      - "<c:text>everyone leaves later."
      - "<c:muted>Want help without that? Use /is coop."
    cancelled: "<prefix><c:text>No invite sent. Your island stays <c:value>solo</c:value>. <c:muted>Tip:</c:muted> <click:suggest_command:'/is coop '><hover:show_text:'<c:text>Let a friend help without a team'><c:action>[Coop]</c:action></hover></click> <c:muted>lets a friend help without that."

# TUTORIAL TQ19: the island portal with pending invites (members.portal-invite-choice).
portal-choice:
  title: "Your island"
  create:
    name: "<c:flame><bold>Create my own island</bold>"
    lore: ["<c:text>A new solo island, just for you.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to create"]
  join:
    name: "<c:flame><bold>Join <island></bold>"
    lore: ["<c:text>You were invited to this island.", "<c:text>Members: <c:value><members>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to join"]

accept:
  none: "<prefix><c:error><sym:cross></c:error> <c:text>You have no island invites."
  none-from: "<prefix><c:error><sym:cross></c:error> <c:text>No invite from <c:value><player></c:value><c:text>'s island."
  has-island: "<prefix><c:error><sym:cross></c:error> <c:text>You already have an island. Leave it first."
  own-profile: "<prefix><c:error><sym:cross></c:error> <c:text>One of your other profiles is (or was) on this island. Profiles can't share one."
  expired: "<prefix><c:error><sym:cross></c:error> <c:text>That invite expired. Ask for a new one."
  full: "<prefix><c:error><sym:cross></c:error> <c:text>That island is full (<c:value><slots></c:value> members)."
  blocked: "<prefix><c:error><sym:cross></c:error> <c:text>You can't join islands at the moment."
  season-limit: "<prefix><c:error><sym:cross></c:error> <c:text>You already joined <c:value><max></c:value> islands this season, the max."
  joined: "<prefix><c:success><sym:check></c:success> <c:text>You joined <c:value><island></c:value>! <click:run_command:'/is home'><hover:show_text:'<c:text>Go to the island'><c:action>[Go there]</c:action></hover></click> <click:run_command:'/is members'><hover:show_text:'<c:text>See the members'><c:action>[Members]</c:action></hover></click>"
  title:
    title: "<grad:phoenix><bold>NEW ISLAND</bold></grad>"
    subtitle: "<c:text>Welcome to <c:value><island>"
    fade-in: 10
    stay: 50
    fade-out: 20

deny:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Declined the invite to <c:value><island></c:value>."
  notify: "<prefix><c:muted><player> declined your island invite."

kick:
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't kick yourself. Use <c:value>/is leave</c:value>."
  not-allowed: "<prefix><c:error><sym:cross></c:error> <c:text>You can't kick <c:value><player></c:value>. <c:muted>You can only kick lower roles."
  crumb: "Kick member"
  shown:
    name: "<c:error><bold>Kick <player>"
    lore:
      - "<c:text>Removes <c:value><player></c:value> from your island."
  details:
    - "<c:text><c:value><player></c:value> is removed from your island"
    - "<c:text>and sent to spawn if they're on it."
    - "<c:text>XP they earned stays with the island."
    - "<c:muted>Staff keep a backup of what they had."
  done: "<prefix><c:success><sym:check></c:success> <c:text>Removed <c:value><player></c:value> from your island."
  you: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>removed you from <c:value><island></c:value>."
  you-reason: "<prefix><c:error><sym:cross></c:error> <c:text>You were removed from <c:value><island></c:value>. Reason: <c:value><reason>"

leave:
  leader: "<prefix><c:error><sym:cross></c:error> <c:text>The Leader can't leave. Hand the island over first: <click:suggest_command:'/is transfer '><hover:show_text:'<c:text>Pick a new Leader'><c:action>[Transfer]</c:action></hover></click>"
  crumb: "Leave island"
  shown:
    name: "<c:error><bold>Leave <island>"
    lore:
      - "<c:text>You stop being a member."
  details:
    - "<c:text>You leave <c:value><island></c:value>."
    - "<c:text>XP you earned stays with the island."
    - "<c:text>You can join or create another island right away."
  done-free: "<prefix><c:success><sym:check></c:success> <c:text>You left <c:value><island></c:value>. <c:muted>Join another island now, or</c:muted> <click:run_command:'/is'><hover:show_text:'<c:text>Create your own island'><c:action>[Create one]</c:action></hover></click>"

promote:
  not-possible: "<prefix><c:error><sym:cross></c:error> <c:text>You can't promote <c:value><player></c:value>. <c:muted>The Leader promotes Members to Mod and Mods to Admin; Admins promote Members to Mod."
  done: "<prefix><c:success><sym:check></c:success> <c:value><player></c:value> <c:text>is now a <c:value><role></c:value>."
  you: "<prefix><c:success><sym:star></c:success> <c:text>You're now a <c:value><role></c:value> on your island. <c:muted>(by <player>)"

demote:
  not-possible: "<prefix><c:error><sym:cross></c:error> <c:text>You can't demote <c:value><player></c:value>. <c:muted>The Leader demotes Admins and Mods; Admins demote Mods."
  done: "<prefix><c:success><sym:check></c:success> <c:value><player></c:value> <c:text>is now a <c:value><role></c:value>."
  you: "<prefix><c:text>You're now a <c:value><role></c:value> on your island. <c:muted>(by <player>)"

transfer:
  not-possible: "<prefix><c:error><sym:cross></c:error> <c:text>You can only hand the island to one of its members."
  crumb: "Transfer island"
  shown:
    name: "<c:warning><bold>Make <player> the Leader"
    lore:
      - "<c:text>Step 1 of 2"
  details:
    - "<c:value><player></c:value> <c:text>becomes the island Leader."
    - "<c:text>You become an <c:value>Admin</c:value>."
    - "<c:muted>One more confirmation follows."
  final:
    crumb: "Are you really sure?"
    shown:
      name: "<c:error><bold>Final step: <player> leads"
      lore:
        - "<c:text>Step 2 of 2"
    details:
      - "<c:error>This can't be undone by you."
      - "<c:text>Only <c:value><player></c:value> <c:text>can give it back."
  done: "<prefix><c:success><sym:check></c:success> <c:value><player></c:value> <c:text>is now the island Leader. You're an <c:value>Admin</c:value>."
  you: "<prefix><c:success><sym:star></c:success> <c:text>You're now the Leader of <c:value><island></c:value>. <c:muted>(from <player>)"
  title:
    title: "<grad:phoenix><bold>ISLAND LEADER</bold></grad>"
    subtitle: "<c:text>The island is yours now"
    fade-in: 10
    stay: 50
    fade-out: 20

coop:
  not-allowed: "<prefix><c:error><sym:cross></c:error> <c:text>Only the Leader, Admins and Mods can coop players."
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't coop yourself."
  own-profile: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value><c:text>'s other profile is on this island, so they can't be coop."
  member: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is already a member of your island."
  already: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is already coop on your island."
  full: "<prefix><c:error><sym:cross></c:error> <c:text>Your island already has <c:value><max></c:value> coop players."
  blocked: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>can't be coop at the moment."
  not-coop: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>isn't coop on your island."
  done: "<prefix><c:success><sym:check></c:success> <c:value><player></c:value> <c:text>is coop while the Leader, an Admin or a Mod is online. <c:muted>(no XP, no bank)"
  you: "<prefix><c:success><sym:star></c:success> <c:value><player></c:value> <c:text>made you coop on <c:value><island></c:value>. You can help build while its Leader, an Admin or a Mod is online."
  removed: "<prefix><c:success><sym:check></c:success> <c:value><player></c:value> <c:text>is no longer coop on your island."
  you-removed: "<prefix><c:text>You're no longer coop on <c:value><island></c:value>."
  you-removed-reason: "<prefix><c:text>You're no longer coop on <c:value><island></c:value>. Reason: <c:value><reason>"
  ended: "<prefix><c:text>Your coop on <c:value><island></c:value> ended: its Leader, Admins and Mods went offline."

# Sent to the island's online members on every member change.
notify:
  invited: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>invited <c:value><target></c:value> to the island."
  joined: "<c:success><sym:bullet></c:success> <c:value><player></c:value> <c:text>joined the island! <c:muted>(<members>/<slots>)"
  left: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>left the island."
  kicked: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>was removed from the island <c:muted>(by <by>)</c:muted>."
  promoted: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>is now a <c:value><role></c:value> <c:muted>(by <by>)</c:muted>."
  demoted: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>is now a <c:value><role></c:value> <c:muted>(by <by>)</c:muted>."
  transferred: "<c:ember><sym:star></c:ember> <c:value><player></c:value> <c:text>is the new island Leader <c:muted>(from <by>)</c:muted>."
  cooped: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>is coop on the island <c:muted>(by <by>)</c:muted>."
  uncooped: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>is no longer coop on the island."
  still-team: "<prefix><c:text>Your island stays a Team Island with only you on it. <c:muted>(solo and team leaderboards stay apart)"
  # M2.4 visiting (arrival, departure and attempts are /settings toggles for each member)
  arrived: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>is visiting your island."
  departed: "<c:muted><sym:bullet> <player> left your island."
  attempt: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>tried to visit, but your island is locked. <click:run_command:'/is unlock'><hover:show_text:'<c:text>Open your island to visitors'><c:action>[Unlock]</c:action></hover></click>"
  locked: "<c:ember><sym:bullet></c:ember> <c:text>The island was locked <c:muted>(by <by>)</c:muted>."
  unlocked: "<c:ember><sym:bullet></c:ember> <c:text>The island is open to visitors again <c:muted>(by <by>)</c:muted>."
  expelled: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>was sent off the island <c:muted>(by <by>)</c:muted>."
  banned: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>was banned from the island <c:muted>(by <by>)</c:muted>."
  unbanned: "<c:ember><sym:bullet></c:ember> <c:value><player></c:value> <c:text>can visit the island again <c:muted>(by <by>)</c:muted>."
  liked: "<c:ember><sym:heart></c:ember> <c:value><player></c:value> <c:text>liked your island!"
  # ISL2
  setting: "<c:ember><sym:bullet></c:ember> <c:value><setting></c:value> <c:text>is now <c:value><value></c:value> <c:muted>(by <by>)</c:muted>."
  warp-gone: "<c:ember><sym:bullet></c:ember> <c:text>Warp <c:value><warp></c:value> was removed: its sign is gone."

members:
  crumb: "Members"
  notes:
    name: "<c:flame><bold>Island notes"
    lore:
      - "<c:text>Your island's shared to-do list."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
  info:
    - "<c:text>Everyone on your island and their role."
    - "<c:text>Click a head for actions."
    - "<c:muted>Leader > Admin > Mod > Member."
    - "<c:muted>Coop players only help while the"
    - "<c:muted>Leader, an Admin or a Mod is online."
  empty:
    name: "<c:muted>Nobody here"
    lore:
      - "<c:text>Invite friends with <c:value>/is invite"
  summary:
    name: "<c:flame><bold><island>"
    lore-solo:
      - "<c:text>Type: <c:value>Solo island"
      - "<c:text>Members: <c:value><members>/<slots>"
      - "<c:text>Coop: <c:value><coops>/<max-coops>"
      - ""
      - "<c:muted>Inviting someone makes it a Team Island."
    lore-team:
      - "<c:text>Type: <c:value>Team island"
      - "<c:text>Members: <c:value><members>/<slots></c:value> <c:muted>(up to <max-slots> with upgrades)"
      - "<c:text>Coop: <c:value><coops>/<max-coops>"
  entry:
    name: "<c:value><player></c:value> <c:muted>· <role>"
    name-leader: "<c:flame><sym:star></c:flame> <c:value><player></c:value> <c:muted>· <role>"
    role:
      - "<c:text>Role: <c:value><role>"
    joined:
      - "<c:text>Joined: <c:value><date>"
    invited-by:
      - "<c:text>Invited by: <c:value><inviter>"
    coop:
      - "<c:text>Temporary trust, no XP, no bank."
    online:
      - "<c:success>● Online"
    offline:
      - "<c:muted>● Offline"
    click:
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>for actions"
  invite:
    name: "<c:flame><bold>Invite a player"
    crumb: "Invite"
    lore:
      - "<c:text>Pick an online player without"
      - "<c:text>an island. Members: <c:value><members>/<slots>"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"
    lore-full:
      - "<c:error>Your island is full (<members>/<slots>)."
  invites:
    name: "<c:flame><bold>Invites"
    lore:
      - "<c:text>Invites you got and invites"
      - "<c:text>your island sent. Open: <c:value><count>"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
  settings:
    name: "<c:flame><bold>Island settings"
    lore:
      - "<c:text>Spawning, fire, explosions,"
      - "<c:text>weather, time and more."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
  permissions:
    name: "<c:flame><bold>Permissions"
    lore-edit:
      - "<c:text>What each role may do on your island."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to edit"
    lore-view:
      - "<c:text>What each role may do on your island."
      - "<c:muted>Only the Leader, Admins and Mods can change it."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to view"

actions:
  crumb: "<player>"
  head:
    name: "<c:value><player>"
    lore:
      - "<c:text>Role: <c:value><role>"
  gone:
    name: "<c:muted>No longer on the island"
    lore:
      - "<c:text>Go back and refresh."
  promote:
    name: "<c:success><bold>Promote to Mod"
    lore:
      - "<c:text>Mods invite, kick Members, coop"
      - "<c:text>players and move the home."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to promote"
  promote-admin:
    name: "<c:success><bold>Promote to Admin"
    lore:
      - "<c:text>Admins do everything Mods do,"
      - "<c:text>change Mod permissions, change the"
      - "<c:text>island settings and promote Members."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to promote"
  demote:
    name: "<c:warning><bold>Demote to Member"
    lore:
      - "<c:text><player> loses the Mod rights."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to demote"
  demote-admin:
    name: "<c:warning><bold>Demote to Mod"
    lore:
      - "<c:text><player> loses the Admin rights."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to demote"
  transfer:
    name: "<c:warning><bold>Make Leader"
    lore:
      - "<c:text>Hand the island to <c:value><player></c:value>."
      - "<c:text>You become an Admin. Two confirmations."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to continue"
  kick:
    name: "<c:error><bold>Kick"
    lore:
      - "<c:text>Remove <c:value><player></c:value> from the island."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to continue"
  uncoop:
    name: "<c:error><bold>End coop"
    lore:
      - "<c:text><player> can't build here anymore."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to end the coop"
  leave:
    name: "<c:error><bold>Leave the island"
    lore:
      - "<c:text>Stop being a member."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to continue"
  back:
    name: "<c:text>Back"
    lore:
      - "<c:muted>To the member list"

