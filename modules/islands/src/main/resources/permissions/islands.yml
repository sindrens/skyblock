# Permissions of the islands module. Registered when the module enables, removed when it disables.
# Format: the permissions section of a plugin.yml (description, default: true|false|op|not op; missing = op).
# LuckPerms grants for these nodes: server/permissions/islands.txt. Commands: docs/commands/islands.md.
skyblock.island:
  description: Use /is (create your island, home, go, sethome, invite, invites, accept, deny, kick, leave, promote, demote, transfer, coop, uncoop, members, settings, notes, chat, info, disband, visit, lock, unlock, expel, ban, unban, setwarp, delwarp, warp, rate, like)
  default: true
skyblock.island.stats:
  description: Use /is stats and the Stats button of the island menu (M2.6) - your island's stats and each member's part
  default: true
skyblock.island.fly:
  description: Island fly - fly inside any island's border (members always; visitors when that island's visitor-fly setting is on). Off when leaving the border, no fall damage on landing. The Wings mastery gives the same on its island later.
  default: false
skyblock.island.bypass:
  description: Staff - /is bypass and /isadmin bypass toggle ignoring island protection (build, containers, borders); every toggle is logged
  default: op
skyblock.island.notes.staff:
  description: Staff - /is notes <island> opens any island's notes read only (logged) and shows its deleted notes of the last notes.deleted-keep-days days (owner N7)
  default: op
skyblock.island.chat.spy:
  description: Staff - see every island's chat (M2.5) while the "Island chat spy" toggle in /settings is on (default off); island chat is always in the audit log
  default: op
skyblock.island.visit.bypass:
  description: Staff - enter locked islands and islands that banned you (teleports, /isadmin tp); can't be expelled; never counted as a visitor while vanished
  default: op
# M2.7 /isadmin: one node per sub-command (the root node only shows the command). Every use is logged (category staff).
skyblock.island.admin:
  description: Staff - see /isadmin (each sub-command needs its own node below)
  default: op
skyblock.island.admin.info:
  description: Staff - /isadmin info <island> shows owner, members, slot, size and home
  default: op
skyblock.island.admin.tp:
  description: Staff - /isadmin tp <island> teleports to an island home
  default: op
skyblock.island.admin.delete:
  description: Staff - /isadmin delete <island> removes an island for good (confirm); the slot is cleared and reused
  default: op
skyblock.island.admin.setsize:
  description: Staff - /isadmin setsize <island> <size> sets the border width in chunks
  default: op
skyblock.island.admin.addmember:
  description: Staff - /isadmin addmember <island> <player> adds a member without an invite (slots still apply)
  default: op
skyblock.island.admin.kick:
  description: Staff - /isadmin kick <player> removes a member or coop player from their island (confirm)
  default: op
skyblock.island.admin.setowner:
  description: Staff - /isadmin setowner <island> <member> makes a member the leader (confirm)
  default: op
skyblock.island.admin.reset:
  description: Staff - /isadmin reset <island> deletes an island and gives its leader a new one (confirm)
  default: op
skyblock.island.admin.restore:
  description: Staff - /isadmin restore <player> restores a kicked member from their kick backup (role, money, items; confirm)
  default: op
skyblock.island.admin.slots:
  description: Staff - /isadmin slots opens the grid overview (used, clearing, free slots)
  default: op
skyblock.island.admin.teleport-slot:
  description: Staff - /isadmin teleport-slot <id> teleports to a grid slot (also by clicking in /isadmin slots)
  default: op
# M2.6 island stats (/isadmin stats)
skyblock.island.admin.stats:
  description: Staff - /isadmin stats view <island> opens any island's stats menu read only (logged)
  default: op
skyblock.island.admin.stats.reset:
  description: Staff - /isadmin stats reset <island> deletes all stats of an island (confirm, logged)
  default: op
