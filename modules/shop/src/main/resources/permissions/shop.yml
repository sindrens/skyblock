# Permissions of the shop module. Registered when the module enables, removed when it disables.
# Format: the permissions section of a plugin.yml (description, default: true|false|op|not op; missing = op).
# LuckPerms grants for these nodes: server/permissions/shop.txt. Commands: docs/commands/shop.md.
skyblock.shop.use:
  description: Buy from the builder shop (/shop [category])
  default: true
skyblock.staff.economy.shop.view:
  description: Look up a shop item's price, block worth, state and the most /sell pays for it (/eco shop price; ECON-SELL-SHOP-AH B2)
  default: op
skyblock.staff.economy.shop.toggle:
  description: Switch a shop item off or on without editing shop.yml (/eco shop disable|enable <item> <reason>; logged as shop_item_toggle)
  default: op
  children:
    skyblock.staff.economy.shop.view: true
