# Builder shop (Shop v2, GUI-3; GUI-P3 categories, buy GUI and sell GUI): /shop [category]. MiniMessage + style tags (style.yml).
# Amount placeholders (<price>, <total>, <balance>, <after>) are plain text like $1,500; they are colored here.
# Item names (<item>) are the translated vanilla names (Java and Bedrock).
# Reload: /skyblock reload shop

error: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong. Nothing was taken; try again soon."
loading: "<prefix><c:error><sym:cross></c:error> <c:text>The shop is still loading. Try again in a moment."
frozen: "<prefix><c:error><sym:cross></c:error> <c:text>You can't shop while frozen."
staff-mode: "<prefix><c:error><sym:cross></c:error> <c:text>You can't shop in staff mode."
switching: "<prefix><c:error><sym:cross></c:error> <c:text>Wait until your profile switch is done."
unknown-category: "<prefix><c:error><sym:cross></c:error> <c:text>No shop category <c:value><input></c:value><c:text>. Try: <c:value><categories>"

skills:
  mining: "Mining"
  foraging: "Foraging"
  combat: "Combat"
  farming: "Farming"
  fishing: "Fishing"

# The name of a shop spawner (<mob> = the translated mob name).
spawner-name: "<mob> Spawner"

# Old tab label (tabs are gone since GUI-P3; kept for owner edits).
tab-name: "<c:flame><name>"
# Categories (ids from shop.yml): the category menu tiles and the grid title. Names are bold green (they are all Shop).
categories:
  wood:
    short: "WOOD"
    name: "<area:money><bold>Wood"
    lore: ["<c:text>Logs, stems and leaves of", "<c:text>every tree. Craft your planks."]
  stone-earth:
    short: "STONE & EARTH"
    name: "<area:money><bold>Stone & Earth"
    lore: ["<c:text>Dirt, sand, stone, deepslate", "<c:text>and cave blocks."]
  special:
    short: "SPECIAL"
    name: "<area:money><bold>Special Blocks"
    lore: ["<c:text>Nether, End, quartz, ocean", "<c:text>and rare blocks."]
  colors:
    short: "COLORS"
    name: "<area:money><bold>Colors"
    lore: ["<c:text>Concrete, stained glass and", "<c:text>terracotta in every colour."]
  decoration:
    short: "DECORATION"
    name: "<area:money><bold>Decoration"
    lore: ["<c:text>Lights, frames, flowers", "<c:text>and plants."]
  essentials:
    short: "ESSENTIALS"
    name: "<area:money><bold>Essentials"
    lore: ["<c:text>Torches, tools, buckets and", "<c:text>advanced workstations."]
  farming:
    short: "FARMING"
    name: "<area:money><bold>Farming"
    lore: ["<c:text>Seeds, saplings, plants, vines", "<c:text>and bone meal."]
  redstone:
    short: "REDSTONE"
    name: "<area:money><bold>Redstone"
    lore: ["<c:text>Pistons, hoppers, rails", "<c:text>and everything that ticks."]
  spawners:
    short: "SPAWNERS"
    name: "<area:money><bold>Spawners"
    lore: ["<c:text>Tier 1 to 4 spawners", "<c:text>for your island."]

# Group names of the shop grid (shop.yml categories.<tab>.groups.<group>), for /admin and docs only: the grid draws no
# captions (MENUS-V3 6.2). Items in no group form the last group "more".
groups:
  wood: { logs: "Logs", other: "Stems and bamboo", leaves: "Leaves", more: "More" }
  stone-earth: { soil: "Soil", sand: "Sand and gravel", stone: "Stone", deep: "Deepslate and caves", more: "More" }
  special: { nether: "Nether", end: "End and quartz", ocean: "Ocean", rare: "Rare blocks", more: "More" }
  colors: { concrete: "Concrete", extras: "Glass, terracotta and wool", glass: "Stained glass", terracotta: "Terracotta", more: "More" }
  decoration: { light: "Lights", display: "Display", greens: "Grass and ferns", nature: "Moss and azalea", flowers: "Flowers", more: "More" }
  essentials: { basics: "Basics", tools: "Tools and buckets", workstations: "Workstations", more: "More" }
  farming: { seeds: "Seeds", crops: "Crops", trees: "Saplings", plants: "Plants", lush: "Lush plants", nether: "Nether plants", more: "More" }
  redstone: { power: "Power", machines: "Machines", inputs: "Inputs", rails: "Rails", more: "More" }
  spawners: { tier1: "Tier 1", tier2: "Tier 2", tier3: "Tier 3", tier4: "Tier 4", more: "More" }

menu:
  title: "Shop"
  # Plaque noun (Java with the icon pack): cartoon capitals, A-Z 0-9 & ' - ! ? ( ) / . , :, at most 16 letters.
  # Slot 4 of the category menu and every grid is the framework wallet tile (messages/menus.yml wallet.money).
  short: "SHOP"
  empty:
    name: "<c:muted>Nothing here right now"
    lore: ["<c:text>Try another category."]
  spawners-off:
    name: "<c:muted>No spawners right now"
    lore: ["<c:text>Spawners are not sold", "<c:text>at the moment."]
  # The sell chest button (46 on the grid, 28 on the category menu): opens /sell.
  sell:
    name: "<area:money><bold>Sell chest"
    lore: ["<c:text>Put many items in and sell", "<c:text>them at live prices.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]

# The action line of a category tile.
category:
  action: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]

# Grid tile tooltips (GUI-P3, I9 section 12, MENUS-V3 6.4). LoreBuilder labels: {price}, {pct} are filled in. Java viewers
# get one muted hint; Bedrock viewers none.
tooltip:
  buy: "<bold><c:buy>| Buy Price: </c:buy><c:value>{price}</c:value></bold><c:muted> each</c:muted>"
  sell: "<bold><c:sell>| Sell Price: </c:sell><c:value>{price}</c:value></bold><c:muted> each</c:muted>"
  not-sellable: "<bold><c:sell>| Sell Price: </c:sell><c:error>Not sellable</c:error></bold>"
  falling: "<c:warning>Falling: -{pct}%</c:warning> <c:muted>from base price</c:muted>"
  rising: "<c:success>Rising: +{pct}%</c:success> <c:muted>from base price</c:muted>"
  hot: "<c:success>Hot item today: +{pct}%</c:success>"
  # ONE muted Java hint per tile (MENUS-V3 D6): hint-sell when the item sells, else hint-stack. Shift + Right-click and
  # middle click still sell every one you carry (taught in /help shop and by the sell GUI's Sell all button).
  hint-sell: "Right-click: sell"
  hint-stack: "Shift-click: buy a stack"
  action-input: "CLICK"
  action: "to buy"

entry:
  name: "<c:value><bold><item>"
  locked: "<c:error><sym:cross> Locked"
  requires: "<c:text>Needs <c:value><skill> <level></c:value><c:text>."
  # ECON-SPAWNERS step 13: a spawner tier unlocks per island by kills. <needed> <have> <what>
  spawner-unlock:
    - "<c:text>Unlock: kill <c:value><needed></c:value> <what>"
    - "<c:muted><have>/<needed>"
  # <what> when the unlock counts any mob of the previous tier. <tier>
  spawner-tier-mobs: "tier <tier> mobs"
  # <what> while the island's kill counts are still loading (a moment after joining).
  spawner-loading: "<c:muted>(loading...)"
  # The island holds the most spawners of this tier. <max>
  spawner-cap: "<c:text>This island holds <c:value><max></c:value> <c:text>of this tier"
  unavailable:
    - "<c:error><sym:cross> Not for sale right now"
    - "<c:muted>Staff are fixing it."

# Grid and buy page lore. These are LoreBuilder labels: plain text, no tags ({amount}, {percent}, {hours} are filled in).
# The formats (| Buy Price, | Sell Price, | Information, » ACTION) are in messages/items.yml (lore.*).
lore:
  info-title: "Information"
  stack: "Stack of {amount}"
  afford: "You can afford"
  next-works: "Next works at"
  percent: "{percent}%"
  payback: "Pays back in"
  never: "<c:error>never <sym:dot> Poor deal"
  # Owner F2 payback colors (these three are MiniMessage; {hours} is filled in). Thresholds: shop-settings.yml
  # spawners.payback-good-hours / payback-ok-hours.
  payback-good: "<c:success>about {hours} h"
  payback-ok: "<c:warning>about {hours} h"
  payback-poor: "<c:error>{hours} h <sym:dot> Poor deal"
  # ECON-SPAWNERS step 13 (plain labels; {item} {price} {owned} {cap} are filled in).
  spawner-drop: "Drops"
  spawner-drop-value: "{item}, ${price} each"
  spawner-island: "On your island"
  spawner-island-value: "{owned}/{cap}"
  spawner-no-cap: "no limit"
  action-input: "CLICK"
  action: "to choose an amount"

# The buy GUI (left click / tap on an item; 3 rows).
buy:
  short: "BUY"
  # Slot 19: switch to the sell GUI of the same item.
  switch-sell:
    name: "<area:money><bold>Sell"
    lore: ["<c:text>Sell this item instead.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
  item:
    name: "<c:value><bold><item>"
    room:
      - ""
      - "<c:text>Room for: <c:value><fits>"
    no-stack: ["<c:muted>Doesn't stack: one at a time."]
  quick:
    name: "<c:success><bold>Buy <amount>"
  fill:
    name: "<c:success><bold>Fill inventory"
  typed:
    name: "<c:warning><bold>Buy <amount>"
  fill-none:
    no-room:
      name: "<c:muted>Fill inventory"
      lore: ["<c:error><sym:cross> Your inventory is full."]
    too-expensive:
      name: "<c:muted>Fill inventory"
      lore: ["<c:error><sym:cross> You can't afford one."]
  type:
    name: "<c:value>Type an amount"
    lore:
      - "<c:text>Choose any amount"
      - "<c:text>(1 to <c:value><max></c:value><c:text>, 1.5k works)."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to type"
  button:
    lore:
      - "<c:text><amount> x <cur:money><price></cur:money> <c:text>= <cur:money><total></cur:money>"
      - ""
    ok: "<bold><c:action>» CLICK</c:action></bold> <c:text>to buy"
    partial:
      - "<c:warning>Only <fits> fit: you get and pay for <fits>."
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to buy"
    no-room:
      - "<c:error><sym:cross> Your inventory is full."
      - "<c:text>Make some room first."
    too-expensive:
      - "<c:error><sym:cross> You can't afford this."
      - "<c:muted>Balance: <balance>"
    # F14: the first click on a buy over half your money arms the button (orange).
    armed:
      - "<c:warning><sym:cross> That is <percent>% of your money"
      - "<c:text>Balance after: <cur:money><after></cur:money>"
      - "<bold><c:action>» CLICK AGAIN</c:action></bold> <c:text>to buy"
  picker-title: "Buy <item>"
  ask: "<prefix><c:text>Type how many to buy (1 to <c:value><max></c:value><c:text>) or <c:value><cancel></c:value><c:text>. <c:muted>(<seconds>s)"
  invalid: "<prefix><c:error><sym:cross></c:error> <c:text>That's not an amount from 1 to <c:value><max></c:value><c:text>."
  # Action bar after every purchase; the chat lines below only from feedback.chat-from (shop-settings.yml).
  bought-bar: "<c:success><sym:check></c:success> <c:value>+<amount> <item></c:value> <c:error>-<price></c:error> <c:muted>· <balance> left"
  partial-bar: "<c:warning><sym:check></c:warning> <c:text>Bought <c:value><amount></c:value> of <c:value><requested></c:value>: no more room <c:error>-<price>"
  bought: "<prefix><c:success><sym:check></c:success> <c:text>Bought <c:value><amount>x <item></c:value> <c:text>for <cur:money><price></cur:money><c:text>. Balance: <cur:money><balance></cur:money>"
  partial: "<prefix><c:warning><sym:check></c:warning> <c:text>Bought <c:value><amount></c:value> of <c:value><requested>x <item></c:value><c:text>: no more room. Paid only <cur:money><price></cur:money><c:text>."
  delivered-late: "<prefix><c:success><sym:check></c:success> <c:text>Here is your shop purchase: <c:value><amount>x <item></c:value><c:text>."
  waiting-no-room: "<prefix><c:warning><sym:cross></c:warning> <c:text>A shop purchase (<c:value><amount>x <item></c:value><c:text>) is waiting. Make room, then rejoin or switch profile."
  not-enough: "<prefix><c:error><sym:cross></c:error> <c:text>That costs <cur:money><price></cur:money><c:text>, you have <cur:money><balance></cur:money><c:text>. Buy fewer or sell items first."
  no-room: "<prefix><c:error><sym:cross></c:error> <c:text>Your inventory is full. Make some room first."
  bad-amount: "<prefix><c:error><sym:cross></c:error> <c:text>Pick an amount from 1 to <c:value><max></c:value><c:text>."
  busy: "<prefix><c:error><sym:cross></c:error> <c:text>Your last purchase is still going through."
  gone: "<prefix><c:error><sym:cross></c:error> <c:text>That item isn't for sale any more."
  price-changed: "<prefix><c:error><sym:cross></c:error> <c:text>The price just changed. Check it and try again."
  unavailable: "<prefix><c:error><sym:cross></c:error> <c:text>That item isn't for sale right now."
  locked: "<prefix><c:error><sym:cross></c:error> <c:text>You need <c:value><skill> <level></c:value> <c:text>to buy that."
  locked-click: "<prefix><c:error><sym:cross></c:error> <c:text>That item is locked. Its lore says what you need."
  # ECON-SPAWNERS step 13. <left> <what>; <max> <tier>
  spawner-locked: "<prefix><c:error><sym:cross></c:error> <c:text>Locked. Kill <c:value><left></c:value> <c:text>more <what> on this island."
  spawner-capped: "<prefix><c:error><sym:cross></c:error> <c:text>This island already holds <c:value><max></c:value> <c:text>tier <tier> spawners."

# The sell GUI (right click on an item, or Sell on the buy GUI; 3 rows). Sales use the /sell rules (prices, bonus,
# ledger). <item> item name, <carried> how many you carry, <total> money, <amount> button amount, <max> type limit.
sell:
  title: "Sell"
  short: "SELL"
  item:
    name: "<area:money><bold><item>"
    carry: "<c:bar>| </c:bar><c:text>You carry: <c:value><carried></c:value>"
    total: "<c:bar>| </c:bar><c:text>You get: <cur:money><total></cur:money>"
    bonus: "<c:muted>incl. your +<bonus>% sell bonus"
  button:
    sell:
      name: "<area:money><bold>Sell <amount>"
      lore: ["<c:text>You get <cur:money><total></cur:money>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to sell"]
    partial: ["<c:warning>You only carry <carried>: you sell <carried>.", "<c:text>You get <cur:money><total></cur:money>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to sell"]
    all:
      name: "<area:money><bold>Sell all <carried>"
      lore: ["<c:text>Every <c:value><item></c:value> <c:text>you carry.", "<c:text>You get <cur:money><total></cur:money>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to sell all"]
    none:
      name: "<c:muted>Sell <amount>"
      lore: ["<c:error><sym:cross> You don't carry any."]
    not-sellable:
      name: "<c:muted>Sell <amount>"
      lore: ["<c:error><sym:cross> Not sellable."]
    too-cheap:
      name: "<c:muted>Sell <amount>"
      lore: ["<c:error><sym:cross> Too little to sell (under $1)."]
    type:
      name: "<c:value>Type an amount"
      lore: ["<c:text>Sell any amount you carry", "<c:text>(1 to <c:value><max></c:value><c:text>).", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to type"]
  ask: "<prefix><c:text>Type how many to sell (1 to <c:value><max></c:value><c:text>) or <c:value><cancel></c:value><c:text>. <c:muted>(<seconds>s)"
  invalid: "<prefix><c:error><sym:cross></c:error> <c:text>That's not an amount from 1 to <c:value><max></c:value><c:text>."
  picker-title: "Sell <item>"
  none-carried: "<c:error><sym:cross></c:error> <c:text>You don't carry any <c:value><item></c:value><c:text>."

# Slot 19 of the sell GUI: back to buying the same item.
sell-switch-buy:
  name: "<area:money><bold>Buy"
  lore: ["<c:text>Buy this item instead.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]

# F14 big buys on a Java shift-click (the grid item can't turn orange, so the action bar says it).
big:
  armed-bar: "<c:warning><sym:cross></c:warning> <c:text>That is <c:value><percent>%</c:value> of your money (<after> left). <c:action>Shift-click again</c:action> <c:text>to buy."

# F14 Undo last buy (47 on the grid, 20 on the buy GUI, 29 on the category menu): clock with the seconds, gray dye when idle.
undo:
  idle:
    name: "<c:muted>Undo last buy"
    lore: ["<c:text>Nothing to undo."]
  ready:
    name: "<c:value><bold>Undo last buy"
    lore:
      - "<c:text><amount>x <item>"
      - "<c:text>Paid: <cur:money><price></cur:money>"
      - "<c:text>Time left: <c:value><seconds>s"
      - "<c:muted>All of it must still be"
      - "<c:muted>in your inventory."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to get <cur:money><price></cur:money> <c:text>back"
  done-bar: "<c:success><sym:check></c:success> <c:text>Undone: <c:value>-<amount> <item></c:value> <c:success>+<price>"
  nothing: "<prefix><c:error><sym:cross></c:error> <c:text>There's nothing to undo (it only works for <seconds> seconds)."
  "off": "<prefix><c:error><sym:cross></c:error> <c:text>Undo is off. Turn it on in <c:value>/settings</c:value><c:text>."
  other-profile: "<prefix><c:error><sym:cross></c:error> <c:text>That buy was on another profile, so it can't be undone."
  missing: "<prefix><c:error><sym:cross></c:error> <c:text>Undo needs all <c:value><amount>x <item></c:value> <c:text>back in your inventory."
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>Undo didn't go through, so your items are back. Nothing was lost."

# /settings toggles (F14).
settings:
  shop-undo:
    name: "<c:value>Shop: Undo last buy"
    lore: ["<c:text>Get your money back for a few", "<c:text>seconds while the items are still", "<c:text>in your inventory."]
  shop-big-buy:
    name: "<c:value>Shop: confirm big buys"
    lore: ["<c:text>Buys over half your money", "<c:text>need a second click."]
