# =====================================================================================================================
#  BUILDER SHOP PRICES (Shop v2, GUI-3)  -  DRAFT: THE OWNER APPROVES THESE PRICES BEFORE LAUNCH (docs/ECONOMY_BALANCE.md §12).
# =====================================================================================================================
# What /shop sells and for how much (money, whole units, price per ONE item). The shop is a money sink: nothing here can
# be sold back in the shop (selling is /sell). Design: docs/design/SHOP_DESIGN.md (9 tabs, ~253 items).
#
# Format:
#   categories.<tab>.icon: <item id>                 the tab's icon (row 0 of every shop page; names: messages/shop.yml)
#   categories.<tab>.items.<item id>: <price>        a vanilla item id and its price per item
#   ...items.<item id>: { price: 260, enabled: false }                 keep the price but stop selling it
#   ...items.<item id>: { price: 2400, contains: { redstone: 9 } }     what the item turns back into (crafting, breaking)
#   ...items.<item id>: { price: 120, requires: { farming: 10 } }      skill level needed to buy it (farming, mining ...)
#   categories.<tab>.kind: spawners                  a Spawners tab: item keys are mob types (pig, zombie ...) from
#                                                    stacking.yml spawners.tier-N, sold as stacked spawner items
# Tabs: at most 9, in file order (slots 0-8 of the top row). Item order in a tab = order in this file; 28 items fit a
# page. Items that are not real item ids are skipped with a console warning.
#
# THE ONE RULE (checked by a build test and again live, against the current /sell prices):
#   price > the most the item (and everything in "contains") can ever sell for with /sell
#         = sell.yml base x dynamic ceiling (150%) x Hot Item (+25%) x (1 + sell bonus cap 300%) = base x 7.5 by default.
#   Otherwise buying here and selling with /sell would print money. An item that breaks this rule is NOT sold (the
#   console and staff get a warning) until its price is raised.
#   That is why carrots, sugar cane, cactus, cocoa, sweet berries and redstone cost more than you might expect, and why
#   glowstone, sea lanterns, hay bales, slime blocks, storage blocks (coal/iron/lapis ...), cobwebs, pumpkins, melons,
#   nether wart, torchflower seeds and pitcher pods are not listed (they break into or grow 1:1 into sellable items).
#
# worth-only: items the shop no longer sells (Shop v2 removed them) whose last price still counts as their block worth
# for the island level and the trade value hint. Never shown in /shop. Edit freely.
#
# Default prices: the shop takes ~4% of what players earn (docs/ECONOMY_BALANCE.md §1.2 "Shop spend"); a stack of a
# common block costs about 3-8 minutes of first-hour income. New entries in a plugin update are added to this file
# automatically; to remove an item set enabled: false (a deleted entry comes back on the next update).
# config-version 2 = Shop v2. A version-1 file is migrated once on startup (backup: shop.yml.before-v2, every change in
# the console and in shop-migration-v2.log).
# Reload: /skyblock reload shop
