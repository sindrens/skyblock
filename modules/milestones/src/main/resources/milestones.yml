    category: dungeon-mobs
    action: kill_mob
    objective: {filter: {entity: "${target}", world: depths}}
    curve: mob
    for-each:
      ZOMBIE: {name: "Undead Hunter", icon: ZOMBIE_SPAWN_EGG}
