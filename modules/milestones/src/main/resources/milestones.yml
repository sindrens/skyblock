      IRON_GOLEM: {name: "Iron Golem Slayer", icon: IRON_GOLEM_SPAWN_EGG}
      WITHER_SKELETON: {name: "Wither Skeleton Slayer", icon: WITHER_SKELETON_SPAWN_EGG}
