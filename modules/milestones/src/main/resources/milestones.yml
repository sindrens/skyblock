      SHEEP: {name: "Sheep Slayer", icon: SHEEP_SPAWN_EGG}
      RABBIT: {name: "Rabbit Slayer", icon: RABBIT_SPAWN_EGG}
      ZOMBIE: {name: "Zombie Slayer", icon: ZOMBIE_SPAWN_EGG}
      SKELETON: {name: "Skeleton Slayer", icon: SKELETON_SPAWN_EGG}
      SPIDER: {name: "Spider Slayer", icon: SPIDER_SPAWN_EGG}
      CAVE_SPIDER: {name: "Cave Spider Slayer", icon: CAVE_SPIDER_SPAWN_EGG}
      SLIME: {name: "Slime Slayer", icon: SLIME_SPAWN_EGG}
      CREEPER: {name: "Creeper Slayer", icon: CREEPER_SPAWN_EGG}
      WITCH: {name: "Witch Slayer", icon: WITCH_SPAWN_EGG}
      DROWNED: {name: "Drowned Slayer", icon: DROWNED_SPAWN_EGG}
      HUSK: {name: "Husk Slayer", icon: HUSK_SPAWN_EGG}
      STRAY: {name: "Stray Slayer", icon: STRAY_SPAWN_EGG}
      BLAZE: {name: "Blaze Slayer", icon: BLAZE_SPAWN_EGG}
      ENDERMAN: {name: "Enderman Slayer", icon: ENDERMAN_SPAWN_EGG}
      GUARDIAN: {name: "Guardian Slayer", icon: GUARDIAN_SPAWN_EGG}
      HOGLIN: {name: "Hoglin Slayer", icon: HOGLIN_SPAWN_EGG}
