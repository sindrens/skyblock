# /help content: categories » topics » pages. MiniMessage + style tags (style.yml), Bedrock-safe symbols only.
# Category: icon, status (active | coming-soon), slot (inner slot of the 6-row menu), name, lore, topics, all-commands.
# Topic: icon, name, summary (2-3 lines), pages (3-6 short pages: title + lines), take-me-there (command run by the
#        "Take me there" button, without /), commands (command categories listed under "Commands"), aliases (other
#        ids for /help <id>; menus open these with their "?" button).
# Command lists are generated automatically from the commands each player may use; never list commands by hand.
# Reload: /skyblock reload menus

categories:
  getting-started:
    icon: nether_star
    status: active
    slot: 11
    name: "<c:flame><bold>Getting started"
    lore: ["<c:text>New here? Start with these."]
    topics: [welcome, tutorial, menu, help, settings, rules, npcs]
  islands:
    icon: grass_block
    status: active
    slot: 12
    name: "<c:flame><bold>Islands"
    lore: ["<c:text>Your own island in the sky:", "<c:text>build, grow and team up."]
    topics: [island, profiles, spawners]
  depths:
    icon: iron_pickaxe
    status: active
    slot: 13
    name: "<c:flame><bold>The Depths"
    lore: ["<c:text>Mine, chop and fight through", "<c:text>tiers for loot and crystals."]
    topics: [depths, satchel]
  economy:
    icon: emerald
    status: active
    slot: 14
    name: "<c:flame><bold>Economy"
    lore: ["<c:text>Money, the shop, selling, the", "<c:text>auction house and trading."]
    topics: [money, bank, shop, sell, notes, auction, trade, box]
  progression:
    icon: experience_bottle
    status: active
    slot: 15
    name: "<c:flame><bold>Progression"
    lore: ["<c:text>Island levels, upgrades,", "<c:text>skills and masteries."]
    topics: [skills, achievements]
  gear:
    icon: smithing_table
    status: active
    slot: 20
    name: "<c:flame><bold>Gear"
    lore: ["<c:text>Tools, the Forge, sets,", "<c:text>enchants and blueprints."]
    topics: [tools, enchants, wardrobe, loadout]
  combat-events:
    icon: clock
    status: coming-soon
    slot: 21
    name: "<c:flame><bold>Combat & Events"
    lore: ["<c:text>Bosses, KOTH, envoys and", "<c:text>seasonal events."]
    topics: []
  rewards:
    icon: tripwire_hook
    status: coming-soon
    slot: 22
    name: "<c:flame><bold>Rewards"
    lore: ["<c:text>Crates, quests, voting", "<c:text>and daily rewards."]
    topics: []
  community:
    icon: bell
    status: active
    slot: 23
    name: "<c:flame><bold>Community"
    lore: ["<c:text>Chat, messages, teleporting", "<c:text>and rank perks."]
    topics: [chat, teleporting, afk, tags, perks, links]
  faq:
    icon: lectern
    status: active
    slot: 24
    name: "<c:flame><bold>FAQ"
    lore: ["<c:text>Quick answers to the", "<c:text>questions we get most."]
    topics: [faq]
  commands:
    icon: command_block
    status: active
    slot: 31
    all-commands: true
    name: "<c:flame><bold>All commands"
    lore: ["<c:text>Every command you can use,", "<c:text>with examples. Click one to", "<c:text>put it in your chat."]
    topics: []

topics:
  welcome:
    icon: nether_star
    name: "<c:flame>Welcome to Phoenix Skyblock"
    summary: ["<c:text>What this server is and how", "<c:text>to find your way around."]
    take-me-there: "spawn"
    commands: [Info]
    pages:
      - title: "<c:value>Welcome"
        lines:
          - "<c:text>Phoenix Skyblock is part of the"
          - "<grad:skyborn>SkybornMC</grad> <c:text>network."
          - "<c:text>Rise from the ashes: build an island,"
          - "<c:text>grow it and climb the leaderboards."
      - title: "<c:value>Getting around"
        lines:
          - "<c:text>Everything is one click away in the"
          - "<c:text>main menu: <c:value>/menu</c:value> or the <c:flame>Nether Star</c:flame>"
          - "<c:text>in your last hotbar slot."
          - "<c:text>Back to spawn at any time: <c:value>/spawn</c:value>"
      - title: "<c:value>Need help?"
        lines:
          - "<c:text>Every menu has a <c:info>?</c:info> button that"
          - "<c:text>explains that screen."
          - "<c:text>Ask in chat or on Discord: <c:value>/discord</c:value>"
      - title: "<c:value>Play fair"
        lines:
          - "<c:text>Read the rules once: <c:value>/rules</c:value>"
          - "<c:text>Staff are here to help. Report problems"
          - "<c:text>to a staff member or on Discord."

  menu:
    icon: nether_star
    aliases: [menus, hub, gui, main-menu]
    name: "<c:flame>The main menu"
    summary: ["<c:text>Every feature in one place."]
    take-me-there: "menu"
    pages:
      - title: "<c:value>Opening it"
        lines:
          - "<c:text>Type <c:value>/menu</c:value> or click the <c:flame>Nether Star</c:flame>"
          - "<c:text>in hotbar slot 9."
          - "<c:text>Don't want the star? Turn it off in"
          - "<c:value>/settings</c:value> <c:muted>»</c:muted> <c:text>Display."
      - title: "<c:value>Coming soon"
        lines:
          - "<c:text>Features that aren't open yet are shown"
          - "<c:text>in gray with <c:muted>Coming soon</c:muted>."
          - "<c:text>They keep their place, so the menu"
          - "<c:text>never moves around on you."
      - title: "<c:value>Moving around menus"
        lines:
          - "<c:ember>«</c:ember> <c:text>Back (bottom left) returns to the"
          - "<c:text>previous screen. <c:error>✘</c:error> <c:text>closes the menu."
          - "<c:info>?</c:info> <c:text>explains the screen, the book opens help."
          - "<c:text>Items can never be taken out of a menu."

  help:
    icon: knowledge_book
    aliases: [guides, how-to]
    name: "<c:flame>Using help"
    summary: ["<c:text>How to find answers fast."]
    pages:
      - title: "<c:value>Help menu"
        lines:
          - "<c:value>/help</c:value> <c:text>opens the guides, sorted by"
          - "<c:text>category. Each topic has short pages,"
          - "<c:text>a <c:value>Take me there</c:value> button and its commands."
      - title: "<c:value>Help in chat"
        lines:
          - "<c:value>/help <topic></c:value> <c:text>opens one topic directly,"
          - "<c:text>for example <c:value>/help settings</c:value>."
          - "<c:text>Every topic has a <c:value>Show in chat</c:value> button."
      - title: "<c:value>All commands"
        lines:
          - "<c:value>/help commands</c:value> <c:text>lists every command you"
          - "<c:text>can use. Click one to put it in chat."

  settings:
    icon: comparator
    aliases: [options, prefs]
    name: "<c:flame>Your settings"
    summary: ["<c:text>Make the server work the way", "<c:text>you like it."]
    take-me-there: "settings"
    pages:
      - title: "<c:value>Changing a setting"
        lines:
          - "<c:text>Open <c:value>/settings</c:value> and click a switch:"
          - "<c:success>✔ green</c:success> <c:text>is on,</c:text> <c:error>✘ red</c:error> <c:text>is off."
          - "<c:text>Changes apply right away and are saved."
      - title: "<c:value>From chat"
        lines:
          - "<c:value>/settings <setting> on|off</c:value>"
          - "<c:text>Press Tab after <c:value>/settings</c:value> to see"
          - "<c:text>every setting you can change."
      - title: "<c:value>Coming soon"
        lines:
          - "<c:text>Gray switches belong to features that"
          - "<c:text>aren't open yet. They unlock by"
          - "<c:text>themselves when the feature arrives."

  depths:
    icon: iron_pickaxe
    aliases: [dungeon, tiers, tier]
    name: "<c:flame>The Depths"
    summary: ["<c:text>Tiered zones to mine, chop and", "<c:text>fight in. Skills open new tiers."]
    take-me-there: "dungeon"
    commands: [Depths]
    pages:
      - title: "<c:value>The wings"
        lines:
          - "<c:text>The Depths has three wings:"
          - "<pillar:mining>Mine</pillar:mining><c:text>, <pillar:foraging>Forest</pillar:foraging> <c:text>and <pillar:combat>Combat</pillar:combat><c:text>."
          - "<c:text>Each wing is a row of tiers, and"
          - "<c:text>every tier is its own zone."
      - title: "<c:value>Unlocking tiers"
        lines:
          - "<c:text>Tier 1 is open for everyone."
          - "<c:text>Higher tiers need a skill level:"
          - "<c:text>Mining for the Mine, Foraging for"
          - "<c:text>the Forest, Combat for Combat."
      - title: "<c:value>Locked gates"
        lines:
          - "<c:text>A locked tier shows bars in its"
          - "<c:text>gate, only for you. Your action"
          - "<c:text>bar says what it needs, e.g."
          - "<c:error>Mining 15 needed (9/15)"
      - title: "<c:value>Teleporting"
        lines:
          - "<c:value>/dungeon</c:value> <c:text>lists every tier. Click an"
          - "<c:text>open one to teleport there."
          - "<c:text>Locked ones show your progress."
          - "<c:text>Stand still for the countdown."

  satchel:
    icon: bundle
    aliases: [drops, drop, crystals, crystal, bag]
    name: "<c:flame>Satchel and drops"
    summary: ["<c:text>Depths drops land in your satchel.", "<c:text>Sell them, forge with them, or take them out."]
    take-me-there: "dungeon"
    commands: [Depths]
    pages:
      - title: "<c:value>Drops"
        lines:
          - "<c:text>Ore and logs you break in The"
          - "<c:text>Depths go straight into your"
          - "<c:text>satchel. Better tools give more."
          - "<c:text>Each profile has its own satchel."
      - title: "<c:value>Opening it"
        lines:
          - "<c:text>Open <c:value>/dungeon</c:value> <c:text>and click"
          - "<c:value>Satchel</c:value><c:text>. The scoreboard shows how"
          - "<c:text>full it is, e.g. Satchel 412 / 640."
      - title: "<c:value>Selling"
        lines:
          - "<c:value>Sell all</c:value> <c:text>sells everything at today's"
          - "<c:text>prices with your sell bonus. Click"
          - "<c:text>an item to sell only that one or"
          - "<c:text>to take it out into your inventory."
      - title: "<c:value>When it's full"
        lines:
          - "<c:text>A full satchel stops your mining"
          - "<c:text>(nothing is lost). Sell, or get"
          - "<c:text>more space from Mining and Foraging"
          - "<c:text>levels and the upgrades in the menu."
      - title: "<c:value>Crystals and the Forge"
        lines:
          - "<c:text>Blocks can drop crystals: they go"
          - "<c:text>to your balance every few seconds."
          - "<c:text>The Forge takes its materials from"
          - "<c:text>your inventory first, then the satchel."

  tools:
    icon: iron_pickaxe
    aliases: [tool, forge, blueprint, blueprints, skin, skins, starter, prestige]
    name: "<c:flame>Tools and the Forge"
    summary: ["<c:text>Custom tools that level up,", "<c:text>the Forge, blueprints and skins."]
    take-me-there: "forge"
    commands: [Tools]
    pages:
      - title: "<c:value>Starter kit"
        lines:
          - "<c:text>Open <c:value>/forge</c:value> <c:text>and click Starter kit"
          - "<c:text>for a free pickaxe, axe, hoe,"
          - "<c:text>sword and rod. Lost one? Claim"
          - "<c:text>the missing ones every 24 h."
      - title: "<c:value>Living tools"
        lines:
          - "<c:text>Custom tools never break and"
          - "<c:text>level up as you use them (1-50)."
          - "<c:text>Levels give speed and open perk"
          - "<c:text>slots at Lv 5, 15, 30 and 45."
      - title: "<c:value>The Forge"
        lines:
          - "<c:text>Forge the next tier with money"
          - "<c:text>and Depths materials. Your level,"
          - "<c:text>perks and stats stay. Tiers follow"
          - "<c:text>the Depths tiers of each wing."
      - title: "<c:value>Prestige"
        lines:
          - "<c:text>At Lv 50 a tool can prestige:"
          - "<c:text>back to Lv 1, keeps perks and"
          - "<c:text>stats, opens slot 5 and gets a"
          - "<c:text>star. Once per tool per season."
      - title: "<c:value>Blueprints and skins"
        lines:
          - "<c:text>Rare blueprints drop in The Depths."
          - "<c:text>Craft them at the Forge for a"
          - "<c:text>special tool. Skins change the"
          - "<c:text>look and stay with you forever."
      - title: "<c:value>Tips"
        lines:
          - "<c:text>Shift + right-click a tool (or"
          - "<c:value>/tool</c:value><c:text>) for its menu. Custom tools"
          - "<c:text>stay with you when you die."

  enchants:
    icon: enchanted_book
    aliases: [enchant, enchanter, enchanting, books, book, scroll, disenchant]
    name: "<c:flame>Enchants"
    summary: ["<c:text>Enchant books for your custom", "<c:text>tools, the Enchanter and rolls."]
    take-me-there: "enchanter"
    commands: [Enchants]
    pages:
      - title: "<c:value>Books"
        lines:
          - "<c:text>Enchant books drop in The Depths"
          - "<c:text>or come from Book shop rolls."
          - "<c:text>Each book is one enchant at one"
          - "<c:text>level. You can trade and sell them."
      - title: "<c:value>Applying"
        lines:
          - "<c:text>Open <c:value>/enchanter</c:value><c:text>, pick a tool,"
          - "<c:text>a free perk slot and a book. It"
          - "<c:text>costs crystals and never fails."
          - "<c:text>Higher tool levels allow more."
      - title: "<c:value>Upgrading"
        lines:
          - "<c:text>Raise an enchant with crystals,"
          - "<c:text>or combine two equal books into"
          - "<c:text>one book a level higher. A book"
          - "<c:text>on a tool enchant works too."
      - title: "<c:value>Removing"
        lines:
          - "<c:text>A Disenchant Scroll takes an"
          - "<c:text>enchant off as a book, so you can"
          - "<c:text>move it. Without one it shatters"
          - "<c:text>and you get some crystals back."
      - title: "<c:value>Rules"
        lines:
          - "<c:text>Some enchants conflict (one area"
          - "<c:text>enchant per tool). Mythics only"
          - "<c:text>fit the prestige slot. See the"
          - "<c:text>Enchant guide for every enchant."

  wardrobe:
    icon: leather_chestplate
    aliases: [sets, set, armor, wardrobe-chest, set-token, sigil, sigils, set-level, merge, tome]
    name: "<c:flame>Wardrobe"
    summary: ["<c:text>Armor sets with bonuses, the", "<c:text>Wardrobe Chest and Set Tokens."]
    take-me-there: "wardrobe"
    commands: [Wardrobe]
    pages:
      - title: "<c:value>Sets"
        lines:
          - "<c:text>Open <c:value>/wardrobe</c:value><c:text> to see every set."
          - "<c:text>Buy a set once with money,"
          - "<c:text>crystals or gems. It stays in"
          - "<c:text>your wardrobe on this profile."
      - title: "<c:value>Wearing"
        lines:
          - "<c:text>Open a set and click a piece,"
          - "<c:text>or Wear all. 2 pieces give a"
          - "<c:text>bonus, 4 pieces a second one."
          - "<c:text>Mix 2 + 2 of two sets too."
      - title: "<c:value>Locked armor"
        lines:
          - "<c:text>Worn pieces stay on: take them"
          - "<c:text>off in /wardrobe. You never lose"
          - "<c:text>a set, not even when you die."
      - title: "<c:value>Gem sets and tokens"
        lines:
          - "<c:text>A gem set is a Sigil: claim it"
          - "<c:text>free on each profile once a"
          - "<c:text>season. Crate sets come as"
          - "<c:text>tokens: right-click to redeem."
      - title: "<c:value>Wardrobe Chest"
        lines:
          - "<c:text>Keep tools, enchant books and"
          - "<c:text>tokens safe in the chest. Plain"
          - "<c:text>items don't fit."
      - title: "<c:value>Set levels"
        lines:
          - "<c:text>New sets start at Lv 0 (no"
          - "<c:text>bonus). Wear 2+ pieces while you"
          - "<c:text>do the set's activity to level"
          - "<c:text>it: Lv 25 = 1x, Lv 50 = 2x."
      - title: "<c:value>Merging"
        lines:
          - "<c:text>Two Lv 50 sets with different"
          - "<c:text>bonuses can merge into one set"
          - "<c:text>with both bonuses. It starts at"
          - "<c:text>Lv 0 again. Costs crystals."

  loadout:
    icon: armor_stand
    aliases: [loadouts, preset, presets, swap]
    name: "<c:flame>Loadouts"
    summary: ["<c:text>Swap sets and hotbar tools", "<c:text>in one click."]
    take-me-there: "loadout"
    commands: [Wardrobe]
    pages:
      - title: "<c:value>Saving"
        lines:
          - "<c:text>Open <c:value>/loadout</c:value><c:text> and click an empty"
          - "<c:text>place. It saves the sets you wear"
          - "<c:text>and the tools in your hotbar."
          - "<c:text>You get 2; ranks add more."
      - title: "<c:value>Swapping"
        lines:
          - "<c:text>Click a loadout, or type"
          - "<c:value>/loadout Mining</c:value><c:text>. Sets change and"
          - "<c:text>tools jump into their slots. Old"
          - "<c:text>tools go to the Wardrobe Chest."
      - title: "<c:value>Rules"
        lines:
          - "<c:text>Not in combat, not in the"
          - "<c:text>warzone, 2 s between swaps."
          - "<c:text>Nothing is ever dropped: a slot"
          - "<c:text>without room is skipped."

  skills:
    icon: experience_bottle
    aliases: [skill, mining, foraging, combat]
    name: "<c:flame>Skills"
    summary: ["<c:text>Level up Mining, Foraging and", "<c:text>Combat to open new tiers."]
    take-me-there: "skills"
    commands: [Progression]
    pages:
      - title: "<c:value>What skills are"
        lines:
          - "<c:text>You have five skills. <pillar:mining>Mining</pillar:mining><c:text>,"
          - "<pillar:foraging>Foraging</pillar:foraging> <c:text>and <pillar:combat>Combat</pillar:combat> <c:text>are open now;"
          - "<pillar:farming>Farming</pillar:farming> <c:text>and <pillar:fishing>Fishing</pillar:fishing> <c:text>come later."
          - "<c:text>Skills are yours alone and reset each season."
      - title: "<c:value>Earning XP"
        lines:
          - "<c:text>Mine ore and chop logs in The Depths,"
          - "<c:text>and defeat monsters yourself."
          - "<c:text>Higher tiers give much more XP."
          - "<c:text>Gains show above your hotbar."
      - title: "<c:value>Levels and unlocks"
        lines:
          - "<c:text>Each level needs a bit more XP."
          - "<c:text>Levels open new Depths tiers: see"
          - "<c:text>'Next unlock' in <c:value>/skills</c:value>."
          - "<c:text>Perks for skills arrive later."
      - title: "<c:value>Tips"
        lines:
          - "<c:text>Look at a friend's skills:"
          - "<c:value>/skills <player></c:value>"
          - "<c:text>Hide the XP line in <c:value>/settings</c:value>."

  rules:
    icon: lectern
    aliases: [rule, appeal, appeals, punishments]
    name: "<c:flame>Server rules"
    summary: ["<c:text>The short version, and where", "<c:text>to read the full rules."]
    take-me-there: "rules"
    pages:
      - title: "<c:value>Be respectful"
        lines:
          - "<c:text>No harassment, hate or spam."
          - "<c:text>Keep chat friendly for everyone."
      - title: "<c:value>Play fair"
        lines:
          - "<c:text>No cheats, hacked clients, x-ray or"
          - "<c:text>exploits. Found a bug? Report it."
      - title: "<c:value>The full rules"
        lines:
          - "<c:text>Read them all with <c:value>/rules</c:value>."
          - "<c:text>Not knowing a rule is never an excuse."
      - title: "<c:value>Punished? Your options"
        lines:
          - "<c:text>See your mute, warnings and history"
          - "<c:text>with <c:value>/mypunishments</c:value>."
          - "<c:text>Think it was a mistake? Send an"
          - "<c:text>appeal with <c:value>/appeal</c:value>."

  chat:
    icon: oak_sign
    aliases: [messages, msg, dm]
    name: "<c:flame>Chat & messages"
    summary: ["<c:text>Talking to everyone or to", "<c:text>one player privately."]
    commands: [Social]
    pages:
      - title: "<c:value>Private messages"
        lines:
          - "<c:value>/msg <player> <message></c:value> <c:text>sends a"
          - "<c:text>private message. Reply with <c:value>/r</c:value>."
      - title: "<c:value>Ignoring someone"
        lines:
          - "<c:value>/ignore <player></c:value> <c:text>hides their chat and"
          - "<c:text>messages. <c:value>/unignore</c:value> <c:text>undoes it."
      - title: "<c:value>Who's online"
        lines:
          - "<c:value>/list</c:value> <c:text>shows everyone online by rank."
          - "<c:value>/ping</c:value> <c:text>shows your connection."
          - "<c:value>/seen</c:value> <c:text>and</c:text> <c:value>/playtime</c:value> <c:text>show activity."

  teleporting:
    icon: ender_pearl
    aliases: [tpa, teleport, tp]
    name: "<c:flame>Teleporting"
    summary: ["<c:text>Getting to spawn and to", "<c:text>your friends."]
    take-me-there: "spawn"
    commands: [Teleport]
    pages:
      - title: "<c:value>Spawn"
        lines:
          - "<c:value>/spawn</c:value> <c:text>takes you back to spawn."
      - title: "<c:value>Teleport requests"
        lines:
          - "<c:value>/tpa <player></c:value> <c:text>asks to teleport to them."
          - "<c:value>/tpahere <player></c:value> <c:text>asks them to come"
          - "<c:text>to you."
      - title: "<c:value>Answering a request"
        lines:
          - "<c:value>/tpaccept</c:value> <c:text>or</c:text> <c:value>/tpdeny</c:value><c:text>, or click the buttons"
          - "<c:text>in chat. <c:value>/tpcancel</c:value> <c:text>cancels your own."

  afk:
    icon: red_bed
    aliases: [away]
    name: "<c:flame>Being away"
    summary: ["<c:text>Let others know you're", "<c:text>not at your keyboard."]
    commands: [Social]
    pages:
      - title: "<c:value>Going AFK"
        lines:
          - "<c:value>/afk</c:value> <c:text>marks you as away. Moving or"
          - "<c:text>chatting marks you as back."
      - title: "<c:value>Automatically"
        lines:
          - "<c:text>If you don't move for a while you're"
          - "<c:text>marked as away by yourself."
      - title: "<c:value>AFK pool"
        lines:
          - "<c:text>Stand in the <c:value>AFK pool</c:value> <c:text>at spawn,"
          - "<c:text>no need to move. Every 15 minutes:"
          - "<c:text>a little money and island fuel. Keys"
          - "<c:text>at 1 h, 3 h, 6 h and 8 h a day; the"
          - "<c:text>longer you stay, the bigger the reward."
          - "<c:text>Max 8 h a day, one account per connection."

  npcs:
    icon: armor_stand
    aliases: [npc, holograms, hologram, leaderboards, leaderboard]
    name: "<c:flame>NPCs and boards"
    summary: ["<c:text>The people and signs at spawn", "<c:text>and in the Depths."]
    take-me-there: "spawn"
    pages:
      - title: "<c:value>NPCs"
        lines:
          - "<c:text>Right-click an NPC to open what it"
          - "<c:text>does: the Banker opens the bank, the"
          - "<c:text>Blacksmith the Forge."
          - "<c:text>Sneak + right-click: a short help."
      - title: "<c:value>Help NPCs"
        lines:
          - "<c:text>NPCs that say <c:muted>Right-click for help</c:muted>"
          - "<c:text>explain a place or a feature."
          - "<c:text>On Java, click <c:action>[Open]</c:action> <c:text>in chat."
      - title: "<c:value>Boards"
        lines:
          - "<c:text>Some boards explain more when you"
          - "<c:text>right-click them."
          - "<c:text>Leaderboards in the Hall of Heroes"
          - "<c:text>update every few minutes."

  perks:
    icon: diamond
    aliases: [ranks, rank-perks, donator]
    name: "<c:flame>Rank perks"
    summary: ["<c:text>Handy commands that come", "<c:text>with ranks."]
    take-me-there: "store"
    commands: [Perks]
    pages:
      - title: "<c:value>What you get"
        lines:
          - "<c:value>/craft</c:value> <c:text>crafting table anywhere,"
          - "<c:value>/ec</c:value> <c:text>your ender chest anywhere,"
          - "<c:value>/hat</c:value> <c:text>wear any block,"
          - "<c:value>/nick</c:value> <c:text>a nickname."
      - title: "<c:value>Nicknames"
        lines:
          - "<c:text>Letters, numbers and _ only, 3-16 long."
          - "<c:text>Higher ranks can add colors."
          - "<c:value>/nick off</c:value> <c:text>removes it."
      - title: "<c:value>Getting a rank"
        lines:
          - "<c:text>Ranks are available in the store:"
          - "<c:value>/store</c:value><c:text>. Every purchase supports the server."
          - "<c:text>Free: play 30 min, then</c:text> <c:value>/freerank</c:value><c:text>."

  links:
    icon: bell
    aliases: [discord, store, vote, website]
    name: "<c:flame>Discord, store & voting"
    summary: ["<c:text>Our community outside the game."]
    take-me-there: "discord"
    pages:
      - title: "<c:value>Discord"
        lines:
          - "<c:value>/discord</c:value> <c:text>for news, sneak peeks,"
          - "<c:text>support and giveaways."
      - title: "<c:value>Voting"
        lines:
          - "<c:value>/vote</c:value> <c:text>helps new players find us"
          - "<c:text>and gives you rewards."
      - title: "<c:value>Store & website"
        lines:
          - "<c:value>/store</c:value> <c:text>for ranks and cosmetics,"
          - "<c:value>/website</c:value> <c:text>for everything else."

  achievements:
    icon: knowledge_book
    aliases: [achievement, secrets]
    name: "<c:flame>Achievements"
    summary: ["<c:text>Goals for everything you do,", "<c:text>with titles as rewards."]
    take-me-there: "tags"
    pages:
      - title: "<c:value>What they are"
        lines:
          - "<c:text>Achievements count what you do:"
          - "<c:text>skills, island work, selling, trades,"
          - "<c:text>tools, sets, visits and playtime."
          - "<c:text>Most have tiers (I, II, III ...)."
      - title: "<c:value>Where to see them"
        lines:
          - "<c:text>Open <c:value>/tags</c:value> and click <c:flame>Achievements</c:flame>."
          - "<c:text>Each category shows your progress"
          - "<c:text>to the next goal. Secret ones show"
          - "<c:text>as <c:value>???</c:value> until you find them."
      - title: "<c:value>Titles"
        lines:
          - "<c:text>The last tier often gives a title."
          - "<c:text>Titles are shared by all your"
          - "<c:text>profiles. Equip it in <c:value>/titles</c:value>."
      - title: "<c:value>Profiles"
        lines:
          - "<c:text>Progress is per profile: a new"
          - "<c:text>profile starts its achievements"
          - "<c:text>from zero. Titles you have stay."

  tags:
    icon: name_tag
    aliases: [titles, title, tag, cosmetics]
    name: "<c:flame>Titles & tags"
    summary: ["<c:text>Show off next to your name", "<c:text>in chat and tab."]
    take-me-there: "tags"
    commands: [Cosmetics]
    pages:
      - title: "<c:value>Titles"
        lines:
          - "<c:text>Titles are earned with achievements:"
          - "<c:text>big wins, but also cool and secret"
          - "<c:text>things. Locked ones tell you how."
      - title: "<c:value>Tags"
        lines:
          - "<c:text>Tags come from crates and the store"
          - "<c:text>as a tag item. Right-click it to add"
          - "<c:text>the tag to your account."
      - title: "<c:value>Extra copies"
        lines:
          - "<c:text>Already own a tag? Trade the item"
          - "<c:text>or sell it on the auction house."
      - title: "<c:value>Wearing them"
        lines:
          - "<c:value>/tags</c:value> <c:text>or</c:text> <c:value>/titles</c:value> <c:text>opens one menu with"
          - "<c:text>both tabs. Equip one title and one tag;"
          - "<c:text>the head at the top shows your look."

  profiles:
    icon: armor_stand
    aliases: [profile, slots]
    name: "<c:flame>Profiles"
    summary: ["<c:text>Up to 3 fresh starts, each", "<c:text>with its own island."]
    take-me-there: "profiles"
    pages:
      - title: "<c:value>What a profile is"
        lines:
          - "<c:text>A profile is one island and everything"
          - "<c:text>on it: money, crystals, shards, items,"
          - "<c:text>ender chest, XP, skills and settings."
          - "<c:text>Gems, rank, titles and cosmetics are shared."
      - title: "<c:value>Switching"
        lines:
          - "<c:text>Open <c:value>/profiles</c:value>, pick a profile, click Switch."
          - "<c:text>Your things are saved and the other"
          - "<c:text>profile's are loaded. Not in combat or frozen."
      - title: "<c:value>Slots"
        lines:
          - "<c:text>Slot 1 is free. Slot 2: <c:value>500 gems</c:value> or Knight+."
          - "<c:text>Slot 3: <c:value>1,500 gems</c:value> or Warlord+."
          - "<c:text>Bought slots stay, also after a season reset."
      - title: "<c:value>No sharing"
        lines:
          - "<c:text>Nothing moves between your own profiles:"
          - "<c:text>no items, money, auction buys or notes."
          - "<c:text>Your profiles can't share an island."

  island:
    icon: grass_block
    aliases: [islands, is, home, sethome, invites, fly, island-chat, ischat, info, island-stats, isstats]
    name: "<c:flame>Your island"
    summary: ["<c:text>Create your island, open its", "<c:text>menu and talk to your team."]
    take-me-there: "is"
    commands: [Island]
    pages:
      - title: "<c:value>Getting one"
        lines:
          - "<c:text>Type <c:value>/is</c:value> and confirm. Your own small"
          - "<c:text>meadow is built and you're taken there."
          - "<c:text>The starter chest has your first items."
      - title: "<c:value>The island menu"
        lines:
          - "<c:value>/is</c:value> <c:text>opens your island menu: home,"
          - "<c:text>members, warps, visitors, settings,"
          - "<c:text>invites, notes, island chat and stats."
      - title: "<c:value>Going home"
        lines:
          - "<c:value>/is home</c:value> <c:text>takes you back to your"
          - "<c:text>island. Stand somewhere safe on it and"
          - "<c:text>use <c:value>/is sethome</c:value> to move your home."
      - title: "<c:value>Island stats"
        lines:
          - "<c:value>/is stats</c:value> <c:text>shows what your island did:"
          - "<c:text>blocks, crops, mobs, playtime and more,"
          - "<c:text>today, this week and each member's part."
      - title: "<c:value>Island chat"
        lines:
          - "<c:value>/is chat</c:value> <c:text>sends your chat to your island"
          - "<c:text>only; again to talk to everyone. One message:</c:text>"
          - "<c:value>/is chat hi</c:value><c:text>. The leader picks role colors.</c:text>"
      - title: "<c:value>The border"
        lines:
          - "<c:text>The border you see is your island's edge:"
          - "<c:text>you can only build inside it. It starts"
          - "<c:text>at 3x3 chunks and grows with upgrades."
      - title: "<c:value>Falling off"
        lines:
          - "<c:text>Fell into the void? No worries: you land"
          - "<c:text>back on your island without damage."
      - title: "<c:value>Starting over"
        lines:
          - "<c:text>A leader alone on the island can delete"
          - "<c:text>it with</c:text> <c:value>/is disband</c:value> <c:text>and a confirm click."
          - "<c:text>With members, hand it over first. A new"
          - "<c:text>island or another team: right away."
      - title: "<c:value>Island settings"
        lines:
          - "<c:value>/is settings</c:value> <c:text>turns mob spawning, fire,"
          - "<c:text>explosions, trampling and more on or off,"
          - "<c:text>and picks the weather and time on your island."
      - title: "<c:value>Roles & invites"
        lines:
          - "<c:text>Leader > Admin > Mod > Member. Admins help"
          - "<c:text>run the island. See open invites with"
          - "<c:value>/is invites</c:value><c:text>.</c:text>"
      - title: "<c:value>Flying"
        lines:
          - "<c:text>With island fly, double-tap jump on an"
          - "<c:text>island to fly. It stops at the border and"
          - "<c:text>you land without damage.</c:text>"
  spawners:
    icon: spawner
    aliases: [spawner, stacking, stacks, stacked]
    name: "<c:flame>Spawners and stacking"
    summary: ["<c:text>Mobs, drops and spawners stack", "<c:text>on islands to keep things fast."]
    take-me-there: "is"
    commands: []
    pages:
      - title: "<c:value>Stacked mobs"
        lines:
          - "<c:text>Mobs of the same kind join one stack,"
          - "<c:text>shown as <c:value>Zombie</c:value> <c:ember>x45</c:ember><c:text>. A hit kills one;"
          - "<c:text>falls, lava and the void kill the whole"
          - "<c:text>stack, with all drops and XP."
      - title: "<c:value>Breeding"
        lines:
          - "<c:text>Feed a stack: each food item breeds"
          - "<c:text>one pair and the babies join the stack."
          - "<c:text>Named, tamed or leashed mobs and"
          - "<c:text>villagers never stack."
      - title: "<c:value>Dropped items"
        lines:
          - "<c:text>Drops merge into one item with a count,"
          - "<c:text>like <c:value>Diamond</c:value> <c:ember>x1,234</c:ember><c:text>. You pick up what fits;"
          - "<c:text>hoppers take 64 at a time. Drops vanish"
          - "<c:text>after about 10 minutes."
      - title: "<c:value>Spawners"
        lines:
          - "<c:text>Place a spawner, then right-click it with"
          - "<c:text>more of the same kind to stack them."
          - "<c:text>Sneak-right-click opens its menu. Each"
          - "<c:text>spawner in the stack adds full speed."
      - title: "<c:value>Breaking and limits"
        lines:
          - "<c:text>Breaking takes one spawner; sneak-break"
          - "<c:text>takes all. No silk touch needed. A"
          - "<c:text>spawner runs while you are within 16"
          - "<c:text>blocks, and light is not needed."
  visiting:
    icon: ender_pearl
    aliases: [visit, warp, warps, lock, unlock, ban, unban, expel, rate, like, setwarp, delwarp]
    name: "<c:flame>Visiting & warps"
    summary: ["<c:text>Visit islands, set warps, lock", "<c:text>your island, rate and like."]
    take-me-there: "is visit"
    commands: [Island]
    pages:
      - title: "<c:value>Visiting"
        lines:
          - "<c:value>/is visit</c:value> <c:text>opens the island browser:"
          - "<c:text>most visited, top rated, most liked"
          - "<c:text>and newest. <c:value>/is visit Steve</c:value> <c:text>takes you"
          - "<c:text>straight to Steve's island."
      - title: "<c:value>Warps"
        lines:
          - "<c:text>Leader and mods set up to 3 warps:"
          - "<c:value>/is setwarp shop shops</c:value> <c:text>or a sign with"
          - "<c:value>[warp]</c:value> <c:text>and the name. Everyone finds them"
          - "<c:text>in <c:value>/is warp</c:value><c:text>, sorted by category."
      - title: "<c:value>Keeping visitors out"
        lines:
          - "<c:value>/is lock</c:value> <c:text>lets only members in. Send a"
          - "<c:text>visitor off with <c:value>/is expel</c:value><c:text>, or keep them"
          - "<c:text>out for good with <c:value>/is ban</c:value><c:text>. Turn visit"
          - "<c:text>alerts on or off in <c:value>/settings</c:value><c:text>."
      - title: "<c:value>Ratings & likes"
        lines:
          - "<c:text>Liked an island you visited? Give it"
          - "<c:value>/is rate Steve 5</c:value> <c:text>(once a season, you can"
          - "<c:text>change it) and <c:value>/is like Steve</c:value> <c:text>once a day."
  money:
    icon: gold_ingot
    aliases: [economy, balance, bal, pay, baltop, transactions, currencies]
    name: "<c:flame>Money & currencies"
    summary: ["<c:text>Your balances, paying players", "<c:text>and your money history."]
    take-me-there: "transactions"
    commands: [Economy]
    pages:
      - title: "<c:value>Four currencies"
        lines:
          - "<cur:money>Money</cur:money> <c:text>for almost everything,"
          - "<cur:crystals>Crystals</cur:crystals> <c:text>for your island, <cur:gems>Gems</cur:gems>"
          - "<c:text>for premium items and <cur:shards>Shards</cur:shards> <c:text>for"
          - "<c:text>the Black Market. See them: <c:value>/bal</c:value>"
      - title: "<c:value>Paying players"
        lines:
          - "<c:value>/pay Steve 1.5k</c:value> <c:text>works even when"
          - "<c:text>Steve is offline. Use k, M and B:"
          - "<c:value>2M</c:value> <c:text>= 2,000,000. Big payments ask"
          - "<c:text>you to confirm first."
      - title: "<c:value>What can be paid"
        lines:
          - "<c:text>Money and shards can be paid."
          - "<c:text>Gems and crystals stay with you."
          - "<c:text>Payments can't be undone, so check"
          - "<c:text>the name before you confirm."
      - title: "<c:value>Your history"
        lines:
          - "<c:value>/transactions</c:value> <c:text>lists every change to your"
          - "<c:text>balances: who paid you, what you sold"
          - "<c:text>and bought. Filter by currency, type"
          - "<c:text>and time. <c:value>/baltop</c:value> <c:text>shows the richest."

  bank:
    icon: barrel
    aliases: [banks, interest, island-bank, personal-bank]
    name: "<c:flame>Banks & interest"
    summary: ["<c:text>Save money in your own bank and", "<c:text>your island's bank, earn interest."]
    take-me-there: "bank"
    commands: [Economy]
    pages:
      - title: "<c:value>Two banks"
        lines:
          - "<c:value>/bank</c:value> <c:text>shows your own bank (left)"
          - "<c:text>and your island's shared bank"
          - "<c:text>(right). Your own bank belongs to"
          - "<c:text>this profile and stays if you leave."
      - title: "<c:value>Interest"
        lines:
          - "<c:text>Both banks earn interest every 8 hours,"
          - "<c:text>also offline, on the lowest balance of"
          - "<c:text>that period. Play 2 hours in 7 days"
          - "<c:text>to earn it. Each payout has a cap."
      - title: "<c:value>Taking money out"
        lines:
          - "<c:text>A withdrawal costs a 2% fee and that"
          - "<c:text>period's interest, except in the first"
          - "<c:text>minutes after a payout. Island masteries"
          - "<c:text>lower the fee step by step. You always"
          - "<c:text>see the fee before you confirm."
      - title: "<c:value>Tiers and roles"
        lines:
          - "<c:text>Buy bank tiers to hold more. On the"
          - "<c:text>island bank, the Leader decides who"
          - "<c:text>may put in, take out and see the"
          - "<c:text>history in <c:value>/is permissions</c:value><c:text>."

  shop:
    icon: emerald
    aliases: [builder-shop, buy, blocks, store-blocks]
    name: "<c:flame>Builder shop"
    summary: ["<c:text>Buy blocks, decoration and", "<c:text>seeds for your island."]
    take-me-there: "shop"
    commands: [Economy]
    pages:
      - title: "<c:value>Buying"
        lines:
          - "<c:value>/shop</c:value> <c:text>shows the categories. In one:"
          - "<c:text>left-click buys 1, right-click 64,"
          - "<c:text>shift-click picks an amount; on"
          - "<c:text>Bedrock, tap an item to pick one."
      - title: "<c:value>Room and money"
        lines:
          - "<c:text>Items go into your inventory. If not"
          - "<c:text>all fit, you pay only for what fits."
          - "<c:text>Big buys ask you to confirm first."
          - "<c:value>/shop wood</c:value> <c:text>opens a category."
      - title: "<c:value>Why some prices are high"
        lines:
          - "<c:text>Crops and redstone also sell with"
          - "<c:value>/sell</c:value><c:text>, so the shop asks more for"
          - "<c:text>them. Buy one, grow the rest. The shop"
          - "<c:text>never buys items back: use /sell."

  sell:
    icon: gold_nugget
    aliases: [selling, sell-hand, sell-all, prices, hot-item, sell-bonus]
    name: "<c:flame>Selling"
    summary: ["<c:text>Sell your loot to the server", "<c:text>at live prices."]
    take-me-there: "sell"
    commands: [Economy]
    pages:
      - title: "<c:value>The sell chest"
        lines:
          - "<c:value>/sell</c:value> <c:text>opens the sell chest. Put"
          - "<c:text>items in (click, shift-click, drag)"
          - "<c:text>or press <c:value>Sell inventory</c:value><c:text>, then <c:value>Sell</c:value><c:text>."
          - "<c:text>Closing it gives everything back."
      - title: "<c:value>Quick selling"
        lines:
          - "<c:value>/sell hand</c:value> <c:text>sells the stack you hold."
          - "<c:value>/sell all</c:value> <c:text>sells everything in your"
          - "<c:text>inventory that can be sold. Armor and"
          - "<c:text>your offhand are never touched."
      - title: "<c:value>Live prices"
        lines:
          - "<c:text>Every sale lowers a price a little and"
          - "<c:text>it climbs back over time. Items nobody"
          - "<c:text>sells go above base. One <c:value>Hot item</c:value>"
          - "<c:text>a day sells for more. Sell a mix!"
      - title: "<c:value>Sell bonus"
        lines:
          - "<c:text>Ranks, island upgrades, sets, enchants"
          - "<c:text>and boosters add up to your sell bonus,"
          - "<c:text>up to +300%. Tools, enchant books,"
          - "<c:text>notes and set pieces can't be sold."

  notes:
    icon: paper
    aliases: [withdraw, note, money-note, money-notes, cheque]
    name: "<c:flame>Money notes"
    summary: ["<c:text>Turn money into an item you", "<c:text>can trade, store or give away."]
    commands: [Economy]
    pages:
      - title: "<c:value>Making a note"
        lines:
          - "<c:value>/withdraw 50k</c:value> <c:text>takes $50,000 from your"
          - "<c:text>balance and gives you a <c:value>Money Note</c:value><c:text>."
          - "<c:text>Keep a slot free: nothing is taken"
          - "<c:text>when your inventory is full."
      - title: "<c:value>Cashing a note"
        lines:
          - "<c:text>Hold the note and <c:value>right-click</c:value><c:text>."
          - "<c:text>The money goes straight to your"
          - "<c:text>balance. Anyone holding the note can"
          - "<c:text>cash it, so keep it safe."
      - title: "<c:value>Trading"
        lines:
          - "<c:text>Notes can be traded, dropped and kept"
          - "<c:text>in chests like any item. They can't be"
          - "<c:text>sold on the auction house."
      - title: "<c:value>Copies don't work"
        lines:
          - "<c:text>Every note has its own id and can be"
          - "<c:text>cashed only once. A copied note is"
          - "<c:text>taken away and staff are told, so"
          - "<c:text>only accept notes from people you trust."

  auction:
    icon: gold_block
    aliases: [ah, auctions, auction-house, sell-items, collection-bin]
    name: "<c:flame>Auction house"
    summary: ["<c:text>Buy and sell items with other", "<c:text>players, even when they're offline."]
    take-me-there: "ah"
    commands: [Economy]
    pages:
      - title: "<c:value>Buying"
        lines:
          - "<c:value>/ah</c:value> <c:text>shows everything for sale. Pick a"
          - "<c:text>category, sort by price or time, or"
          - "<c:text>search by name. Click an item and"
          - "<c:text>confirm to buy it."
      - title: "<c:value>Selling"
        lines:
          - "<c:text>Hold the item and click <c:value>Sell held item</c:value>"
          - "<c:text>or type <c:value>/ah sell 1.5k 24h</c:value>. Listing costs a"
          - "<c:text>1% fee; when it sells you get the price"
          - "<c:text>minus 5% tax, even while offline."
      - title: "<c:value>Getting items back"
        lines:
          - "<c:text>Unsold, cancelled and bought items that"
          - "<c:text>don't fit wait in your <c:value>Collection bin</c:value><c:text>."
          - "<c:text>Cancel a listing in <c:value>My listings</c:value><c:text>."
          - "<c:text>You can have 5 listings at once."
      - title: "<c:value>Rules"
        lines:
          - "<c:text>Starter kit items and money notes"
          - "<c:text>can't be sold here. Your other profiles"
          - "<c:text>can't buy your items. Every sale is"
          - "<c:text>logged, so scams get caught."

  trade:
    icon: emerald
    aliases: [trading, secure-trade, swap]
    name: "<c:flame>Trading"
    summary: ["<c:text>Swap items and money safely", "<c:text>with a player next to you."]
    take-me-there: "trade"
    commands: [Economy]
    pages:
      - title: "<c:value>Starting a trade"
        lines:
          - "<c:value>/trade Steve</c:value> <c:text>asks a player nearby."
          - "<c:text>They click <c:value>[Accept]</c:value> <c:text>or type"
          - "<c:value>/trade accept</c:value><c:text>. Stand close and stay"
          - "<c:text>in the same world."
      - title: "<c:value>Offering"
        lines:
          - "<c:text>Tap items in your own inventory to"
          - "<c:text>offer them. Tap the gold ingot to add"
          - "<c:text>money. Tap your offered item to take"
          - "<c:text>it back."
      - title: "<c:value>Confirming"
        lines:
          - "<c:text>Both tap <c:value>Confirm</c:value><c:text>. After a short"
          - "<c:text>countdown the trade happens. Any"
          - "<c:text>change resets both confirmations, so"
          - "<c:text>check the other side first."
      - title: "<c:value>Safe by design"
        lines:
          - "<c:text>Offered items are stored safely until"
          - "<c:text>the trade ends. Closing, leaving or"
          - "<c:text>moving away cancels it and gives"
          - "<c:text>everything back. Crystals can't be traded."

  tutorial:
    icon: written_book
    aliases: [guide, start, locks, starter-chest]
    name: "<c:flame>Tutorial"
    summary: ["<c:text>A short guided start: your island,", "<c:text>the Depths, selling, Forge and bank."]
    take-me-there: "tutorial"
    commands: [Info]
    pages:
      - title: "<c:value>How it works"
        lines:
          - "<c:text>Walk into the Island portal at"
          - "<c:text>spawn. A boss bar, flames and"
          - "<c:text>holograms show you the way, one"
          - "<c:text>short step at a time (about 3 min)."
      - title: "<c:value>Features unlock"
        lines:
          - "<c:text>Some features open as you go: team"
          - "<c:text>features, the Depths, the auction"
          - "<c:text>house, /pay and /withdraw, then"
          - "<c:text>/trade, warzone and new profiles."
      - title: "<c:value>Lost?"
        lines:
          - "<c:value>/tutorial</c:value> <c:text>shows your step, takes"
          - "<c:text>you there and repeats the hint."
          - "<c:text>Your progress is saved, even if you"
          - "<c:text>leave. Watch it again any time."

  box:
    icon: chest_minecart
    aliases: [mailbox, item-box, full-inventory, overflow]
    name: "<c:flame>Item box"
    summary: ["<c:text>Items that did not fit your", "<c:text>inventory wait here, safe."]
    take-me-there: "box"
    commands: [Economy]
    pages:
      - title: "<c:value>Never dropped"
        lines:
          - "<c:text>When your inventory is full, items"
          - "<c:text>from selling, the shop, the Forge,"
          - "<c:text>trades and more go to your box"
          - "<c:text>instead of falling on the ground."
      - title: "<c:value>Taking items"
        lines:
          - "<c:value>/box</c:value> <c:text>opens it, oldest first."
          - "<c:text>Tap a stack to take it, or tap"
          - "<c:value>Take all that fit</c:value><c:text>. Each item says"
          - "<c:text>where it came from and when."
      - title: "<c:value>Good to know"
        lines:
          - "<c:text>Each profile has its own box. We"
          - "<c:text>remind you when you join. Nothing"
          - "<c:text>is ever lost; we warn you when it"
          - "<c:text>gets close to 500 stacks."

  staff:
    icon: shield
    aliases: [staff-hub]
    name: "<c:flame>Staff hub"
    summary: ["<c:text>Staff tools in one place."]
    take-me-there: "staff"
    commands: [Staff]
    pages:
      - title: "<c:value>Opening it"
        lines:
          - "<c:value>/staff</c:value> <c:text>opens the hub. Tools your rank"
          - "<c:text>can't use are shown locked."
      - title: "<c:value>Everything is logged"
        lines:
          - "<c:text>Every staff action is stored in the"
          - "<c:text>audit log with who, what and when."
      - title: "<c:value>Chat language"
        lines:
          - "<c:text>Public chat is English only (rule 7)."
          - "<c:text>Ask nicely first; warn if it goes on."
          - "<c:text>Private messages may be any language."

  display:
    icon: painting
    aliases: [display-editor, formats]
    name: "<c:flame>Display editor"
    summary: ["<c:text>How players look in chat,", "<c:text>tab and above heads."]
    take-me-there: "display"
    pages:
      - title: "<c:value>Editing a part"
        lines:
          - "<c:text>Click a part, type the new format in"
          - "<c:text>chat and check the preview head"
          - "<c:text>before you confirm."
      - title: "<c:value>Parts"
        lines:
          - "<c:value><rank> <name> <title> <tag></c:value>"
          - "<c:value><message></c:value> <c:text>in chat,</c:text> <c:value><afk></c:value> <c:text>in tab."
          - "<c:text>Type</c:text> <c:value>default</c:value> <c:text>to reset a part."
      - title: "<c:value>Applied instantly"
        lines:
          - "<c:text>Changes apply to everyone right"
          - "<c:text>away and are logged."

  admin:
    icon: comparator
    aliases: [config, config-editor]
    name: "<c:flame>Config editor"
    summary: ["<c:text>Change server settings", "<c:text>without touching files."]
    take-me-there: "admin"
    pages:
      - title: "<c:value>Finding a setting"
        lines:
          - "<c:value>/admin</c:value> <c:text>lists every config file. Gold"
          - "<c:text>settings differ from the default."
      - title: "<c:value>Changing it"
        lines:
          - "<c:text>Switches flip, choices cycle, numbers"
          - "<c:text>use a picker, text uses chat input."
          - "<c:text>Wrong values are refused with a reason."
      - title: "<c:value>Safe by design"
        lines:
          - "<c:text>Every change is saved, applied live"
          - "<c:text>(or after a restart when marked) and"
          - "<c:text>logged with the old and new value."
          - "<c:text>Economy and season settings: owner only."

  faq:
    icon: lectern
    aliases: [questions]
    name: "<c:flame>Frequently asked"
    summary: ["<c:text>Quick answers."]
    pages:
      - title: "<c:value>Can I play on Bedrock?"
        lines:
          - "<c:text>Yes. Java and Bedrock players play"
          - "<c:text>together on <c:value>play.skybornmc.net</c:value>."
      - title: "<c:value>When does Season 1 start?"
        lines:
          - "<c:text>Follow <c:value>/discord</c:value> for the date and"
          - "<c:text>sneak peeks along the way."
      - title: "<c:value>I lost my menu item"
        lines:
          - "<c:text>Check <c:value>/settings</c:value> <c:muted>»</c:muted> <c:text>Display, or type"
          - "<c:value>/menu</c:value><c:text>. It comes back after respawning."
      - title: "<c:value>How do I report a player?"
        lines:
          - "<c:text>Tell a staff member in game or open a"
          - "<c:text>ticket on <c:value>/discord</c:value> with proof."
