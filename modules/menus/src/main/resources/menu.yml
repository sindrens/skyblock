# Phoenix Skyblock menus: the /menu hub, You and Travel (G9 v3, I9 v2), and the /staff hub.
# Texts (names and descriptions) are in messages/navigation.yml. Reload: /skyblock reload menus

# /menu: the hub (G9 v3, I9 v2). Your head on 4, the Staff tile on 8, then 4 rows with space between them. No frame,
# no filler panes: empty slots stay empty. Close (49) and Help (50) are drawn by the hub itself.
# Texts: messages/navigation.yml → hub.buttons.<id> (name in the row's area colour, one sentence, optional action).
# slot:        4 (your head), 8 (the Staff tile) or a slot of the 7x4 grid (10-16, 19-25, 28-34, 37-43)
# group:       one of hub-groups below (fallback names take its colour)
# icon:        an icon key of the icon catalogue (resourcepack/icons.json, e.g. feature/home: our picture for Java players
#              with the pack, its vanilla base item for everyone else) or a vanilla item id (that plain item for everyone)
# action:      command (default: runs `command` as the player) or a built-in screen:
#              you (the You menu), travel (the Travel menu), rewards (claims everything ready; with nothing ready it
#              runs `command`), settings, help (Help is already on slot 50, so don't add it twice), staff (opens /staff),
#              top (the Top screen: solo/team islands, this week, richest players, top skills; /is top is one click away)
# service:     the service the feature provides (e.g. SellService). Owner G2: a feature that is not built (service
#              missing, module off, command missing) is HIDDEN. Test server: navigation.yml → hub.show-unbuilt: true
#              shows them in the "Coming soon" look.
# show:        false hides the button everywhere (also on the test server). Use this instead of deleting a button:
#              deleted buttons come back from the defaults on the next start.
# permission:  optional; players without it see the button locked.
# show-locked: false = players without the permission do not see the button at all (the Staff tile).
# One button per action: a second button that does the same thing is skipped (with a warning).
hub:
  you:       {slot: 4,  action: you,      icon: player_head}
  # Plan 4 Nov C §3: vanilla items that match their meaning, at most 4 per row with an empty column between them.
  # Play (lime): your island and the two grind areas
  home:      {slot: 10, group: play,  icon: red_bed,           command: "is home",   service: IslandService}
  island:    {slot: 12, group: play,  icon: grass_block,       command: "is",        service: IslandService}
  farm:      {slot: 14, group: play,  icon: wheat,             command: "farm"}
  mine:      {slot: 16, group: play,  icon: iron_pickaxe,      command: "mine"}
  # Money (green)
  sell:      {slot: 19, group: money, icon: gold_nugget,       command: "sell",      service: SellService}
  shop:      {slot: 21, group: money, icon: emerald,           command: "shop",      service: ShopPrices}
  bank:      {slot: 23, group: money, icon: barrel,            command: "bank",      service: BankService}
  auction:   {slot: 25, group: money, icon: gold_block,        command: "ah"}
  # Power (violet): the island tools replace the retired Forge
  tools:     {slot: 28, group: power, icon: smithing_table,    command: "tool"}
  skills:    {slot: 30, group: power, icon: experience_bottle, command: "skills",    service: SkillService}
  enchanter: {slot: 32, group: power, icon: enchanting_table,  command: "enchanter", service: EnchantService}
  wardrobe:  {slot: 34, group: power, icon: leather_chestplate, command: "wardrobe", service: WardrobeService}
  # More (flame gold), centred: Rewards, Travel, Top
  rewards:   {slot: 38, group: more,  icon: chest,             action: rewards, command: "daily", service: RewardsService}
  travel:    {slot: 40, group: more,  icon: compass,           action: travel}
  top:       {slot: 42, group: more,  icon: golden_helmet,     action: top,      service: IslandService}
  # Staff tile (G9): only players with the permission see it (hidden, not locked)
  staff:     {slot: 8, icon: shield, action: staff, command: "staff", permission: "skyblock.staff.hub", show-locked: false}

# The four hub groups, in order. A row is a group by its spacing; `color` = the area colour (style.yml → area) its
# fallback names take (G9). The old marker panes (`mark`) are gone.
hub-groups:
  play:  {color: home}
  money: {color: money}
  power: {color: skills}
  more:  {color: reward}

# /menu → You (G9 v3). No slots: the entries are placed by Centered in file order (up to 8 in one row of a 3-row menu,
# 9 to 14 in two rows of a 4-row menu; nine = 5 + 4). Hidden entries leave no hole. Same keys as the hub (no group, no slot).
# Texts: messages/navigation.yml → you.buttons.<id>.
you:
  profiles:     {icon: armor_stand,     command: "profiles",     service: ProfileService}
  titles:       {icon: paper,       command: "tags",         service: Cosmetics}
  achievements: {icon: nether_star, command: "achievements", service: AchievementService}
  quests:       {icon: map,       command: "contracts",    service: QuestService}
  collection:   {icon: bundle,   command: "collection",   service: CollectionLog}
  # FULL_PLAN 8 (7 Nov 2026): every feature reachable from /menu.
  quest-book:   {icon: writable_book, command: "tutorial"}
  mailbox:      {icon: ender_chest,   command: "box"}
  friends:      {icon: player_head,   command: "friends"}
  milestones:   {icon: golden_apple,  command: "milestones"}
  settings:     {icon: repeater,     action: settings}
  rules:        {icon: book,        command: "rules"}
  # Ranks V2: donor ranks only (a player without the node never sees it).
  rank-rewards: {icon: chest,                command: "rankrewards",  permission: "skyblock.rank.kit", show-locked: false}
  store:        {icon: emerald_block,        command: "store"}
  # Card C1: your credits, bought and earned (/credit bal). Same base item as the Store (diamond, I9 section 9).
  credits:      {icon: sunflower,     command: "credit bal",   service: EconomyService}

# /menu → Travel (G9 v3; replaces the UX3 warps menu). 3 rows, up to 7 places centred on the middle row in file order
# (no slots). One click teleports with the /spawn warmup (reason: dungeon = the /dungeon warmup); locked places explain
# why (e.g. Depths tiers). A place that does not exist on this server is hidden (build not applied, world not loaded,
# command missing) and the others re-centre.
# Texts: messages/navigation.yml → travel.places.<id> (name, lore, optional action). permission: optional.
# target: "command <cmd>"                              runs a command as the player (e.g. spawn, is home)
#         "point <category> <id>"                      a spot of the applied builds (build-points.yml), e.g. road entries
#         "location <world> <x> <y> <z> [yaw] [pitch]" a fixed position (feet)
travel:
  spawn:         {icon: lodestone,       target: "command spawn"}
  my-island:     {icon: grass_block,     target: "command is home"}
  depths-gate:   {icon: wheat,              target: "command farm", reason: dungeon}   # 3 Nov 2026: the Farm replaces the Depths Gate
  crate-yard:    {icon: tripwire_hook,  target: "location spawn 46.5 100 -35.5 -90 0"}
  market:        {icon: barrel,      target: "location spawn 0.5 99 33.5 0 0"}
  forge-quarter: {icon: iron_pickaxe,       target: "command mine"}   # 3 Nov 2026: the Mine (the Depths Forge is retired)
  pond:          {icon: fishing_rod,     target: "command fish"}   # owner 6 Nov 2026: /fish
  visit-islands: {icon: ender_pearl,       target: "command is visit"}

# Tutorial highlights (GUI-ICONS-FINAL): while the tutorial's current step is `step`, the tile `target` (hub.<button id>
# or travel.<place id>) glints, shows "● Start here" (messages/navigation.yml → hub.highlight) and uses `icon` (an icon
# catalogue key: our lit picture for Java with the pack, its base item for everyone else). Clicks do the same as always.
# To switch a rule off set its step to none (deleted rules come back from the defaults on the next start).
highlights:
  hub-farm:    {target: "hub.farm",           step: none, icon: wheat}
  gate-depths: {target: "travel.depths-gate", step: none, icon: wheat}

# /staff hub (staff only). Rules: slot (inner slot), icon, command, status (auto | coming-soon | active), optional permission; texts in messages/navigation.yml → staff.entries.<id>.
staff-entries:
  display:      {slot: 20, icon: painting,         command: "display",     status: auto, permission: "skyblock.admin.display"}
  admin:        {slot: 21, icon: comparator,       command: "admin",       status: auto, permission: "skyblock.admin.config"}
  cosmetics:    {slot: 22, icon: name_tag,         command: "tags",        status: auto, permission: "skyblock.admin.cosmetics.edit"}
  staff-mode:   {slot: 23, icon: ender_eye,        command: "s",           status: auto, permission: "skyblock.staff.mode"}
  logs:         {slot: 24, icon: bookshelf,        command: "logs",        status: auto, permission: "skyblock.staff.logs"}
  reports:      {slot: 29, icon: bell,             command: "reports",     status: auto, permission: "skyblock.staff.reports"}
  vanish:       {slot: 30, icon: glass,            command: "vanish",      status: auto}
  staff-chat:   {slot: 31, icon: writable_book,    command: "sc",          status: auto, permission: "skyblock.staff.chat"}
  modules:      {slot: 32, icon: command_block,    command: "skyblock modules", status: auto, permission: "skyblock.admin.modules"}
  worlds:       {slot: 33, icon: grass_block,      command: "skyblock worlds",  status: auto, permission: "skyblock.admin.worlds"}
  islands:      {slot: 34, icon: filled_map,       command: "isadmin slots",    status: auto, permission: "skyblock.island.admin.slots"}
  npcs:         {slot: 25, icon: armor_stand,      command: "skyblock npcs",    status: auto, permission: "skyblock.admin.npcs"}
  tutorial:     {slot: 28, icon: writable_book,    command: "tutorial admin stats", status: auto, permission: "skyblock.tutorial.admin"}
