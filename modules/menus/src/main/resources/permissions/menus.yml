# Permissions of the menus module. Registered when the module enables, removed when it disables.
# Format: the permissions section of a plugin.yml (description, default: true|false|op|not op; missing = op).
# LuckPerms grants for these nodes: server/permissions/menus.txt. Commands: docs/commands/menus.md.
skyblock.menu:
  description: Open the main menu (/menu) and use the menu item
  default: true
skyblock.help:
  description: Open the help menu (/help)
  default: true
skyblock.settings:
  description: Change your own settings (/settings)
  default: true
skyblock.staff.menu:
  description: Open the staff hub (/staff)
  default: op
