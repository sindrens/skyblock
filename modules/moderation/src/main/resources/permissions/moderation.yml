# Permissions of the moderation module. Registered when the module enables, removed when it disables.
# Format: the permissions section of a plugin.yml (description, default: true|false|op|not op; missing = op).
# LuckPerms grants for these nodes: server/permissions/moderation.txt. Commands: docs/commands/moderation.md.
skyblock.staff.unban:
  description: Unban players or IP addresses (/unban)
  default: op
skyblock.staff.punish.warn:
  description: Warn players (/warn)
  default: op
skyblock.staff.punish.kick:
  description: Kick players (/kick)
  default: op
skyblock.staff.punish.mute:
  description: Mute players (/mute, /tempmute)
  default: op
skyblock.staff.punish.ban:
  description: Ban players (/ban, /tempban)
  default: op
skyblock.staff.punish.ipban:
  description: IP bans (/ipban, -ip flag)
  default: op
skyblock.staff.punish.unmute:
  description: Unmute players (/unmute)
  default: op
skyblock.staff.punish.unwarn:
  description: Remove warnings (/unwarn)
  default: op
skyblock.staff.punish.silent:
  description: Punish silently (-s flag)
  default: op
skyblock.staff.punish.gui:
  description: Punish with templates (/punish)
  default: op
skyblock.staff.punish.history:
  description: View punishment history (/history)
  default: op
skyblock.staff.punish.alts:
  description: View accounts sharing an IP (/alts) and alt alerts
  default: op
skyblock.staff.punish.exempt:
  description: Can't be punished (except by staff with exempt.bypass)
  default: false
skyblock.staff.punish.exempt.bypass:
  description: Can punish exempt staff
  default: op
skyblock.staff.punish.max.helper:
  description: Punishment length tier 'helper' (moderation.yml limits.max-duration)
  default: false
skyblock.staff.punish.max.mod:
  description: Punishment length tier 'mod' (moderation.yml limits.max-duration)
  default: false
skyblock.staff.punish.max.admin:
  description: Punishment length tier 'admin' (moderation.yml limits.max-duration)
skyblock.staff.punish.undo.others:
  description: Undo punishments other staff gave (within the undo window, /p head or [Undo])
  default: op
skyblock.staff.punish.force:
  description: Use -force on /p to skip the double-punish check
  default: op
skyblock.staff.punish.stats:
  description: See your own punishment numbers (/pstats, /mystats)
  default: op
skyblock.staff.punish.stats.others:
  description: See other staff members' numbers and the ranking (/pstats <staff>, /pstats top)
  default: op
skyblock.staff.punish.notes:
  description: Private staff notes on players (/pnote) and the newest notes on the head of /p
  default: op
skyblock.punish.view.own:
  description: See your own punishments (/mypunishments) and confirm warnings (/ack)
  default: true
skyblock.staff.punish.approve:
  description: Approve or deny requested big punishments (approval.rules in punishments.yml); without it they become requests
  default: op
skyblock.staff.watch:
  description: Watch players (/watch, /watchlist) and see the watch line on the head of /p
  default: op
skyblock.staff.punish.bulk:
  description: Punish several players for one reason (/pbulk, the Bulk button of /p); always with a confirm
  default: op
skyblock.punish.appeal:
  description: Appeal your own mute or ban (/appeal)
  default: true
skyblock.staff.appeals:
  description: Handle appeals (/appeals queue, accept / reduce / deny) and get the reminder for old open appeals
  default: op
skyblock.staff.lockdown:
  description: Raid lockdown for new players (/lockdown chat|join|off|status and its menu) and the [Start chat lockdown] alert button
  default: op
skyblock.lockdown.bypass:
  description: Never affected by a chat lockdown (given to every rank above default; staff with skyblock.staff.notify never are either)
  default: op
skyblock.staff.punish.suggest:
  description: Suggest a punishment for staff to decide (/psuggest, also used by GrimAC from the console); never applies anything
  default: op
skyblock.staff.punish.island:
  description: Island ladder steps (island-kick, island-ban, coop-remove, coop-block) from /p and /p <player> <reason>
  default: op
skyblock.staff.sanction.freeze:
  description: Freeze a player's balance and lift it again (/p -> Sanctions)
  default: op
skyblock.staff.sanction.trade:
  description: Block a player's trading and lift it again; cancels their auction listings (/p -> Sanctions)
  default: op
skyblock.staff.sanction.money:
  description: Remove money from a player as a sanction (/p -> Sanctions; senior staff)
  default: op
skyblock.staff.sanction.confiscate:
  description: Confiscate an item from an online player's inventory or ender chest (/p -> Sanctions; senior staff)
  default: op
skyblock.staff.sanction.restore:
  description: Give back removed money or a confiscated item (/psanction restore <id>, the Sanctions menu; senior staff)
  default: op
