# Punishment config for /p <player> (alias of /punish) and /p <player> <reason-id> [-s] [-ip].
#
# ONE SOURCE OF TRUTH: server/plugins/PhoenixSkyblock/punishments.yml in the GitHub repo (edit it there, see
# docs/specs/PUNISH_SPEC_NOTES.md "Owner edits on GitHub"). The copy inside the plugin jar
# (modules/moderation/src/main/resources/punishments.yml) is only the first-run default and is kept identical.
# Every edit is validated: a broken file is rejected as a whole, the previous working config stays active, and the
# console + online staff (skyblock.admin.reload) get the error with the line number. The build also parses this file,
# so a bad edit fails CI before it can be deployed. Reload: /skyblock reload moderation
#
# Only ids, slots, icons, ladders and rules live here. ALL TEXTS (reason names, warn button names, menu texts) are in
# messages/moderation.yml (reasons.<id>, categories.<id>, warn-buttons.<id>.name / .reason).
#
# Ladders: the 1st offence uses the 1st step, the 2nd offence the 2nd step, and so on (the last step repeats).
# Offences = earlier punishments with the same reason that were not pardoned or undone, and are younger than
# offence-expire (extras.offence-expire below, 90d; a reason can override it: offence-expire: perm | 180d).
# History is never deleted: only the counting for the ladder changes.
# Steps: warn | kick | mute <time|perm> | ban <time|perm> | ipban <time|perm>   (times: 30m, 1h, 12h, 1d, 7d, 30d)
#        warn 0.5 = a warning that counts half toward the warn rules (weight, 0.1 to 10; plain warn = 1)
# Island steps (P7): island-kick (sent off their team island now) | island-ban <time|perm> (can't enter that island)
#        | coop-remove (removed from the team) | coop-block <time|perm> (can't join, be cooped on or create islands).
#        The island = the one of the player's active profile. An island owner is never island-banned from their own
#        island: for owners the island steps skip to the next coop-block (or next normal step). Without the islands module
#        (or without a team island) the next possible step is used and staff are told.
# report-block <time|perm> (P9): the player can't use /report for that time (enforced by the reports module; without
#        it the next step is used).
# Reason ids: lowercase a-z, 0-9 and - only, unique. icon = any item id.
# probation: true|false (category or reason; default true) = after a mute/ban of this reason ends by time the player is
# on probation (extras.probation), and offences of this reason get the probation step bonus. Off for the small stuff.
# appealable: true|false (reason; default true) = players can /appeal punishments of this reason (extras.appeal).
# rule: 3 | [1, 3] (reason or warn button; P8, spec 14.2) = the server rule(s) it breaks. Only numbers listed under
# rules: below are allowed (an unknown number rejects the file). No rule = the general extras.rules-link is shown.

# ---------- rule numbers (P8, spec 14.2) ----------
# The server rules by number. link = where that rule is explained (optional; default extras.rules-link). The TITLES are
# texts and live in messages/moderation.yml → rules.titles.<number>. Shown to players in the warning, mute message,
# ban screen, /mypunishments and /appeal, and to staff in the /p lore and /history ("Rule 4: No spam, ads or scams").
# PLACEHOLDER: same numbers as /rules today; the owner confirms the real list and the mapping (docs/OPEN_QUESTIONS.md).
rules:
  1: { link: "https://skybornmc.net/rules" }    # Be kind (no harassment, hate or threats)
  2: { link: "https://skybornmc.net/rules" }    # No cheats or unfair mods
  3: { link: "https://skybornmc.net/rules" }    # No duping or bug abuse
  4: { link: "https://skybornmc.net/rules" }    # No spam, ads or scams
  5: { link: "https://skybornmc.net/rules" }    # No real-money trading
  6: { link: "https://skybornmc.net/rules" }    # Staff decisions are final

categories:
  cheating:
    icon: DIAMOND_SWORD
    reasons:
      hacking:
        icon: IRON_SWORD
        rule: 2
        ladder: ["ban 30d", "ban perm"]
        offence-expire: perm        # cheating never expires (owner spec 12.3)
      xray:
        icon: DIAMOND_ORE
        rule: 2
        ladder: ["ban 14d", "ban 60d", "ban perm"]
        offence-expire: perm        # cheating never expires (owner spec 12.3)
      macro:
        icon: STONE_BUTTON
        rule: 2
        ladder: ["warn", "ban 3d", "ban 14d", "ban perm"]
        offence-expire: perm        # cheating never expires (owner spec 12.3)
      alt-abuse:
        icon: PLAYER_HEAD
        rule: 2
        ladder: ["ipban perm"]
        offence-expire: perm        # cheating never expires (owner spec 12.3)
        appealable: false           # owner spec 13.10: no appeals for alt abuse

  chat:
    icon: WRITABLE_BOOK
    reasons:
      toxicity:
        icon: MAGMA_CREAM
        rule: 1
        ladder: ["warn", "mute 1h", "mute 1d", "mute 7d", "mute perm"]
      spam:
        icon: PAPER
        rule: 4
        ladder: ["warn", "mute 30m", "mute 6h", "mute 3d"]
      advertising:
        icon: OAK_SIGN
        rule: 4
        ladder: ["mute 1d", "ban 7d", "ban perm"]
      hate:
        icon: BARRIER
        rule: 1
        ladder: ["mute 7d", "ban 30d", "ban perm"]
      personal-info:
        icon: NAME_TAG
        rule: 1
        ladder: ["mute 1d", "ban 7d", "ban perm"]
      report-abuse:                 # P9 (spec 14.5): false reports. Only ever SUGGESTED (3 invalid reports in 30d), never
        icon: BELL                  # automatic. report-block = can't use /report for that time. No rule number yet (owner).
        ladder: ["warn", "report-block 3d", "report-block 14d", "mute 1d"]
        probation: false

  gameplay:
    icon: GRASS_BLOCK
    reasons:
      exploiting:
        icon: TNT
        rule: 3
        ladder: ["ban 7d", "ban 30d", "ban perm"]
      scamming:
        icon: EMERALD
        rule: 4
        ladder: ["warn", "ban 3d", "ban 14d", "ban perm"]
      griefing:
        icon: FLINT_AND_STEEL
        ladder: ["warn", "ban 1d", "ban 7d", "ban 30d"]
      afk-farming:
        icon: CLOCK
        ladder: ["warn", "kick", "ban 1d", "ban 7d"]
        probation: false            # small stuff (bottom-right quarter of /p): no probation
      rmt:
        icon: GOLD_INGOT
        rule: 5
        ladder: ["ban 30d", "ban perm"]
        offence-expire: perm        # cheating never expires (owner spec 12.3)
        appealable: false           # owner spec 13.10: no appeals for real-money trading
      coop-griefing:                # P7 (spec 13.2 example ladder): griefing your own team's island
        icon: IRON_DOOR
        ladder: ["warn", "island-ban 1d", "coop-block 7d", "ban 7d"]

  other:
    icon: ARMOR_STAND
    probation: false                # small stuff (name / build / skin): no probation (owner spec 13.7)
    reasons:
      inappropriate-name:
        icon: NAME_TAG
        rule: 1
        ladder: ["kick", "ban 1d", "ban perm"]
      inappropriate-build:
        icon: BRICKS
        rule: 1
        ladder: ["warn", "ban 1d", "ban 7d"]
      inappropriate-skin:
        icon: LEATHER_CHESTPLATE
        rule: 1
        ladder: ["kick", "ban 1d", "ban 7d"]
      disrespect-staff:
        icon: IRON_HELMET
        rule: 1
        ladder: ["warn", "mute 1h", "mute 1d", "ban 3d"]

# ---------- /p menu layout (single screen) ----------
# Slots 0-53 (row 1 = 0-8, row 2 = 9-17, ...). Left side = columns 0-3, right side = columns 5-8, middle = column 4.
# A reason that is not placed here is still reachable through "More reasons". No two things may share a slot.
menu:
  confirm: false                    # owner decision: no "are you sure?" click (true = confirm menu before applying)
  keep-open: true                   # stay open and refresh after applying
  filler: GRAY_STAINED_GLASS_PANE
  divider: RED_STAINED_GLASS_PANE
  divider-slots: [13, 22, 40]       # column 4 between the halves (the warn counter sits on 31)
  summary-slot: 4                   # player head + summary (click it to handle a pending suggestion)
  warn-counter-slot: 31
  warn-counter-icon: YELLOW_CONCRETE
  unavailable-icon: GRAY_DYE        # buttons of later milestones ("Not available yet")
  buttons:                          # bottom row
    sanctions: { slot: 45, icon: GOLD_INGOT }      # P7: freeze balance, block trading, remove money, confiscate
    kick: { slot: 46, icon: LEATHER_BOOTS }
    bulk: { slot: 47, icon: CHEST_MINECART }       # P5: punish several players for one reason
    history: { slot: 48, icon: WRITABLE_BOOK }
    close: { slot: 49, icon: BARRIER }
    more-reasons: { slot: 50, icon: BOOKSHELF }
    dry-run: { slot: 52, icon: GRAY_DYE }          # P8

  # Four quarters (owner decision). Reason ids come from categories above.
  mutes:                            # TOP-LEFT (slots 9-12, 18-21)
    toxicity: 9
    spam: 10
    advertising: 11
    hate: 12
    personal-info: 18
    disrespect-staff: 19
  warns:                            # BOTTOM-LEFT (slots 27-30, 36-39): plain warn buttons, one warning each, no ladder
    # weight = how much the warning counts toward the warn rules (default 1; e.g. 0.5 for a light reminder, 2 for serious)
    warn-language: { slot: 27, icon: PAPER, rule: 1 }
    warn-caps-spam: { slot: 28, icon: WRITABLE_BOOK, rule: 4 }
    warn-rules: { slot: 29, icon: BOOK }
    warn-other: { slot: 30, icon: YELLOW_DYE }
  bans:                             # TOP-RIGHT (slots 14-17, 23-26)
    hacking: 14
    xray: 15
    macro: 16
    alt-abuse: 17
    exploiting: 23
    rmt: 24
    scamming: 25
    griefing: 26
  small:                            # BOTTOM-RIGHT (slots 32-35, 41-44): minor things (kick is the fixed button 46)
    afk-farming: 32
    inappropriate-name: 33
    inappropriate-build: 34
    inappropriate-skin: 35
    coop-griefing: 41               # P7: island steps (island-ban, coop-block); the bans quarter is full
    report-abuse: 42                # P9: false reports (normally applied from the suggestion after 3 invalid reports)

# ---------- automatic warn system ----------
# Only active warns count (not removed with /unwarn, younger than warn-expire). The counter is the SUM OF THE WEIGHTS
# of those warns (0.5 + 0.5 + 1 = 2) and is calculated from the database, never stored. "at: 2" fires at 2 or more. Rule actions must be a mute or ban (never warn or kick, so a rule can't trigger itself).
warn-rules:
  enabled: true
  mode: notify                # owner decision: staff decide with [Apply] / [Dismiss]. "auto" applies at once as "System (auto)"
  warn-expire: 30d            # owner decision: a warn stops counting after this (perm = never)
  reset-after-trigger: true   # owner decision: the counter restarts from 0 after a suggestion is applied OR dismissed
  pending-expire: 24h         # an unhandled suggestion disappears after this
  rules:
    - at: 2                   # 2 active warns -> suggest a 1 hour mute
      action: "mute 1h"
  repeat-window: 7d           # after a rule fired: another warn OR any mute within this time ...
  repeat-action: "mute 1d"    # ... suggests this instead
  # No 4-warn ban (owner dropped it). Example if wanted later:
  #   - at: 4
  #     action: "ban 1d"

# ---------- extras (owner spec section 12) ----------
# Times: 30s, 2m, 1h, 7d. Texts for all of this are in messages/moderation.yml (undo.*, stats.*, error.duplicate*).
extras:
  undo-window: 2m             # [Undo] after a punishment works this long (chat button + the head in /p for Bedrock)
  duplicate-window: 15s       # same player + same reason again within this time is blocked ("just punished by ...")
  duplicate-confirm: 5s       # ... unless the same staff member clicks/types it again within this time (or uses -force)
  offence-expire: 90d         # default for every reason; perm = never. Cheating reasons above set offence-expire: perm
  stats:                      # /pstats
    timezone: Europe/Oslo     # owner decision: CET. 7d / 30d = whole days in this time zone, 24h = the last 24 hours
    cache: 60s                # results are reused this long
    default-period: 7d        # 24h | 7d | 30d | all
    top: 10                   # lines in /pstats top
  close-reports: true        # a punishment closes the reports about that player YOU claimed (outcome: punished)
  evidence:                   # chat lines saved with every mute and warning (shown in /history -> click an entry)
    enabled: true
    chat-lines: 10            # the player's last chat lines
    context-lines: 5          # other players' lines before them
    retention: 180d           # deleted automatically after this (privacy); IP addresses are never stored
    max-line-length: 200      # one line is cut to this many characters
    max-chars: 6000           # all lines of one punishment together
  notes:                      # /pnote: private staff notes
    max-length: 200
    shown: 3                  # newest notes on the head of /p
    cut: 40                   # characters per note there
  ack:                        # warnings: [I understand] / /ack
    repeat: 30s               # reminder every ...
    max-repeats: 3            # ... this many times (and once on the next join)
    block-until-ack: false    # true = no chat/commands (except /ack, /rules, /mypunishments) until confirmed
    bedrock-menu: true        # Bedrock players also get a small menu with one "I understand" button
  rules-link: "https://skybornmc.net/rules"
  discord:                    # punishment log on Discord. OFF: Discord is postponed (docs/LATER.md)
    enabled: false            # also needs the webhook URL, which is a SECRET: never here, only on the server in
                              # plugins/PhoenixSkyblock/secrets/discord.yml (written by server/scripts/apply-secrets.sh)
    channel: punishments      # name of the webhook in secrets/discord.yml
    queue-size: 100           # messages waiting at most (more are dropped, the punishment itself always works)
    # P8 (spec 14.9): send a notification type to its own webhook: type: <webhook name in secrets/discord.yml>.
    # Types: punishments, suggestions, approvals, appeals, watchlist, raid, guard, reports, auto, report. Nothing mapped =
    # punishments and raid go to 'channel' above, everything else is not sent. WARNING: watchlist, appeals (player
    # text), guard and approvals must only ever go to a PRIVATE staff channel (who can read it is set in Discord).
    # Example (off): channels: { appeals: appeals, guard: admin-alerts }
    channels: {}
    max-attempts: 3           # tries per message (rate limits and errors are retried)
    colors: { ban: "#e74c3c", mute: "#e67e22", warn: "#f1c40f", kick: "#95a5a6", pardon: "#2ecc71", undo: "#3498db", lockdown: "#e91e63" }
  player-view:                # /mypunishments
    show-staff: false         # owner spec: staff names hidden from players
    last-entries: 5
  chat-suggestions:           # for a chat filter that suggests punishments (never applied automatically). The API is
    spam: { hits: 3, within: 10s, reason: spam }   # ready; the detector that uses this is a separate task

  # ---------- owner spec section 13 (P4) ----------
  approval:                   # big punishments need an approver (skyblock.staff.punish.approve, admins)
    enabled: true             # staff without it create a request; nothing happens to the player until approved
    expire: 24h               # an unhandled request disappears after this
    self-approve: false       # an approver can't approve their own request
    # What needs approval. Kinds: ban (every ban), ipban, mute. Then: perm, * (any), a time (exactly), >= time, > time.
    # Also anything longer than the staff member's rank limit (moderation.yml limits) becomes a request.
    # P7: "sanction freeze|trade|money|confiscate|*" = that sanction needs an approver (it is refused for others, not queued).
    rules: ["ban perm", "ipban *", "mute perm", "ban >= 30d", "sanction money", "sanction confiscate"]
    deny-reasons: [evidence, too-harsh, wrong-reason, talked]   # buttons in the Deny menu (max 6, texts in messages)
  watchlist:                  # /watch <player> [reason]: staff get one line when they join, the player is never told
    expire: 30d               # perm = until /watch remove
    reason-max-length: 100
  probation:                  # after a mute or ban ENDS BY TIME (not pardoned, not undone, not perm) ...
    enabled: true
    duration: 14d             # ... the player is on probation this long ...
    step-bonus: 1             # ... and a new offence uses the ladder step + this (never past the last step)
  mute-ended:                 # "Your mute has ended. Please follow the rules" / "Welcome back" (once, also after being offline)
    enabled: true
    sound: notify             # a sound name from sounds.yml, "" = none

  # ---------- owner spec section 13 (P5) ----------
  bulk:                       # /pbulk <reason> <players...> and the Bulk button of /p (skyblock.staff.punish.bulk)
    max: 20                   # players in one bulk action. Always a confirm with the count; each player gets their own
                              # next ladder step; approval rules apply per player
  appeal:                     # /appeal (players), /appeals (staff queue, skyblock.staff.appeals)
    enabled: true
    appealable-types: [mute, ban]   # mute | ban | warn. A reason can say appealable: false (alt-abuse, rmt)
    cooldown: 7d              # after a denied appeal, the same punishment can be appealed again after this
    min-length: 20            # characters of the appeal text
    max-length: 500
    reminder: 48h             # open appeals older than this are listed to staff when they join
    reduce-max-days: 365      # Reduce on a permanent punishment offers up to this many days
    deny-reasons: [clear-evidence, fair, no-reason]   # buttons in the Deny menu (max 6, texts in messages)
    discord:                  # new appeals and decisions on Discord. OFF: Discord is postponed (docs/LATER.md)
      enabled: false          # also needs the webhook URL (a SECRET: secrets/discord.yml, never here)
      channel: appeals        # name of the webhook in secrets/discord.yml

  # ---------- owner spec section 13 (P6) ----------
  never-auto: [hacking, xray, macro]   # reason ids never applied without a staff click (suggestions from /psuggest and
                                       # GrimAC are never automatic anyway; this also holds in warn-rules mode: auto)
  lockdown:                   # /lockdown chat|join|off|status (skyblock.staff.lockdown). Only NEW accounts are affected;
                              # staff and every rank above default (skyblock.lockdown.bypass) never. Never punishes anyone.
    new-player-playtime: 30m  # new = total playtime below this ...
    new-player-age: 24h       # ... or first join less than this ago
    chat-default: 10m         # /lockdown chat without a time
    chat-max: 60m             # (never more than 6h)
    join-default: 5m          # /lockdown join: accounts that NEVER joined before can't join; returning players always can
    join-max: 15m             # (never more than 1h)
    staff-reminder: 60s       # staff (skyblock.staff.notify) get the status line this often while a lockdown is active
    blocked-commands: [msg, tell, w, whisper, m, pm, r, reply, mail]   # also blocked for new players in a chat lockdown
  raid:                       # raid detection: only ALERTS staff, with [Start chat lockdown] [Ignore]
    detect: true
    accounts: 15              # more than this many accounts joining for the very first time ...
    window: 30s               # ... within this time = possible raid (restarts and vote parties are existing players)
    auto-lock: false          # true = also start a chat lockdown by itself: chat only, never join, ...
    auto-duration: 5m         # ... this long (never more than 5m) ...
    auto-cooldown: 30m        # ... at most once per this time (never less than 30m)
  network:                    # network-ready (several servers sharing one database later). One server: keep enabled false
    enabled: false            # true = bans/mutes only count where their scope says (network = everywhere, server = there)
    server-id: phoenix        # stored on every new punishment
    default-scope: network    # scope of new bans and mutes (warnings and kicks are always server)

  # ---------- owner spec section 13 (P7) ----------
  sanctions:                  # /p <player> -> Sanctions (spec 13.1). Account-wide: every profile of the player.
    enabled: true
    durations: [1d, 3d, 7d, 30d, perm]   # lengths offered for freeze balance and block trading (max 7; perm = until lifted)
    reasons: [duping, scamming, rmt, exploit, other]   # preset reasons (max 7, texts in messages sanctions.reasons.<id>)
    # What each sanction blocks. Uses: pay, note, bank, shop, auction-list, auction-buy, trade
    freeze-blocks: [pay, note, bank, shop, auction-list, auction-buy, trade]
    trade-blocks: [pay, note, auction-list, auction-buy, trade]
    freeze-currencies: [money]           # a frozen balance can't spend these (crystals/gems/shards stay usable)
    freeze-exempt-reasons: [admin_take, admin_set, admin_reset, sanction_remove]   # staff may still take money
    freeze-receive-reasons: [bank_withdraw]   # a frozen player can't take money out of an island bank either
    trade-reasons: [pay, trade, ah_buy, note_withdraw]   # refused when either side is trade-blocked (economy safety net)
    money-max: 1000000000000             # most money one "remove money" takes (never more than the balance)
    dupe-suggestion:                     # a detected dupe suggests a punishment to staff (never applied by itself)
      enabled: true
      reason: exploiting                 # reason id above whose ladder is suggested (exploiting: ban 7d first)

  # ---------- owner spec section 14 (P8) ----------
  training:                   # trainees = staff with skyblock.staff.punish.trainee (a LuckPerms group, removed to graduate)
    # A trainee's action of these kinds becomes an approval request for a mentor (even small ones); nothing is applied
    # until an approver says yes. Kinds: ban, mute, kick, warn, island, sanction, bulk. Warnings are not listed (spec:
    # applied directly; approvers get [Undo]). sanction = refused for trainees (sanctions have no request queue).
    # Dry run (/p <player> <reason> -dry, Dry run button of /p) is for every staff member (skyblock.staff.punish.dry).
    requests-for: [ban, mute, kick, sanction, island, bulk]
  notify:                     # /pnotify: every staff member switches their own alert types (skyblock.staff.notify.<type>)
    always: [guard]           # types that can't be switched off

  # ---------- owner spec section 14 (P9) ----------
  guard:                      # safety net against rogue or hacked staff accounts (not a punishment)
    enabled: true
    window: 5m                # what each staff member APPLIED in this sliding window counts (requests and dry runs never)
    # One tier per rank tier of moderation.yml limits (skyblock.staff.punish.max.<tier>; helper = staff, mod = moderator).
    # mode: block = the punishment that goes over a limit is refused and the staff member is blocked until an admin runs
    # /pguard allow; alert = applied anyway, admins only get the alert. Limits per window; 0 = none allowed, -1 = no limit.
    # Bulk punishments count per player. The owner (skyblock.admin.punish.guard.exempt) is never limited.
    tiers:
      helper: { mode: block, max-bans: 5,  max-mutes: 15, max-sanctions: 0,  max-total: 25 }
      mod:    { mode: block, max-bans: 10, max-mutes: 25, max-sanctions: 3,  max-total: 40 }
      admin:  { mode: alert, max-bans: 30, max-mutes: 60, max-sanctions: 10, max-total: 100 }
    default-tier: helper      # staff without any max tier permission
    allow-default: 30m        # /pguard allow <staff> without a time: lifts the block, limits only alert for this long
    alert-rollback: 1h        # the [Rollback] button in the alert previews this period
  rollback:                   # /prollback <staff> <period> (admins): always a preview first, then a confirm
    min-period: 15m
    max-period: 7d
    confirm-window: 60s       # the preview can be confirmed this long ([Confirm] click or typing ... confirm)
  false-reports:              # a report closed as INVALID counts (no-evidence and duplicate never count)
    enabled: true
    threshold: 3              # this many invalid reports ...
    window: 30d               # ... within this time suggest the reason below (staff click [Apply] or [Dismiss])
    cap: 7d                   # at most one suggestion per player per this time
    reason: report-abuse      # reason id above
  purge:                      # /ppurge <player> preview|confirm (owner): removes a player's personal data on request
    keep-ledger: 365d         # 12 months: the minimal record (account id, type, reason id, start/end, id) of an ENDED
                              # punishment is kept this long, then deleted. 0 = keep nothing that has ended. A punishment
                              # still in force (e.g. a ban) is always kept until it ends. Check this with the privacy policy.
    confirm-window: 60s       # the typed confirm must follow the preview within this time
