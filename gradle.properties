# Build speed (owner 2026-11-02: a full build took ~7 min). Nothing here changes what is built or tested.
# Build independent modules at the same time (41 modules; most only depend on common).
org.gradle.parallel=true
# Reuse task outputs whose inputs did not change (also across worktrees on the same machine).
org.gradle.caching=true
# Enough heap for parallel compile + test workers.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC
