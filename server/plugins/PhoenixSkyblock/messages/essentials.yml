# Owner 7 Nov 2026 (OWNER_PICKS_7NOV.md): the meteor at spawn and the fishing contest.
server-events:
  meteor:
    landed: "<prefix><c:flame><bold>A meteor landed at spawn!</bold></c:flame> <c:text>Break its fragments for loot: </c:text><click:run_command:'/spawn'><c:action>/spawn</c:action></click>"
