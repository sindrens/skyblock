# Essentials messages (teleports + staff tools). MiniMessage + style tags (style.yml).
# <staff> = the staff member (in "-notify" messages), <player> = the other player.
# Format (docs/UI_STYLE.md §3): success = <c:success><sym:check></c:success> + gray text, error = <c:error><sym:cross></c:error>
# + gray text with the fix, values in <c:value>, clicks in <c:action>.

no-permission-others: "<prefix><c:error><sym:cross></c:error> <c:text>You can't use this on other players."
needs-player: "<prefix><c:error><sym:cross></c:error> <c:text>Name a player when using this from the console."
cooldown: "<prefix><c:error><sym:cross></c:error> <c:text>Slow down. Try again in <c:value><time></c:value>."

# Teleport warmup, countdown, cancel and failure texts are shared by every module: messages/core.yml → teleport.*

spawn:
  arrived: "<prefix><c:success><sym:check></c:success> <c:text>Welcome to <c:value>spawn</c:value>."
  missing: "<prefix><c:error><sym:cross></c:error> <c:text>The spawn world <c:value><world></c:value> isn't loaded. Tell staff."

tpa:
  sent: "<prefix><c:success><sym:check></c:success> <c:text>Request sent to <c:value><player></c:value>. <c:muted>Expires in <seconds>s.</c:muted> <click:run_command:'/tpcancel'><hover:show_text:'<c:text>Cancel your requests'><c:action>[Cancel]</c:action></hover></click>"
  sent-here: "<prefix><c:success><sym:check></c:success> <c:text>Asked <c:value><player></c:value> to come to you. <c:muted>Expires in <seconds>s.</c:muted> <click:run_command:'/tpcancel'><hover:show_text:'<c:text>Cancel your requests'><c:action>[Cancel]</c:action></hover></click>"
  received:
    - "<prefix><c:value><player></c:value> <c:text>wants to teleport <c:value>to you</c:value>."
    - "  <click:run_command:'/tpaccept <player>'><hover:show_text:'<c:text>Accept: <player> teleports to you'><c:action>[Accept]</c:action></hover></click>  <click:run_command:'/tpdeny <player>'><hover:show_text:'<c:text>Deny the request'><c:action>[Deny]</c:action></hover></click>  <c:muted>Expires in <seconds>s"
  received-here:
    - "<prefix><c:value><player></c:value> <c:text>wants <c:value>you</c:value> to teleport to them."
    - "  <click:run_command:'/tpaccept <player>'><hover:show_text:'<c:text>Accept: you teleport to <player>'><c:action>[Accept]</c:action></hover></click>  <click:run_command:'/tpdeny <player>'><hover:show_text:'<c:text>Deny the request'><c:action>[Deny]</c:action></hover></click>  <c:muted>Expires in <seconds>s"
  # GUI-5: the Bedrock popup (Bedrock can't click chat). <player>, <seconds>, <left>.
  popup:
    title: "Teleport request"
    name: "<c:value><player></c:value> <c:text>wants to come to you"
    lore: ["<c:text>Accept, and <player> teleports", "<c:text>to where you are.", "", "<c:muted>Expires in <left>"]
  popup-here:
    title: "Teleport request"
    name: "<c:value><player></c:value> <c:text>wants you there"
    lore: ["<c:text>Accept, and you teleport", "<c:text>to <player>.", "", "<c:muted>Expires in <left>"]
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't send a request to yourself."
  already-sent: "<prefix><c:error><sym:cross></c:error> <c:text>You already asked <c:value><player></c:value>. Wait, or use <c:value>/tpcancel</c:value>."
  target-full: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has too many requests. Try again soon."
  # F1: the target turned "Teleport requests" off in /settings.
  disabled: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>doesn't accept teleport requests."
  none: "<prefix><c:error><sym:cross></c:error> <c:text>You have no teleport requests."
  none-from: "<prefix><c:error><sym:cross></c:error> <c:text>No request from <c:value><player></c:value>."
  requester-offline: "<prefix><c:error><sym:cross></c:error> <c:text>That player is offline now."
  accepted-target: "<prefix><c:success><sym:check></c:success> <c:text>Accepted <c:value><player></c:value>'s request."
  accepted-sender: "<prefix><c:success><sym:check></c:success> <c:value><player></c:value> <c:text>accepted your request."
  arrived: "<prefix><c:success><sym:check></c:success> <c:text>Teleported to <c:value><player></c:value>."
  denied-target: "<prefix><c:success><sym:check></c:success> <c:text>Denied <c:value><player></c:value>'s request."
  denied-sender: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>denied your request."
  nothing-to-cancel: "<prefix><c:error><sym:cross></c:error> <c:text>You have no requests to cancel."
  cancelled-sender: "<prefix><c:success><sym:check></c:success> <c:text>Cancelled <c:value><count></c:value> request(s)."
  cancelled-target: "<prefix><c:value><player></c:value> <c:text>cancelled their request."
  expired-sender: "<prefix><c:muted>Your request to <player> expired."
  expired-target: "<prefix><c:muted>The request from <player> expired."
  left: "<prefix><c:muted>The request with <player> ended: they left."

tp:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Teleported to <c:value><player></c:value>."
  other: "<prefix><c:success><sym:check></c:success> <c:text>Teleported <c:value><player></c:value> to <c:value><target></c:value>."
  notify: "<prefix><c:value><staff></c:value> <c:text>teleported you to <c:value><target></c:value>."
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't teleport to yourself."
  same: "<prefix><c:error><sym:cross></c:error> <c:text>Pick two different players."

tphere:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Teleported <c:value><player></c:value> to you."
  notify: "<prefix><c:text>You were teleported to <c:value><staff></c:value>."

tppos:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Teleported to <c:value><position></c:value> <c:muted>in <world>."
  invalid: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not a coordinate. Use a number, or <c:value>~</c:value> for where you are."

top:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Teleported to the highest block."
  none: "<prefix><c:error><sym:cross></c:error> <c:text>There is no block above you."

back:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Back at your last spot."
  none: "<prefix><c:error><sym:cross></c:error> <c:text>No last spot to go back to."

home:
  none: "<prefix><c:error><sym:cross></c:error> <c:text>No staff homes yet. Set one with <c:value>/setshome [name]</c:value>."
  list: "<prefix><c:text>Your homes: <c:value><homes></c:value>. <c:muted>Use /home <name>."
  unknown: "<prefix><c:error><sym:cross></c:error> <c:text>No home <c:value><name></c:value>. Yours: <c:value><homes>"
  done: "<prefix><c:success><sym:check></c:success> <c:text>Teleported to home <c:value><name></c:value>."
  set: "<prefix><c:success><sym:check></c:success> <c:text>Home <c:value><name></c:value> set here."
  deleted: "<prefix><c:success><sym:check></c:success> <c:text>Home <c:value><name></c:value> deleted."
  limit: "<prefix><c:error><sym:cross></c:error> <c:text>Max <c:value><max></c:value> homes. Delete one with <c:value>/delshome</c:value>."
  invalid-name: "<prefix><c:error><sym:cross></c:error> <c:text>Use letters, numbers, - and _ (up to 24)."

gamemode:
  self: "<prefix><c:success><sym:check></c:success> <c:text>Game mode: <c:value><mode></c:value>."
  other: "<prefix><c:success><sym:check></c:success> <c:text>Set <c:value><player></c:value> to <c:value><mode></c:value>."
  notify: "<prefix><c:value><staff></c:value> <c:text>set your game mode to <c:value><mode></c:value>."
  invalid: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not a game mode. Use <c:value>c</c:value>, <c:value>s</c:value>, <c:value>sp</c:value> or <c:value>a</c:value>."
  no-permission: "<prefix><c:error><sym:cross></c:error> <c:text>You can't use <c:value><mode></c:value> mode."

# Owner answer 331: creative only for builders and admins, only in the creative worlds (essentials.yml staff-powers.*).
# <worlds> = staff-powers.creative-worlds, <player> = the target.
creative:
  not-allowed: "<prefix><c:error><sym:cross></c:error> <c:text>Creative mode is for builders and admins. Use <c:value>/gm sp</c:value> to look around."
  wrong-place: "<prefix><c:error><sym:cross></c:error> <c:text>Creative mode only works in <c:value><worlds></c:value>."
  other-not-allowed: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>can't use creative mode (builders and admins only)."
  other-wrong-place: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is not in a creative area (<c:value><worlds></c:value>)."
  left-area: "<prefix><c:warning><sym:dot></c:warning> <c:text>Creative mode only works in <c:value><worlds></c:value>, so you're in survival now."
  items-warning: "<prefix><c:warning><sym:dot></c:warning> <c:text>Items you take or move in creative become staff items: they can't be sold, traded or auctioned."

# Owner answers 333/334: god mode, fly and heal only in staff mode or build mode. <power>, <player>, <powers>.
powers:
  need-mode: "<prefix><c:error><sym:cross></c:error> <c:value><power></c:value> <c:text>only works in staff mode or build mode: <click:run_command:'/s'><hover:show_text:'<c:text>Click to turn on staff mode'><c:action>/s</c:action></hover></click> <c:text>or</c:text> <c:action>/build</c:action><c:text>."
  target-needs-mode: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>must be in staff mode or build mode for <c:value><power></c:value><c:text>."
  removed: "<prefix><c:warning><sym:dot></c:warning> <c:text>Staff and build mode are off, so <c:value><powers></c:value> <c:text>turned off."
  names:
    god: "God mode"
    fly: "Fly"
    heal: "Heal"
  # Other features that can give flight at the same time as /fly (FIXES1). <source> in the fly texts.
  sources:
    island: "island fly"
    staff-mode: "staff mode"
    freeze: "freeze"
    fly: "/fly"

# /fly only switches its own flight (never island fly or staff mode) and says what you really have afterwards.
# <source> = the feature that still lets you fly (powers.sources), <mode> = game mode, <player>, <staff>.
fly:
  enabled: "<prefix><c:success><sym:check></c:success> <c:text>Fly <c:value>on</c:value><c:text>. Double-tap jump to fly."
  disabled: "<prefix><c:success><sym:check></c:success> <c:text>Fly <c:value>off</c:value><c:text>."
  disabled-still-flying: "<prefix><c:success><sym:check></c:success> <c:text>/fly <c:value>off</c:value><c:text>. You can still fly here: <c:value><source></c:value><c:text>."
  enabled-other: "<prefix><c:success><sym:check></c:success> <c:text>Fly <c:value>on</c:value> <c:text>for <c:value><player></c:value><c:text>."
  disabled-other: "<prefix><c:success><sym:check></c:success> <c:text>Fly <c:value>off</c:value> <c:text>for <c:value><player></c:value><c:text>."
  disabled-still-flying-other: "<prefix><c:success><sym:check></c:success> <c:text>/fly <c:value>off</c:value> <c:text>for <c:value><player></c:value><c:text>. They can still fly: <c:value><source></c:value><c:text>."
  enabled-notify: "<prefix><c:text>You can fly now <c:muted>(<staff>)</c:muted>."
  disabled-notify: "<prefix><c:text>Your /fly was turned off <c:muted>(<staff>)</c:muted>."
  game-mode: "<prefix><c:warning><sym:dot></c:warning> <c:text>You always fly in <c:value><mode></c:value><c:text>. /fly is for survival."
  game-mode-other: "<prefix><c:warning><sym:dot></c:warning> <c:value><player></c:value> <c:text>is in <c:value><mode></c:value> <c:text>and always flies."

speed:
  fly: "<prefix><c:success><sym:check></c:success> <c:text>Fly speed: <c:value><speed></c:value>."
  walk: "<prefix><c:success><sym:check></c:success> <c:text>Walk speed: <c:value><speed></c:value>."

god:
  enabled: "<prefix><c:success><sym:check></c:success> <c:text>God mode <c:value>on</c:value>."
  disabled: "<prefix><c:success><sym:check></c:success> <c:text>God mode <c:value>off</c:value>."
  enabled-other: "<prefix><c:success><sym:check></c:success> <c:text>God mode <c:value>on</c:value> for <c:value><player></c:value>."
  disabled-other: "<prefix><c:success><sym:check></c:success> <c:text>God mode <c:value>off</c:value> for <c:value><player></c:value>."
  enabled-notify: "<prefix><c:text>God mode on <c:muted>(<staff>)</c:muted>."
  disabled-notify: "<prefix><c:text>God mode off <c:muted>(<staff>)</c:muted>."

heal:
  self: "<prefix><c:success><sym:heart></c:success> <c:text>Healed."
  other: "<prefix><c:success><sym:check></c:success> <c:text>Healed <c:value><player></c:value>."
  notify: "<prefix><c:success><sym:heart></c:success> <c:value><staff></c:value> <c:text>healed you."

feed:
  self: "<prefix><c:success><sym:check></c:success> <c:text>Hunger full."
  other: "<prefix><c:success><sym:check></c:success> <c:text>Fed <c:value><player></c:value>."
  notify: "<prefix><c:value><staff></c:value> <c:text>fed you."

clear:
  self: "<prefix><c:success><sym:check></c:success> <c:text>Inventory cleared <c:muted>(<count> items)."
  other: "<prefix><c:success><sym:check></c:success> <c:text>Cleared <c:value><player></c:value>'s inventory <c:muted>(<count> items, logged)."
  notify: "<prefix><c:value><staff></c:value> <c:text>cleared your inventory."
  confirm: "<prefix><c:text>Clear all of <c:value><player></c:value>'s inventory? <click:run_command:'/clear <player>'><hover:show_text:'<c:text>Runs /clear <player> again'><c:action>[Confirm]</c:action></hover></click> <c:muted>or repeat it within <seconds>s."

time:
  set: "<prefix><c:success><sym:check></c:success> <c:text>Time in <c:value><world></c:value>: <c:value><ticks></c:value>."
  invalid: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not a time. Use <c:value>day</c:value>, <c:value>noon</c:value>, <c:value>night</c:value>, <c:value>midnight</c:value> or 0-23999."

weather:
  set: "<prefix><c:success><sym:check></c:success> <c:text>Weather in <c:value><world></c:value>: <c:value><weather></c:value>."

give:
  self: "<prefix><c:success><sym:check></c:success> <c:text>Gave you <c:value><amount>x <item></c:value>."
  other: "<prefix><c:success><sym:check></c:success> <c:text>Gave <c:value><amount>x <item></c:value> to <c:value><player></c:value>."
  notify: "<prefix><c:text>You got <c:value><amount>x <item></c:value> from <c:value><staff></c:value>."
  boxed: "<prefix><c:text>Their inventory was full: <c:value><amount></c:value> item(s) went to <c:value><player></c:value><c:text>'s /box."
  unknown-item: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not an item. Press Tab to see them all."
  too-many: "<prefix><c:error><sym:cross></c:error> <c:text>Max <c:value><max></c:value> at once."

skull:
  given: "<prefix><c:success><sym:check></c:success> <c:text>Gave you <c:value><player></c:value>'s head."
  invalid: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not a player name."

more:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Stack filled to <c:value><amount></c:value>."
  empty: "<prefix><c:error><sym:cross></c:error> <c:text>Hold an item first."
  custom: "<prefix><c:error><sym:cross></c:error> <c:text>Custom items can't be copied."

vanish:
  enabled: "<prefix><c:success><sym:check></c:success> <c:text>You're <c:value>vanished</c:value>. Only staff can see you."
  disabled: "<prefix><c:success><sym:check></c:success> <c:text>You're <c:value>visible</c:value> again."
  enabled-other: "<prefix><c:success><sym:check></c:success> <c:text>Vanished <c:value><player></c:value>."
  disabled-other: "<prefix><c:success><sym:check></c:success> <c:text>Made <c:value><player></c:value> visible."
  enabled-notify: "<prefix><c:value><staff></c:value> <c:text>vanished you."
  disabled-notify: "<prefix><c:value><staff></c:value> <c:text>made you visible."
  still: "<prefix><c:muted>You're still vanished. /vanish to show yourself."
  staff-on: "<c:muted>[Staff]</c:muted> <c:value><player></c:value> <c:text>vanished."
  staff-off: "<c:muted>[Staff]</c:muted> <c:value><player></c:value> <c:text>is visible again."

invsee:
  opened-view: "<prefix><c:text>Viewing <c:value><player></c:value>'s <kind> <c:muted>(view only)."
  opened-edit: "<prefix><c:text>Editing <c:value><player></c:value>'s <kind>. <c:muted>Every change is logged."
  logged: "<prefix><c:muted>Logged <count> change(s) to <player>'s items."
  target-left: "<prefix><c:muted><player> left. View closed."
  self: "<prefix><c:error><sym:cross></c:error> <c:text>That's your own inventory."

# --- M1.1 join flow ---
join:
  # Join/quit lines are only shown for players with the join-message permission (ranks + staff), and only to players
  # who keep "Join & leave messages" on in /settings (also the first-join welcome line).
  message: "<c:muted>[</c:muted><c:success>+</c:success><c:muted>]</c:muted> <player>"
  quit: "<c:muted>[</c:muted><c:error>-</c:error><c:muted>]</c:muted> <player>"
  first-broadcast: "<c:ember><sym:sparkle></c:ember> <c:text>Welcome <c:value><player></c:value> to Phoenix Skyblock! <c:muted>(#<number>)"
  first-title:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    subtitle: "<c:text>Welcome, <c:value><player></c:value>"
    fade-in: 10
    stay: 70
    fade-out: 20
  welcome-back:
    title: ""
    subtitle: "<c:text>Welcome back, <c:value><player></c:value>"
    fade-in: 5
    stay: 40
    fade-out: 10
  # Shown only when the tutorial does not welcome the player (tutorial off, staff): the tutorial's start title and chat are
  # the one welcome otherwise (owner U2).
  first-welcome:
    - ""
    - "  <grad:phoenix><bold>Welcome to Phoenix Skyblock!</bold></grad>"
    - "  <c:text>Build your island in the sky."
    - ""
    - "  <c:muted><sym:bullet></c:muted> <click:run_command:'/menu'><hover:show_text:'<c:text>Open the main menu'><c:action>/menu</c:action></hover></click> <c:text>everything in one place <c:muted>(or the Nether Star)"
    - "  <c:muted><sym:bullet></c:muted> <click:run_command:'/help'><hover:show_text:'<c:text>Open the help'><c:action>/help</c:action></hover></click> <c:text>how it all works"
    - "  <c:muted><sym:bullet></c:muted> <click:run_command:'/discord'><hover:show_text:'<c:text>Join our Discord'><c:action>/discord</c:action></hover></click> <c:text>news and support"
    - ""
  # Owner answers 319/532: one line that chat, private messages and commands are logged, with the privacy link. Sent on the
  # first join after essentials.yml join.privacy-delay-seconds, so it is not on the first screen (UX review §3).
  privacy: "<prefix><c:muted>Chat, private messages and commands are logged for 30 days and staff can read them.</c:muted> <click:open_url:'https://skybornmc.net/privacy'><hover:show_text:'<c:action>Click to open'><c:sky_ice><u>Privacy</u></c:sky_ice></hover></click>"

build:
  "on": "<prefix><c:success><sym:check></c:success> <c:text>Build mode <c:value>on</c:value>. You can edit protected worlds. <c:muted>/build to stop."
  "off": "<prefix><c:success><sym:check></c:success> <c:text>Build mode <c:value>off</c:value>."
  hint: "<c:muted>Protected area <sym:dot> use </c:muted><c:value>/build</c:value><c:muted> to edit</c:muted>"

setspawn:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Spawn of <c:value><world></c:value> set to <c:value><position></c:value> (saved)."
  live-only: "<prefix><c:warning><sym:cross></c:warning> <c:text>Spawn of <c:value><world></c:value> set to <c:value><position></c:value>, but it resets on restart (world not in worlds.yml)."

protection:
  no-drop: "<c:muted>You can't drop items here.</c:muted>"
  void: "<c:text>Caught you! Back to spawn.</c:text>"

# QUICK1 drop guard: the first drop of a custom/unique item is refused (second drop or sneak + drop throws it).
drop-guard:
  ask: "<prefix><c:warning><sym:cross></c:warning> <c:text>Drop <item> <c:text>again within <c:value><seconds>s</c:value> to throw it away (or sneak + drop). <c:muted>/settings</c:muted>"
