    bar: "<c:flame><bold>Meteor</bold></c:flame> <c:muted>· <c:value><left></c:value> fragments · <time>"
    # <hp> hits left
    hit: "<c:flame>Fragment</c:flame> <c:muted>· <c:value><hp></c:value> hits left"
    # <money> <crystals> <crate>
    loot: "<prefix><c:success><sym:check></c:success> <c:text>Meteor loot: <cur:money>+<money></cur:money><c:text>, <c:value><crystals></c:value> <c:text>crystals."
