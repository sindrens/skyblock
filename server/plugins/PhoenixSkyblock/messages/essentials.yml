    gone: "<c:muted>The meteor cooled down."
  contest:
    # <minutes>
    start: "<prefix><c:flame><bold>Fishing Contest!</bold></c:flame> <c:text>Most catches in <minutes> minutes wins keys: </c:text><click:run_command:'/fish'><c:action>/fish</c:action></click>"
