# Titles & tags (/tags, /titles), tag items, the registry editor and the display editor (/display).
# MiniMessage + style tags (style.yml). Placeholders: <name>. Item texts use {placeholder}. Reload: /skyblock reload cosmetics
# Format (docs/UI_STYLE.md §3): success/error marks + gray text, values in <c:value>, clicks in <c:action>.

rarity:
  common: "<rarity:common>Common"
  uncommon: "<rarity:uncommon>Uncommon"
  rare: "<rarity:rare>Rare"
  epic: "<rarity:epic>Epic"
  legendary: "<rarity:legendary>Legendary"
  mythic: "<rarity:mythic>Mythic"
  special: "<rarity:special>Special"

unlocked:
  title: "<prefix><c:success><sym:star></c:success> <c:text>New title: <display><c:text>! <click:run_command:'/titles'><hover:show_text:'<c:text>Open /titles'><c:action>[Equip]</c:action></hover></click>"
  tag: "<prefix><c:success><sym:star></c:success> <c:text>New tag: <display><c:text>! <click:run_command:'/tags'><hover:show_text:'<c:text>Open /tags'><c:action>[Equip]</c:action></hover></click>"

equip:
  set-titles: "<prefix><c:success><sym:check></c:success> <c:text>Title equipped: <display>"
  set-tags: "<prefix><c:success><sym:check></c:success> <c:text>Tag equipped: <display>"
  removed-titles: "<prefix><c:success><sym:check></c:success> <c:text>Title removed."
  removed-tags: "<prefix><c:success><sym:check></c:success> <c:text>Tag removed."

menu:
  title: "Titles & Tags"
  info:
    - "<c:text>Equip one title and one tag."
    - "<c:text>The head on top shows your look."
  tab-titles:
    crumb: "Titles"
    name: "<c:flame><bold>Titles"
    lore: ["<c:text>Earned with achievements.", "<c:text>Owned: <c:value><owned></c:value><c:muted>/<total>"]
  tab-tags:
    crumb: "Tags"
    name: "<c:flame><bold>Tags"
    lore: ["<c:text>From crates and the store.", "<c:text>Owned: <c:value><owned></c:value><c:muted>/<total>"]
  tab-selected: ["", "<c:success><sym:check> Showing now"]
  tab-action: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to show"]
  preview:
    name: "<c:value>How you look"
    chat-label: "<c:muted>Chat:"
    tab-label: "<c:muted>Tab list:"
    message: "Hello everyone!"
  rarity: "<c:text>Rarity: <rarity>"
  earned: "<c:text>Earned: <c:muted><source>"
  status-equipped: ["", "<c:success><sym:check> Equipped"]
  status-owned: ["", "<c:text>Owned"]
  action-equip: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to equip"]
  action-unequip: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to unequip"]
  locked-name: "<c:muted><name>"
  locked-title: ["<c:error><sym:cross> Not earned yet", "<c:text>How to earn it:", "<c:value><source>"]
  locked-tag: ["<c:error><sym:cross> Not owned", "<c:text>How to get it:", "<c:value><source>"]
  default-title-source: "Keep playing: it comes with an achievement."
  default-tag-source: "Crates or the store."
  secret-name: "???"
  secret-lore: ["<c:muted><sym:time> A secret title.", "<c:muted>Find out how to earn it."]
  unequip-titles:
    name: "<c:error><sym:cross></c:error> <c:value>Remove title"
    lore: ["<c:text>Wearing: <display>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to remove"]
  unequip-tags:
    name: "<c:error><sym:cross></c:error> <c:value>Remove tag"
    lore: ["<c:text>Wearing: <display>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to remove"]
  achievements:
    name: "<c:flame>Achievements"
    lore: ["<c:text>Most titles come from these.", "<c:text>Done: <c:value><done></c:value><c:muted>/<total>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
  edit:
    name: "<c:warning>Edit titles & tags"
    lore: ["<c:text>Staff: create and change titles", "<c:text>and tags.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to edit"]
  empty:
    name: "<c:text>Nothing here yet"
    lore: ["<c:muted>New ones are added over time."]

item:
  name: "<c:flame>Tag"
  name-with-tag: "<c:flame>Tag: </c:flame>{tag}"
  description: "Adds this tag to your account. Extra copies can be traded or sold."
  preview: "<c:text>Tag: {tag}"
  rarity: "<c:text>Tag rarity: {rarity}"
  action-input: "USE"
  action-text: "to redeem"

redeem:
  crumb: "Redeem tag"
  details:
    - "<c:text>Adds <display> <c:text>to your tags"
    - "<c:text>and uses up this item."
  owned: "<prefix><c:error><sym:cross></c:error> <c:text>You already own <display><c:text>. Trade it or sell it with <c:value>/ah</c:value>."
  unknown: "<prefix><c:error><sym:cross></c:error> <c:text>This tag doesn't exist anymore. Show it to staff."
  moved: "<prefix><c:error><sym:cross></c:error> <c:text>Keep the tag item in your hand to confirm."
  error: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong. You got your item back."

unknown-tag: "<prefix><c:error><sym:cross></c:error> <c:text>No tag <c:value><id></c:value>. Press Tab to see them."

staff:
  given-title: "<prefix><c:success><sym:check></c:success> <c:text>Gave the title <c:value><id></c:value> to <c:value><player></c:value>."
  given-title-noop: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>already has the title <c:value><id></c:value>."
  taken-title: "<prefix><c:success><sym:check></c:success> <c:text>Took the title <c:value><id></c:value> from <c:value><player></c:value>."
  taken-title-noop: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>doesn't have the title <c:value><id></c:value>."
  given-tag: "<prefix><c:success><sym:check></c:success> <c:text>Gave the tag <c:value><id></c:value> to <c:value><player></c:value>."
  given-tag-noop: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>already has the tag <c:value><id></c:value>."
  taken-tag: "<prefix><c:success><sym:check></c:success> <c:text>Took the tag <c:value><id></c:value> from <c:value><player></c:value>."
  taken-tag-noop: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>doesn't have the tag <c:value><id></c:value>."
  # Titles/tags another module grants and takes by itself (the clean-streak title "honorable", spec 14.11).
  automatic-title: "<prefix><c:error><sym:cross></c:error> <c:text>The title <c:value><id></c:value> <c:text>is earned automatically. Staff can't give or take it."
  automatic-tag: "<prefix><c:error><sym:cross></c:error> <c:text>The tag <c:value><id></c:value> <c:text>is earned automatically. Staff can't give or take it."
  items-given: "<prefix><c:success><sym:check></c:success> <c:text>Gave <c:value><player></c:value> <c:value><amount></c:value> <c:text>tag item(s): <c:value><tag></c:value>."
  items-received: "<prefix><c:success><sym:check></c:success> <c:text>You got <c:value><amount></c:value> <c:text>tag item(s): <c:value><tag></c:value>. Use one to redeem it."
  console-needs-player: "<prefix><c:error><sym:cross></c:error> <c:text>Add a player: <c:value>/tags item phoenix 1 Steve</c:value>"
  unknown-player: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has never joined. Check the spelling."
  error: "<prefix><c:error><sym:cross></c:error> <c:text>That didn't work: <reason>"

editor:
  crumb-titles: "Edit titles"
  crumb-tags: "Edit tags"
  info:
    - "<c:text>Click one to edit it, or create"
    - "<c:text>a new one. Changes save instantly."
  entry-info:
    - "<c:text>Change how it looks, its rarity"
    - "<c:text>and how players get it."
  id: "<c:muted>Id: <id>"
  source: "<c:text>How to get: <c:muted><source>"
  action-edit: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to edit"]
  create-titles:
    name: "<c:success>+ New title"
    lore: ["<c:text>Create a new title.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to create"]
  create-tags:
    name: "<c:success>+ New tag"
    lore: ["<c:text>Create a new tag.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to create"]
  prompt-id: "<prefix><c:text>Type an id (a-z, 0-9, _), like <c:value>night_owl</c:value>. <c:muted>(<cancel> to cancel, <seconds>s)"
  prompt-display: "<prefix><c:text>Type how it looks (MiniMessage or & codes), like <c:value>&c[Fire]</c:value>. <c:muted>(<cancel> to cancel, <seconds>s)"
  prompt-source: "<prefix><c:text>Type how players get it (or <c:value>none</c:value>). <c:muted>(<cancel> to cancel, <seconds>s)"
  # GUI-4c: the Bedrock popups (on-screen keyboard) of the three prompts above.
  prompt-id-form:
    title: "New id"
    label: "<c:text>An id (a-z, 0-9, _), like night_owl:"
  prompt-display-form:
    title: "How it looks"
    label: "<c:text>MiniMessage or & codes, like &c[Fire]:"
  prompt-source-form:
    title: "How players get it"
    label: "<c:text>A short text, or none:"
  invalid-id: "<prefix><c:error><sym:cross></c:error> <c:text>Ids use only a-z, 0-9 and _ (max 64)."
  exists: "<prefix><c:error><sym:cross></c:error> <c:value><id></c:value> <c:text>already exists."
  empty:
    name: "<c:text>Nothing yet"
    lore: ["<c:muted>Click + to create the first one."]
  gone:
    name: "<c:text>This was deleted"
    lore: ["<c:muted>Go back to the list."]
  preview-lore: ["<c:muted>Id: <id>"]
  display:
    name: "<c:value>Look"
    lore: ["<c:text>Shown as: <shown>", "<c:muted>Text: <raw>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to change"]
  rarity:
    name: "<c:value>Rarity: <rarity>"
    lore: ["<c:text>How rare it looks in /tags.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"]
    crumb: "Rarity"
  source-item:
    name: "<c:value>How to get it"
    lore: ["<c:text><source>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to change"]
  none: "<c:muted>(not set)"
  secret:
    name: "<c:value>Secret"
    lore: ["<c:text>Shown as ??? until earned."]
  season:
    name: "<c:value>Kept across seasons"
    lore: ["<c:text>Players keep it when a new", "<c:text>season starts."]
  give-item:
    name: "<c:value>Get a tag item"
    lore: ["<c:text>A redeemable item of this tag", "<c:text>in your inventory.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to get one"]
  delete:
    name: "<c:error>Delete"
    lore: ["<c:text>Removes it from the menu.", "<c:text>Players who own it lose it from view.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to delete"]
    crumb: "Delete"
    details: ["<c:text>This removes it for everyone."]
  saved: "<prefix><c:success><sym:check></c:success> <c:text>Saved: <display>"
  deleted: "<prefix><c:success><sym:check></c:success> <c:text>Deleted <c:value><id></c:value>."
  save-failed: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't save: <reason>"

display:
  crumb-staff: "Staff"
  crumb: "Display"
  info:
    - "<c:text>How players look in chat, tab"
    - "<c:text>and above heads. Preview first."
  no-chat:
    name: "<c:error><sym:cross> Chat module is off"
    lore: ["<c:text>The formats live in chat.yml.", "<c:text>Enable the chat module first."]
  parts:
    name: "<c:info>Parts you can use"
    lore:
      - "<c:value><rank></c:value> <c:text>rank prefix"
      - "<c:value><name></c:value> <c:text>name in rank color (nickname aware)"
      - "<c:value><title></c:value> <c:text>title,</c:text> <c:value><tag></c:value> <c:text>tag"
      - "<c:value><message></c:value> <c:text>the message (chat only)"
      - "<c:value><afk></c:value> <c:text>AFK marker (tab only)"
      - "<c:value><value></c:value> <c:text>inside title/tag/AFK parts"
      - "<c:text>Colors: style tags, hex or gradients."
      - "<c:text>Empty parts disappear by themselves."
  fields:
    chat:
      name: "<c:value>Chat line"
      lore: ["<c:text>The order of everything in chat."]
    title-part:
      name: "<c:value>Title in chat"
      lore: ["<c:text>How a title looks in chat.", "<c:text>Empty = titles hidden in chat."]
    tag-part:
      name: "<c:value>Tag in chat"
      lore: ["<c:text>How a tag looks in chat.", "<c:text>Empty = tags hidden in chat."]
    tab:
      name: "<c:value>Tab entry"
      lore: ["<c:text>The order of everything in tab."]
    tab-title-part:
      name: "<c:value>Title in tab"
      lore: ["<c:text>How a title looks in tab."]
    tab-tag-part:
      name: "<c:value>Tag in tab"
      lore: ["<c:text>How a tag looks in tab."]
    afk-part:
      name: "<c:value>AFK marker"
      lore: ["<c:text>Shown in tab and above heads."]
    nametag:
      name: "<c:value>Rank above heads"
      lore: ["<c:text>Show the rank prefix above", "<c:text>players' heads."]
  current: "<c:text>Now: <c:muted><raw>"
  default: "<c:text>Default: <c:muted><raw>"
  action-edit: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to change"]
  preview:
    name: "<c:value>Preview (you)"
    afk-label: "<c:muted>AFK marker:"
  prompt: "<prefix><c:text>Type the new <c:value><field></c:value>. <c:value>default</c:value> resets, <c:value>empty</c:value> clears. <c:muted>(<cancel> to cancel, <seconds>s)"
  # GUI-4c: the Bedrock popup of the prompt above. <field> the format's path.
  prompt-form:
    title: "Display format"
    label: "<c:text>New <field> (default resets, empty clears):"
  confirm-crumb: "Save display"
  confirm-details: ["<c:text>Old: <c:muted><old>", "<c:text>New: <c:value><new>", "<c:text>The head shows the preview."]
  saved: "<prefix><c:success><sym:check></c:success> <c:text>Saved <c:value><field></c:value>. Live for everyone."
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>Not saved: <reason>"
