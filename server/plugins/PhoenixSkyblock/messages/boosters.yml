# Boosters (PHASE-10 M10.2): /boosters, /thanks, booster items. MiniMessage + style tags (style.yml).
# Reload: /skyblock reload boosters
# Placeholders are plain text: <type> (Sell, Skill XP ...), <percent> (a number), <time>/<total>/<left>/<wait> (like 12m 30s).

error: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong. Your booster item is back in your inventory or /box."
loading: "<prefix><c:error><sym:cross></c:error> <c:text>Boosters are still loading. Try again in a moment."
busy: "<prefix><c:error><sym:cross></c:error> <c:text>Your last booster is still starting. One moment."
frozen: "<prefix><c:error><sym:cross></c:error> <c:text>You can't start boosters while frozen."
staff-mode: "<prefix><c:error><sym:cross></c:error> <c:text>You can't start boosters in staff mode."
switching: "<prefix><c:error><sym:cross></c:error> <c:text>Wait until your profile switch is done."
no-permission: "<prefix><c:error><sym:cross></c:error> <c:text>You can't use boosters."
invalid: "<prefix><c:error><sym:cross></c:error> <c:text>This booster item is broken. Ask staff to look at it."
moved: "<prefix><c:error><sym:cross></c:error> <c:text>That booster item is not in your inventory anymore."
not-yours: "<prefix><c:error><sym:cross></c:error> <c:text>This booster belongs to another profile. Only that profile can start it."
already-used: "<prefix><c:error><sym:cross></c:error> <c:text>This booster item was already used, so it was removed. Staff can see it in the logs."

# Booster type names.
types:
  sell: "Sell"
  skill_xp: "Skill XP"
  tool_xp: "Tool XP"
  crystals: "Crystals"
  shards: "Shards"

# Scoreboard timer row (G7-R1-01): the label of the soonest-ending booster, plain (the board colours it and adds the
# time: "Booster: +50% Sell 37m"). <percent> a number, <type> a type name above.
scoreboard:
  timer: "Booster: +<percent>% <type>"

# Booster items. Name and lore use {type}, {percent} and {time} (filled in by the item, plain text).
item:
  personal:
    name: "{type} Booster +{percent}%"
    description: "Use it to start. The same type adds time."
    lore:
      - "<c:bar>| </c:bar><c:text>Bonus: <c:value>+{percent}% {type}"
      - "<c:bar>| </c:bar><c:text>Time: <c:value>{time}"
      - "<c:muted>Counts only while you play."
  global:
    name: "Global {type} Booster +{percent}%"
    description: "Use it to start it for everyone online."
    lore:
      - "<c:bar>| </c:bar><c:text>Bonus: <c:value>+{percent}% {type}</c:value> <c:text>for everyone"
      - "<c:bar>| </c:bar><c:text>Time: <c:value>{time}"
      - "<c:muted>Players can thank you for credits."
  # Owner 7 Nov 2026: island boosters (every member of the island, everywhere).
  island:
    name: "Island {type} Booster +{percent}%"
    description: "Use it on your island's behalf: every member gets the bonus."
    lore:
      - "<c:bar>| </c:bar><c:text>Bonus: <c:value>+{percent}% {type}</c:value> <c:text>for your whole island"
      - "<c:bar>| </c:bar><c:text>Time: <c:value>{time}"
      - "<c:muted>Runs in real time, also while you're offline."
  bound: "<c:muted>Can't be traded: only this profile can use it."
  action-input: "USE"
  action-text: "to start"

personal:
  started: "<prefix><c:success><sym:sparkle></c:success> <c:text>Your <c:value>+<percent>% <type> booster</c:value> <c:text>is running for <c:value><time></c:value><c:text>."
  extended: "<prefix><c:success><sym:sparkle></c:success> <c:text>Added <c:value><time></c:value> <c:text>to your +<percent>% <type> booster. Time left: <c:value><total></c:value><c:text>."
  bank-started: "<prefix><c:success><sym:sparkle></c:success> <c:text>Your banked <c:value>+<percent>% <type> booster</c:value> <c:text>started (<c:value><time></c:value><c:text>). Time left: <c:value><total></c:value><c:text>."
  ended: "<prefix><c:muted><sym:time></c:muted> <c:text>Your +<percent>% <type> booster ended. <c:muted>/boosters"
  resumed: "<prefix><c:success><sym:sparkle></c:success> <c:text>Your boosters are running again (<c:value><count></c:value><c:text>). See <c:value>/boosters</c:value><c:text>."
  full: "<prefix><c:error><sym:cross></c:error> <c:text>A <type> booster can hold at most <c:value><max></c:value><c:text>. Time left now: <c:value><left></c:value><c:text>. Keep this one for later."
  other-strength: "<prefix><c:error><sym:cross></c:error> <c:text>Your +<running>% <type> booster runs for <c:value><left></c:value><c:text>. Start this +<percent>% one after it ends."

global:
  disabled: "<prefix><c:error><sym:cross></c:error> <c:text>Global boosters are turned off right now. Keep the item."
  queue-full: "<prefix><c:error><sym:cross></c:error> <c:text>There are already <c:value><max></c:value> <c:text>global <type> boosters waiting. Try again later."
  started-own: "<prefix><c:success><sym:sparkle></c:success> <c:text>Your <c:value>global +<percent>% <type> booster</c:value> <c:text>runs for everyone for <c:value><time></c:value><c:text>. Thanks give you credits!"
  started: "<tag:booster><bold>[Booster]</bold></tag> <c:value><name></c:value> <c:text>started a <c:value>global +<percent>% <type> booster</c:value> <c:text>for <time>! Say <c:action>thanks</c:action> <c:text>or type <c:action>/thanks</c:action><c:text>."
  started-queued: "<tag:booster><bold>[Booster]</bold></tag> <c:text>The next <c:value>global +<percent>% <type> booster</c:value> <c:text>from <c:value><name></c:value> <c:text>runs now for <time>! Say <c:action>thanks</c:action><c:text>."
  queued: "<prefix><c:success><sym:check></c:success> <c:text>Your global +<percent>% <type> booster is in line (number <c:value><position></c:value><c:text>). It starts in about <c:value><wait></c:value><c:text>."
  queued-all: "<tag:booster><bold>[Booster]</bold></tag> <c:value><name></c:value> <c:text>queued a global +<percent>% <type> booster. It starts in about <wait>."
  ended: "<tag:booster><bold>[Booster]</bold></tag> <c:text>The global +<percent>% <type> booster from <c:value><name></c:value> <c:text>ended (<thanks> thanks)."
  # Boss bar: <queued> = boosters of this type waiting.
  bar: "<c:flame><sym:star></c:flame> <c:value>Global +<percent>% <type></c:value> <c:muted><sym:dot></c:muted> <c:text><time> <c:muted><sym:dot></c:muted> <c:text>from <name> <c:muted><sym:dot></c:muted> <c:action>/thanks"

thanks:
  disabled: "<prefix><c:error><sym:cross></c:error> <c:text>Thanks are turned off right now."
  none: "<prefix><c:error><sym:cross></c:error> <c:text>No global booster is running right now."
  own: "<prefix><c:error><sym:cross></c:error> <c:text>That is your own booster. Others thank you for it."
  already: "<prefix><c:muted><sym:check></c:muted> <c:text>You already thanked every running global booster."
  sent: "<prefix><c:success><sym:check></c:success> <c:text>You thanked <c:value><name></c:value> <c:text>for the global <type> booster. They got <cur:credits><credits> credit</cur:credits><c:text>."
  sent-no-credit: "<prefix><c:success><sym:check></c:success> <c:text>You thanked <c:value><name></c:value> <c:text>for the global <type> booster."
  received: "<c:value><name></c:value> <c:text>thanked you! <cur:credits>+<credits> credit"
  received-no-credit: "<c:value><name></c:value> <c:text>thanked you!"

settings:
  booster-bar:
    name: "Global booster bar"
    lore:
      - "<c:text>Show a boss bar while a global"
      - "<c:text>booster runs for everyone."

menu:
  title: "Boosters"
  info:
    - "<c:text>Row 2: your own boosters."
    - "<c:text>Row 4: global boosters for everyone."
    - "<c:text>Row 5: booster items you carry."
    - "<c:text>Click an item to start it."
  loading:
    name: "<c:muted>Loading your boosters..."
    lore: []
  summary:
    name: "<c:flame><sym:star></c:flame> <c:value>Your boosters"
    lore:
      - "<c:text>The same type never stacks: a"
      - "<c:text>new booster adds time instead."
      - "<c:text>Personal boosters only count"
      - "<c:text>down while you play this profile."
      - ""
      - "<c:muted>All bonuses together stay inside"
      - "<c:muted>the caps (sell: +300% in total)."
  personal:
    running:
      name: "<c:success><type> booster"
      lore:
        - "<c:bar>| </c:bar><c:text>Running: <c:value>+<percent>%"
        - "<c:bar>| </c:bar><c:text>Time left: <c:value><time>"
    idle:
      name: "<c:muted><type> booster"
      lore:
        - "<c:locked>Not running"
    banked:
      - "<c:text>Banked: <c:value>+<percent>%</c:value> <c:muted>for <time>"
      - "<c:muted>Starts by itself when this type"
      - "<c:muted>is free."
    banked-held:
      - "<c:text>Banked: <c:value>+<percent>%</c:value> <c:muted>for <time>"
      - "<c:muted>Starts when you leave the AFK pool."
    global: ["<c:text>Global booster: <c:value>+<percent>%"]
    footer:
      - ""
      - "<c:muted>Most time per type: <max>"
  global:
    running:
      name: "<c:flame>Global <type> +<percent>%"
      lore:
        - "<c:text>Everyone online gets <c:value>+<percent>%"
        - "<c:bar>| </c:bar><c:text>Time left: <c:value><time>"
        - "<c:text>Started by <c:value><name>"
        - "<c:bar>| </c:bar><c:text>Thanks so far: <c:value><thanks>"
    idle:
      name: "<c:muted>Global <type> booster"
      lore:
        - "<c:locked>Not running"
        - "<c:muted>Global boosters come from the"
        - "<c:muted>Phoenix and Eclipse crates."
    queue-line: "<c:muted><sym:bullet></c:muted> <c:text>Next: <c:value><name></c:value> <c:muted>+<percent>% for <time>, in <wait>"
    queue-more: "<c:muted>... and <more> more waiting"
    thank:
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to thank <name>"
      - "<c:muted>(they get <credits> credit)"
    thanked:
      - ""
      - "<c:success><sym:check></c:success> <c:text>You thanked <name>."
    own:
      - ""
      - "<c:muted>This is your booster."
  owned:
    personal:
      name: "<c:value><type> Booster +<percent>%"
      lore:
        - "<c:bar>| </c:bar><c:text>Bonus: <c:value>+<percent>% <type>"
        - "<c:bar>| </c:bar><c:text>Time: <c:value><time>"
    island:
      name: "<c:island>Island <type> Booster +<percent>%"
      lore:
        - "<c:text>Every member of your island gets <c:value>+<percent>%"
        - "<c:bar>| </c:bar><c:text>Time: <c:value><time>"
        - ""
        - "<bold><c:action>» CLICK</c:action></bold> <c:text>to start it"
    global:
      name: "<c:flame>Global <type> Booster +<percent>%"
      lore:
        - "<c:text>Everyone online gets <c:value>+<percent>%"
        - "<c:bar>| </c:bar><c:text>Time: <c:value><time>"
    action:
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to start it"
    more:
      name: "<c:muted>And <more> more"
      lore: ["<c:text>Start these from your inventory."]
    none:
      name: "<c:muted>No booster items"
      lore:
        - "<c:text>Boosters come from crates, the"
        - "<c:text>daily calendar and quests."
  # Confirm before a booster item is used up: the details go on the middle item (GUI design 4).
  confirm:
    crumb: "Confirm Booster"
    personal: ["<c:text>Use up this booster item.", "<c:text>You get <c:value>+<percent>% <type></c:value> <c:text>for <c:value><time></c:value><c:text>."]
    global: ["<c:text>Use up this booster item.", "<c:text>Everyone online gets <c:value>+<percent>% <type></c:value><c:text>.", "<c:text>It runs <c:value><time></c:value> <c:text>(or queues after others)."]
    island: ["<c:text>Use up this booster item.", "<c:text>Every member of your island gets <c:value>+<percent>% <type></c:value>", "<c:text>for <c:value><time></c:value><c:text>, everywhere."]
  # Owner 7 Nov 2026 (boosters v2): one row per kind, island boosters and the shop.
  row:
    personal:
      name: "<c:you><bold>Personal"
      lore: ["<c:text>Only you, while you play."]
    island:
      name: "<c:island><bold>Island"
      lore: ["<c:text>Every member of your island,", "<c:text>everywhere, in real time."]
    global:
      name: "<c:event><bold>Server"
      lore: ["<c:text>Everyone online. Buy one in /store", "<c:text>and your name is on the bar."]
  island:
    running:
      name: "<c:island><bold>Island <type> +<percent>%"
      lore: ["<c:text>Every member gets it.", "<c:bar>| </c:bar><c:text>Time left: <c:value><time>"]
    idle:
      name: "<c:muted>Island <type>"
      lore: ["<c:text>Not running.", "<c:muted>Island boosters: KOTH, crates, the Shop."]
    no-island:
      name: "<c:muted>Island <type>"
      lore: ["<c:text>You need an island for island boosters."]
  shop-button:
    name: "<c:money><bold>Booster Shop"
    lore: ["<c:text>Personal boosters for money,", "<c:text>island boosters for crystals.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]

# Owner 7 Nov 2026 (boosters v2): island boosters. <player> <type> <percent> <time> <max>
island:
  started: "<prefix><c:island><sym:sparkle></c:island> <c:value><player></c:value> <c:text>started an island booster: <c:value>+<percent>% <type></c:value> <c:text>for every member, <c:value><time></c:value><c:text>."
  disabled: "<prefix><c:error><sym:cross></c:error> <c:text>Island boosters are off right now."
  no-island: "<prefix><c:error><sym:cross></c:error> <c:text>You need an island to start an island booster: <click:run_command:'/is'><c:action>/is</c:action></click>"
  other-strength: "<prefix><c:error><sym:cross></c:error> <c:text>Your island already runs another <c:value><type></c:value> <c:text>booster. Wait until it ends."
  full: "<prefix><c:error><sym:cross></c:error> <c:text>That would be more than <c:value><max></c:value> <c:text>of island <type> boosters. Wait a bit."

# Owner 7 Nov 2026: /boosters, Shop. <type> <percent> <time> <price>
shop:
  title: "Shop"
  crumb: "Buy this booster?"
  row-personal:
    name: "<c:you><bold>Personal"
    lore: ["<c:text>For you, paid with money."]
  row-island:
    name: "<c:island><bold>Island"
    lore: ["<c:text>For your whole island, paid with crystals."]
  personal:
    name: "<c:value><bold><type> +<percent>%"
    lore: ["<c:muted>PERSONAL BOOSTER", "<c:bar>| </c:bar><c:text>Time: <c:value><time>", "<c:bar>| </c:bar><c:text>Price: <price>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to buy"]
  island:
    name: "<c:value><bold>Island <type> +<percent>%"
    lore: ["<c:muted>ISLAND BOOSTER", "<c:text>Every member, everywhere.", "<c:bar>| </c:bar><c:text>Time: <c:value><time>", "<c:bar>| </c:bar><c:text>Price: <price>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to buy"]
  confirm: ["<c:bar>| </c:bar><c:text>Price: <price>", "<c:muted>The booster goes to your inventory (or /box)."]
  bought: "<prefix><c:success><sym:check></c:success> <c:text>Bought: <c:value><type> +<percent>%</c:value><c:text>. Right-click it to start."
  not-enough: "<prefix><c:error><sym:cross></c:error> <c:text>You need <price><c:text>."
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>Buying failed. Nothing was taken; try again."
  unavailable: "<prefix><c:error><sym:cross></c:error> <c:text>That booster can't be bought right now."
