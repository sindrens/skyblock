  signpost_crate_yard: "<c:flame><bold>Crate Yard"
  signpost_forge_quarter: "<c:flame><bold>Forge Quarter"
  signpost_market_square: "<c:flame><bold>Market Square"
  signpost_tavern: "<c:flame><bold>Tavern"
  signpost_hall_of_heroes: "<c:flame><bold>Hall of Heroes"
  portal_to_warzone: "<c:flame><bold>Warzone <c:muted>· KOTH: /koth"
  portal_to_depths: "<c:flame><bold>Farm & Mine <c:muted>· /farm /mine"
  portal_to_island: "<c:flame><bold>Your Island"
  portal_to_outposts: "<c:flame><bold>The Pond <c:muted>· /fish"
