# Format of a build's own text (ids without a text above). <text> the builder's text, never parsed.
hologram-fallback: "<c:flame><bold><text>"

# Last line of every hologram you can click (it has a hologram-help text below), A5-R1-01. Boards, portals and signs
# without a click never get it.
hologram-click: "<c:muted>Click me"

# Help shown when a hologram is clicked (gets an invisible click box). Title: hologram-names.<id>, else the id.
hologram-names:
  info_board: "Phoenix Skyblock"
  rules_board: "Rules"
  spawn_map: "Spawn map"
  key_board: "Crate keys"
  blueprint_wall: "Blueprints"
  dungeon_board: "Farm & Mine"
  ah_board: "Auction House"
  vote_party: "Vote Party"
hologram-help:
  info_board:
    - "<c:text>Start with <c:value>/menu</c:value><c:text>: every feature is there."
    - "<c:text>Create your island with <c:value>/is</c:value><c:text>."
  rules_board:
    - "<c:text>Read all rules with <c:value>/rules</c:value><c:text>."
