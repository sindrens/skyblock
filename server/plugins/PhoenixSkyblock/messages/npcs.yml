# ------------------------------------------------------------------ leaderboards (V2 style, like messages/items.yml hologram.*)
leaderboard:
  # <title> leaderboard.titles.<id>, else the id
  title: "<c:header><bold><title>"
  # <place>, <player> name, <value> formatted value. #1-#3 use the top1/top2/top3 colors.
  top1: "<bold><c:top1>#1</c:top1></bold> <c:value><player></c:value> <c:muted>·</c:muted> <value>"
  top2: "<bold><c:top2>#2</c:top2></bold> <c:value><player></c:value> <c:muted>·</c:muted> <value>"
  top3: "<bold><c:top3>#3</c:top3></bold> <c:value><player></c:value> <c:muted>·</c:muted> <value>"
  place: "<c:muted>#<place></c:muted> <c:value><player></c:value> <c:muted>·</c:muted> <value>"
  # A place nobody holds yet (keeps the board the same height).
  empty-place: "<c:locked>#<place> -"
  # Owner 7 Nov 2026: an empty board says so on its first line.
  be-first: "<c:muted>#1</c:muted> <c:value>Be the first!"
  coming-soon: "<c:muted>Coming soon"
  # <minutes> leaderboards.refresh-minutes
  footer: "<c:muted>Updates every <minutes> min"
  unknown-player: "Unknown"
  unknown-island: "Unnamed island"
  value:
    # <amount> formatted with the currency symbol
    currency: "<c:money><amount>"
    # <level>, <xp>
    skill: "<c:value>Lv <level>"
    # <amount>
    island: "<c:value><amount>"
    # PHASE-5 M5.2 island_level boards. <level>
    island-level: "<c:value>Lv <level>"
    # island_value boards (block worth). <amount> with the money symbol
    island-value: "<c:money><amount>"
    # PHASE-5 M5.7 weekly boards: island_gain <points> (earned level points this week), pillar_gain <levels>
    island-gain: "<c:value>+<points> XP"
    pillar-gain: "<c:value>+<levels> lv"
    # Boards set to 'cycle' switch Solo/Team every few seconds; this tag says which one is shown. <value> the line above
    cycle-solo: "<value> <c:muted>Solo"
    cycle-team: "<value> <c:muted>Team"
    # F13a milestone boards. <points> completed milestone tiers
    milestones: "<c:value><points> pts"
    # Owner 7 Nov 2026: Top Tools. <score> prestiges, a rebirth counting 50
    tool-prestige: "<c:flame><score> ★"
  titles:
    island_top_solo: "Top Islands <c:muted>· Solo"
    island_top_team: "Top Islands <c:muted>· Team"
    weekly_island_gain: "Island Gain <c:muted>· Week"
    weekly_pillar_gain: "Pillar Gain <c:muted>· Week"
    boss_damage: "Island Worth"
    mining: "Top Mining"
    foraging: "Top Tools"
    combat: "Top Combat"
    farming: "Top Farming"
    fishing: "Top Fishing"
    baltop: "Richest Players"
    money: "Richest Players"
    milestones_island: "Island Milestones"
    milestones_personal: "Personal Milestones"

# ------------------------------------------------------------------ staff tools (/skyblock npcs)
admin:
  kind:
    npc: "NPC"
    hologram: "Hologram"
    board: "Leaderboard"
  state:
    spawned: "spawned"
    unloaded: "chunk not loaded"
  # Console list. <npcs>, <holograms>, <boards> counts
  list:
    header: "<prefix><c:text>From the builds: <c:value><npcs></c:value> NPCs, <c:value><holograms></c:value> holograms, <c:value><boards></c:value> leaderboards."
    # <kind>, <id>, <world>, <x> <y> <z>, <state>
    line: "<c:muted> - </c:muted><c:value><id></c:value> <c:muted>(<kind>)</c:muted> <c:text><world> <x>, <y>, <z></c:text> <c:muted><state>"
  players-only: "<prefix><c:error><sym:cross></c:error> <c:text>Only players can teleport."
  tp:
    # <id>
    done: "<prefix><c:success><sym:check></c:success> <c:text>Teleported to <c:value><id></c:value>."
    unknown: "<prefix><c:error><sym:cross></c:error> <c:text>No NPC or hologram <c:value><id></c:value>. See <c:value>/skyblock npcs list</c:value>."
    # <world>
    no-world: "<prefix><c:error><sym:cross></c:error> <c:text>World <c:value><world></c:value> isn't loaded."
  # <total> points placed
  respawned: "<prefix><c:success><sym:check></c:success> <c:text>Respawned <c:value><total></c:value> NPCs, holograms and leaderboards from the builds."
  menu:
    crumb: "NPCs & Holograms"
    info: ["<c:text>Every NPC, hologram and leaderboard", "<c:text>from the builds. Click one to go there."]
    empty:
      name: "<c:muted>Nothing placed"
      lore: ["<c:text>Apply a build first:", "<c:value>/skyblock builds apply <id>"]
    # <name>, <id>, <kind>, <role>, <world>, <x> <y> <z>, <state>
    entry:
      name: "<c:flame><name>"
      lore:
        - "<c:muted><kind> <sym:dot> <id>"
        - "<c:text>Role: <c:value><role>"
        - "<c:text><world> <x>, <y>, <z>"
        - "<c:muted><state>"
        - ""
        - "<c:action>Click to teleport"
