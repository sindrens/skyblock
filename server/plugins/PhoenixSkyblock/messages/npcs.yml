# NPCs, holograms and leaderboards (NPCHOLO): name texts, help texts, hologram texts, leaderboard lines and staff tools.
# MiniMessage + style tags (style.yml). Bedrock-safe symbols only. Keep help short: a few lines, plain words
# (owner answer 44: things are explained where they are, item lores stay clean and simple).
# Holograms are the same for every viewer (Java colors; Geyser converts them for Bedrock).
# Reload (respawns everything): /skyblock reload npcs

# ------------------------------------------------------------------ NPC name text (above the NPC)
# A5-R1-01: "[ Banker ]" bold flame, then the command it runs in white (npc.command, only when the role runs one and
# npcs.yml npcs.command-line is on), then "Click me" muted. One action word: Click.
npc:
  # <name> NPC name (npc-names.<id>, else roles.<role>.name), <command> npc.command plus a line break (or nothing),
  # <hint> one of the hints below
  label: "<c:flame><bold>[ <name> ]</bold></c:flame><newline><command><hint>"
  # <command> the command without the slash
  command: "<c:value>/<command>"
  hint-action: "<c:muted>Click me"
  hint-help: "<c:muted>Click for help"

# Names per NPC id (when it differs from the role name).
npc-names:
  depths_forge: "Blacksmith"
  depths_sell: "Merchant"
  depths_guide: "Depths Guide"
  mine_foreman: "Foreman"
  help: "Info Clerk"

# ------------------------------------------------------------------ roles: name + help
# Action NPCs: one plain click runs the action and, the first time each session, prints this help (npcs.yml npcs.help-once).
# Help-only NPCs show it on every click; sneak-click always shows it.
roles:
  # The spawn guide (start flow, owner 3 Nov 2026): this name is also used in the start boss bar and /start.
  guide:
    name: "Rowan"
    help:
      - "<c:text>Welcome to Phoenix Skyblock! I'm Rowan."
      - "<c:text>Your island, the farm and the mine: <c:value>/start</c:value>"
      - "<c:text>Everything else: <c:value>/menu</c:value> <c:muted>·</c:muted> <c:text>help: <c:value>/help"
  info:
    name: "Info"
    help:
      - "<c:text>Questions? Every topic is in <c:value>/help</c:value><c:text>."
      - "<c:text>Rules: <c:value>/rules</c:value> <c:muted>·</c:muted> <c:text>staff help on Discord."
  forge:
    name: "Blacksmith"
    help:
      - "<c:text>Your island hoe and pickaxe:"
      - "<c:text>levels, enchants, prestige: <c:value>/tool</c:value>"
      - "<c:text>Tools keep their level when forged."
  enchanter:
    name: "Enchanter"
    help:
      - "<c:text>Put enchant books on your tools."
      - "<c:text>Pay with island crystals: <c:value>/enchanter"
  wardrobe:
    name: "Tailor"
    help:
      - "<c:text>Save and swap armor sets: <c:value>/wardrobe"
  bank:
    name: "The Banker"
    help:
      - "<c:text>Keep money safe and earn interest."
      - "<c:text>Open it any time: <c:value>/bank"
  shop:
    name: "Juniper"
    help:
      - "<c:text>Buy blocks and items: <c:value>/shop"
  sell:
    name: "Merchant"
    help:
      - "<c:text>Sell your loot for money: <c:value>/sell"
  auction:
    name: "Ollie"
    help:
      - "<c:text>Buy and sell with other players."
      - "<c:text>Open it any time: <c:value>/ah"
  dungeon:
    name: "Depths Guide"
    help:
      - "<c:text>Pick a tier to travel to: <c:value>/dungeon"
      - "<c:text>Level your skills to open new tiers."
  foreman:
    name: "Foreman"
    help:
      - "<c:text>Mine the ore field in this tier."
      - "<c:text>Higher Mining levels open deeper tiers."
      - "<c:text>Travel between tiers: <c:value>/dungeon"
  crates:
    name: "Crate Keeper"
    help:
      - "<c:text>Open crates with your keys: <c:value>/crates"
      - "<c:text>Keys come from the daily calendar and playtime."
  black_market:
    name: "Black Market"
    help:
      - "<c:text>Rare goods. The stock changes at every restock."
      - "<c:text>Open it any time: <c:value>/blackmarket"
  quests:
    name: "Contract Board"
    help:
      - "<c:text>Daily and weekly contracts: <c:value>/contracts"
      - "<c:text>Finish all your dailies for a key."
  daily:
    name: "Daily Rewards"
    help:
      - "<c:text>Claim one reward every day: <c:value>/daily"
      - "<c:text>Missing a day never sends you back."
  vote:
    name: "Voting"
    help:
      - "<c:text>Vote for us every day for keys and credits: <c:value>/vote"
      - "<c:text>Votes fill the vote party on the board."

  # Tutorial spawn NPCs (owner 4 Nov 2026): friendly names, each points to the next one in the tour.
  farm_merchant:
    name: "Bramble"
    help:
      - "<c:text>I buy every crop you harvest: <c:value>/sell"
      - "<c:text>The farm is always ripe: <c:value>/farm"
  mine_merchant:
    name: "Flint"
    help:
      - "<c:text>I buy every ore you mine: <c:value>/sell"
      - "<c:text>Better ores show up as you mine: <c:value>/mine"
  tinker:
    name: "Tinker"
    help:
      - "<c:text>Your island hoe and pickaxe level up as you use them."
      - "<c:text>Upgrades and storage: <c:value>/tool"
  sage:
    name: "Sage"
    help:
      - "<c:text>Every skill grows as you play: <c:value>/skills"
      - "<c:text>Higher skills give more crops and ores."
  fish_merchant:
    name: "Marla"
    help:
      - "<c:text>I buy every fish you catch: <c:value>/sell"
      - "<c:text>Your rod levels up as you fish: <c:value>/tool"
  arena_master:
    name: "Warden Hale"
    help:
      - "<c:text>200 kills in a ring earn a Sigil."
      - "<c:text>Spend it on that ring's boss: <c:value>/pve boss"

# ------------------------------------------------------------------ help dialog
help:
  # <name> NPC or hologram name
  header: "<c:flame><bold><name>"
  open: "<c:action><bold>[Open]"
  # <command> the command it runs
  open-hover: "<c:text>Click to open <c:value><command>"
  missing: "<c:text>Nothing to explain here yet."
  menu:
    crumb: "<name>"
    open:
      name: "<c:success><bold>Open"
      lore: ["<c:muted><command>"]

