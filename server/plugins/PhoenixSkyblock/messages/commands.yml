# Command framework messages: usage, errors, cooldowns, confirmations (used by every command).
# MiniMessage + style tags (style.yml). /skyblock reload core applies changes.
# Format (docs/UI_STYLE.md §3): <prefix> + success "<c:success><sym:check></c:success> <c:text>..." or
# error "<c:error><sym:cross></c:error> <c:text>problem. Fix." Values in <c:value>, clicks in <c:action>.

usage: "<prefix><c:error><sym:cross></c:error> <c:text>Usage: <click:suggest_command:'<example>'><hover:show_text:'<c:text><description><newline><c:action>Click to fill in'><c:value><usage></c:value></hover></click>"
# FIXES1: a word our command can't take (unknown option, or too many words), instead of Minecraft's grey
# "Incorrect argument for command ... <--[HERE]". <input> = the first word that doesn't fit.
unknown-input: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>doesn't fit here. Usage: <click:suggest_command:'<example>'><hover:show_text:'<c:text><description><newline><c:action>Click to fill in'><c:value><usage></c:value></hover></click>"
players-only: "<prefix><c:error><sym:cross></c:error> <c:text>Only players can use this."
console-only: "<prefix><c:error><sym:cross></c:error> <c:text>Only the console can use this."
cooldown: "<prefix><c:error><sym:cross></c:error> <c:text>Slow down. Try again in <c:value><time></c:value>."
confirm: "<prefix><c:text>This can't be undone. <click:run_command:'/<command> confirm'><hover:show_text:'<c:text>Runs /<command> confirm'><c:action>[Confirm]</c:action></hover></click> <c:muted>or type /<command> confirm within <time>."
confirm-expired: "<prefix><c:error><sym:cross></c:error> <c:text>Nothing to confirm. Run <c:value>/<command></c:value> again."
error: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong. Staff can see why in the console."

# Argument errors. <input> = what was typed.
player-offline: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not online."
player-unknown: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>has never joined. Check the spelling (Bedrock names start with a dot)."
world-unknown: "<prefix><c:error><sym:cross></c:error> <c:text>No loaded world named <c:value><input></c:value>."
invalid-duration: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not a time. Try <c:value>30m</c:value>, <c:value>2h30m</c:value>, <c:value>7d</c:value> or <c:value>1w</c:value>."
invalid-amount: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not an amount. Try <c:value>1500</c:value>, <c:value>1.5k</c:value>, <c:value>2M</c:value> or <c:value>3B</c:value>."
invalid-number: "<prefix><c:error><sym:cross></c:error> <c:text>Use a whole number from <c:value><min></c:value> to <c:value><max></c:value> <c:muted>(not <input>)</c:muted>."
invalid-choice: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not an option. Pick one of: <c:value><choices>"
