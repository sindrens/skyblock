  fallback-name: "<rarity:uncommon>Set Piece"
  unknown: "This set no longer exists."
  subtitle: "<c:muted>Set piece · Tier {tier}"
  set: "<c:text>Set: {set}"
  merged: "<c:text>Merged with <c:value>{set}"
  level: "<c:text>Lv <c:value>{level}</c:value> <c:muted>· {multiplier}x"
  action-input: "/wardrobe"
  action-text: "to take it off"

token:
  fallback-name: "<rarity:rare>Set Token"
  name: "<rarity:{rarity}>Token: {set}"
  unknown: "This set no longer exists."
  subtitle: "<c:muted>Set Token · Tier {tier}"
  description: "Adds this set to your wardrobe. Tradeable until redeemed."
  tradeable: "<c:muted>Trade it or sell it on /ah."
  action-input: "Right-click"
  action-text: "to redeem"

tome:
  fallback-name: "<rarity:epic>Wardrobe Tome"
  name:
    normal: "<rarity:epic>Wardrobe Tome"
    greater: "<rarity:legendary>Greater Wardrobe Tome"
  subtitle: "<c:muted>Consumable · Set XP"
  description: "Adds {xp} set XP to one of your sets. Never past level {level}."
  action-input: "/wardrobe"
  action-text: "to use it on a set"

