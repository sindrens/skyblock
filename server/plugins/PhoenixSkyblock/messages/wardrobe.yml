bonus:
  two-header: "<c:muted>2 pieces"
  four-header: "<c:muted>4 pieces"
  line: " <c:ember>▸</c:ember> <c:text>{text}"

# ---------------------------------------------------------------- items
piece:
  fallback-name: "<rarity:uncommon>Set Piece"
  unknown: "This set no longer exists."
  subtitle: "<c:muted>Set piece · Tier {tier}"
  set: "<c:text>Set: {set}"
  merged: "<c:text>Merged with <c:value>{set}"
  level: "<c:text>Lv <c:value>{level}</c:value> <c:muted>· {multiplier}x"
  action-input: "/wardrobe"
  action-text: "to take it off"
  # Armor enchants (E5): one line per slot. {name} enchant + level, {rarity} its rarity id, {slot} slot number,
  # {level} set level that opens the slot. Dormant = slot not open yet or level above the set level gate (no effect).
  enchants:
    header: "<c:muted>Enchants"
    active: " <c:enchant>▸ <rarity:{rarity}>{name}"
    mythic: " <c:enchant>★ <rarity:{rarity}>{name}"
    dormant: " <c:muted>▸ {name} (dormant)"
    empty: " <c:muted>▸ Empty slot"
    locked: " <c:muted>▸ Slot {slot} at Lv {level}"
    mythic-empty: " <c:muted>★ Empty mythic slot"
    mythic-locked: " <c:muted>★ Mythic slot at Lv {level}"

token:
  fallback-name: "<rarity:rare>Set Token"
  name: "<rarity:{rarity}>Token: {set}"
  unknown: "This set no longer exists."
  subtitle: "<c:muted>Set Token · Tier {tier}"
  description: "Adds this set to your wardrobe. Tradeable until redeemed."
  tradeable: "<c:muted>Trade it or sell it on /ah."
  action-input: "Right-click"
  action-text: "to redeem"

tome:
  fallback-name: "<rarity:epic>Wardrobe Tome"
  name:
    normal: "<rarity:epic>Wardrobe Tome"
    greater: "<rarity:legendary>Greater Wardrobe Tome"
  subtitle: "<c:muted>Consumable · Set XP"
  description: "Adds {xp} set XP to one of your sets. Never past level {level}."
  action-input: "/wardrobe"
  action-text: "to use it on a set"

# ---------------------------------------------------------------- menus
menu:
  title: "Wardrobe"
  click: ["<c:action><sym:bullet> Click to open"]
  main:
    info: ["<c:text>Every set in the game. Buy", "<c:text>a set once, wear it any time.", "<c:text>2 and 4 pieces give bonuses."]
    click: ["<c:action><sym:bullet> Click to open"]
    empty:
      name: "<c:muted>No sets here"
      lore: ["<c:text>Try another filter."]
    filter:
      name: "<c:value>Filter: <filter>"
      lore: ["<c:text>Show only some sets.", "", "<c:action><sym:bullet> Click to switch"]
    worn:
      name: "<c:value>Worn now"
      lore: ["<c:text>Your active set bonuses.", ""]
      none: ["<c:muted>Wear 2 pieces of a set."]
      line: "<c:ember>▸</c:ember> <c:text><text>"
      line-capped: "<c:ember>▸</c:ember> <c:text><text> <c:warning>(capped)"
    chest:
      name: "<c:value>Wardrobe Chest"
      lore: ["<c:text>Keep tools, books and tokens", "<c:text>safe. Space: <c:value><size></c:value>", "", "<c:action><sym:bullet> Click to open"]
