    info: ["<c:text>Wear pieces one by one or all", "<c:text>at once. 2 and 4 pieces give", "<c:text>bonuses. Sets stay yours."]
    piece:
      not-owned: ["<c:error><sym:cross> Not owned"]
      worn: ["<c:success><sym:check> Worn", "", "<c:action><sym:bullet> Click to take off"]
      wear: ["<c:text>In your wardrobe.", "", "<c:action><sym:bullet> Click to wear"]
    wear-all:
      name: "<c:success>Wear all"
      lore: ["<c:text>Put on all 4 pieces.", "", "<c:action><sym:bullet> Click to wear"]
    take-off-all:
      name: "<c:error>Take all off"
      lore: ["<c:text>The pieces stay yours.", "", "<c:action><sym:bullet> Click to take off"]
    bonuses:
      name: "<c:value>Bonuses"
      lore: ["<c:text>Values at your set level.", ""]
      two: "<c:muted>2 pieces"
      four: "<c:muted>4 pieces"
      line: "<c:ember>▸</c:ember> <c:text><text>"
      merged: "<c:muted>Merged with <set>:"
      warzone: ["", "<c:warning>Warzone: 1x, only damage", "<c:warning>reduction and conquest work."]
    level:
      name: "<c:value>Set level <level>"
      lore: ["<c:ember><bar></c:ember> <c:muted><percent>%", "<c:text>Bonus: <c:value><multiplier>x", "<c:muted>Lv <max>: <max_multiplier>x"]
      next: ["<c:text>Lv <next> in <c:value><xp></c:value> XP"]
      maxed: ["<c:success><sym:star> Max level"]
      earns: ["", "<c:text>Earns XP from: <c:value><from>", "<c:muted>Wear 2+ pieces (4 = full XP)."]
      merged: ["<c:muted>Merged: <factor>x XP per level"]
      not-owned: ["<c:muted>Starts at Lv 0 (0x)."]
      warzone: ["<c:warning>Warzone: counts as <multiplier>x"]
    level-off:
      name: "<c:value>Set level"
      lore: ["<c:text>Set levels are off.", "<c:text>Bonus now: <c:value><multiplier>x"]
    gone:
      name: "<c:error>Set not found"
      lore: ["<c:text>This set is not in your", "<c:text>wardrobe any more."]
    tome:
      name: "<c:success>Use a Wardrobe Tome"
      lore: ["<c:text>+<c:value><xp></c:value> set XP from your tome.", "<c:text>Then: <c:value>Lv <level>", "<c:muted>Tomes stop at Lv <cap>.", "", "<c:action><sym:bullet> Click to use"]
    tome-capped:
      name: "<c:muted>Wardrobe Tome"
      lore: ["<c:text>Tomes only work below", "<c:text>Lv <level>. Play to level up."]
    merge:
      name: "<c:success>Merge"
      lore: ["<c:text>Combine with another max", "<c:text>level set: both bonuses in", "<c:text>one set, back to Lv 0.", "", "<c:action><sym:bullet> Click to pick a set"]
    merge-locked:
      name: "<c:muted>Merge"
      lore: ["<c:text>Combine two max level sets.", "<c:error><sym:cross></c:error> <why>"]
    trail-on:
