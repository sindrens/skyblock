# Wardrobe (Phase W, docs/plans/WARDROBE.md): /wardrobe, set pieces, Set Tokens, set levels, tomes, merging, the Wardrobe Chest, loadouts, staff view.
# MiniMessage + style tags (style.yml). Item lore uses {placeholders} (filled by the plugin); chat and menus use <placeholders>.
# Menu and lore lines: max 36 visible characters (Bedrock). Set names live in sets.yml.
# Reload: /skyblock reload wardrobe

# ---------------------------------------------------------------- chat
error: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong. Try again in a moment."
unavailable: "<prefix><c:error><sym:cross></c:error> <c:text>The shop is closed right now. Try again later."
no-permission: "<prefix><c:error><sym:cross></c:error> <c:text>You can't do that."
loading: "<prefix><c:error><sym:cross></c:error> <c:text>Your wardrobe is still loading. Try again in a second."
busy: "<c:warning>Wait a moment, saving your wardrobe..."
blocked-world: "<prefix><c:error><sym:cross></c:error> <c:text>You can't change sets here."
cooldown: "<prefix><c:error><sym:cross></c:error> <c:text>Wait <c:value><time></c:value> before changing sets again."
not-owned: "<prefix><c:error><sym:cross></c:error> <c:text>You don't own that set."
already-worn: "<prefix><c:error><sym:cross></c:error> <c:text>You already wear that."
nothing-worn: "<prefix><c:error><sym:cross></c:error> <c:text>You don't wear any of it."
make-room: "<prefix><c:error><sym:cross></c:error> <c:text>Make room for your <c:value><item></c:value> first."
worn: "<prefix><c:success><sym:check></c:success> <c:text>Wearing <c:value><set></c:value> <c:muted>(<count>/4)</c:muted><c:text>."
taken-off: "<prefix><c:success><sym:check></c:success> <c:text>Took off <c:value><count></c:value> piece(s). They stay in your wardrobe."
locked-hint: "<c:text>Use <c:value>/wardrobe</c:value> to take this off."
frozen: "<prefix><c:error><sym:cross></c:error> <c:text>You can't do that while frozen."
in-combat: "<prefix><c:error><sym:cross></c:error> <c:text>You're in combat. Wait a few seconds."

cant-buy: "<prefix><c:error><sym:cross></c:error> <c:text>You can't buy that set right now."
cant-claim: "<prefix><c:error><sym:cross></c:error> <c:text>You can't claim that set right now."
bought: "<prefix><c:success><sym:check></c:success> <c:text>You got <c:value><set></c:value> for <c:value><price></c:value>. Wear it in /wardrobe."
claimed: "<prefix><c:success><sym:check></c:success> <c:text>You claimed <c:value><set></c:value> on this profile."
claimed-already: "<prefix><c:error><sym:cross></c:error> <c:text>You already claimed that set this season."
has-sigil: "<prefix><c:error><sym:cross></c:error> <c:text>You already own that Sigil. Claim the set instead."
not-enough: "<prefix><c:error><sym:cross></c:error> <c:text>You need <c:value><price></c:value>. You have <c:value><have></c:value>."
owned: "<prefix><c:error><sym:cross></c:error> <c:text>You already own that set on this profile."
unknown-set: "<prefix><c:error><sym:cross></c:error> <c:text>That set does not exist any more. Ask staff."
set-disabled: "<prefix><c:error><sym:cross></c:error> <c:text><c:value><set></c:value> is turned off for now."
arrives: "<prefix><c:error><sym:cross></c:error> <c:text><c:value><set></c:value> isn't out yet."
locked: "<prefix><c:error><sym:cross></c:error> <c:text>Needs <requirement><c:text>."
token-gone: "<prefix><c:error><sym:cross></c:error> <c:text>Token not found. Put it in your inventory."
token-copy: "<prefix><c:error><sym:cross></c:error> <c:text>That token was a copy. It was taken and staff were told."
token-received: "<prefix><c:success><sym:check></c:success> <c:text>You got a <c:value><set></c:value> token. Right-click it to redeem."
redeemed: "<prefix><c:success><sym:check></c:success> <c:text><c:value><set></c:value> is in your wardrobe now."
staff-token-copy: "<c:error><bold>DUPE</bold></c:error> <c:value><player></c:value> <c:text>used a copied Set Token <c:muted>(<id>)</c:muted><c:text>. Taken."
staff-copy-alert: "<c:error><bold>DUPE</bold></c:error> <c:value><player></c:value> <c:text>had a copied set piece in <c:value><where></c:value><c:text>. Deleted."

# Set levels (W2)
xp-bar: "<c:value><set></c:value> <c:muted>Lv <level> · <percent>%</c:muted> <c:success>+<xp> XP"
level-up: "<c:value><set></c:value> <c:success>Lv <level></c:success> <c:muted>· <multiplier>x"
level-title:
  title: "<c:success>Lv <level>"
  subtitle: "<c:value><set></c:value> <c:muted>· <multiplier>x"
  fade-in: 10
  stay: 50
  fade-out: 20
level-max: "<prefix><c:success><sym:star></c:success> <c:value><set></c:value> <c:text>is max level (<c:value><level></c:value>). You can merge it now."
trail-on: "<prefix><c:success><sym:check></c:success> <c:text>Trail on."
trail-off: "<prefix><c:success><sym:check></c:success> <c:text>Trail off."

# Wardrobe Tomes (W2)
tome-hint: "<c:text>Use it on a set in <c:value>/wardrobe</c:value><c:text>."
tome-gone: "<prefix><c:error><sym:cross></c:error> <c:text>Tome not found. Put it in your inventory."
tome-capped: "<prefix><c:error><sym:cross></c:error> <c:text>Tomes only work below <c:value>Lv <level></c:value><c:text>. Play to level up."
tome-used: "<prefix><c:success><sym:check></c:success> <c:value><set></c:value> <c:text>is <c:value>Lv <level></c:value> <c:text>now."
tome-copy: "<prefix><c:error><sym:cross></c:error> <c:text>That tome was a copy. It was taken and staff were told."
tome-received: "<prefix><c:success><sym:check></c:success> <c:text>You got a <c:value>Wardrobe Tome</c:value><c:text>. Use it in /wardrobe."
staff-tome-copy: "<c:error><bold>DUPE</bold></c:error> <c:value><player></c:value> <c:text>used a copied Wardrobe Tome <c:muted>(<id>)</c:muted><c:text>. Taken."

# Merging (W2). <why> is one of merge.why.*
merge:
  turned-off: "<prefix><c:error><sym:cross></c:error> <c:text>Merging is turned off for now."
  refused: "<prefix><c:error><sym:cross></c:error> <c:text>Can't merge: <why><c:text>."
  gone: "<prefix><c:error><sym:cross></c:error> <c:text>One of the sets changed. Try again."
  done: "<prefix><c:success><sym:check></c:success> <c:text>Merged into <c:value><set></c:value> <c:muted>(<fee>)</c:muted><c:text>. It starts at Lv 0."
  books-returned: "<prefix><c:success><sym:check></c:success> <c:value><count></c:value> <c:text>enchant book(s) from the other set are in your Wardrobe Chest."
  enchants-unavailable: "<prefix><c:error><sym:cross></c:error> <c:text>The other set has enchants and the Enchanter is closed. Try again later."
  enchant-unknown: "<prefix><c:error><sym:cross></c:error> <c:text>An enchant on the other set (<c:value><enchant></c:value>) does not exist any more. Ask staff."
  free: "free"
  why:
    same-entry: "<c:error>pick another set"
    same-set: "<c:error>same set"
    gone: "<c:error>set not found"
    already-merged: "<c:error>already merged"
    tier-iv: "<c:error>tier IV can't merge"
    disabled: "<c:error>set is turned off"
    not-max: "<c:error>needs max level"
    shared-family: "<c:error>same bonus type"

# Loadouts (W3). <parts> lists skipped parts like "Helm (set gone), Slot 3 (no room)".
loadout:
  turned-off: "<prefix><c:error><sym:cross></c:error> <c:text>Loadouts are turned off for now."
  unknown: "<prefix><c:error><sym:cross></c:error> <c:text>No loadout called <c:value><name></c:value><c:text>. Open /loadout to see yours."
  locked: "<prefix><c:error><sym:cross></c:error> <c:text>That loadout is locked. Ranks and the store add more."
  gone: "<prefix><c:error><sym:cross></c:error> <c:text>That loadout is gone. Open /loadout again."
  blocked-world: "<prefix><c:error><sym:cross></c:error> <c:text>You can't swap loadouts here."
  refused: "<prefix><c:error><sym:cross></c:error> <c:text>Swap stopped, nothing changed: <c:value><parts></c:value><c:text>."
  nothing: "<prefix><c:error><sym:cross></c:error> <c:text>Nothing to swap: <c:value><parts></c:value><c:text>."
  already: "<prefix><c:success><sym:check></c:success> <c:text>You already use <c:value><name></c:value><c:text>."
  changed: "<prefix><c:error><sym:cross></c:error> <c:text>Your chest or sets changed. Try again."
  applied: "<prefix><c:success><sym:check></c:success> <c:text>Loadout <c:value><name></c:value><c:text>: <pieces> piece(s), <tools> tool(s). Old tools went to your Wardrobe Chest."
  applied-bar: "<c:text>Loadout <c:value><name></c:value> <c:muted>· <pieces> pieces, <tools> tools"
  skipped: "<prefix><c:warning><sym:cross></c:warning> <c:text>Skipped: <c:value><parts></c:value><c:text>."
  saved: "<prefix><c:success><sym:check></c:success> <c:text>Saved <c:value><name></c:value> <c:muted>(<pieces> piece(s), <tools> tool(s))</c:muted><c:text>."
  renamed: "<prefix><c:success><sym:check></c:success> <c:text>Renamed to <c:value><name></c:value><c:text>."
  deleted: "<prefix><c:success><sym:check></c:success> <c:text>Deleted <c:value><name></c:value><c:text>. Your sets and tools stay yours."
  no-slot: "<prefix><c:error><sym:cross></c:error> <c:text>No free loadout place. Ranks and the store add more."
  rename-prompt: "<prefix><c:text>Type a new name for <c:value><name></c:value> <c:text>(max <max>, letters, digits, - and _). Type <c:value><cancel></c:value> <c:text>to stop."
  name:
    empty: "<prefix><c:error><sym:cross></c:error> <c:text>Type a name."
    too-long: "<prefix><c:error><sym:cross></c:error> <c:text>Names are at most <c:value><max></c:value> <c:text>characters."
    characters: "<prefix><c:error><sym:cross></c:error> <c:text>Use letters, digits, - and _ only."
    taken: "<prefix><c:error><sym:cross></c:error> <c:text>You already have a loadout with that name."
  # Plain texts ({n} = place number, {slot} = hotbar slot 1-9).
  default-name: "Loadout-{n}"
  slot-name: "Slot {slot}"
  skip:
    set-gone: "set gone"
    item-missing: "item missing"
    no-room: "no room"

chest:
  not-storable: "<prefix><c:error><sym:cross></c:error> <c:text>Only tools, enchant books, scrolls and tokens fit."
  stored: "<prefix><c:success><sym:check></c:success> <c:value><item></c:value> <c:text>is in your Wardrobe Chest."
  full: "<prefix><c:error><sym:cross></c:error> <c:text>Your Wardrobe Chest is full (<c:value><size></c:value>)."
  stale: "<prefix><c:warning><sym:cross></c:warning> <c:text>That item was already in your chest. The copy was removed."
  inventory-full: "<prefix><c:error><sym:cross></c:error> <c:text>Make room in your inventory first."
  gone: "<prefix><c:error><sym:cross></c:error> <c:text>That item is not in your chest any more."
  taken: "<prefix><c:success><sym:check></c:success> <c:text>You took <c:value><item></c:value> out."
  recovered: "<prefix><c:success><sym:check></c:success> <c:text>Gave you <c:value><count></c:value> item(s) from your Wardrobe Chest."
  kept: "<prefix><c:warning><sym:cross></c:warning> <c:value><count></c:value> <c:text>item(s) stayed in your Wardrobe Chest. Make room and take them out."

staff:
  removed: "<prefix><c:success><sym:check></c:success> <c:text>Removed <c:value><set></c:value> from <c:value><player></c:value>."
  given: "<prefix><c:success><sym:check></c:success> <c:text>Gave <c:value><set></c:value> to <c:value><player></c:value>."
  token-given: "<prefix><c:success><sym:check></c:success> <c:text>Gave a <c:value><set></c:value> token to <c:value><player></c:value>."
  gone: "<prefix><c:error><sym:cross></c:error> <c:text>That set is already gone."
  owned: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>already owns that set."
  offline: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>must be online for a token."
  target-full: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value><c:text>'s inventory is full."
  level-set: "<prefix><c:success><sym:check></c:success> <c:value><set></c:value> <c:text>of <c:value><player></c:value> <c:text>is <c:value>Lv <level></c:value> <c:text>now."
  tome-given: "<prefix><c:success><sym:check></c:success> <c:text>Gave a Wardrobe Tome to <c:value><player></c:value><c:text>."

