  farming-xp: "Farming XP +{value}%"
  all-skill-xp: "All skill XP +{value}%"
  tool-xp: "Tool XP +{value}%"
  mob-damage-taken: "Damage from mobs -{value}%"
  mob-damage: "Damage to mobs +{value}%"
