  mining-speed: "Mining speed +{value}%"
  chopping-speed: "Chopping speed +{value}%"
  gather-speed: "Gathering speed +{value}%"
  mining-crystals: "Mining crystals +{value}%"
  gather-crystals: "Gathering crystals +{value}%"
