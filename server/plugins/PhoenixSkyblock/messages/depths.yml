# The Depths: per-player resource blocks (M4.3). MiniMessage + style tags (style.yml). Placeholders: <name>.
# Reload: /skyblock reload depths
# Format (docs/UI_STYLE.md §3): prefix only on replies, success/error marks + gray text, values in <c:value>, clicks in <c:action>.

# Action bar when breaking a non-resource block or placing a block inside a region.
protected: "<c:error><sym:cross></c:error> <c:text>Only resource blocks can be mined here."

alert:
  fast-break: "<c:muted>[Depths]</c:muted> <c:value><player></c:value> <c:text>broke <c:value><block></c:value> too fast <c:muted>(<actual> ms, min <min> of <expected> ms with <tool>) <sym:dot> <count> flags in <seconds> s"
  no-start: "<c:muted>[Depths]</c:muted> <c:value><player></c:value> <c:text>broke <c:value><block></c:value> without mining it first <c:muted>(needs <expected> ms with <tool>) <sym:dot> <count> flags in <seconds> s"

debug:
  header: "<prefix><c:text>Depths debug: <c:value><player></c:value>"
  region: " <c:ember><sym:bullet></c:ember> <c:text>Region at feet: <c:value><region></c:value> <c:muted>(<world> <min> to <max>, <resources> resource blocks, from <source>)"
  no-region: " <c:ember><sym:bullet></c:ember> <c:text>Region at feet: <c:muted>none in <world>"
  target-plain: " <c:ember><sym:bullet></c:ember> <c:text>Looking at <c:value><block></c:value> <c:muted>(not a resource block here)"
  target-resource: " <c:ember><sym:bullet></c:ember> <c:text>Looking at <c:value><block></c:value>, a resource block <c:muted>(depleted: <depleted>, respawn <seconds> s)"
  target-depleted: " <c:ember><sym:bullet></c:ember> <c:text>Looking at <c:value><block></c:value>, depleted for this player <c:muted>(shows <depleted>, respawn <seconds> s)"
  depleted: " <c:ember><sym:bullet></c:ember> <c:text>Depleted for <player>: <c:value><count></c:value> <c:muted><sym:dot> all players: <total> (<players> tracked)"
  timers: " <c:ember><sym:bullet></c:ember> <c:text>Timers pending: <c:value><timers></c:value> <c:muted><sym:dot> pool <capacity>, wheel <slots> ticks <sym:dot> regions: <regions>"
  perf: " <c:ember><sym:bullet></c:ember> <c:text>Break handling: avg <c:value><avg> ms</c:value> <c:muted><sym:dot> max <max> ms <sym:dot> <breaks> breaks"
  flags: " <c:ember><sym:bullet></c:ember> <c:text>Fast-break flags for <player>: <c:value><window></c:value> <c:muted>in window <sym:dot> <total> this session <sym:dot> <all> on the server"
  combat: " <c:ember><sym:bullet></c:ember> <c:text>Combat mobs: <c:value><alive></c:value> <c:muted>of max <max> <sym:dot> <zones> active zones"
  combat-zone: " <c:ember><sym:bullet></c:ember> <c:text>This zone (<zone>): <c:value><alive></c:value> <c:text>alive, target <c:value><target></c:value> <c:muted><sym:dot> <players> players <sym:dot> mini-boss: <boss>"
  abilities: " <c:ember><sym:bullet></c:ember> <c:text>Mob abilities: <c:value><mobs></c:value> <c:text>mobs <sym:dot> <c:value><active></c:value><c:muted>/<max> effects running"
  region-flags: " <c:ember><sym:bullet></c:ember> <c:text>Region flags at feet: <c:value><regions></c:value> <c:muted><sym:dot> denied: <denied> <sym:dot> bypass: <bypass>"
  region-flags-off: " <c:ember><sym:bullet></c:ember> <c:muted>Region flags: the worlds module isn't running"
  "yes": "yes"
  "no": "no"
  ambient: " <c:ember><sym:bullet></c:ember> <c:text>Ambient mobs: <c:value><alive></c:value> <c:muted>of max <max> <sym:dot> <player>: <own>"

# Zones (M4.1): layout from zones.yml, /depths generate, /depths tp, boss portal.
zones:
  skill:
    mining: "<pillar:mining>Mining"
    foraging: "<pillar:foraging>Foraging"
    combat: "<pillar:combat>Combat"
    farming: "<pillar:farming>Farming"
    fishing: "<pillar:fishing>Fishing"
  no-world: "<prefix><c:error><sym:cross></c:error> <c:text>World <c:value><world></c:value> isn't loaded. Check worlds.yml, then <click:run_command:'/skyblock reload depths'><hover:show_text:'<c:text>Reload the Depths config'><c:action>[Reload]</c:action></hover></click>"
  generate:
    start: "<prefix><c:text>Building <c:value><parts></c:value> placeholder part(s) in <c:value><world></c:value>. <c:muted>(max <blocks> blocks per tick, progress on the action bar)"
    skipped-built: "<prefix><c:warning><sym:cross></c:warning> <c:text>Skipped (<c:value>built: true</c:value> in zones.yml, never overwritten): <c:value><zones>"
    nothing: "<prefix><c:error><sym:cross></c:error> <c:text>Nothing to build: all of it is <c:value>built: true</c:value> in zones.yml."
    busy: "<prefix><c:error><sym:cross></c:error> <c:text>A build is already running <c:muted>(part <done>/<total>, <percent>%)</c:muted><c:text>. Wait for it to finish."
    progress: "<c:ember><sym:pickaxe></c:ember> <c:text>Depths build <c:value><percent>%</c:value> <c:muted><sym:dot> part <done>/<total>: <part> <sym:dot> <changed> blocks changed"
    progress-console: "<c:muted>[Depths]</c:muted> <c:text>Build <c:value><percent>%</c:value> <c:muted><sym:dot> part <done>/<total>: <part> <sym:dot> <changed> blocks changed"
    bad-block: "<prefix><c:warning><sym:cross></c:warning> <c:value><part></c:value><c:text>: <c:value><block></c:value> isn't a block (zones.yml). Using <c:value><used></c:value>."
    bad-biome: "<prefix><c:warning><sym:cross></c:warning> <c:value><part></c:value><c:text>: unknown biome <c:value><biome></c:value>. Biome left as it is."
    done: "<prefix><c:success><sym:check></c:success> <c:text>Build done: <c:value><parts></c:value> part(s), <c:value><changed></c:value> blocks changed. <c:muted>(<seconds> s)"
  tp:
    done: "<prefix><c:success><sym:check></c:success> <c:text>Teleported to <c:value><name></c:value>. <c:muted>(<zone>)"
    failed: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't teleport to <c:value><zone></c:value>. Check zones.yml."
  portal:
    boss: "<c:ember><sym:sword></c:ember> <c:text>Entering the <c:value><name></c:value>"
    back: "<c:ember><sym:arrow></c:ember> <c:text>Back to <c:value><name></c:value>"
    locked: "<c:error><sym:cross></c:error> <c:text>Needs <skill> <c:value><required></c:value> <c:muted>(<level>/<required>)"

# Tiers (M4.6): locks, gates, unlocks. Placeholders in every tiers.* / dungeon.* text:
#   <skill> <required> <level> <missing> <name> (zone name) <tier> <wing>
tiers:
  wing:
    mine: "<pillar:mining>Mine"
    forest: "<pillar:foraging>Forest"
    combat: "<pillar:combat>Combat"
  # Action bar when a locked zone blocks you (walking, teleport, pearl, mining).
  locked: "<c:error><sym:cross></c:error> <c:text>Needs <skill> <c:value><required></c:value> <c:muted>(<level>/<required>) <sym:dot> <wing> <c:muted>Tier <tier>"
  kicked: "<prefix><c:error><sym:cross></c:error> <wing> <c:text>Tier <tier> <c:value><name></c:value> <c:text>needs <skill> <c:value><required></c:value> <c:muted>(you: <level>)</c:muted><c:text>. Sent back to <c:value>The Gate</c:value>."
  unlocked: "<prefix><c:success><sym:star></c:success> <c:text>Unlocked <wing> <c:value>Tier <tier></c:value> <c:value><name></c:value>! <click:run_command:'/dungeon'><hover:show_text:'<c:text>Open /dungeon'><c:action>[Teleport]</c:action></hover></click>"
  first-visit:
    title: "<c:value><name>"
    subtitle: "<wing> <c:muted><sym:dot></c:muted> <c:text>Tier <tier>"
    fade-in: 10
    stay: 50
    fade-out: 15

# /dungeon menu (M4.6). Lore lines max ~32 characters (Bedrock).
dungeon:
  title: "The Depths"
  info:
    - "<c:text>Teleport to any tier you have"
    - "<c:text>unlocked. Locked tiers show the"
    - "<c:text>skill level they need."
  tab:
    name: "<wing>"
    lore:
      - "<c:muted>Wing <sym:dot> <skill> <c:muted>Lv <level>"
      - ""
      - "<c:text>Tiers open: <c:value><open></c:value><c:muted>/<total>"
    next: "<c:text>Next: <c:value>Tier <tier></c:value> <c:muted>at <skill> <c:muted><required>"
    all-open: "<c:success><sym:check> Every tier open"
    selected: "<c:ember><sym:bullet> <c:text>Showing this wing"
    click: "<bold><c:action>» CLICK</c:action></bold> <c:text>to show"
  tier:
    name: "<c:value>Tier <tier> <c:muted><sym:dot></c:muted> <c:text><name>"
    # GUI-4: the key fact (what unlocks it) in the name, so Bedrock players read it without the lore.
    locked-name: "<c:locked><sym:cross> Tier <tier></c:locked> <c:muted><sym:dot></c:muted> <c:text>Needs <skill> <required>"
    subtitle: "<c:muted><wing> <c:muted><sym:dot> Tier <tier>"
    resource: "<c:text>Resource: <c:value><resource>"
    requirement-met: "<c:text>Needs <skill> <c:value><required></c:value> <c:success><sym:check>"
    requirement-none: "<c:text>Open for everyone <c:success><sym:check>"
    requirement-missing: "<c:error><sym:cross> <c:text>Needs <skill> <c:value><required></c:value> <c:muted><sym:dot> <level>/<required>"
    progress: "<bar> <c:muted>(<missing> to go)"
    here: "<c:ember><sym:bullet> <c:text>You are here"
    teleport: "<bold><c:action>» CLICK</c:action></bold> <c:text>to teleport"
    how:
      - "<c:text>Level up <skill> <c:text>to open it:"
      - "<c:value>/skills"
  bar:
    filled: "<c:flame>●</c:flame>"
    empty: "<c:muted>●</c:muted>"
  empty:
    name: "<c:muted>No tiers yet"
    lore: ["<c:text>This wing has no zones in", "<c:text>zones.yml yet."]
  # Where /dungeon teleports to, shown in the shared warmup/countdown/cancel texts (messages/core.yml → teleport.*).
  destination: "<wing> <c:value>Tier <tier></c:value> <c:muted><sym:dot></c:muted> <c:value><name>"
  arrived: "<c:ember><sym:pickaxe></c:ember> <wing> <c:value>Tier <tier></c:value> <c:muted><sym:dot></c:muted> <c:text><name>"
  locked: "<prefix><c:error><sym:cross></c:error> <wing> <c:text>Tier <tier> needs <skill> <c:value><required></c:value> <c:muted>(you: <level>)</c:muted><c:text>. Level up in <click:run_command:'/skills'><hover:show_text:'<c:text>Open /skills'><c:action>[Skills]</c:action></hover></click>"
  # Owner answer 346: a /tpahere (or other teleport) into a tier the traveller has not unlocked.
  teleport-locked: "<prefix><c:error><sym:cross></c:error> <c:text>You can't go there: that Depths tier is still locked for you. See <click:run_command:'/dungeon'><hover:show_text:'<c:text>Open /dungeon'><c:action>[Tiers]</c:action></hover></click>"
  # Satchel button (M4.4). <used> <max>
  satchel:
    name: "<c:flame>Satchel"
    lore:
      - "<c:text>Your Depths drops: <c:value><used></c:value><c:muted>/<max>"
      - "<c:text>Sell them or take them out."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"

# Satchel (M4.4): virtual storage per profile for Depths drops.
satchel:
  # Action bar while mining. <used> <max>
  full-overflow: "<c:error><sym:cross></c:error> <c:text>Satchel full <c:value><used>/<max></c:value> <c:muted><sym:dot> drops go to your inventory, then /box"
  box-full: "<c:error><sym:cross></c:error> <c:text>Satchel and /box full <c:value>(<max>)</c:value> <c:muted><sym:dot> empty /box or sell in /dungeon to mine again"
  loading: "<c:muted>Your satchel is loading..."
  not-loaded: "<prefix><c:error><sym:cross></c:error> <c:text>Your satchel is still loading. Try again in a moment."
  busy: "<prefix><c:error><sym:cross></c:error> <c:text>Wait a moment, your last satchel action is still running."
  changed: "<prefix><c:error><sym:cross></c:error> <c:text>Your satchel changed. Try again."
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>That didn't work, nothing changed. Try again."
  no-permission: "<prefix><c:error><sym:cross></c:error> <c:text>You can't open the satchel."
  sell-off: "<prefix><c:error><sym:cross></c:error> <c:text>Selling is off right now. Try again later."
  sell-none: "<prefix><c:error><sym:cross></c:error> <c:text>Nothing in your satchel can be sold."
  too-cheap: "<prefix><c:error><sym:cross></c:error> <c:text>Those items are worth less than $1 right now. Nothing was sold."
  overflow: "<prefix><c:error><sym:cross></c:error> <c:text>Your balance is at the limit. Nothing was sold."
  # <items> <money> <bonus>
  sold: "<prefix><c:success><sym:check></c:success> <c:text>Sold <c:value><items></c:value> items for <cur:money><money></cur:money><c:text>."
  sold-bonus: "<prefix><c:success><sym:check></c:success> <c:text>Sold <c:value><items></c:value> items for <cur:money><money></cur:money> <c:muted>(+<bonus>% bonus)</c:muted><c:text>."
  take-off: "<prefix><c:error><sym:cross></c:error> <c:text>Taking items out is off right now. You can still sell them or use them at the Forge."
  take-none: "<prefix><c:error><sym:cross></c:error> <c:text>You have none of that left."
  inventory-full: "<prefix><c:error><sym:cross></c:error> <c:text>Your inventory is full. Make room first."
  # <amount> <item>
  taken: "<prefix><c:success><sym:check></c:success> <c:text>Took <c:value><amount>x</c:value> <item> <c:text>out of your satchel."
  taken-rest: "<prefix><c:text><c:value><amount></c:value> didn't fit and stayed in your satchel."
  # Upgrades. <level> <capacity> <max> <price>
  upgraded: "<prefix><c:success><sym:check></c:success> <c:text>Satchel upgrade <c:value><level></c:value> bought: <c:value>+<capacity></c:value> space <c:muted>(now <max>)</c:muted><c:text>."
  upgrade-money: "<prefix><c:error><sym:cross></c:error> <c:text>You need <cur:money><price></cur:money> <c:text>for the next upgrade."
  upgrade-max: "<prefix><c:error><sym:cross></c:error> <c:text>Your satchel has every upgrade."
  menu:
    title: "Satchel"
    info:
      - "<c:text>Depths drops land here, not in"
      - "<c:text>your inventory. Sell them, use them"
      - "<c:text>at the Forge or take them out."
    empty:
      name: "<c:muted>Empty"
      lore: ["<c:text>Mine and chop in The Depths:", "<c:text>your drops land here."]
    # <used> <max> <percent> <worth> <bonus>
    summary:
      name: "<c:flame>Satchel <c:value><used></c:value><c:muted>/<max>"
      lore:
        - "<c:text>Space used: <c:value><percent>%"
        - "<c:text>Worth about: <cur:money><worth>"
        - "<c:muted>(sell bonus +<bonus>% included)"
        - ""
        - "<c:text>More space: Mining and Foraging"
        - "<c:text>levels, and upgrades below."
      loading: ["<c:muted>Loading..."]
    sell-all:
      name: "<c:success>Sell all"
      lore:
        - "<c:text>Sell everything for about"
        - "<cur:money><worth> <c:muted>(+<bonus>% bonus)"
        - ""
        - "<bold><c:action>» CLICK</c:action></bold> <c:text>to sell all"
      empty: ["<c:muted>Nothing to sell yet."]
    # SELL2: opens the /sell chest (for items in your inventory; satchel items are sold with Sell all / per item).
    sell-chest:
      name: "<c:value><bold>Sell chest"
      lore:
        - "<c:text>Sell items from your inventory:"
        - "<c:text>put them in and press Sell."
        - ""
        - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
    # <level> <next> <levels> <capacity> <price>
    upgrade:
      name: "<c:flame>Upgrade <c:value><next></c:value><c:muted>/<levels>"
      lore:
        - "<c:bar>| </c:bar><c:text>Cost: </c:text><cur:money><price>"
        - "<c:bar>| </c:bar><c:text>Space: </c:text><c:value>+<capacity>"
        - ""
        - "<bold><c:action>» CLICK</c:action></bold> <c:text>to upgrade"
      name-max: "<c:flame>Upgrades <c:success><sym:check>"
      max: ["<c:text>All <c:value><levels></c:value> upgrades bought."]
    # Confirms (details on the middle item, GUI_DESIGN §4). Same placeholders as sell-all / upgrade.
    confirm:
      sell-all:
        crumb: "Sell everything?"
        details: ["<c:text>Sell every item in your satchel", "<c:text>for about <cur:money><worth></cur:money> <c:muted>(+<bonus>% bonus)<c:text>."]
      upgrade:
        crumb: "Buy upgrade <next>?"
        details: ["<c:text>Pay <cur:money><price></cur:money><c:text>.", "<c:text>Your satchel holds <c:value><capacity></c:value> <c:text>more."]
    # <item> <amount> <price> <worth> <trend>
    entry:
      name: "<item>"
      lore:
        - "<bold><c:sell>| Sell Price: </c:sell><cur:money><price></cur:money></bold> <c:muted>each (<trend>%)"
        - ""
        - "<bold><c:header>| Information</c:header></bold>"
        - "<c:bar>| </c:bar><c:text>Amount: </c:text><c:value><amount>"
        - "<c:bar>| </c:bar><c:text>Worth: </c:text><cur:money><worth>"
      no-price: ["<c:muted>Can't be sold to the server."]
      click: ["<bold><c:action>» CLICK</c:action></bold> <c:text>to sell or take out"]
  item:
    gone:
      name: "<c:muted>None left"
      lore: ["<c:text>You have none of this item now."]
    # <item> <amount> <worth>
    sell:
      name: "<c:success>Sell all <c:value><amount></c:value>"
      lore:
        - "<c:text>For about <cur:money><worth>"
        - "<c:muted>(before your sell bonus)"
        - ""
        - "<bold><c:action>» CLICK</c:action></bold> <c:text>to sell"
    no-sell:
      name: "<c:muted>Can't be sold"
      lore: ["<c:text>The server doesn't buy this.", "<c:text>Take it out to trade it."]
    take-stack:
      name: "<c:flame>Take one stack"
      lore: ["<c:text>Up to 64 into your inventory.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to take"]
    take-all:
      name: "<c:flame>Take all that fit"
      lore: ["<c:text>As many as your inventory holds.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to take"]
    take-off:
      name: "<c:muted>Taking out is off"
      lore: ["<c:text>Sell it or use it at the Forge."]

# Drops and crystals (M4.9).
drops:
  # Action bar after each crystal payout. <amount>
  crystals: "<cur:crystals><sym:crystals> +<amount></cur:crystals> <c:text>crystals"
  # Chat line for a rare find. <item> <amount>
  rare: "<prefix><c:success><sym:star></c:success> <c:text>Rare find: <c:value><amount>x</c:value> <item><c:text>! It's in your satchel."
  # R3-18: a key fragment (skips the satchel). <item>
  fragment: "<prefix><c:success><sym:star></c:success> <c:text>Rare find: <item><c:text>! 3 make a Phoenix key in <c:value>/crates</c:value><c:text>."
  fragment-box: "<prefix><c:success><sym:star></c:success> <c:text>Rare find: <item><c:text>! Your inventory is full, it's in <c:value>/box</c:value><c:text>."

# Drop items (M4.9): names, lore. {rarity} and {name} are filled by the plugin.
drop-items:
  name: "<rarity:{rarity}>{name}"
  subtitle: "<c:muted>Depths material"
  description: "Sell it from your satchel or use it at the Forge."
  descriptions:
    depths_geode: "A rare stone from deep in the mines."
    depths_key_fragment: "A rare find from tier 11+. 3 make a Phoenix key in /crates. Tradeable."
  names:
    depths_coal: "Coal"
    depths_copper: "Copper"
    depths_iron: "Iron"
    depths_gold: "Gold"
    depths_redstone: "Redstone"
    depths_lapis: "Lapis"
    depths_diamond: "Diamond"
    depths_emerald: "Emerald"
    depths_amethyst: "Amethyst"
    depths_quartz: "Quartz"
    depths_netherite: "Netherite"
    depths_voidstone: "Voidstone"
    depths_oak_log: "Oak Log"
    depths_birch_log: "Birch Log"
    depths_spruce_log: "Spruce Log"
    depths_jungle_log: "Jungle Log"
    depths_acacia_log: "Acacia Log"
    depths_dark_oak_log: "Dark Oak Log"
    depths_mangrove_log: "Mangrove Log"
    depths_cherry_log: "Cherry Log"
    depths_pale_oak_log: "Pale Oak Log"
    depths_crimson_stem: "Crimson Stem"
    depths_warped_stem: "Warped Stem"
    depths_geode: "Geode"
    depths_key_fragment: "Key Fragment"
    depths_rotten_flesh: "Grave Flesh"
    depths_bone: "Crypt Bone"
    depths_spider_eye: "Venom Eye"
    depths_slime_ball: "Bog Slime"
    depths_prismarine: "Tide Shard"
    depths_glowstone: "Hex Dust"
    depths_raider_scrap: "Raider Scrap"
    depths_blaze_rod: "Forge Rod"
    depths_wither_ash: "Wither Ash"
    depths_warlord_sigil: "Warlord Sigil"

# Forest (M4.7). Action bar when breaking leaves in a forest zone.
forest:
  leaves: "<c:error><sym:cross></c:error> <c:text>Leaves are decoration. Chop the logs."

# Combat zones (M4.8). <name> is the mob name (mobs.<id>), <zone> the zone name, <player> the killer.
combat:
  mini-boss:
    # Custom name of a mini-boss (around its mobs.<id> name).
    name: "<c:error><sym:star></c:error> <name> <c:error><sym:star></c:error>"
    bar: "<name>"
    # R3-10: boss bar name with the health. <name> <health> <max>; the -scaled one also has <extra> (health % added for
    # extra fighters).
    bar-health: "<name> <c:error><sym:heart></c:error> <c:value><health>/<max></c:value>"
    bar-health-scaled: "<name> <c:error><sym:heart></c:error> <c:value><health>/<max></c:value> <c:muted>(+<extra>% for the group)</c:muted>"
    spawn: "<prefix><c:error><sym:sword></c:error> <c:text>Mini-boss <name> <c:text>appeared in <c:value><zone></c:value><c:text>!"
    killed: "<prefix><c:success><sym:check></c:success> <name> <c:text>was defeated by <c:value><player></c:value><c:text>."
    reward: "<prefix><c:success><sym:star></c:success> <c:text>You helped defeat <name><c:text>. Rewards are in your satchel."
  # M8.1 elites (mobs.yml elite-chance): custom name around the mob's name (always visible).
  elite:
    name: "<rarity:legendary><sym:star></rarity:legendary> <name>"
  # M8.1 ability warnings: action bar for players near the mob, 1 s before the ability hits (with the red ring of
  # blocks and the warning sound). <name> = the mob's name. Keep them short (phones, Bedrock).
  ability:
    slam: "<c:error><sym:arrow></c:error> <name> <c:text>slams! <c:value>Leave the ring!"
    leap: "<c:error><sym:arrow></c:error> <name> <c:text>leaps! <c:value>Leave the ring!"
    charge: "<c:error><sym:arrow></c:error> <name> <c:text>charges! <c:value>Leave the red lane!"
    volley: "<c:error><sym:arrow></c:error> <name> <c:text>takes aim! <c:value>Take cover!"
    pull: "<c:error><sym:arrow></c:error> <name> <c:text>pulls! <c:value>Leave the ring!"
    summon: "<c:error><sym:arrow></c:error> <name> <c:text>calls for help!"
    shield: "<c:error><sym:arrow></c:error> <name> <c:text>raises a shield!"
    ring: "<c:error><sym:arrow></c:error> <name> <c:text>sets the ground alight! <c:value>Leave the ring!"
    curse: "<c:error><sym:arrow></c:error> <name> <c:text>casts a curse! <c:value>Leave the ring!"
    teleport: "<c:error><sym:arrow></c:error> <name> <c:text>blinks to the red mark! <c:value>Watch your back!"
    enrage: "<c:error><sym:arrow></c:error> <name> <c:text>is enraged!"
    # Name tag while the shield is up (takes much less damage).
    shield-name: "<name> <c:info>[Shield]</c:info>"

