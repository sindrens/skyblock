# Economy (M3.1): /bal, /baltop, /pay, /transactions, /eco. Money notes (M3.2): /withdraw, /eco note, note item. MiniMessage + style tags (style.yml).
# Amount placeholders (<amount>, <balance>, <min>) are already colored with their currency (see format.*).
# Reload: /skyblock reload economy

# How amounts look. <value> = 12,500 below 100k, 1.2M above; <exact> = every digit.
format:
  money: "<hover:show_text:'<c:text><exact>'><cur:money><sym:money><value></cur:money></hover>"
  crystals: "<hover:show_text:'<c:text><exact>'><cur:crystals><sym:crystals> <value></cur:crystals></hover>"
  gems: "<hover:show_text:'<c:text><exact>'><cur:gems><sym:gems> <value></cur:gems></hover>"
  shards: "<hover:show_text:'<c:text><exact>'><cur:shards><sym:shards> <value></cur:shards></hover>"

names:
  money: "<cur:money>Money</cur:money>"
  crystals: "<cur:crystals>Crystals</cur:crystals>"
  gems: "<cur:gems>Gems</cur:gems>"
  shards: "<cur:shards>Shards</cur:shards>"

# Shown by the balance placeholders (scoreboard) for a moment after joining.
placeholder:
  loading: "..."

error: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong, nothing changed. Try again; staff can see why in the console."
unknown-player: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has never joined. Check the spelling (Bedrock names start with a dot)."

bal:
  header-self: "<prefix><c:text>Your balance:"
  header-other: "<prefix><c:value><player></c:value><c:text>'s balance:"
  line: " <c:muted><sym:bullet></c:muted> <c:text><currency><c:muted>:</c:muted> <amount>"
  no-permission-others: "<prefix><c:error><sym:cross></c:error> <c:text>You can only see your own. Type <c:value>/bal</c:value>."

baltop:
  loading: "<prefix><c:text>The top list is loading. Try again in a few seconds."
  header: "<prefix><c:text>Richest players <c:muted>(<currency><c:muted>) <sym:dot> updated <ago> ago, every <refresh>"
  line: " <c:muted>#<rank></c:muted> <c:value><player></c:value> <c:muted><sym:dot></c:muted> <amount>"
  line-you: " <c:flame>#<rank></c:flame> <c:flame><player></c:flame> <c:muted><sym:dot></c:muted> <amount> <c:muted>(you)"
  not-listed: " <c:muted>You're not in the top <size>. You have </c:muted><amount>"
  empty: " <c:muted>Nobody has any yet."

pay:
  sent: "<prefix><c:success><sym:check></c:success> <c:text>Paid <amount> <c:text>to <c:value><player></c:value>. <c:muted>Balance: </c:muted><balance>"
  received: "<prefix><c:success><sym:check></c:success> <c:text>Got <amount> <c:text>from <c:value><player></c:value>. <c:muted>Balance: </c:muted><balance>"
  confirm: "<prefix><c:text>Send <amount> <c:text>to <c:value><player></c:value>? It can't be undone. <click:run_command:'/<command> confirm'><hover:show_text:'<c:text>Runs /<command> confirm'><c:action>[Confirm]</c:action></hover></click> <c:muted>or type /<command> confirm within <time>."
  insufficient: "<prefix><c:error><sym:cross></c:error> <c:text>You don't have <amount><c:text>. <c:muted>Balance: </c:muted><balance>"
  overflow: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>can't hold that much. Nothing was sent."
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't pay yourself."
  frozen: "<prefix><c:error><sym:cross></c:error> <c:text>You can't pay while frozen. Wait for staff."
  not-tradeable: "<prefix><c:error><sym:cross></c:error> <currency> <c:text>can't be paid to players."
  below-minimum: "<prefix><c:error><sym:cross></c:error> <c:text>The smallest payment is <min><c:text>."

eco:
  done-give: "<prefix><c:success><sym:check></c:success> <c:text>Gave <amount> <c:text>to <c:value><player></c:value>. <c:muted>Now </c:muted><balance> <c:muted>(<reason>)"
  done-take: "<prefix><c:success><sym:check></c:success> <c:text>Took <amount> <c:text>from <c:value><player></c:value>. <c:muted>Now </c:muted><balance> <c:muted>(<reason>)"
  done-set: "<prefix><c:success><sym:check></c:success> <c:text>Set <c:value><player></c:value><c:text>'s <currency> <c:text>to <balance><c:text>. <c:muted>(<reason>)"
  done-reset: "<prefix><c:success><sym:check></c:success> <c:text>Reset <c:value><player></c:value><c:text>'s <currency> <c:text>to <balance><c:text>. <c:muted>(<reason>)"
  alert-give: "<c:muted>[Economy]</c:muted> <c:value><staff></c:value> <c:text>gave <amount> <c:text>to <c:value><player></c:value> <c:muted>(<reason>) <sym:dot> now <balance>"
  alert-take: "<c:muted>[Economy]</c:muted> <c:value><staff></c:value> <c:text>took <amount> <c:text>from <c:value><player></c:value> <c:muted>(<reason>) <sym:dot> now <balance>"
  alert-set: "<c:muted>[Economy]</c:muted> <c:value><staff></c:value> <c:text>set <c:value><player></c:value><c:text>'s <currency> <c:text>to <balance> <c:muted>(<reason>)"
  alert-reset: "<c:muted>[Economy]</c:muted> <c:value><staff></c:value> <c:text>reset <c:value><player></c:value><c:text>'s <currency> <c:text>to <balance> <c:muted>(<reason>)"
  insufficient: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>only has <balance><c:text>. Use <c:value>/eco set</c:value> for an exact balance."
  overflow: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>can't hold that much. Nothing changed."
  notify: "<prefix><c:text>Staff changed your <currency><c:text>. <c:muted>Now </c:muted><balance> <c:muted>(see /transactions)"

# Money notes (M3.2). <amount>, <balance>, <min>, <max> are colored amounts; <id> = first 8 characters of the note id.
note:
  # The note item (lore follows UI_STYLE §4; {placeholders} are filled by the plugin, max ~36 visible characters per line).
  item:
    name: "<cur:{currency}>{amount} Note"
    name-unknown: "<cur:money>Money Note"
    subtitle: "<c:muted>Note <sym:dot> Tradeable"
    description: "Right-click to add it to your balance. Can be traded."
    amount: "<c:text>Amount: <cur:{currency}>{amount}"
    signed-by: "<c:text>Signed by: <c:value>{signer}"
    date: "<c:text>Date: <c:value>{date}"
    id: "<c:text>Note id: <c:muted>#{id}"
    action-input: "Right-click"
    action-text: "to redeem"
  withdrawn: "<prefix><c:success><sym:check></c:success> <c:text>Made a note of <amount><c:text>. <c:muted>Balance: </c:muted><balance> <c:muted>(#<id>) <sym:dot> right-click it to cash it."
  dropped: "<prefix><c:warning><sym:cross></c:warning> <c:text>Inventory full: the note dropped at your feet. Pick it up!"
  insufficient: "<prefix><c:error><sym:cross></c:error> <c:text>You don't have <amount><c:text>. <c:muted>Balance: </c:muted><balance>"
  inventory-full: "<prefix><c:error><sym:cross></c:error> <c:text>Inventory full. Free a slot and try again. Nothing was taken."
  cooldown: "<prefix><c:error><sym:cross></c:error> <c:text>Make another note in <c:value><time></c:value>."
  busy: "<prefix><c:error><sym:cross></c:error> <c:text>Your last note is still being made. Wait a moment."
  frozen: "<prefix><c:error><sym:cross></c:error> <c:text>You can't make notes while frozen. Wait for staff."
  frozen-redeem: "<prefix><c:error><sym:cross></c:error> <c:text>You can't cash notes while frozen. Wait for staff."
  currency-not-allowed: "<prefix><c:error><sym:cross></c:error> <currency> <c:text>can't be made into notes. Money can: <c:value>/withdraw 50k</c:value>"
  below-minimum: "<prefix><c:error><sym:cross></c:error> <c:text>The smallest note is <min><c:text>."
  above-maximum: "<prefix><c:error><sym:cross></c:error> <c:text>The largest note is <max><c:text>. Make several instead."
  new-account: "<prefix><c:error><sym:cross></c:error> <c:text>New players can't make notes yet. <c:value><time></c:value> <c:text>left."
  redeemed: "<prefix><c:success><sym:check></c:success> <c:text>Cashed a note of <amount> <c:muted>(signed by <c:value><signer></c:value>)<c:text>. <c:muted>Balance: </c:muted><balance>"
  overflow: "<prefix><c:error><sym:cross></c:error> <c:text>Your balance can't hold that much. You got the note back."
  confiscated: "<prefix><c:error><sym:cross></c:error> <c:text>This note <why> <c:text>It was taken and staff were told. Got it from someone? <c:value>/report</c:value> them."
  # Why a note was taken (used in <why> above and in the staff alert).
  why:
    already_redeemed: "was already cashed, so it's a copy."
    unknown: "doesn't exist (it was never made)."
    void: "was cancelled before it was handed out."
  dupe-alert: "<c:error><bold>NOTE</bold></c:error> <c:value><player></c:value> <c:text>tried to cash note <c:muted>#<id></c:muted> (<amount><c:text>): it <why> <c:muted>Cashed by <by> <ago> ago. Copy taken (see /logs)."
  admin-done: "<prefix><c:success><sym:check></c:success> <c:text>Gave <c:value><player></c:value> <c:text>a note of <amount><c:text>. <c:muted>(#<id>, <reason>)"
  admin-received: "<prefix><c:success><sym:check></c:success> <c:text>Staff gave you a note of <amount><c:text>. Right-click it to cash it."
  admin-alert: "<c:muted>[Economy]</c:muted> <c:value><staff></c:value> <c:text>gave <c:value><player></c:value> <c:text>a note of <amount> <c:muted>(<reason>) <sym:dot> #<id>"
  admin-inventory-full: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value><c:text>'s inventory is full. Ask them to free a slot. Nothing was made."
  admin-target-left: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>left before the note was ready. Nothing was given."

# Ledger reasons as players read them (/transactions). Groups ("ah", "bank" ...) are used by the reason filter.
reasons:
  pay: "Payment"
  sell: "Selling"
  shop: "Shop"
  shop_buy: "Shop purchase"
  ah: "Auction house"
  ah_buy: "Auction purchase"
  ah_sale: "Auction sale"
  ah_fee: "Auction fee"
  trade: "Trade"
  interest: "Interest"
  bank: "Bank"
  bank_deposit: "Bank deposit"
  bank_withdraw: "Bank withdrawal"
  note: "Money notes"
  note_withdraw: "Money note made"
  note_redeem: "Money note cashed"
  start_balance: "Starting balance"
  admin: "Staff"
  admin_give: "Given by staff"
  admin_take: "Taken by staff"
  admin_set: "Set by staff"
  admin_reset: "Reset by staff"
  admin_note: "Note made by staff"

menu:
  title: "Transactions"
  info:
    - "<c:text>Every change to your balances,"
    - "<c:text>newest first."
    - "<c:text>Filter with the buttons below."
  summary:
    name: "<c:flame><sym:star></c:flame> <c:value>Your balances"
    lore:
      - "<c:text>Matching transactions: <c:value><total>"
      - ""
    line: "<c:muted><sym:bullet></c:muted> <c:text><currency><c:muted>:</c:muted> <amount>"
  any: "<c:value>All"
  any-time: "<c:value>All time"
  last: "<c:value>Last <time>"
  filter-currency:
    name: "<c:value>Currency: <value>"
    lore:
      - "<c:text>Show one currency or all."
      - ""
      - "<c:action><sym:bullet> Click to change"
  filter-reason:
    name: "<c:value>Type: <value>"
    lore:
      - "<c:text>Payments, selling, shop, auctions ..."
      - ""
      - "<c:action><sym:bullet> Click to change"
  filter-time:
    name: "<c:value>Time: <value>"
    lore:
      - "<c:text>How far back to look."
      - ""
      - "<c:action><sym:bullet> Click to change"
  refresh:
    name: "<c:value>Refresh"
    lore:
      - "<c:text>Load the newest transactions."
      - ""
      - "<c:action><sym:bullet> Click to refresh"
  empty:
    name: "<c:muted>Nothing here"
    lore:
      - "<c:text>No transactions match these filters."
  entry:
    island: "Island bank"
    server: "Server"
    in:
      name: "<c:success>+</c:success><amount> <c:muted><sym:dot></c:muted> <c:text><reason>"
      lore:
        - "<c:text>From: <c:value><other>"
        - "<c:text>Balance after: <balance>"
    out:
      name: "<c:error>-</c:error><amount> <c:muted><sym:dot></c:muted> <c:text><reason>"
      lore:
        - "<c:text>To: <c:value><other>"
        - "<c:text>Balance after: <balance>"
    reference:
      - "<c:text>Note: <c:value><reference>"
    footer:
      - ""
      - "<c:muted><ago> ago <sym:dot> <date> UTC"
      - "<c:muted>#<id>"
