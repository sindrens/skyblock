# Economy dashboard + anomaly alerts (M3.8): /eco admin. Staff only. Amount placeholders are colored with their currency.
# Alerts never punish anyone: staff open the evidence and decide.
watch:
  disabled: "<prefix><c:error><sym:cross></c:error> <c:text>The economy watch is switched off (<c:value>economy-watch.yml</c:value> <c:muted>enabled</c:muted>)."
  invalid-alert: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not an alert number. Use the number from the alert, like <c:value>/eco admin 12</c:value>."
  unknown-alert: "<prefix><c:error><sym:cross></c:error> <c:text>Alert <c:value>#<id></c:value> doesn't exist (old alerts are removed after a while)."
  refreshed: "<prefix><c:success><sym:check></c:success> <c:text>Read <c:value><rows></c:value> new transactions. Numbers are up to date."
  state-changed: "<prefix><c:success><sym:check></c:success> <c:text>Alert <c:value>#<id></c:value> is now <c:value><state></c:value>."
  state-unchanged: "<prefix><c:error><sym:cross></c:error> <c:text>Alert <c:value>#<id></c:value> was already <c:value><state></c:value>."
  suggested: "<prefix><c:success><sym:check></c:success> <c:text>Filed a punishment suggestion for <c:value><player></c:value>. Staff decide with Apply or Dismiss."
  suggest-refreshed: "<prefix><c:success><sym:check></c:success> <c:text>The waiting suggestion for <c:value><player></c:value> was updated."
  suggest-failed: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't file a suggestion (<c:value><why></c:value>). Check <c:value>alerts.suggest-reason</c:value> in economy-watch.yml."
  suggest-unavailable: "<prefix><c:error><sym:cross></c:error> <c:text>Suggestions need the moderation module. Use <c:value>/p <player></c:value> instead."
  no-player: "<prefix><c:error><sym:cross></c:error> <c:text>This alert is not about one player."

  # The staff chat line. <severity>, <rule>, <details> are filled from the keys below.
  chat:
    player: "<c:error>[Eco]</c:error> <severity> <c:value><rule></c:value> <c:muted><sym:dot></c:muted> <details> <click:run_command:'/eco admin <id>'><hover:show_text:'<c:text>Open the evidence of alert #<id>'><c:action>[Open]</c:action></hover></click> <click:run_command:'/p <player>'><hover:show_text:'<c:text>Open the punishment menu for <player>'><c:action>[Punish]</c:action></hover></click>"
    server: "<c:error>[Eco]</c:error> <severity> <c:value><rule></c:value> <c:muted><sym:dot></c:muted> <details> <click:run_command:'/eco admin <id>'><hover:show_text:'<c:text>Open the evidence of alert #<id>'><c:action>[Open]</c:action></hover></click>"
  severity:
    high: "<c:error><bold>HIGH</bold></c:error>"
    watch: "<c:warning>WATCH</c:warning>"
  state:
    open: "open"
    reviewed: "reviewed"
    dismissed: "a false alarm"
  # Short rule names and the one-line details. <player> <other> <amount> <expected> <hits> <ratio> <line> <hour> <currency>.
  rules:
    earn-rate:
      name: "Earning fast"
      text: "<c:value><player></c:value> <c:text>earned <amount> <c:text>in the hour from <hour> <c:muted>(alert above <expected>)"
    big-transfer:
      name: "Big transfer"
      text: "<c:value><player></c:value> <c:text>moved <amount> <c:text>to <c:value><other></c:value> <c:text>in one go <c:muted>(alert from <expected>)"
    big-transfer-created:
      name: "Big payout"
      text: "<c:value><player></c:value> <c:text>got <amount> <c:text>in one transaction <c:muted>(alert from <expected>)"
    repeat-transfer:
      name: "Repeated transfers"
      text: "<c:value><player></c:value> <c:text>sent <c:value><other></c:value> <c:text>about the same amount <c:value><hits></c:value> <c:text>times in a few minutes <c:muted>(total <amount>)"
    note-redeem:
      name: "Many notes cashed"
      text: "<c:value><player></c:value> <c:text>cashed <c:value><hits></c:value> <c:text>money notes in the hour from <hour>"
    sell-spike:
      name: "Sell spike"
      text: "<c:text>The server sold for <amount> <c:text>in the hour from <hour> <c:muted>(alert above <expected>)"
    balance-mismatch:
      name: "Balance jump"
      text: "<c:value><player></c:value><c:text>'s <currency> <c:text>changed by <amount> <c:text>without a transaction <c:muted>(was <expected>)"
    balance-mismatch-account:
      name: "Balance jump"
      text: "<c:text>An island or bank account's <currency> <c:text>changed by <amount> <c:text>without a transaction <c:muted>(was <expected>)"
    staff-transfer:
      name: "Staff transfer"
      text: "<c:value><player></c:value> <c:text>moved <amount> <c:text>to <c:value><other></c:value> <c:muted>(a staff account; alert from <expected>)"
    sink-ratio:
      name: "Inflation"
