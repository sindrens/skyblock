# Social messages: private messages, ignore, socialspy, AFK, /list, /ping, /playtime, /seen, /whois, /broadcast, links.
# MiniMessage + style tags (style.yml). Player text (<message>) is never parsed, so players can't inject tags.
# Format (docs/UI_STYLE.md §3): <prefix> on command replies only; success/error marks + gray text; values in <c:value>.
# Reload: /skyblock reload social

unknown-player: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has never joined. Check the spelling."

dm:
  sent: "<hover:show_text:'<c:text>Sent <time>'><c:muted>[</c:muted><c:ember>me</c:ember> <c:muted><sym:arrow></c:muted> <click:suggest_command:'/msg <target> '><hover:show_text:'<c:action>Click to message <target>'><c:value><target></c:value></hover></click><c:muted>]</c:muted></hover> <c:parchment><message>"
  received: "<hover:show_text:'<c:text>Received <time>'><c:muted>[</c:muted><click:suggest_command:'/msg <sender> '><hover:show_text:'<c:action>Click to reply to <sender>'><c:value><sender></c:value></hover></click> <c:muted><sym:arrow></c:muted> <c:ember>me</c:ember><c:muted>]</c:muted></hover> <c:parchment><message>"
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't message yourself."
  disabled: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has private messages off."
  muted: "<prefix><c:error><sym:cross></c:error> <c:text>You're muted, so you can't send private messages."
  too-long: "<prefix><c:error><sym:cross></c:error> <c:text>Too long. Max <c:value><max></c:value> characters."
  slow-down: "<prefix><c:error><sym:cross></c:error> <c:text>Too fast. Try again in <c:value><time></c:value>."
  no-reply: "<prefix><c:error><sym:cross></c:error> <c:text>Nobody to reply to. Use <c:value>/msg <player> <message></c:value>."
  reply-offline: "<prefix><c:error><sym:cross></c:error> <c:text>That player is offline now."
  # R3-32: an account still in the tutorial only gets DMs from staff and players it messaged first. Says nothing about why.
  not-yet: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>can't get private messages from you yet."
  # R3-32 / answer 305: private messages use the chat filter's link, IP and phone checks (never the swear list).
  blocked-link: "<prefix><c:error><sym:cross></c:error> <c:text>Links aren't allowed in private messages."
  blocked-ip: "<prefix><c:error><sym:cross></c:error> <c:text>Server addresses aren't allowed in private messages."
  blocked-phone: "<prefix><c:error><sym:cross></c:error> <c:text>Phone numbers aren't allowed in private messages."

spy:
  line: "<c:muted>[Spy]</c:muted> <c:text><sender> <c:muted><sym:arrow></c:muted> <target>:</c:text> <c:parchment><message>"
  line-blocked: "<c:muted>[Spy]</c:muted> <c:text><sender> <c:muted><sym:arrow></c:muted> <target> <c:muted>(ignored)</c:muted>:</c:text> <c:parchment><message>"
  enabled: "<prefix><c:success><sym:check></c:success> <c:text>Social spy <c:value>on</c:value>. You see all private messages."
  disabled: "<prefix><c:success><sym:check></c:success> <c:text>Social spy <c:value>off</c:value>."

ignore:
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't ignore yourself."
  unknown: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has never joined. Check the spelling."
  staff: "<prefix><c:error><sym:cross></c:error> <c:text>You can't ignore staff. Use <c:value>/report</c:value> if someone bothers you."
  already: "<prefix><c:error><sym:cross></c:error> <c:text>You already ignore <c:value><player></c:value>."
  added: "<prefix><c:success><sym:check></c:success> <c:text>Ignoring <c:value><player></c:value>. No messages, teleport or trade requests or island invites from them. <click:run_command:'/unignore <player>'><hover:show_text:'<c:text>Runs /unignore <player>'><c:action>[Undo]</c:action></hover></click>"
  not-ignored: "<prefix><c:error><sym:cross></c:error> <c:text>You don't ignore <c:value><player></c:value>."
  removed: "<prefix><c:success><sym:check></c:success> <c:text>No longer ignoring <c:value><player></c:value>."
  list-empty: "<prefix><c:text>You don't ignore anyone."
  list: "<prefix><c:text>Ignored (<c:value><count></c:value>): <c:value><players>"

# /settings toggles of this module (owner answer 317).
settings:
  hide-ignored-chat:
    name: "<c:value>Hide ignored chat"
    lore: ["<c:text>Hide the public chat of players", "<c:text>you ignore (only for you)."]

afk:
  tag: "<c:muted>[AFK]</c:muted>"
  now-afk: "<c:muted><sym:dot></c:muted> <c:value><player></c:value> <c:text>is AFK."
  back: "<c:muted><sym:dot></c:muted> <c:value><player></c:value> <c:text>is back."
  you-afk: "<prefix><c:text>You're now <c:value>AFK</c:value>."
  you-back: "<prefix><c:text>Welcome back. You're no longer AFK."

list:
  header: "<prefix><c:value><online></c:value><c:muted>/<max></c:muted> <c:text>online:"
  group: " <c:muted><sym:bullet></c:muted> <rank> <c:muted>(<count>):</c:muted> <players>"
  afk-suffix: " <c:muted>[AFK]</c:muted>"

ping:
  good-self: "<prefix><c:text>Your ping: <c:success><ping> ms"
  ok-self: "<prefix><c:text>Your ping: <c:warning><ping> ms"
  bad-self: "<prefix><c:text>Your ping: <c:error><ping> ms"
  good-other: "<prefix><c:value><player></c:value><c:text>'s ping: <c:success><ping> ms"
  ok-other: "<prefix><c:value><player></c:value><c:text>'s ping: <c:warning><ping> ms"
  bad-other: "<prefix><c:value><player></c:value><c:text>'s ping: <c:error><ping> ms"

playtime:
  self: "<prefix><c:text>You've played <c:value><time></c:value>."
  other: "<prefix><c:value><player></c:value> <c:text>has played <c:value><time></c:value>."

seen:
  online: "<prefix><c:value><player></c:value> <c:text>is <c:success>online</c:success>. First joined <c:value><first></c:value>."
  offline: "<prefix><c:value><player></c:value> <c:text>was online <c:value><ago></c:value> ago <c:muted>(<last>)</c:muted>. First joined <c:value><first></c:value>."
  details: " <c:muted><sym:bullet></c:muted> <c:text>UUID <click:copy_to_clipboard:'<uuid>'><hover:show_text:'<c:action>Click to copy'><c:value><uuid></c:value></hover></click> <c:muted><sym:dot></c:muted> <c:value><platform>"

whois:
  header: "<prefix><c:text>Who is <c:value><player></c:value>?"
  uuid: " <c:muted><sym:bullet></c:muted> <c:text>UUID <click:copy_to_clipboard:'<uuid>'><hover:show_text:'<c:action>Click to copy'><c:value><uuid></c:value></hover></click>"
  status: " <c:muted><sym:bullet></c:muted> <c:text>Status <c:value><status></c:value> <c:muted>(seen <ago> ago)"
  rank: " <c:muted><sym:bullet></c:muted> <c:text>Rank <c:value><rank></c:value> <c:muted><sym:dot></c:muted> <c:text>Platform <c:value><platform>"
  times: " <c:muted><sym:bullet></c:muted> <c:text>First <c:value><first></c:value> <c:muted><sym:dot></c:muted> <c:text>Last <c:value><last></c:value> <c:muted><sym:dot></c:muted> <c:text>Played <c:value><playtime>"
  location: " <c:muted><sym:bullet></c:muted> <c:text>At <c:value><world> <x>, <y>, <z></c:value> <c:muted><sym:dot></c:muted> <c:text><gamemode> <c:muted><sym:dot></c:muted> <c:text><ping> ms"
  names: " <c:muted><sym:bullet></c:muted> <c:text>Names <c:value><names>"
  ips: " <c:muted><sym:bullet></c:muted> <c:text>Addresses <c:value><ips>"
  alts: " <c:muted><sym:bullet></c:muted> <c:warning>Same address (<count>): <c:value><alts>"
  no-alts: " <c:muted><sym:bullet></c:muted> <c:text>No other accounts on this address."
  error: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't load that player. Check the console."

broadcast:
  chat:
    - ""
    - " <grad:phoenix><bold>ANNOUNCEMENT</bold></grad>"
    - " <c:parchment><message>"
    - ""
  title: "<grad:phoenix><bold>ANNOUNCEMENT</bold></grad>"

links:
  discord: "<prefix><c:text>Our Discord: <click:open_url:'<url>'><hover:show_text:'<c:action>Click to open'><c:sky_ice><u><url></u></c:sky_ice></hover></click>"
  store: "<prefix><c:text>Ranks, keys and more: <click:open_url:'<url>'><hover:show_text:'<c:action>Click to open'><c:sky_ice><u><url></u></c:sky_ice></hover></click>"
  vote: "<prefix><c:text>Vote daily for rewards: <click:open_url:'<url>'><hover:show_text:'<c:action>Click to open'><c:sky_ice><u><url></u></c:sky_ice></hover></click>"
  website: "<prefix><c:text>Our website: <click:open_url:'<url>'><hover:show_text:'<c:action>Click to open'><c:sky_ice><u><url></u></c:sky_ice></hover></click>"

rules:
  - ""
  - " <grad:phoenix><bold>RULES</bold></grad>"
  - " <c:muted>1.</c:muted> <c:text>Be kind. No harassment, hate or threats."
  - " <c:muted>2.</c:muted> <c:text>No cheats, hacked clients, x-ray or unfair mods."
  - " <c:muted>3.</c:muted> <c:text>No duping or bug abuse. Report bugs to staff."
  - " <c:muted>4.</c:muted> <c:text>No spam, ads or scams."
  - " <c:muted>5.</c:muted> <c:text>No real-money trading outside the store."
  - " <c:muted>6.</c:muted> <c:text>Staff decisions are final unless you appeal with /appeal in game or on Discord."
  - " <c:muted>7.</c:muted> <c:text>English only in public chat. Private messages can be in any language."
  - " <c:muted>8.</c:muted> <c:text>No alt accounts to dodge punishments or farm rewards."
  - " <c:muted>9.</c:muted> <c:text>No macros or AFK farming outside the AFK pool."
  - " <c:muted>Chat, private messages and commands are logged for 30 days and staff can read them.</c:muted> <click:open_url:'https://skybornmc.net/privacy'><hover:show_text:'<c:action>Click to open'><c:sky_ice><u>Privacy</u></c:sky_ice></hover></click>"
  - " <c:muted>Private messages attached to a /report are kept 180 days as evidence."
  - " <c:text>Full rules: <click:open_url:'<url>'><hover:show_text:'<c:action>Click to open'><c:sky_ice><u><url></u></c:sky_ice></hover></click>"
  - ""
