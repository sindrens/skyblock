# HUD texts. MiniMessage + style tags. Reload: /skyblock reload hud
#
# Sidebar layouts: scoreboard.<layout>.title + lines (max 15 lines; Bedrock shows 15). Keep them short: 10 lines
#   with the title is the house style (docs/UI_STYLE.md §6.1).
# Which layout is used where is set in hud.yml -> places (one layout per place):
#   island        your own island (and the island world outside any island)
#   island-visit  someone else's island (falls back to "island")
#   depths        The Depths; variants: depths-gate (The Gate), depths-forest, depths-combat (fall back to "depths")
#   spawn         spawn
#   warzone       the warzone (placeholder until the warzone is built)
#   default       everywhere else; a layout named after a world is used in that world
#   A module can still pick a layout itself (events later). A missing layout falls back to the next one.
# Built-in values: <name> (rank color), <rank>, <money>, <crystals>, <gems>, <island>, <island_here> (name of the
#   island you stand on), <objective>, <online>.
#   Any placeholder works too: <ph:playtime>, <ph:ping>, <ph:depths_zone>, <ph:skill_mining_level> ...
# An empty line "" is a blank separator.
# A line starting with "if:<placeholder>|" only shows while that placeholder has a value (not empty, not "-"):
#   "if:island_next_note| <c:muted>Next</c:muted>  ..." hides the whole line when there is no open note.
# V2 look (STYLE2): phoenix gradient title, bold red "| Section" headers, rows start with a dark red "|" bar,
# labels gray with a colon, values white or their currency color, footer play.skybornmc.net. Max 9 lines + title.

scoreboard:
  default:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - " <bold><c:header>| Profile</c:header></bold>"
      - " <c:bar>|</c:bar> <name> <c:muted><sym:dot></c:muted> <rank>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - " <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - " <c:bar>|</c:bar> <c:text>Gems:</c:text> <gems>"
      - ""
      - " <bold><c:header>| Island</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Level:</c:text> <island>"
      # Optional (island profiles): show the active profile. Remove the "# " to turn it on (max 9 lines).
      # - " <c:bar>|</c:bar> <c:text>Profile:</c:text> <c:value><ph:profile_name>"
      - " <c:sky_ice>play.skybornmc.net"

  # Spawn: the hub. Same as default for now; change it freely.
  spawn:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - " <bold><c:header>| Profile</c:header></bold>"
      - " <c:bar>|</c:bar> <name> <c:muted><sym:dot></c:muted> <rank>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - " <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - " <c:bar>|</c:bar> <c:text>Gems:</c:text> <gems>"
      # Blank separator, except while standing in the AFK pool: then the AFK line (messages/afk.yml -> scoreboard.line).
      - "<ph:afk_line>"
      - " <bold><c:header>| Island</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Level:</c:text> <island>"
      - " <c:sky_ice>play.skybornmc.net"

  # Your own island: island first, the newest open note (only when there is one and the
  # "Next note on scoreboard" setting is on), then money, crystals and gems (owner: gems on the scoreboard).
  island:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - " <bold><c:header>| Island</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Level:</c:text> <island>"
      - "if:island_next_note| <c:bar>|</c:bar> <c:text>Next:</c:text> <c:value><ph:island_next_note>"
      - " <bold><c:header>| Profile</c:header></bold>"
      - " <c:bar>|</c:bar> <name> <c:muted><sym:dot></c:muted> <rank>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - " <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - " <c:bar>|</c:bar> <c:text>Gems:</c:text> <gems>"
      - " <c:sky_ice>play.skybornmc.net"

  # Someone else's island: whose island you are on.
  island-visit:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - " <bold><c:header>| Island</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Visiting:</c:text> <island_here>"
      - ""
      - " <bold><c:header>| Profile</c:header></bold>"
      - " <c:bar>|</c:bar> <name> <c:muted><sym:dot></c:muted> <rank>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - " <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - " <c:bar>|</c:bar> <c:text>Gems:</c:text> <gems>"
      - " <c:sky_ice>play.skybornmc.net"

  # The Depths, Mine wing and causeways: where you are and how far your mining is.
  depths:
    title: "<grad:phoenix><bold>THE DEPTHS</bold></grad>"
    lines:
      - " <bold><c:header>| Depths</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Zone:</c:text> <c:value><ph:depths_zone>"
      - " <c:bar>|</c:bar> <c:text>Tier:</c:text> <c:value><ph:depths_tier>"
      - " <c:bar>|</c:bar> <c:text>Satchel:</c:text> <c:value><ph:satchel_used></c:value> <c:muted>/</c:muted> <c:value><ph:satchel_max>"
      - " <c:bar>|</c:bar> <c:text>Mining:</c:text> <c:value>Lv <ph:skill_mining_level></c:value> <c:muted>(<ph:skill_mining_progress>%)"
      - ""
      - " <bold><c:header>| Profile</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - " <c:sky_ice>play.skybornmc.net"

  # The Gate (Depths hub): the three skills that unlock the wings.
  depths-gate:
    title: "<grad:phoenix><bold>THE DEPTHS</bold></grad>"
    lines:
      - " <bold><c:header>| Depths</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Zone:</c:text> <c:value><ph:depths_zone>"
      - ""
      - " <bold><c:header>| Skills</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Mining:</c:text> <c:value>Lv <ph:skill_mining_level>"
      - " <c:bar>|</c:bar> <c:text>Foraging:</c:text> <c:value>Lv <ph:skill_foraging_level>"
      - " <c:bar>|</c:bar> <c:text>Combat:</c:text> <c:value>Lv <ph:skill_combat_level>"
      - ""
      - " <c:sky_ice>play.skybornmc.net"

  # Forest wing: foraging instead of mining.
  depths-forest:
    title: "<grad:phoenix><bold>THE DEPTHS</bold></grad>"
    lines:
      - " <bold><c:header>| Depths</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Zone:</c:text> <c:value><ph:depths_zone>"
      - " <c:bar>|</c:bar> <c:text>Tier:</c:text> <c:value><ph:depths_tier>"
      - " <c:bar>|</c:bar> <c:text>Satchel:</c:text> <c:value><ph:satchel_used></c:value> <c:muted>/</c:muted> <c:value><ph:satchel_max>"
      - " <c:bar>|</c:bar> <c:text>Foraging:</c:text> <c:value>Lv <ph:skill_foraging_level></c:value> <c:muted>(<ph:skill_foraging_progress>%)"
      - ""
      - " <bold><c:header>| Profile</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - " <c:sky_ice>play.skybornmc.net"

  # Combat wing: combat instead of mining.
  depths-combat:
    title: "<grad:phoenix><bold>THE DEPTHS</bold></grad>"
    lines:
      - " <bold><c:header>| Depths</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Zone:</c:text> <c:value><ph:depths_zone>"
      - " <c:bar>|</c:bar> <c:text>Tier:</c:text> <c:value><ph:depths_tier>"
      - " <c:bar>|</c:bar> <c:text>Combat:</c:text> <c:value>Lv <ph:skill_combat_level></c:value> <c:muted>(<ph:skill_combat_progress>%)"
      - ""
      - " <bold><c:header>| Profile</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - " <c:sky_ice>play.skybornmc.net"

  # Warzone: placeholder until the warzone is built (kills, bounty and event timer come with it).
  warzone:
    title: "<grad:phoenix><bold>WARZONE</bold></grad>"
    lines:
      - " <bold><c:header>| Warzone</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Combat:</c:text> <c:value>Lv <ph:skill_combat_level></c:value> <c:muted>(<ph:skill_combat_progress>%)"
      - ""
      - " <bold><c:header>| Profile</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - " <c:sky_ice>play.skybornmc.net"

values:
  dash: "<c:muted>-"   # "—" would need a Bedrock test first (style.yml bedrock-safe-symbols)
  money: "<cur:money><sym:money><value>"
  crystals: "<cur:crystals><sym:crystals> <value>"
  gems: "<cur:gems><sym:gems> <value>"
  island: "<c:value>Lv <level></c:value> <c:muted>#<position>"
  island-no-rank: "<c:value>Lv <level>"
  island-here: "<c:value><value>"
  objective: "<c:text>Next: <c:value><value>"
  objective-default: "<c:text>Next: <c:value>Explore /menu"
