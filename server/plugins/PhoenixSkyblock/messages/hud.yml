# HUD texts. MiniMessage + style tags. Reload: /skyblock reload hud
#
# Sidebar layouts: scoreboard.<layout>.title + lines. Board shape (G7-R1-01, docs/UI_STYLE.md §6.1): the title
#   PHOENIX SKYBLOCK, the "| You" section, one section named after the place, the footer: 10 lines at most counting
#   the title and the footer (Bedrock shows 15).
# Which layout is used where is set in hud.yml -> places (one layout per place):
#   island        your own island (and the island world outside any island)
#   island-visit  someone else's island (falls back to "island")
#   depths        The Depths; variants: depths-gate (The Gate), depths-forest, depths-combat (fall back to "depths")
#   spawn         spawn
#   warzone       the warzone (placeholder until the warzone is built)
#   default       everywhere else; a layout named after a world is used in that world
#   A module can still pick a layout itself (events later). A missing layout falls back to the next one.
# Built-in values: <name> (rank color), <rank>, <money>, <crystals>, <credits>, <island> ("Lv 34 #12"), <island_here>
#   (name of the island you stand on), <objective> ("Next: ..."), <online>, and:
#   <progress:key>  the placeholder "key" as a percent, drawn as dots (values.progress; hud.yml scoreboard.progress-length)
#   <plain:key>     the placeholder's plain text, never parsed, so it takes the colour around it ("| <plain:depths_zone>")
#   <timer>         the soonest running timer (boosters, later events): "Booster: +50% Sell 37m" (values.timer)
#   Any placeholder works too: <ph:playtime>, <ph:ping>, <ph:skill_mining_level> ...
# A line starting with "if:<placeholder>|" only shows while that placeholder has a value (not empty, not "-");
#   "if:a,b|" shows it while any of them has a value. The built-in key "board_timer" has a value while a timer runs.
# Board rules (automatic, hud.yml scoreboard.*):
#   - a header is a line starting with <bold><c:header>, a row a line starting with <c:bar>; a header takes at most
#     scoreboard.section-rows rows (3): rows further down a full section are dropped, the first ones win
#   - a header with no row under it disappears (no "if:" needed on headers)
#   - "<soft-blank>" is a blank line that only shows while the other lines are at most
#     scoreboard.blank-under-title-max-lines (8 = boards with 5 rows or fewer); "" is a blank line that always shows
# Look (V2): phoenix gradient title, bold red "| Section" headers, rows start with a dark red "|" bar, labels gray with
#   a colon, values white or their currency colour, footer play.skybornmc.net. No icons, no online count.

scoreboard:
  # Everywhere else: like your own island.
  default:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - "<soft-blank>"   # blank line under the title, only while the board is short (scoreboard.blank-under-title-max-lines)
      - " <bold><c:header>| You</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - "if:crystals_owned| <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - "if:credits_owned| <c:bar>|</c:bar> <c:text>Credits:</c:text> <credits>"
      - " <bold><c:header>| Island</c:header></bold>"
      - "if:island_level| <c:bar>|</c:bar> <c:text>Level:</c:text> <island>"
      - "if:objective| <c:bar>|</c:bar> <objective>"
      - "if:island_level| <c:bar>|</c:bar> <progress:island_level_progress>"
      - "if:board_timer| <c:bar>|</c:bar> <timer>"
      - " <c:sky_ice>play.skybornmc.net"

  # Your own island: level and place, progress to the next level, then the newest open note or a timer.
  island:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - "<soft-blank>"   # blank line under the title, only while the board is short (scoreboard.blank-under-title-max-lines)
      - " <bold><c:header>| You</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - "if:crystals_owned| <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - "if:credits_owned| <c:bar>|</c:bar> <c:text>Credits:</c:text> <credits>"
      - " <bold><c:header>| Island</c:header></bold>"
      - "if:island_level| <c:bar>|</c:bar> <c:text>Level:</c:text> <island>"
      - "if:objective| <c:bar>|</c:bar> <objective>"
      - "if:island_level| <c:bar>|</c:bar> <progress:island_level_progress>"
      - "if:island_next_note| <c:bar>|</c:bar> <c:text>Note:</c:text> <c:value><ph:island_next_note>"
      - "if:board_timer| <c:bar>|</c:bar> <timer>"
      - " <c:sky_ice>play.skybornmc.net"

  # Someone else's island: whose island you are on.
  island-visit:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - "<soft-blank>"   # blank line under the title, only while the board is short (scoreboard.blank-under-title-max-lines)
      - " <bold><c:header>| You</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - "if:crystals_owned| <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - " <bold><c:header>| Visiting</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Island:</c:text> <island_here>"
      - "if:island_here_owner| <c:bar>|</c:bar> <c:text>Owner:</c:text> <c:value><ph:island_here_owner>"
      - "if:board_timer| <c:bar>|</c:bar> <timer>"
      - " <c:sky_ice>play.skybornmc.net"

  # Spawn: the tutorial "Next:" line, or the AFK pool line while you stand in the pool.
  spawn:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - "<soft-blank>"   # blank line under the title, only while the board is short (scoreboard.blank-under-title-max-lines)
      - " <bold><c:header>| You</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - "if:crystals_owned| <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - "if:credits_owned| <c:bar>|</c:bar> <c:text>Credits:</c:text> <credits>"
      - " <bold><c:header>| Spawn</c:header></bold>"
      - "if:objective| <c:bar>|</c:bar> <objective>"
      - "if:afk_pool| <c:bar>|</c:bar><ph:afk_line>"   # the AFK line (messages/afk.yml scoreboard.line) has its own leading space
      - "if:board_timer| <c:bar>|</c:bar> <timer>"
      - " <c:sky_ice>play.skybornmc.net"

  # The Depths, Mine wing and causeways: the zone is the section name; tier, Mining level and progress ("Next:" takes the progress row during the tutorial).
  depths:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - "<soft-blank>"   # blank line under the title, only while the board is short (scoreboard.blank-under-title-max-lines)
      - " <bold><c:header>| You</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - "if:crystals_owned| <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - " <bold><c:header>| <plain:depths_zone></c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Tier:</c:text> <c:value><ph:depths_tier>"
      - " <c:bar>|</c:bar> <c:text>Mining:</c:text> <c:value>Lv <ph:skill_mining_level>"
      - "if:objective| <c:bar>|</c:bar> <objective>"
      - " <c:bar>|</c:bar> <progress:skill_mining_progress>"
      - " <c:sky_ice>play.skybornmc.net"

  # Forest wing: foraging instead of mining.
  depths-forest:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - "<soft-blank>"   # blank line under the title, only while the board is short (scoreboard.blank-under-title-max-lines)
      - " <bold><c:header>| You</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - "if:crystals_owned| <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - " <bold><c:header>| <plain:depths_zone></c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Tier:</c:text> <c:value><ph:depths_tier>"
      - " <c:bar>|</c:bar> <c:text>Foraging:</c:text> <c:value>Lv <ph:skill_foraging_level>"
      - "if:objective| <c:bar>|</c:bar> <objective>"
      - " <c:bar>|</c:bar> <progress:skill_foraging_progress>"
      - " <c:sky_ice>play.skybornmc.net"

  # Combat wing: combat instead of mining.
  depths-combat:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - "<soft-blank>"   # blank line under the title, only while the board is short (scoreboard.blank-under-title-max-lines)
      - " <bold><c:header>| You</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - "if:crystals_owned| <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - " <bold><c:header>| <plain:depths_zone></c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Tier:</c:text> <c:value><ph:depths_tier>"
      - " <c:bar>|</c:bar> <c:text>Combat:</c:text> <c:value>Lv <ph:skill_combat_level>"
      - "if:objective| <c:bar>|</c:bar> <objective>"
      - " <c:bar>|</c:bar> <progress:skill_combat_progress>"
      - " <c:sky_ice>play.skybornmc.net"

  # The Gate (Depths hub): the three skills that unlock the wings.
  depths-gate:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - "<soft-blank>"   # blank line under the title, only while the board is short (scoreboard.blank-under-title-max-lines)
      - " <bold><c:header>| You</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - "if:crystals_owned| <c:bar>|</c:bar> <c:text>Crystals:</c:text> <crystals>"
      - " <bold><c:header>| <plain:depths_zone></c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Mining:</c:text> <c:value>Lv <ph:skill_mining_level>"
      - " <c:bar>|</c:bar> <c:text>Foraging:</c:text> <c:value>Lv <ph:skill_foraging_level>"
      - " <c:bar>|</c:bar> <c:text>Combat:</c:text> <c:value>Lv <ph:skill_combat_level>"
      - " <c:sky_ice>play.skybornmc.net"

  # Warzone: placeholder until the warzone is built (kills, bounty and the event timer come with it).
  warzone:
    title: "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    lines:
      - "<soft-blank>"   # blank line under the title, only while the board is short (scoreboard.blank-under-title-max-lines)
      - " <bold><c:header>| You</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Money:</c:text> <money>"
      - " <bold><c:header>| Warzone</c:header></bold>"
      - " <c:bar>|</c:bar> <c:text>Combat:</c:text> <c:value>Lv <ph:skill_combat_level>"
      - " <c:bar>|</c:bar> <progress:skill_combat_progress>"
      - "if:board_timer| <c:bar>|</c:bar> <timer>"
      - " <c:sky_ice>play.skybornmc.net"

values:
  dash: "<c:muted>-"   # "—" would need a Bedrock test first (style.yml bedrock-safe-symbols)
  money: "<cur:money><sym:money><value>"
  crystals: "<cur:crystals><sym:crystals> <value>"
  credits: "<cur:credits><sym:credits> <value>"
  island: "<c:value>Lv <level></c:value> <c:muted>#<position>"
  island-no-rank: "<c:value>Lv <level>"
  island-here: "<c:value><value>"
  objective: "<c:text>Next: <c:value><value>"
  objective-default: "<c:text>Next: <c:value>Explore /menu"
  # Progress line (<progress:key>): filled dots flame, empty dots the same dot in locked gray (UI_STYLE §4.1).
  progress: "<c:flame><filled></c:flame><c:locked><empty></c:locked> <c:value><percent>%"
  progress-filled: "●"
  progress-empty: "●"
  # Timer line (<timer>): <label> from the module that runs it ("Booster: +50% Sell"), <time> such as 37m or 2h 15m.
  timer: "<c:text><label></c:text> <c:ember><time></c:ember>"
