# Staff log viewer (/logs) texts. MiniMessage + style tags (style.yml). Placeholders are written as <name>.
# Reload: /skyblock reload logs

usage:
  - "<prefix><c:value>Log viewer</c:value> <c:muted><sym:dot></c:muted> <c:text>search the audit log"
  - " <c:muted><sym:bullet></c:muted> <c:value>/logs player <name> [category] [time]</c:value> <c:text>everything about a player"
  - " <c:muted><sym:bullet></c:muted> <c:value>/logs pay <name> [other]</c:value> <c:text>money between players"
  - " <c:muted><sym:bullet></c:muted> <c:value>/logs trade|chat|commands <name> [time]</c:value>"
  - " <c:muted><sym:bullet></c:muted> <c:value>/logs island <name|id></c:value> <c:muted><sym:dot></c:muted> <c:value>/logs item <uuid></c:value>"
  - " <c:muted><sym:bullet></c:muted> <c:value>/logs staff <name> [time]</c:value> <c:muted><sym:dot></c:muted> <c:value>/logs export <name|last></c:value>"
  - " <c:muted><sym:bullet></c:muted> <c:value>/logs page <n></c:value> <c:text>next pages of your last search"

title:
  staff: "Staff"
  logs: "Logs"
  pick-player: "Pick a player"
  category: "Category"

# ------------------------------------------------------------------ hub (/logs)
hub:
  info:
    - "<c:text>Choose <c:value>who</c:value> to look at, a <c:value>category</c:value>"
    - "<c:text>and a <c:value>time range</c:value>, then press <c:success>Search</c:success>."
    - "<c:muted>Shortcuts: /logs player, /logs pay, /logs chat ..."
  summary:
    name: "<c:flame><sym:star></c:flame> <c:value>Current search"
    lore:
      - "<c:text>Who: <c:value><subject>"
      - "<c:text>Category: <c:value><categories>"
      - "<c:text>Time: <c:value><range>"
  selected:
    - ""
    - "<c:success><sym:check> Selected: <c:value><subject>"
  online:
    name: "<c:flame>Online player"
    lore:
      - "<c:text>Everything a player online now did"
      - "<c:text>or had done to them."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to pick a player"
  any:
    name: "<c:flame>Any player"
    lore:
      - "<c:text>Online or offline: type the name."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to type a name"
  staff:
    name: "<c:flame>Staff member"
    lore:
      - "<c:text>Only what a staff member <c:value>did</c:value>."
      - "<c:text>For accountability."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to type a name"
    # QOL3: shown (locked) to ranks without the staff-member search, so the row keeps its shape.
    locked: "<c:muted>Only admins can search by staff member."
  near:
    name: "<c:flame>Near me"
    lore:
      - "<c:text>Actions around where you stand."
      - "<c:text>Change the radius below."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to search around you"
  item:
    name: "<c:flame>Item"
    lore:
      - "<c:text>The full life of a unique item:"
      - "<c:text>created, traded, sold, flagged as dupe."
      - "<c:text>Uses the item in your hand, or type its id."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose the item"
  island:
    name: "<c:flame>Island"
    lore:
      - "<c:text>Invites, kicks, roles, bank, upgrades."
      - "<c:text>Type the owner's name or the island id."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to type a name or id"
  all:
    name: "<c:flame>Everything"
    lore:
      - "<c:text>All actions on the server, newest first."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to select"
  category:
    name: "<c:value>Category"
    lore:
      - "<c:text>Now: <c:value><categories>"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"
  time:
    name: "<c:value>Time range"
    lore:
      - "<c:text>Now: <c:value><range>"
      - "<c:muted>Options: <options>"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"
  radius:
    name: "<c:value>Radius"
    lore:
      - "<c:text>Now: <c:value><radius> blocks"
      - "<c:muted>Options: <options>"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to choose"
    value: "<c:value><radius> blocks"
  reset:
    name: "<c:error>Reset"
    lore:
      - "<c:text>Clear who, category and time."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to reset"
  search:
    name: "<c:success><bold>SEARCH</bold>"
    lore:
      - "<c:text>Show the logs of <c:value><subject></c:value>,"
      - "<c:text>newest first."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to search"
  export:
    name: "<c:value>Export as CSV"
    lore:
      - "<c:text>Saves every result of this search to"
      - "<c:value>plugins/PhoenixSkyblock/exports/</c:value>"
      - "<c:text>for appeals and evidence."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to export"

# ------------------------------------------------------------------ results
results:
  info:
    - "<c:text>Newest first. Click an entry for its"
    - "<c:text>details, Teleport and Punish."
    - "<c:text>Java shortcut: right-click prints it in chat."
  summary:
    name: "<c:flame><sym:star></c:flame> <c:value>Search"
    lore:
      - "<c:text>Who: <c:value><subject>"
      - "<c:text>Category: <c:value><categories>"
      - "<c:text>Time: <c:value><range>"
      - ""
      - "<c:text>Results: <c:value><total>"
      - "<c:text>Page <c:value><page></c:value> of <c:value><pages>"
  filters:
    name: "<c:value>Change search"
    lore:
      - "<c:text>Back to who, category and time."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to change"
  chat:
    name: "<c:value>Show in chat"
    lore:
      - "<c:text>Prints this page in chat, one line per"
      - "<c:text>entry with hover details."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to show"
  refresh:
    name: "<c:value>Refresh"
    lore:
      - "<c:text>Load the newest entries."
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to refresh"
  export:
    name: "<c:value>Export as CSV"
    lore:
      - "<c:text>Every result of this search, saved to"
      - "<c:value>plugins/PhoenixSkyblock/exports/"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>to export"
  empty:
    name: "<c:text>No logs found"
    lore:
      - "<c:muted>Nothing matches this search."
      - "<c:muted>Try a longer time range or All categories."

# ------------------------------------------------------------------ category picker
category-menu:
  info:
    - "<c:text>Search one category, or all you may see."
    - "<c:muted>Which categories you see depends on your rank."
  all:
    name: "<c:flame>All categories"
    lore:
      - "<c:text>Every category you may see."
  entry:
    name: "<c:flame><category>"
  selected:
    - ""
    - "<c:success><sym:check> Selected"
  click:
    - ""
    - "<bold><c:action>» CLICK</c:action></bold> <c:text>to select"
  descriptions:
    economy: ["<c:text>Payments, money given or taken, banks."]
    trade: ["<c:text>Secure trades, with both sides."]
    auction: ["<c:text>Auction listings, purchases, expiries."]
    island: ["<c:text>Invites, kicks, roles, bank, upgrades."]
    punishment: ["<c:text>Bans, mutes, unbans, warnings."]
    staff: ["<c:text>What staff did: give, teleport, edit ..."]
    config: ["<c:text>Config reloads and setting changes."]
    command: ["<c:text>Every command players ran (30 days)."]
    chat: ["<c:text>Public chat (30 days)."]
    dm: ["<c:text>Private messages (/msg, /r), 30 days.", "<c:text>Mods and up only."]
    item: ["<c:text>Item events and dupe alerts (30 days)."]
    auth: ["<c:text>Joins and quits."]
    world: ["<c:text>World events."]
    tutorial: ["<c:text>Join tutorial: steps, finish, staff skip."]
    crates: ["<c:text>Crate keys given and used, opens, rewards."]
    boosters: ["<c:text>Boosters started, banked, global, thanks."]
    rewards: ["<c:text>Daily claims, streaks, playtime rewards."]
    quests: ["<c:text>Quests rolled, swapped and done, island missions."]
    collection: ["<c:text>Collection log finds, milestones, rewards."]
    pass: ["<c:text>Battle pass XP, tier claims, premium."]
    blackmarket: ["<c:text>Black Market buys, hand-outs, refunds."]
    production: ["<c:text>Island Fuel added, islands asleep."]

categories:
  all: "All you can see"
  separator: ", "
  economy: "Economy"
  trade: "Trade"
  auction: "Auction"
  island: "Island"
  punishment: "Punishment"
  staff: "Staff"
  config: "Config"
  command: "Commands"
  chat: "Chat"
  dm: "Private messages"
  item: "Items"
  auth: "Joins"
  world: "World"
  tutorial: "Tutorial"
  crates: "Crates"
  boosters: "Boosters"
  rewards: "Rewards"
  quests: "Quests"
  collection: "Collection"
  pass: "Battle pass"
  blackmarket: "Black Market"
  production: "Production"

ranges:
  all: "All time"
  last: "Last <range>"

subjects:
  all: "Everyone"
  player: "<name>"
  actor: "<name> (as actor)"
  between: "<name> & <other>"
  item: "Item <id>"
  island: "Island <id>"
  island-of: "<name>'s island"
  near: "Near <x>, <z> (<radius>)"

# ------------------------------------------------------------------ one entry
entry:
  name: "<c:flame><actor></c:flame> <c:text><action></c:text> <c:muted><sym:dot> <ago>"
  time: "<c:muted><utc>"
  who: "<c:value><actor></c:value> <c:ember><sym:arrow></c:ember> <c:value><target>"
  who-solo: "<c:text>By <c:value><actor>"
  amount: "<c:text>Amount: <c:value><amount>"
  text: "<c:text>Text: <c:value><text>"
  location: "<c:text>Where: <c:value><world> <x>, <y>, <z>"
  details-header: "<c:ember>Details"
  detail: " <c:muted>•</c:muted> <c:text><line>"
  meta: "<c:muted>#<id> <sym:dot> <server> <sym:dot> season <season> <sym:dot> <raw-action>"
  click-teleport: "<bold><c:action>» CLICK</c:action></bold> <c:text>to teleport there"
  right-click-chat: "<bold><c:action>» RIGHT-CLICK</c:action></bold> <c:text>full details in chat"
  click-chat: "<bold><c:action>» CLICK</c:action></bold> <c:text>full details in chat"
  # Phase P 13.11: a chat line opens the punish menu (/p) with this line (and the lines before it) as evidence.
  click-punish: "<bold><c:action>» CLICK</c:action></bold> <c:text>to punish with this line as evidence"
  # GUI-4c: a click on a result opens the entry screen.
  click-open: "<bold><c:action>» CLICK</c:action></bold> <c:text>for details and actions"

# GUI-4c: one log entry (plain click on a result). <id> entry id, <world> <x> <y> <z>, <player> who wrote the line.
entry-menu:
  crumb: "Entry #<id>"
  teleport:
    name: "<c:info>Teleport there"
    lore: ["<c:text><world> <x>, <y>, <z>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to teleport"]
  punish:
    name: "<c:error>Punish <player>"
    lore: ["<c:text>Opens /p with this chat line", "<c:text>(and the lines before it) as evidence.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to punish"]
  chat:
    name: "<c:value>Show in chat"
    lore: ["<c:text>One line with the full details", "<c:text>(hover it on Java).", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to show"]
  read:
    name: "<c:value>Read the details"
    lore: ["<c:text>Every detail of this entry", "<c:text>in a popup.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to read"]
  popup-back: "Back"

hover:
  header: "<c:flame><category></c:flame> <c:muted><sym:dot> <utc>"
  json: "<c:muted><line>"

# ------------------------------------------------------------------ chat output
chat:
  loading: "<prefix><c:text>Searching the logs..."
  header: "<prefix><c:value>Logs</c:value> <c:muted><sym:dot></c:muted> <c:value><subject></c:value> <c:muted><sym:dot></c:muted> <c:text><categories> <c:muted><sym:dot></c:muted> <c:text><range> <c:muted><sym:dot></c:muted> <c:value><total></c:value> <c:text>results"
  empty: " <c:muted>No logs match this search.</c:muted>"
  line: " <c:muted><ago></c:muted> <c:value><actor></c:value> <c:text><action></c:text><target-part><amount-part><text-part>"
  target: " <c:value><target>"
  amount: " <c:muted>(</c:muted><c:value><amount></c:value><c:muted>)</c:muted>"
  text: "<c:muted>:</c:muted> <c:text><text>"
  location: " <c:info>[<x>, <y>, <z>]"
  location-hover: "<c:text>Teleport to <c:value><world> <x>, <y>, <z>"
  # Phase P 13.11: after a chat line, for staff who may punish (opens /p with this line as evidence).
  punish: " <c:action>[Punish]"
  punish-hover: "<c:text>Open the punish menu for <c:value><actor></c:value> with this line as evidence <c:muted>(#<id>)"
  previous: "<c:action>[« Previous]"
  previous-off: "<c:muted>[« Previous]"
  next: "<c:action>[Next <sym:arrow>]"
  next-off: "<c:muted>[Next <sym:arrow>]"
  footer: " <previous> <c:muted>Page <c:value><page></c:value>/<c:value><pages></c:value></c:muted> <next>"

# ------------------------------------------------------------------ typed values (QOL3: MenuService.input)
# Java: the chat line (<cancel>, <seconds>, <max>). Bedrock: the <key>-form popup (title + label, <max>).
prompt:
  player: "<prefix><c:text>Type the <c:value>player name</c:value> in chat. <c:muted>(<cancel> to cancel, <seconds>s)"
  player-form:
    title: "Logs: player"
    label: "<c:text>Player name, online or offline (Bedrock names start with a dot):"
  staff: "<prefix><c:text>Type the <c:value>staff member's name</c:value> in chat. <c:muted>(<cancel> to cancel, <seconds>s)"
  staff-form:
    title: "Logs: staff member"
    label: "<c:text>Name of the staff member:"
  item: "<prefix><c:text>Type the <c:value>item id</c:value> (UUID) in chat. <c:muted>(<cancel> to cancel, <seconds>s)"
  item-form:
    title: "Logs: item"
    label: "<c:text>Item id (<max> characters, like 2f1c0b6e-...-000000000000):"
  island: "<prefix><c:text>Type the <c:value>owner's name</c:value> or the <c:value>island id</c:value>. <c:muted>(<cancel> to cancel, <seconds>s)"
  island-form:
    title: "Logs: island"
    label: "<c:text>Owner's name or island id:"

# ------------------------------------------------------------------ results of actions
teleported: "<prefix><c:success><sym:check></c:success> <c:text>Teleported to <c:value><world> <x>, <y>, <z></c:value>."
export:
  started: "<prefix><c:text>Exporting... <c:muted>You get a message when it's ready."
  done: "<prefix><c:success><sym:check></c:success> <c:text>Exported <c:value><rows></c:value> <c:text>rows to <c:value><file></c:value>. <c:muted>(max <max> per export)"
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>Export failed: <c:value><reason></c:value>. Check the console."

errors:
  unknown-category: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not a category. Pick one of: <c:value><choices>"
  not-uuid: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not an item id. It looks like 2f1c0b6e-...-000000000000."
  no-search: "<prefix><c:error><sym:cross></c:error> <c:text>No search yet. Start one with <c:value>/logs</c:value>."
  unknown-player: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>has never joined. Check the spelling (Bedrock names start with a dot)."
  no-access: "<prefix><c:error><sym:cross></c:error> <c:text>Your rank can't see these logs. Pick another category."
  search-failed: "<prefix><c:error><sym:cross></c:error> <c:text>Search failed. Try again or check the console."
  no-teleport: "<prefix><c:error><sym:cross></c:error> <c:text>You can't teleport from logs."
  no-export: "<prefix><c:error><sym:cross></c:error> <c:text>Only admins can export logs."
  world-unloaded: "<prefix><c:error><sym:cross></c:error> <c:text>The world <c:value><world></c:value> isn't loaded."

