# Menu /skills [player]
menu:
  title: "Skills"
  title-other: "<player>"
  info:
    - "<c:text>Your skill levels. Skills grow"
    - "<c:text>by mining, chopping and fighting"
    - "<c:text>and unlock new Depths tiers."
  head:
    name: "<c:value><player>"
    lore:
      - "<c:muted>Skills"
      - ""
      - "<c:text>Total skill levels: <c:value><total>"
  bar:
    filled: "<c:flame>●</c:flame>"
    empty: "<c:muted>●</c:muted>"
  skill:
    name: "<skill> <c:value>Lv <level>"
    locked-name: "<skill> <c:muted><sym:dot> Coming soon"
    subtitle: "<c:muted>Skill <sym:dot> Lv <level>/<max>"
    progress: "<c:text>Lv <level> <bar> <c:value><percent>%"
    xp: "<c:value><into></c:value><c:muted>/<step> XP to level <next>"
    total: "<c:text>Total XP: <c:value><total>"
    maxed: "<c:success><sym:check> Maxed"
    next-unlock:
      - "<c:muted>Next unlock"
      - " <c:ember><sym:bullet></c:ember> <unlock>"
      - " <c:text>at level <c:value><level></c:value> <c:muted>(<missing> to go)"
    all-unlocked: "<c:success><sym:check> <c:text>Everything unlocked"
    how-header: "<c:muted>How to earn XP"
    coming-soon:
      - "<c:error><sym:cross> Locked"
      - "<c:text>Coming in a later update."

# /settings toggle (Display)
settings:
  skill-xp-bar:
    name: "<c:value>Skill XP in the action bar"
    lore: ["<c:text>Show '+12 Mining XP' above", "<c:text>your hotbar when you earn XP."]

# /skills <player>
others-no-permission: "<prefix><c:error><sym:cross> You can only view your own skills. Use <click:run_command:'/skills'><c:action>/skills</c:action></click>."
loading: "<prefix><c:text>Loading the skills of <c:value><player></c:value>..."
load-failed: "<prefix><c:error><sym:cross> Couldn't load the skills of <c:value><player></c:value>. Try again in a moment."
unknown-player: "<prefix><c:error><sym:cross> <c:value><player></c:value> has never played here. Check the name."

# Kick messages when skill data can't be loaded at login (protects the data).
login:
  slow: "<c:error>Your skills took too long to load.<newline><c:text>Please rejoin in a moment."
  failed: "<c:error>Your skills couldn't be loaded.<newline><c:text>Please rejoin. If this keeps happening, tell staff on Discord."
