# Skills (M4.5): XP, levels, /skills. MiniMessage + style tags (style.yml). Placeholders: <name>.
# Reload: /skyblock reload skills

# Skill names (with their pillar color), short description and how XP is earned (menu lore, max ~32 chars per line).
skill:
  mining:
    name: "<pillar:mining>Mining"
    description: ["<c:text>Break ore in the Mine of", "<c:text>The Depths."]
    how: [" <pillar:mining><sym:bullet> <c:text>Mine ore in The Depths", " <pillar:mining><sym:bullet> <c:text>Better tiers give more XP"]
  foraging:
    name: "<pillar:foraging>Foraging"
    description: ["<c:text>Chop logs in the Forest of", "<c:text>The Depths."]
    how: [" <pillar:foraging><sym:bullet> <c:text>Chop logs in The Depths", " <pillar:foraging><sym:bullet> <c:text>Better tiers give more XP"]
  combat:
    name: "<pillar:combat>Combat"
    description: ["<c:text>Defeat monsters in the", "<c:text>Combat zones."]
    how: [" <pillar:combat><sym:bullet> <c:text>Kill monsters yourself", " <pillar:combat><sym:bullet> <c:text>Stronger mobs give more XP", " <pillar:combat><sym:bullet> <c:text>Spawner mobs give no XP"]
  farming:
    name: "<pillar:farming>Farming"
    description: ["<c:text>Grow and harvest crops on", "<c:text>your island."]
    how: []
  fishing:
    name: "<pillar:fishing>Fishing"
    description: ["<c:text>Catch fish and treasure."]
    how: []

# Action bar on XP gain (max one line per 1.5 s, gains in between are added up). <skill> <amount> <percent> <level>
action-bar:
  gain: "<c:success>+<amount></c:success> <skill> <c:text>XP</c:text> <c:muted>(<percent>%)"
  separator: " <c:muted><sym:dot></c:muted> "

# Level-up: title + sound (skills.yml → level-up.sound) + chat. <skill> <level> <from>
level-up:
  title:
    title: "<skill> <c:value><level>"
    subtitle: "<c:flame>Level up!"
    fade-in: 5
    stay: 50
    fade-out: 15
  chat: "<prefix><c:success><sym:star> <skill> <c:text>is now level <c:value><level></c:value>! <click:run_command:'/skills'><hover:show_text:'<c:text>Open your skills'><c:action>[View skills]</c:action></hover></click>"
  next-unlock: "<prefix><c:text>Next unlock at level <c:value><level></c:value>: <unlock>"

