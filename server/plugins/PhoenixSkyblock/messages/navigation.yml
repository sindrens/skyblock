    trade-requests:
      name: "<c:value>Trade requests"
      lore: ["<c:text>Let players send you", "<c:text>trade requests."]
    island-invites:
      name: "<c:value>Island invites"
      lore: ["<c:text>Let players invite you to", "<c:text>their island."]
    afk-broadcast:
      name: "<c:value>AFK announcements"
      lore: ["<c:text>Show when players go", "<c:text>AFK or come back."]
    scoreboard:
      name: "<c:value>Scoreboard"
      lore: ["<c:text>The info panel on the right", "<c:text>of your screen."]
    menu-item:
      name: "<c:value>Menu item"
      lore: ["<c:text>The Nether Star in hotbar", "<c:text>slot 9 that opens /menu."]
    tips:
      name: "<c:value>Tips"
      lore: ["<c:text>Short tips in chat the first", "<c:text>time you open a feature."]
    particles:
      name: "<c:value>Particles"
      lore: ["<c:text>Cosmetic particles of", "<c:text>other players."]
    depths-visibility:
      name: "<c:value>Players in The Depths"
      lore: ["<c:text>See other players while", "<c:text>mining in The Depths."]
    ui-sounds:
      name: "<c:value>Menu sounds"
      lore: ["<c:text>Clicks and confirmations", "<c:text>in menus."]
    event-sounds:
      name: "<c:value>Event sounds"
      lore: ["<c:text>Sounds for events, bosses", "<c:text>and announcements."]
    auto-pickup:
      name: "<c:value>Island auto-pickup"
      lore: ["<c:text>Blocks you break on your own", "<c:text>island go into your inventory."]
    drop-guard:
      name: "<c:value>Drop guard"
      lore: ["<c:text>Ask again before you drop a", "<c:text>tool, book, note or spawner."]
    sell-skip-hotbar:
      name: "<c:value>Sell all skips hotbar"
      lore: ["<c:text>/sell all and Sell inventory", "<c:text>leave your hotbar alone."]
