# Navigation texts: /menu, /help, /settings and the menu item. MiniMessage + style tags (style.yml).
# Item names: one color + white value, never italic. Lore: description in <c:text>, empty line, then
# "<bold><c:action>» CLICK</c:action></bold> <c:text>to ...". Placeholders: <name>. Help page contents live in help.yml.
# Reload: /skyblock reload menus

# The locked look of anything that isn't built yet (hub entries, help categories, settings).
coming-soon:
  name: "<c:muted><name> <dark_gray>(Coming soon)"
  lore:
    - ""
    - "<c:muted><sym:time> Coming soon"
    - "<c:muted>Keep an eye on /discord for news."

menu-item:
  name: "<c:flame><bold>Menu</bold></c:flame> <c:muted><sym:dot></c:muted> <c:text>Right-click"
  lore:
    - "<c:text>Every feature in one place."
    - ""
    - "<bold><c:action>» RIGHT-CLICK</c:action></bold> <c:text>to open the menu"

