  changed-off: "<prefix><c:success><sym:check></c:success> <c:text><setting> <c:text>is <c:value>off</c:value>."
  unknown: "<prefix><c:error><sym:cross></c:error> <c:text>No setting <c:value><setting></c:value>. Press Tab to see them all."
  not-yet: "<prefix><c:error><sym:cross></c:error> <c:value><setting></c:value> <c:text>comes with its feature, soon."
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't change that setting. Try again soon."

help:
  title: "Help"
  all-commands: "Commands"
  info:
    - "<c:text>Pick a category to read the guides."
    - "<c:text>Tip: /help <topic> opens one directly."
  topic-info:
    - "<c:text>Hover the pages to read them."
    - "<c:text>Take me there brings you to the feature."
  commands-info:
    - "<c:text>Every command you can use."
    - "<c:text>Click one to put it in your chat."
  category-topics: ["<c:text>Topics: <c:value><count>"]
  open-action: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
  topic-pages: ["<c:text>Pages: <c:value><count>"]
  read-action: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to read"]
  empty:
    name: "<c:text>No topics yet"
    lore: ["<c:muted>Guides are added as features open."]
  page-name: "<c:ember><page>.</c:ember> <title>"
  page-footer: ["<c:muted>Page <page> of <pages>"]
  no-pages:
    name: "<c:text>Nothing written yet"
    lore: ["<c:muted>This guide is still being written."]
  show-in-chat:
    name: "<c:info>Show in chat"
    lore: ["<c:text>Prints this guide in chat so you", "<c:text>can read it while you play.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to show in chat"]
  take-me-there:
    name: "<c:success>Take me there"
    lore: ["<c:text>Runs <c:value><command></c:value> for you.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to go"]
  commands-button:
    name: "<c:ember>Commands"
    lore: ["<c:text>Commands for this topic", "<c:text>you can use: <c:value><count>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to see them"]
  command:
    name: "<c:value><usage>"
    description: "<c:text><description>"
    category: "<c:muted>Category: <category>"
    aliases: "<c:muted>Also: <aliases>"
    example: "<c:muted>Example: <c:text><example>"
    action: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to put it in your chat"]
  no-commands:
    name: "<c:text>No commands here"
    lore: ["<c:muted>You don't have any commands in this list."]
  coming-soon: "<prefix><c:value><name></c:value> <c:text>help comes with the feature, soon."
  unknown: "<prefix><c:error><sym:cross></c:error> <c:text>No help topic <c:value><topic></c:value>. Here are all categories."
  chat:
    header: "<prefix><c:text>Help <c:muted>(click a category):"
    category: " <c:muted><sym:bullet></c:muted> <click:run_command:'/help <id>'><hover:show_text:'<lore>'><name></hover></click>"
    category-locked: " <c:muted><sym:bullet> <name> (Coming soon)"
    footer: " <c:muted>Tip: <c:text>/help commands <c:muted>lists every command you can use."
    category-header: "<prefix><name> <c:muted>(click a topic):"
    topic-line: " <c:muted><sym:bullet></c:muted> <click:run_command:'/help <id>'><hover:show_text:'<summary>'><name></hover></click>"
    topic-header: "<prefix><name>"
    page-title: " <c:muted><sym:bullet></c:muted> <title>"
    page-line: "   <line>"
    take-me-there: " <click:run_command:'/<command>'><hover:show_text:'<c:text>Runs /<command>'><c:success>[Take me there]</c:success></hover></click>"
    commands-header: " <c:muted><sym:bullet></c:muted> <c:value>Commands <c:muted>(click to put in chat)"
    all-commands-header: "<prefix><c:text>Your commands <c:muted>(<count>, click one to put it in chat):"
    commands-category: " <c:ember><category>"
    command-line: "   <click:suggest_command:'<command>'><hover:show_text:'<c:text><description>'><c:value><usage></c:value></hover></click> <c:muted><description>"
    suggest: "<prefix><click:suggest_command:'<command>'><hover:show_text:'<c:text>Click to put it in your chat'><c:action>[Click]</c:action> <c:value><usage></c:value></hover></click> <c:muted><description>"

