      lore: ["<c:text>Add an entry by typing it.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to add"]
    prompt: "<prefix><c:text>Type the entry to add to <c:value><path></c:value>. <c:muted>(<cancel> to cancel, <seconds>s)"
    empty:
      name: "<c:text>The list is empty"
      lore: ["<c:muted>Use + to add the first entry."]
