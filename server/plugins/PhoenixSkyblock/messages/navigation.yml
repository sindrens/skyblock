    name: "<c:value><file>"
    lore: ["<c:text>Settings: <c:value><settings>", "<c:text>You can edit: <c:value><editable>", "<c:text>Changed: <c:value><changed>"]
    problems: ["<c:warning><sym:cross></c:warning> <c:text><count> problem(s), see /skyblock config"]
  setting:
    name: "<c:value><path>"
    name-changed: "<c:flame><path>"
    description: "<c:text><text>"
    value: "<c:text>Now: <c:value><value>"
    default: "<c:text>Default: <c:muted><value>"
    range: "<c:text>Allowed: <c:value><min></c:value> <c:muted>to</c:muted> <c:value><max>"
    choices: "<c:text>Choices: <c:muted><choices>"
    restart: ["<c:warning>Needs a restart to take effect."]
    owner: ["<c:warning>Owner only"]
    locked: ["", "<c:error><sym:cross></c:error> <c:text>Only the owner can change this."]
    action-toggle: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to switch"]
    action-cycle: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>for the next choice"]
    action-list: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to edit the list"]
    action-edit: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to change"]
  prompt: "<prefix><c:text>Type a new value for <c:value><path></c:value> <c:muted>(now <value>)</c:muted><c:text>. <c:value>default</c:value> resets it. <c:muted>(<cancel> to cancel, <seconds>s)"
  saved: "<prefix><c:success><sym:check></c:success> <c:value><file></c:value> <c:text><c:muted>»</c:muted> <c:value><path></c:value><c:text>: <c:muted><old></c:muted> <c:text>to <c:value><new></c:value><c:text>. Live now."
  saved-restart: "<prefix><c:success><sym:check></c:success> <c:value><file></c:value> <c:text><c:muted>»</c:muted> <c:value><path></c:value><c:text>: <c:muted><old></c:muted> <c:text>to <c:value><new></c:value><c:text>. Applies after a restart."
