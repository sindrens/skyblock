# Navigation texts: /menu, /help, /settings and the menu item. MiniMessage + style tags (style.yml).
# Item names: one color + white value, never italic. Lore: description in <c:text>, empty line, then
# "<bold><c:action>» CLICK</c:action></bold> <c:text>to ...". Placeholders: <name>. Help page contents live in help.yml.
# Reload: /skyblock reload menus

# The locked look of anything that isn't built yet (hub entries, help categories, settings).
coming-soon:
  name: "<c:muted><name> <dark_gray>(Coming soon)"
  lore:
    - ""
    - "<c:muted><sym:time> Coming soon"
    - "<c:muted>Keep an eye on /discord for news."

menu-item:
  name: "<c:flame><bold>Menu</bold></c:flame> <c:muted><sym:dot></c:muted> <c:text>Click"
  lore:
    - "<c:text>Every feature in one place."
    - ""
    - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open the menu"

hub:
  title: "Menu"
  info:
    - "<c:text>Everything in four groups:"
    - "<c:text>Play, Money, Power and More."
    - "<c:text>Click your head for profiles,"
    - "<c:text>titles, settings and the store."
  action: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
  locked: ["", "<c:error><sym:cross></c:error> <c:text>Your rank can't open this yet."]
  # A button added in menu.yml without texts here: <name> = its id.
  fallback-name: "<c:flame><bold><name>"
  # Your head (slot 4). <money>, <crystals>, <playtime> are plain text.
  head:
    name: "<ph:displayname>"
    lore:
      - "<c:muted><ph:rank>"
      - ""
      - "<c:bar>| </c:bar><c:text>Money: <cur:money><money>"
      - "<c:bar>| </c:bar><c:text>Crystals: <cur:crystals><crystals>"
      - "<c:bar>| </c:bar><c:text>Playtime: <c:value><playtime>"
      - ""
      - "<bold><c:action>» CLICK</c:action></bold> <c:text>for profiles, titles, settings"
  groups:
    play:
      name: "<c:success><bold>Play"
      lore: ["<c:text>Your island, the Depths", "<c:text>and getting around."]
    money:
      name: "<c:flame><bold>Money"
      lore: ["<c:text>Sell, buy, save and trade."]
    power:
      name: "<c:enchant><bold>Power"
      lore: ["<c:text>Tools, skills, enchants", "<c:text>and armor sets."]
    more:
      name: "<c:ember><bold>More"
      lore: ["<c:text>Rewards and leaderboards."]
  # Rewards button (owner G7). <count> = number ready, <list> = their names (sources below), plain text.
  rewards:
    ready-name: "<c:flame><bold>Rewards</bold> <c:value>(<count> ready)"
    ready: ["", "<c:flame><sym:dot></c:flame> <c:text>Ready: <c:value><list>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to claim everything"]
    none: ["", "<c:muted>Nothing to claim right now.", "<c:muted>Playtime rewards pay by themselves.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open your rewards"]
    nothing: "<prefix><c:muted><sym:time></c:muted> <c:text>Nothing to claim right now. Playtime rewards pay by themselves."
    sources:
      daily: "daily reward"
      vote: "vote"
  buttons:
    home:
      name: "<c:success><bold>Home"
      lore: ["<c:text>Go to your island."]
    island:
      name: "<c:success><bold>Island"
      lore: ["<c:text>Members, upgrades, warps", "<c:text>and settings."]
    depths:
      name: "<c:info><bold>The Depths"
      lore: ["<c:text>Mine, chop and fight through", "<c:text>tiers for loot and crystals."]
    travel:
      name: "<c:success><bold>Travel"
      lore: ["<c:text>Spawn, crates, market, Forge", "<c:text>and other islands."]
    sell:
      name: "<c:flame><bold>Sell"
      lore: ["<c:text>Sell your loot."]
    shop:
      name: "<c:flame><bold>Shop"
      lore: ["<c:text>Blocks, farming and", "<c:text>utility items."]
    bank:
      name: "<c:flame><bold>Bank"
      lore: ["<c:text>Keep money safe and earn", "<c:text>interest, even offline."]
    auction:
      name: "<c:flame><bold>Auction House"
      lore: ["<c:text>Buy and sell items with", "<c:text>other players."]
    forge:
      name: "<c:enchant><bold>Forge"
      lore: ["<c:text>Craft and upgrade your tools."]
    skills:
      name: "<c:enchant><bold>Skills"
      lore: ["<c:text>Level Mining, Foraging, Combat", "<c:text>and more for perks."]
    enchanter:
      name: "<c:enchant><bold>Enchanter"
      lore: ["<c:text>Add and upgrade enchants."]
    wardrobe:
      name: "<c:enchant><bold>Wardrobe"
      lore: ["<c:text>Sets and loadouts."]
    rewards:
      name: "<c:flame><bold>Rewards"
      lore: ["<c:text>Daily rewards and playtime."]
    top:
      name: "<c:ember><bold>Top"
      lore: ["<c:text>The best islands:", "<c:text>level and value."]

# /menu → You (GUI-2): your head (display only), profiles, titles, achievements, settings, store, rules.
