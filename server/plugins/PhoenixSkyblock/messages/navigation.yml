  info:
    - "<c:text>Places at spawn and beyond."
    - "<c:text>Click one to go there."
  action: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to go"]
  fallback-name: "<c:flame><bold><name>"
  gone: "<prefix><c:error><sym:cross></c:error> <c:text>That place is not there right now. Try again later."
  empty:
    name: "<c:muted>No places yet"
    lore: ["<c:text>Places appear here once", "<c:text>they are built."]
  places:
    spawn:
      name: "<c:brand><bold>Spawn"
      lore: ["<c:text>The courtyard at spawn."]
    my-island:
      name: "<c:success><bold>My Island"
      lore: ["<c:text>Your island home."]
    depths-gate:
      name: "<c:info><bold>Depths Gate"
      lore: ["<c:text>Mine, chop and fight", "<c:text>from here."]
    crate-yard:
      name: "<c:brand><bold>Crate Yard"
      lore: ["<c:text>Open your crates."]
    market:
      name: "<c:flame><bold>Market"
      lore: ["<c:text>Shop, Sell, Auction House", "<c:text>and the Bank."]
    forge-quarter:
      name: "<c:enchant><bold>Forge Quarter"
      lore: ["<c:text>Blacksmith and Enchanter."]
    visit-islands:
      name: "<c:success><bold>Visit Islands"
      lore: ["<c:text>See the islands of", "<c:text>other players."]
      action: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to browse"]

