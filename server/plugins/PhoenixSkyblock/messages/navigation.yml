      - "<c:text>Click an entry to remove it."
      - "<c:text>Use + to add one."
    entry: "<c:value><value>"
    entry-lore: ["", "<bold><c:action>» CLICK</c:action></bold> <c:text>to remove"]
    remove-crumb: "Remove entry"
    remove-details: ["<c:text>Removes <c:value><value></c:value> from the list."]
    add:
