  fields:
    type: "Type"
    target: "Player"
    staff: "Staff"
    reason: "Reason"
    length: "Length"
    weight: "Counts"
    id: "ID"
    rule: "Rule"
    given-by: "Given by"
    count: "Players"
    requested: "Sent for approval"
    skipped: "Skipped"
    players: "Who"
    group: "Group"
    appeal: "Appeal"
