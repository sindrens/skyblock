# Moderation (punishments) texts. MiniMessage + style tags. Reload: /skyblock reload moderation
# Common placeholders: <player> target, <staff> issuer (or "Staff" when announce.show-staff is off), <staff_real> issuer,
# <reason>, <id>, <type>, <length> (total), <expires> (time left), <date>, <appeal> (link), <target> (for clicks).
# Phase P: every text of punishments.yml lives here (reason names, warn buttons, /p menu, warn rules, config errors);
# punishments.yml only holds ids, slots, icons, ladders and rules.
# Format (docs/UI_STYLE.md §3): prefix only on replies, success/error marks + gray text, values in <c:value>, clicks in <c:action>.

words:
  permanent: "permanent"
  staff: "Staff"
  no-reason: "No reason given"
  silent: "[silent]"
  ip-wide: "IP-wide"
  account: "account"
  removed-by: "Removed by"
  alt-of: "Alt account of"
  system: "System"
  system-auto: "System (auto)"
  never: "never"
  "yes": "yes"
  "no": "no"

# How a ladder step / rule action reads ("Next step: Mute 1h"). <length> = time or "permanent".
steps:
  warn: "Warning"
  # A warning with another weight than 1 (P3, spec 12.7: "warn 0.5" ladder steps, warn button weight). <weight> = 0.5, 2.
  warn-weighted: "Warning (counts <weight>)"
  kick: "Kick"
  mute: "Mute <length>"
  ban: "Ban <length>"
  ipban: "IP-ban <length>"

# Reason names (ids from punishments.yml → categories). Also the reason text stored with the punishment.
categories:
  cheating: "Cheating"
  chat: "Chat"
  gameplay: "Gameplay"
  other: "Name / build / skin"
reasons:
  hacking: "Hacked client"
  xray: "X-ray / ESP"
  macro: "Macros / auto-clicker"
  alt-abuse: "Ban evasion"
  toxicity: "Toxicity / harassment"
  spam: "Spam / flooding"
  advertising: "Advertising"
  hate: "Hate speech / slurs"
  personal-info: "Sharing personal info"
  disrespect-staff: "Disrespecting staff"
  exploiting: "Exploiting bugs / duping"
  scamming: "Scamming"
  griefing: "Griefing (coop abuse)"
  afk-farming: "Illegal AFK farming"
  rmt: "Real-money trading"
  inappropriate-name: "Inappropriate name or nickname"
  inappropriate-build: "Inappropriate build"
  inappropriate-skin: "Inappropriate skin"

# Plain warn buttons of the /p menu (ids from punishments.yml → menu.warns). name = button, reason = stored text.
warn-buttons:
  warn-language:
    name: "Language"
    reason: "Inappropriate language"
  warn-caps-spam:
    name: "Caps / light spam"
    reason: "Caps or light spam"
  warn-rules:
    name: "Rule reminder"
    reason: "Not following the rules"
  warn-other:
    name: "Other warning"
    reason: "Staff warning"

# Reason text stored with punishments from the automatic warn rules. <count> = the rule's warn count, <window> = repeat-window.
warn-rules:
  reason: "Automatic rule: <count> warnings"
  repeat-reason: "Automatic rule: repeated within <window>"

types:
  ban: "<c:error>Ban</c:error>"
  mute: "<c:warning>Mute</c:warning>"
  warn: "<c:flame>Warning</c:flame>"
  kick: "<c:text>Kick</c:text>"

status:
  active: "Active"
  expired: "Expired"
  removed: "Removed"
  done: "Done"

# Disconnect screens.
screen:
  ban:
    - "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    - ""
    - "<c:error><bold>You are permanently banned.</bold>"
    - ""
    - "<c:text>Reason: <c:value><reason>"
    - "<c:text>Banned by: <c:value><staff>"
    - "<c:text>Ban ID: <c:value>#<id>"
    - ""
    - "<c:text>Appeal on Discord: <c:sky_ice><appeal>"
  tempban:
    - "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    - ""
    - "<c:error><bold>You are banned.</bold>"
    - ""
    - "<c:text>Reason: <c:value><reason>"
    - "<c:text>Banned by: <c:value><staff>"
    - "<c:text>Ends in: <c:value><expires>"
    - "<c:text>Ban ID: <c:value>#<id>"
    - ""
    - "<c:text>Appeal on Discord: <c:sky_ice><appeal>"
  kick:
    - "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    - ""
    - "<c:warning><bold>You were kicked.</bold>"
    - ""
    - "<c:text>Reason: <c:value><reason>"
    - ""
    - "<c:text>You can rejoin. Read <c:value>/rules</c:value> first."

muted:
  you: "<prefix><c:error><sym:cross></c:error> <c:text>You're muted for <c:value><length></c:value>. Reason: <c:value><reason>"
  unmuted: "<prefix><c:success><sym:check></c:success> <c:text>You're no longer muted."
  blocked: "<prefix><c:error><sym:cross></c:error> <c:text>You're muted: <c:value><reason></c:value> <c:muted>(ends <expires>, #<id>)"
  # Extra line for mutes from the automatic warn rules (<count> = warnings of the rule).
  auto: "<prefix><c:text>You got <c:value><count> warnings</c:value>, so you're muted for <c:value><length></c:value>."
  auto-repeat: "<prefix><c:text>Warned again soon after an automatic rule, so you're muted for <c:value><length></c:value>."
  # On join while muted (e.g. muted while offline).
  join: "<prefix><c:error><sym:cross></c:error> <c:text>You're muted: <c:value><reason></c:value> <c:muted>(ends <expires>, #<id>)"

warned:
  you: "<prefix><c:warning><sym:cross></c:warning> <c:text>Warning: <c:value><reason></c:value>. More warnings lead to mutes or bans."
  title: "<c:warning><bold>WARNING</bold>"
  subtitle: "<c:text><reason>"

# Staff notifications (staff with skyblock.staff.notify). Hover = details, click = /history.
notify:
  ban: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline>Reason: <reason><newline>Length: <length><newline><c:muted>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:error>banned</c:error> <c:value><player></c:value> <c:text>for <c:value><reason></c:value> <c:muted><silent></c:muted></click></hover>"
  tempban: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline>Reason: <reason><newline>Length: <length><newline><c:muted>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:error>banned</c:error> <c:value><player></c:value> <c:text>for <c:value><length></c:value>: <c:value><reason></c:value> <c:muted><silent></c:muted></click></hover>"
  ipban: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline>Reason: <reason><newline>IP-wide<newline><c:muted>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:error>IP-banned</c:error> <c:value><player></c:value> <c:text>for <c:value><reason></c:value> <c:muted><silent></c:muted></click></hover>"
  mute: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline>Reason: <reason><newline><c:muted>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:warning>muted</c:warning> <c:value><player></c:value> <c:text>for <c:value><reason></c:value> <c:muted><silent></c:muted></click></hover>"
  tempmute: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline>Reason: <reason><newline>Length: <length><newline><c:muted>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:warning>muted</c:warning> <c:value><player></c:value> <c:text>for <c:value><length></c:value>: <c:value><reason></c:value> <c:muted><silent></c:muted></click></hover>"
  ipmute: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline>Reason: <reason><newline>IP-wide<newline><c:muted>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:warning>IP-muted</c:warning> <c:value><player></c:value> <c:text>for <c:value><reason></c:value> <c:muted><silent></c:muted></click></hover>"
  warn: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline><c:muted>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:flame>warned</c:flame> <c:value><player></c:value><c:text>: <c:value><reason></c:value></click></hover>"
  kick: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline><c:muted>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:text>kicked</c:text> <c:value><player></c:value><c:text>: <c:value><reason></c:value></click></hover>"
  unban: "<c:muted>[Staff]</c:muted> <click:run_command:'/history <target>'><hover:show_text:'<c:text>Click for history'><c:value><staff></c:value> <c:success>unbanned</c:success> <c:value><player></c:value><c:text>: <c:value><reason></hover></click>"
  unmute: "<c:muted>[Staff]</c:muted> <click:run_command:'/history <target>'><hover:show_text:'<c:text>Click for history'><c:value><staff></c:value> <c:success>unmuted</c:success> <c:value><player></c:value><c:text>: <c:value><reason></hover></click>"
  unwarn: "<c:muted>[Staff]</c:muted> <click:run_command:'/history <target>'><hover:show_text:'<c:text>Click for history'><c:value><staff></c:value> <c:success>removed a warning of</c:success> <c:value><player></c:value><c:text>: <c:value><reason></hover></click>"

# Public announcements (not for -s silent punishments; announce.public in moderation.yml).
public:
  ban: "<c:value><player></c:value> <c:text>was banned: <c:value><reason>"
  mute: "<c:value><player></c:value> <c:text>was muted: <c:value><reason>"

error:
  no-silent: "<prefix><c:error><sym:cross></c:error> <c:text>You can't punish silently (<c:value>-s</c:value>)."
  no-ip: "<prefix><c:error><sym:cross></c:error> <c:text>You can't punish IP-wide (<c:value>-ip</c:value>)."
  too-long: "<prefix><c:error><sym:cross></c:error> <c:text>Too long for your rank (max <c:value><max></c:value>). Ask a higher staff member."
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't punish yourself."
  exempt: "<prefix><c:error><sym:cross></c:error> <c:text>You can't punish <c:value><player></c:value>."
  unknown: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has never joined. Check the spelling."
  unknown-template: "<prefix><c:error><sym:cross></c:error> <c:text>Unknown reason <c:value><reason></c:value>. Press Tab to see them all."
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>Something went wrong. Details are in the console."
  no-known-ip: "<prefix><c:error><sym:cross></c:error> <c:text>No IP known for that player yet. They must join once."
  not-banned: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is not banned."
  not-muted: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is not muted."
  not-warned: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has no active warnings."
  kick-offline: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is offline, so the kick can't be applied."
  no-permission-type: "<prefix><c:error><sym:cross></c:error> <c:text>You can't give this punishment (<c:value><type_name></c:value>)."
  no-permission-menu: "<prefix><c:error><sym:cross></c:error> <c:text>You can't punish anymore."
  no-permission-suggestion: "<prefix><c:error><sym:cross></c:error> <c:text>You can't handle punishment suggestions."
  already-muted: "<prefix><c:warning><sym:cross></c:warning> <c:text>Nothing applied: <c:value><player></c:value> is muted for longer <c:muted>(<left> left, #<id>)</c:muted><c:text>. Use <c:value>/unmute</c:value> first."
  already-banned: "<prefix><c:warning><sym:cross></c:warning> <c:text>Nothing applied: <c:value><player></c:value> is banned for longer <c:muted>(<left> left, #<id>)</c:muted><c:text>. Use <c:value>/unban</c:value> first."
  # Double-punish protection (P2). <staff>, <ago>, <reason>, <id> of the earlier one; <confirm> = extras.duplicate-confirm.
  duplicate: "<prefix><c:warning><sym:cross></c:warning> <c:value><staff></c:value> <c:text>punished <c:value><player></c:value> for <c:value><reason></c:value> <ago> ago. Do it again within <c:value><confirm></c:value> to apply anyway."
  duplicate-self: "<prefix><c:warning><sym:cross></c:warning> <c:text>You punished <c:value><player></c:value> for <c:value><reason></c:value> <ago> ago. Do it again within <c:value><confirm></c:value> to apply a second one."
  no-force: "<prefix><c:error><sym:cross></c:error> <c:text>You can't use <c:value>-force</c:value>."

history:
  header: "<prefix><c:text>History of <c:value><player></c:value> <c:muted>(<total>)</c:muted> <c:text><bans> bans <c:muted><sym:dot></c:muted> <mutes> mutes <c:muted><sym:dot></c:muted> <warns> warnings <c:muted><sym:dot></c:muted> <kicks> kicks"
  empty: " <c:success><sym:check></c:success> <c:text>No punishments."
  line: " <c:ember><sym:bullet></c:ember> <hover:show_text:'<c:text>By <staff_real> on <date><newline>Length: <length><newline><removed>'><c:muted>#<id></c:muted> <type> <c:text><reason> <c:muted>(<status>)</c:muted></hover>"
  more: " <c:muted>... and <more> more.</c:muted> <click:run_command:'/history <target> menu'><hover:show_text:'<c:text>Open the history menu'><c:action>[Menu]</c:action></hover></click>"

alts:
  header: "<prefix><c:text>Accounts sharing an IP with <c:value><player></c:value> <c:muted>(<count>)"
  none: " <c:success><sym:check></c:success> <c:text>No other accounts found."
  line: " <c:ember><sym:bullet></c:ember> <click:run_command:'/history <target>'><hover:show_text:'<c:text>Click for history'><c:value><player></c:value></hover></click> <status> <c:muted>(seen <seen> ago)"
  banned: "<c:error>[banned]</c:error>"
  muted: "<c:warning>[muted]</c:warning>"
  clean: ""
  alert: "<c:muted>[Staff]</c:muted> <c:warning><sym:cross></c:warning> <c:text>Alt alert: <c:value><player></c:value> shares an IP with <c:value><count></c:value> punished account(s): <c:value><alts></c:value> <click:run_command:'/alts <target>'><hover:show_text:'<c:text>See all alts'><c:action>[Alts]</c:action></hover></click>"

menu:
  summary:
    name: "<c:value><player>"
    lore:
      - "<c:text>Banned: <banned>"
      - "<c:text>Muted: <muted>"
      - ""
      - "<c:text>Bans: <c:value><bans></c:value> <c:muted><sym:dot></c:muted> <c:text>Mutes: <c:value><mutes>"
      - "<c:text>Warnings: <c:value><warns></c:value> <c:muted><sym:dot></c:muted> <c:text>Kicks: <c:value><kicks>"
  punish:
    title: "Punish"
    info:
      - "<c:text>Pick a category, then a reason."
      - "<c:text>The reason's ladder decides the punishment:"
      - "<c:text>1st offence, 2nd offence, and so on."
    history-button:
      name: "<c:value>Punishment history"
      lore:
        - "<c:text><total> punishment(s) on record."
        - ""
        - "<c:action><sym:bullet> Click to view"
  category:
    name: "<c:value><category>"
    lore:
      - "<c:text><reasons> reason(s)"
      - ""
      - "<c:action><sym:bullet> Click to choose a reason"
  empty-category:
    name: "<c:text>No reasons here"
    lore:
      - "<c:muted>Add reasons in punishments.yml."
  reason:
    name: "<c:value><reason>"
    lore:
      - "<c:text>This is offence <c:value>#<offence></c:value>."
      - "<c:text>Punishment: <c:flame><step>"
      - ""
      - "<c:muted>Ladder:"
    click: "<c:action><sym:bullet> Click to punish"
    too-long: "<c:error><sym:cross> Your rank can't do this (max <max>)"
  ladder-current: " <c:flame><sym:bullet> <n>. <step></c:flame>"
  ladder-step: " <c:muted><n>. <step>"
  confirm:
    title: "Punish <player>"
    details:
      - "<c:text>Player: <c:value><player>"
      - "<c:text>Reason: <c:value><reason>"
      - "<c:text>Offence: <c:value>#<offence>"
      - "<c:text>Punishment: <c:flame><step>"
  history:
    title: "History"
    info:
      - "<c:text>Every punishment of this player,"
      - "<c:text>newest first. Kept forever."
    empty:
      name: "<c:success><sym:check> Clean record"
      lore:
        - "<c:text>This player was never punished."
    name: "<type> <c:muted>#<id> (<status>)"
    entry:
      - "<c:text>Reason: <c:value><reason>"
      - "<c:text>By: <c:value><staff>"
      - "<c:text>Date: <c:value><date>"
      - "<c:text>Length: <c:value><length></c:value> <c:muted><sym:dot></c:muted> <c:text>Left: <c:value><left>"
      - "<c:text>Template: <c:value><template>"
      - "<c:text>Scope: <c:value><scope>"
    removed:
      - ""
      - "<c:success>Removed by <c:value><by></c:value> on <c:value><removed_date>"
      - "<c:text>Why: <c:value><removed_reason>"
    # P3: warn weight (12.7), acknowledgement (12.6), click for details + evidence (12.4).
    weight: "<c:text>Counts: <c:value><weight>"
    ack-yes: "<c:success><sym:check> Acknowledged <date>"
    ack-no: "<c:warning><sym:cross> Not acknowledged"
    # P4 (spec 13.4): a requested punishment that an approver approved. <by> = the approver.
    approved: "<c:text>Approved by: <c:value><by>"
    click: "<c:action><sym:bullet> Click for details and evidence"

# ---------------------------------------------------------------- /p <player> (single-screen menu, Phase P)
punish:
  title: "Punish"
  info:
    - "<c:text>Left: mutes (top) and warnings (bottom)."
    - "<c:text>Right: bans (top) and small things (bottom)."
    - "<c:text>One click applies the next ladder step."
  kick-reason: "Kicked by staff. Follow the rules."
  click: "<c:action><sym:bullet> Click to apply"
  # Needs an approver (P4, spec 13.4): the click sends a request instead. <rule> = the approval rule ("ban perm").
  request:
    - "<c:warning>Needs approval <c:muted>(<rule>)"
    - "<c:action><sym:bullet> Click to send a request"
  request-limit:
    - "<c:warning>Longer than your rank allows: needs approval"
    - "<c:action><sym:bullet> Click to send a request"
  # Why a button can't be used right now (same checks as the click).
  blocked:
    self: "<c:error><sym:cross> You can't punish yourself"
    exempt: "<c:error><sym:cross> This player can't be punished by you"
    offline: "<c:error><sym:cross> Player is offline (kick needs them online)"
    permission: "<c:error><sym:cross> Your rank can't give this punishment"
    length-limit: "<c:error><sym:cross> Too long for your rank (max <max>)"
    never-shorten:
      - "<c:warning>Already punished for longer (<left> left)"
      - "<c:muted>Clicking changes nothing (never shortens)"
    # Same player + same reason within extras.duplicate-window (P2). <staff>, <ago>, <confirm>.
    duplicate:
      - "<c:warning>Just punished for this by <staff> (<ago> ago)"
      - "<c:action><sym:bullet> Click, then again within <confirm>, to apply anyway"
  reason:
    name: "<c:value><reason>"
    lore:
      - "<c:text>This is offence <c:value>#<offence></c:value>."
      - "<c:text>Next step: <c:flame><step>"
    after: "<c:muted>Then: <step>"
    after-repeat: "<c:muted>Then: <step> (last step repeats)"
    # Offences older than offence-expire (P2). <older> = how many.
    older-one: "<c:muted>(1 older offence no longer counts)"
    older: "<c:muted>(<older> older offences no longer count)"
    # Probation (P4, spec 13.7): the step above is raised. <bonus> = steps added, <normal> = the step without probation.
    probation: "<c:warning>Probation: +<bonus> step <c:muted>(normally <normal>)"
  warn-button:
    name: "<c:flame><name>"
    lore:
      - "<c:text>One warning: <c:value><reason>"
      - "<c:muted>Counts toward the automatic rules."
    # P3 (spec 12.7): only shown when the button's weight is not 1.
    weight: "<c:text>Counts as <c:value><weight></c:value> warning(s)."
  summary:
    ban-left: "<c:error>Banned: <left> left <c:muted>(<reason>)"
    mute-left: "<c:warning>Muted: <left> left <c:muted>(<reason>)"
    pending:
      - ""
      - "<c:warning>Pending: suggested <action>"
      - "<c:action><sym:bullet> Click to apply or dismiss"
    # [Undo] for Bedrock (P2): your last action on this player while extras.undo-window is open. <type>, <reason>, <id>, <left>.
    undo:
      - ""
      - "<c:text>Last action: <type> <c:muted>(<reason>, #<id>)"
      - "<c:action><sym:bullet> Click to undo <c:muted>(<left> left)"
    # A detector suggestion is waiting (P3, spec 12.8). <action>, <reason>, <details>, <count> = how many are waiting.
    api-pending:
      - ""
      - "<c:warning>Suggested (<details>): <reason>, <action>"
      - "<c:action><sym:bullet> Click to apply or dismiss"
    # Staff notes (P3, spec 12.5): newest notes, only for staff with skyblock.staff.punish.notes. <count> = all active notes.
    notes-header:
      - ""
      - "<c:text>Notes <c:muted>(<count>)</c:muted>:"
    note: " <c:muted><sym:bullet> <author>, <date>:</c:muted> <c:value><text>"
    notes-more: " <c:muted><more> more, use /pnote <player>"
    notes-none:
      - ""
      - "<c:muted>No staff notes."
    # P4. Probation (13.7): <until> = date (Europe/Oslo), <bonus> = extra ladder steps.
    probation: "<c:warning>On probation until <until> (+<bonus> step)"
    # Watchlist (13.5), only for staff with skyblock.staff.watch. <reason>, <staff>, <ago>, <expires>.
    watch:
      - ""
      - "<c:warning>Watched: <c:value><reason>"
      - "<c:muted>By <staff>, <ago> ago (until <expires>)"
    # Approval request waiting (13.4). <action>, <staff> (who asked), <reason>, <ago>, <count> = requests waiting.
    request:
      - ""
      - "<c:warning>Request: <action> by <staff>"
      - "<c:muted>(<reason>, <ago> ago)"
      - "<c:action><sym:bullet> Click to approve or deny"
    request-wait:
      - ""
      - "<c:warning>Request: <action> by <staff>"
      - "<c:muted>Waiting for an approver."
    # P5 (13.11): opened from a /logs chat line; every punishment from this menu saves it as evidence. <line>, <id>.
    evidence:
      - ""
      - "<c:info>Evidence from the logs <c:muted>(#<id>)</c:muted>:"
      - "<c:value><line>"
  counter:
    name: "<c:flame>Warnings: <c:value><count> / <next>"
    "off":
      - "<c:muted>Automatic warn rules are off."
    next: "<c:text>At <c:value><at></c:value> warnings: <c:flame><action>"
    no-next: "<c:muted>No automatic rule left to fire."
    repeat:
      - "<c:warning>Repeat window open until <until>:"
      - "<c:warning>any warning or mute suggests <action>"
    expiries-header: "<c:text>Active warnings expire:"
    expiry: " <c:muted><sym:bullet> <date>"
    mode:
      notify: "<c:muted>Staff decide: [Apply] / [Dismiss]"
      auto: "<c:muted>Mode: applied automatically"
    pending:
      - "<c:warning>Pending: suggested <action>"
      - "<c:action><sym:bullet> Click to apply or dismiss"
  # Bottom row. Sanctions and dry run arrive in later milestones.
  buttons:
    sanctions:
      name: "<c:muted>Sanctions"
      lore:
        - "<c:muted>Not available yet."
    kick:
      name: "<c:value>Kick"
      lore:
        - "<c:text>Kick with the default reason."
    # P5 (13.8). <max> = extras.bulk.max.
    bulk:
      name: "<c:value>Bulk punish"
      lore:
        - "<c:text>Punish up to <c:value><max></c:value> players for one reason."
        - "<c:text>Each gets their own next step."
        - "<c:muted>This player is already selected."
        - ""
        - "<c:action><sym:bullet> Click to pick the players"
    bulk-locked:
      name: "<c:muted>Bulk punish"
      lore:
        - "<c:muted>Senior staff only."
    history:
      name: "<c:value>Punishment history"
      lore:
        - "<c:text><total> punishment(s) on record."
        - ""
        - "<c:action><sym:bullet> Click to view"
    close:
      name: "<c:error>Close"
      lore: []
    more-reasons:
      name: "<c:value>More reasons"
      lore:
        - "<c:text>All <reasons> reasons by category"
        - "<c:muted>(<unplaced> not placed on this screen)"
        - ""
        - "<c:action><sym:bullet> Click to open"
    dry-run:
      name: "<c:muted>Dry run"
      lore:
        - "<c:muted>Not available yet."

# ---------------------------------------------------------------- suggestions from the warn rules
# Placeholders: <player>, <target> (clicks), <sid> (suggestion id), <count>, <action>, <reason>, <window>, <date>,
# <expires>, <staff> (who handled it), <status>, <left> (time left of an existing mute/ban).
suggest:
  notify: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:text>has <c:value><count> warnings</c:value>. Suggested: <c:value><action></c:value>.  <click:run_command:'/warns <target> apply <sid>'><hover:show_text:'<c:text>Apply <action> now'><c:action>[Apply]</c:action></hover></click> <click:run_command:'/warns <target> dismiss <sid>'><hover:show_text:'<c:text>Not too bad: apply nothing'><c:action>[Dismiss]</c:action></hover></click> <click:run_command:'/p <target>'><hover:show_text:'<c:text>Open the punish menu'><c:action>[Punish menu]</c:action></hover></click>"
  notify-repeat: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:text>was punished again within <c:value><window></c:value> of an automatic rule. Suggested: <c:value><action></c:value>.  <click:run_command:'/warns <target> apply <sid>'><hover:show_text:'<c:text>Apply <action> now'><c:action>[Apply]</c:action></hover></click> <click:run_command:'/warns <target> dismiss <sid>'><hover:show_text:'<c:text>Not too bad: apply nothing'><c:action>[Dismiss]</c:action></hover></click> <click:run_command:'/p <target>'><hover:show_text:'<c:text>Open the punish menu'><c:action>[Punish menu]</c:action></hover></click>"
  auto: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:text>has <c:value><count> warnings</c:value>: auto <c:value><action></c:value> <c:muted>(#<id>)</c:muted> <click:run_command:'/history <target>'><hover:show_text:'<c:text>Open the history'><c:action>[History]</c:action></hover></click>"
  auto-repeat: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:text>was punished again within <c:value><window></c:value>: auto <c:value><action></c:value> <c:muted>(#<id>)</c:muted> <click:run_command:'/history <target>'><hover:show_text:'<c:text>Open the history'><c:action>[History]</c:action></hover></click>"
  skipped-exempt: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:text>is exempt, so the warn rules' <c:value><action></c:value> was not applied."
  # A detector (chat filter, anticheat) suggests a punishment through the suggestion API (P3, spec 12.8). <details> = "chat filter: 3 spam hits in 10s".
  api-notify: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:muted>(<details>)</c:muted><c:text>. Suggested: <c:value><reason>, <action></c:value>.  <click:run_command:'/warns <target> apply <sid>'><hover:show_text:'<c:text>Apply <action> now'><c:action>[Apply]</c:action></hover></click> <click:run_command:'/warns <target> dismiss <sid>'><hover:show_text:'<c:text>Not too bad: apply nothing'><c:action>[Dismiss]</c:action></hover></click> <click:run_command:'/p <target>'><hover:show_text:'<c:text>Open the punish menu'><c:action>[Punish menu]</c:action></hover></click>"
  skipped-already: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:text>is punished for longer <c:muted>(<left> left)</c:muted><c:text>, so <c:value><action></c:value> was skipped."
  applied: "<c:muted>[Punish]</c:muted> <c:value><staff></c:value> <c:text>applied the suggestion for <c:value><player></c:value>: <c:value><action></c:value>"
  dismissed: "<c:muted>[Punish]</c:muted> <c:value><staff></c:value> <c:text>dismissed the suggestion for <c:value><player></c:value> <c:muted>(<action>)</c:muted><c:text>. The counter restarts."
  already-handled: "<prefix><c:error><sym:cross></c:error> <c:text>Already handled by <c:value><staff></c:value>. <c:muted>(<status>)"
  expired: "<prefix><c:error><sym:cross></c:error> <c:text>This suggestion expired. Nobody handled it in time."
  not-found: "<prefix><c:error><sym:cross></c:error> <c:text>No such suggestion. Use <c:value>/warns</c:value> and the name to see what's waiting."
  status:
    pending: "pending"
    applied: "applied"
    dismissed: "dismissed"
    auto: "applied automatically"
    skipped: "skipped"
    removed: "removed (warning undone)"
    requested: "sent for approval"
  menu:
    title: "Suggestion"
    info:
      name: "<c:flame>Suggested: <action>"
      lore:
        - "<c:text>Player: <c:value><player>"
        - "<c:text>Reason: <c:value><reason>"
        - "<c:text>Warnings: <c:value><count>"
        - "<c:text>Created: <c:value><date>"
        - "<c:text>Disappears in: <c:value><expires>"
    apply:
      name: "<c:success><sym:check> Apply"
      lore:
        - "<c:text>Applies <c:flame><action></c:flame> now, as you."
        - "<c:muted>Undo any time with /unmute or /unban."
    dismiss:
      name: "<c:error><sym:cross> Dismiss"
      lore:
        - "<c:text>Not too bad: apply nothing."
        - "<c:muted>The warning counter still restarts."

# ---------------------------------------------------------------- /warns <player>
warns:
  header: "<prefix><c:text>Warnings of <c:value><player></c:value><c:text>: <c:value><count> / <next></c:value>  <click:run_command:'/p <target>'><hover:show_text:'<c:text>Open the punish menu'><c:action>[Punish menu]</c:action></hover></click>"
  rules-off: " <c:muted>Automatic warn rules are off."
  mode: " <c:text>Mode: <c:value><mode></c:value> <c:muted><sym:dot></c:muted> <c:text>warnings expire after <c:value><expire>"
  modes:
    notify: "staff decide"
    auto: "automatic"
  rule: " <c:text>At <c:value><at></c:value> warnings: <c:value><action>"
  repeat-rule: " <c:text>Again within <c:value><window></c:value> of a rule: <c:value><action>"
  none: " <c:success><sym:check></c:success> <c:text>No warnings count."
  line: " <c:ember><sym:bullet></c:ember> <hover:show_text:'<c:text>By <staff> on <date><newline>Counts: <weight><newline><ack>'><c:muted>#<id></c:muted> <c:text><reason></hover> <c:muted>(stops counting <expires>)"
  # Hover of a warning line (P3, spec 12.6).
  ack-yes: "Acknowledged by the player"
  ack-no: "Not acknowledged yet"
  # A waiting suggestion from a detector (P3, spec 12.8). Same placeholders as suggest.*, plus <details>.
  api-pending: " <c:warning><sym:cross></c:warning> <c:text>Suggested by <details>: <c:value><reason>, <action></c:value> <c:muted>(gone in <expires>)</c:muted>  <click:run_command:'/warns <target> apply <sid>'><hover:show_text:'<c:text>Apply <action> now'><c:action>[Apply]</c:action></hover></click> <click:run_command:'/warns <target> dismiss <sid>'><hover:show_text:'<c:text>Apply nothing'><c:action>[Dismiss]</c:action></hover></click>"
  repeat-open: " <c:warning><sym:cross></c:warning> <c:text>Repeat window open until <c:value><until></c:value>: any warning or mute suggests <c:value><action></c:value>."
  pending: " <c:warning><sym:cross></c:warning> <c:text>Pending: suggested <c:value><action></c:value> <c:muted>(<reason>, gone in <expires>)</c:muted>  <click:run_command:'/warns <target> apply <sid>'><hover:show_text:'<c:text>Apply <action> now'><c:action>[Apply]</c:action></hover></click> <click:run_command:'/warns <target> dismiss <sid>'><hover:show_text:'<c:text>Apply nothing'><c:action>[Dismiss]</c:action></hover></click>"
  footer: " <click:run_command:'/history <target>'><hover:show_text:'<c:text>All punishments'><c:action>[Full history]</c:action></hover></click>"

# ---------------------------------------------------------------- punishments.yml validation (console + staff)
# <file>, <line>, <path> are always there; <value>, <other>, <section>, <detail> where it makes sense.
# <hint> = config.hint when a close match exists ("did you mean").
config:
  hint: " (did you mean \"<suggestion>\"?)"
  loaded: "punishments.yml loaded: <reasons> reasons, <rules> warn rule(s), mode <mode>."
  rejected: "<prefix><c:error><sym:cross></c:error> <c:value>punishments.yml</c:value> <c:text>has <c:value><count></c:value> error(s). The last working config stays active."
  rejected-default: "<prefix><c:error><sym:cross></c:error> <c:value>punishments.yml</c:value> <c:text>has <c:value><count></c:value> error(s). Using the built-in default until it's fixed."
  line: " <c:error><sym:bullet></c:error> <c:text><problem>"
  more: " <c:muted>... and <more> more (see the console)."
  yaml-invalid: "<file> line <line>: not valid YAML: <detail>"
  missing-section: "<file>: missing section '<section>'"
  missing-optional: "<file>: no '<section>' section, using defaults"
  not-a-section: "<file> line <line>: <path>: '<value>' must be a section"
  bad-id: "<file> line <line>: <path>: id '<value>' may only use a-z, 0-9 and -"
  duplicate-id: "<file> line <line>: <path>: id '<value>' is already used at <other>"
  empty-ladder: "<file> line <line>: <path>: needs a list with at least one step, e.g. [\"warn\", \"mute 1h\"]"
  bad-step: "<file> line <line>: <path>: unknown step \"<value>\"<hint>. Steps: warn, kick, mute 1h, ban 7d, ipban perm"
  bad-step-time: "<file> line <line>: <path>: \"<value>\" has a bad time (use 30m, 1h, 7d or perm; kick takes no time; warn takes an optional weight like 0.5)"
  bad-icon: "<file> line <line>: <path>: '<value>' is not an item<hint>"
  unknown-reason: "<file> line <line>: <path>: no reason '<value>' in categories<hint>"
  unknown-button: "<file> line <line>: <path>: unknown button '<value>'<hint>"
  reason-placed-twice: "<file> line <line>: <path>: reason '<value>' is already placed at <other>"
  bad-slot: "<file> line <line>: <path>: slot '<value>' must be a number from 0 to 53"
  duplicate-slot: "<file> line <line>: <path>: slot <value> is already used by <other>"
  bad-boolean: "<file> line <line>: <path>: '<value>' must be true or false"
  bad-mode: "<file> line <line>: <path>: mode '<value>' must be notify or auto<hint>"
  bad-duration: "<file> line <line>: <path>: '<value>' is not a time (use 30m, 1h, 7d)"
  bad-rules: "<file> line <line>: <path>: must be a list of rules (- at: 2 / action: \"mute 1h\")"
  bad-rule-at: "<file> line <line>: <path>: 'at' must be a whole number of 1 or more, not '<value>'"
  duplicate-rule-at: "<file> line <line>: <path>: there is already a rule at <value> warnings"
  bad-rule-action: "<file> line <line>: <path>: \"<value>\" is not allowed: automatic actions must be a mute or ban (never warn or kick)"
  repeat-incomplete: "<file> line <line>: <path>: repeat-window and repeat-action go together; the repeat rule is off"
  bad-zone: "<file> line <line>: <path>: '<value>' is not a time zone (example: Europe/Oslo)"
  bad-period: "<file> line <line>: <path>: '<value>' must be 24h, 7d, 30d or all<hint>"
  bad-number: "<file> line <line>: <path>: '<value>' must be a whole number from <min> to <max>"
  confirm-longer: "<file> line <line>: <path>: duplicate-confirm is longer than duplicate-window (it still works)"
  bad-weight: "<file> line <line>: <path>: weight '<value>' must be a number from 0.1 to 10 with at most one decimal (0.5, 1, 2)"
  bad-link: "<file> line <line>: <path>: '<value>' is not a valid link (no spaces, quotes or < >)"
  webhook-in-config: "<file> line <line>: <path>: the Discord webhook URL is a secret and must not be in this file (it goes in secrets/discord.yml on the server)"
  unknown-key: "<file> line <line>: <path>: unknown key '<value>'<hint>"
  bad-color: "<file> line <line>: <path>: '<value>' is not a colour (use \"#e74c3c\")"
  missing-key: "<file> line <line>: <path>: '<key>' is required"
  # P4 (spec 13.4)
  bad-approval-rules: "<file> line <line>: <path>: must be a list, e.g. [ban perm, ipban *, ban >= 30d]"
  bad-approval-rule: "<file> line <line>: <path>: rule '<value>' is not valid<hint>. Use ban, ipban or mute with perm, *, a time, >= time or > time"
  bad-list: "<file> line <line>: <path>: must be a list"

# ---------------------------------------------------------------- [Undo] (P2, spec 12.1)
# Placeholders as in notify.* (<player>, <type>, <reason>, <id>, <length>), plus <window> = extras.undo-window.
undo:
  offer: "<prefix><c:success><sym:check></c:success> <type> <c:text>for <c:value><player></c:value>. <c:muted>(#<id>)</c:muted> <undo>"
  button: "<c:action>[Undo]</c:action>"
  hover: "<c:text>Undo this mistake. Works for <window>."
  # Stored as the pardon reason. <staff> = who clicked.
  reason: "Undone by <staff> (mistake)"
  notify: "<c:muted>[Staff]</c:muted> <click:run_command:'/history <target>'><hover:show_text:'<c:text>Click for history'><c:value><staff></c:value> <c:text>undid</c:text> <type> <c:muted>#<id></c:muted> <c:text>for <c:value><player></c:value> <c:muted>(given by <by>)</hover></click>"
  expired: "<prefix><c:error><sym:cross></c:error> <c:text>Too late to undo <c:muted>(<window>)</c:muted><c:text>. Use <c:value>/unmute</c:value>, <c:value>/unban</c:value> or <c:value>/unwarn</c:value>."
  not-yours: "<prefix><c:error><sym:cross></c:error> <c:text>You can only undo your own punishments."
  already: "<prefix><c:error><sym:cross></c:error> <c:text>Already removed by <c:value><by></c:value>."
  not-undoable: "<prefix><c:error><sym:cross></c:error> <c:text>A kick can't be undone."
  not-found: "<prefix><c:error><sym:cross></c:error> <c:text>That punishment doesn't exist."
  # To the player.
  player-mute: "<prefix><c:success><sym:check></c:success> <c:text>Your mute was removed. <c:muted>(staff mistake)"
  player-mute-still: "<prefix><c:text>One mute was removed, but another one is still active."
  player-warn: "<prefix><c:success><sym:check></c:success> <c:text>Your last warning was removed. <c:muted>(staff mistake)"

# ---------------------------------------------------------------- /pstats (P2, spec 12.10)
stats:
  header: "<prefix><c:text>Punishments by <c:value><staff></c:value> <c:muted>(<period>)"
  given: " <c:text>Warns <c:value><warns></c:value> <c:muted><sym:dot></c:muted> <c:text>Mutes <c:value><mutes></c:value> <c:muted><sym:dot></c:muted> <c:text>Bans <c:value><bans></c:value> <c:muted><sym:dot></c:muted> <c:text>Kicks <c:value><kicks></c:value>  <c:text>= <c:value><given></c:value> <c:text>given"
  reversed: " <c:text>Reversed: <c:value><reversed></c:value> <c:muted>(<percent>%, undone or pardoned)</c:muted>  <c:text>Net: <c:value><net>"
  suggestions: " <c:text>From automatic suggestions: <c:value><applied>"
  # P4 (spec 13.4): approval requests this staff member made, and handled as an approver (only shown when > 0).
  requests: " <c:text>Requests: <c:value><made></c:value> made <c:muted><sym:dot></c:muted> <c:text><approved> approved <c:muted><sym:dot></c:muted> <c:text><denied> denied <c:muted><sym:dot></c:muted> <c:text><waiting> waiting <c:muted><sym:dot></c:muted> <c:text><expired> expired"
  approvals: " <c:text>Requests handled: <c:value><approved></c:value> approved <c:muted><sym:dot></c:muted> <c:text><denied> denied"
  # P5 (spec 13.10): appeals this staff member handled, and their own punishments lifted by an accepted appeal (shown when > 0).
  appeals: " <c:text>Appeals handled: <c:value><accepted></c:value> accepted <c:muted><sym:dot></c:muted> <c:text><reduced> reduced <c:muted><sym:dot></c:muted> <c:text><denied> denied <c:muted><sym:dot></c:muted> <c:text>Reversed by appeal: <c:value><reversed>"
  top-header: "<prefix><c:text>Top staff <c:muted>(<period>)"
  top-empty: " <c:muted>No punishments in this period."
  top-line: " <c:muted><place>.</c:muted> <click:run_command:'/pstats <target>'><hover:show_text:'<c:text>Show details'><c:value><staff></c:value></hover></click> <c:text><given> given <c:muted><sym:dot></c:muted> <c:text><reversed> reversed (<percent>%) <c:muted><sym:dot></c:muted> <c:text>net <net>"
  bad-period: "<prefix><c:error><sym:cross></c:error> <c:text>Unknown period. Use one of: <c:value><periods>"
  no-permission-others: "<prefix><c:error><sym:cross></c:error> <c:text>You can only see your own numbers."
  periods:
    24h: "last 24 hours"
    7d: "last 7 days"
    30d: "last 30 days"
    all: "all time"

# ---------------------------------------------------------------- P3 (spec 12.4-12.12)

# Warning acknowledgement (12.6). <ack> = the clickable [I understand] (ack.button), <rules> = extras.rules-link.
ack:
  prompt: "<prefix><c:text>Read the <click:open_url:'<rules>'><hover:show_text:'<c:text>Open the rules'><c:action>[Rules]</c:action></hover></click> <c:text>and confirm: <ack> <c:muted>(or type /ack)"
  reminder: "<prefix><c:warning><sym:cross></c:warning> <c:text>You have a warning to confirm. Read the <click:open_url:'<rules>'><hover:show_text:'<c:text>Open the rules'><c:action>[Rules]</c:action></hover></click> <c:text>and confirm: <ack> <c:muted>(or /ack)"
  join: "<prefix><c:warning><sym:cross></c:warning> <c:text>You got a warning <c:muted>(/mypunishments)</c:muted><c:text>. Read the <click:open_url:'<rules>'><hover:show_text:'<c:text>Open the rules'><c:action>[Rules]</c:action></hover></click> <c:text>and confirm: <ack>"
  button: "<c:action>[I understand]</c:action>"
  hover: "<c:text>Confirm you read the warning and the rules"
  done: "<prefix><c:success><sym:check></c:success> <c:text>Thanks! Confirmed <c:value><count></c:value> warning(s)."
  nothing: "<prefix><c:text>You have no warnings to confirm."
  blocked: "<prefix><c:error><sym:cross></c:error> <c:text>Confirm your warning first: <click:run_command:'/ack'><hover:show_text:'<c:text>Confirm the warning'><c:action>[I understand]</c:action></hover></click> <c:muted>(or /ack)"
  menu:
    title: "Warning"
    button:
      name: "<c:success><sym:check> I understand"
      lore:
        - "<c:text>You got a warning from staff."
        - "<c:text>Follow the rules to avoid more."
        - ""
        - "<c:action><sym:bullet> Click to confirm"

# Evidence (12.4): stored with mutes/warns (never IP addresses).
evidence:
  ip-hidden: "[IP hidden]"
  blocked: "(blocked)"

# History entry details (12.4, 12.6). Click an entry in /history.
entry:
  info:
    name: "<type> <c:muted>#<id>"
    lore:
      - "<c:text>Reason: <c:value><reason>"
      - "<c:text>By: <c:value><staff>"
      - "<c:text>Date: <c:value><date>"
  evidence-name: "<c:value>Evidence <c:muted>(<count> lines)"
  evidence-line: "<c:muted><line>"
  evidence-more: "<c:muted>... <more> older line(s), see chat"
  evidence-click: "<c:action><sym:bullet> Click to show all lines in chat"
  evidence-none:
    name: "<c:muted>No evidence"
    lore:
      - "<c:text>No chat lines were saved,"
      - "<c:text>or they were deleted after <retention>."
  evidence-type:
    name: "<c:muted>No evidence"
    lore:
      - "<c:text>Evidence is only saved for"
      - "<c:text>mutes and warnings."
  chat-header: "<prefix><c:text>Evidence for <c:value>#<id></c:value> <c:muted>(<player>)"
  chat-line: " <c:muted><line>"

# Staff notes (12.5): /pnote <player> [text], /pnote remove <id>. Only staff ever see them.
notes:
  usage: "<prefix><c:error><sym:cross></c:error> <c:text>Use <c:value>/pnote <player> [text]</c:value> or <c:value>/pnote remove <id></c:value>."
  added: "<prefix><c:success><sym:check></c:success> <c:text>Note <c:value>#<id></c:value> added on <c:value><player></c:value>. <click:run_command:'/pnote <target>'><hover:show_text:'<c:text>Show all notes'><c:action>[Notes]</c:action></hover></click>"
  header: "<prefix><c:text>Notes on <c:value><player></c:value> <c:muted>(<count>)"
  none: " <c:muted>No notes yet. Add one with /pnote, the name and the text."
  line: " <c:ember><sym:bullet></c:ember> <c:muted>#<id> <date> <author>:</c:muted> <c:value><text></c:value> <click:run_command:'/pnote remove <nid>'><hover:show_text:'<c:text>Remove this note (kept in the log)'><c:action>[Remove]</c:action></hover></click>"
  removed: "<prefix><c:success><sym:check></c:success> <c:text>Note <c:value>#<id></c:value> on <c:value><player></c:value> removed."
  already-removed: "<prefix><c:error><sym:cross></c:error> <c:text>Note <c:value>#<id></c:value> was already removed by <c:value><by></c:value>."
  not-found: "<prefix><c:error><sym:cross></c:error> <c:text>No note <c:value>#<id></c:value>. Use <c:value>/pnote</c:value> and the name to see the ids."
  bad-id: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not a note id. Press Tab to see them."
  empty: "<prefix><c:error><sym:cross></c:error> <c:text>The note is empty. Add some text."
  too-long: "<prefix><c:error><sym:cross></c:error> <c:text>Too long <c:muted>(<length>/<max>)</c:muted><c:text>. Make it shorter."

# Report link (12.9), to the staff member who punished.
reports:
  closed: "<prefix><c:success><sym:check></c:success> <c:text>Closed <c:value><count></c:value> claimed report(s) on <c:value><player></c:value> as punished. <c:muted>(<ids>, reporters told)"
  open: "<prefix><c:value><count></c:value> <c:text>open report(s) on <c:value><player></c:value>. <click:run_command:'/reports player <target>'><hover:show_text:'<c:text>See the reports (/reports player <target>)'><c:action>[Reports]</c:action></hover></click>"

# /mypunishments (12.12): only your own data. Staff names are hidden unless extras.player-view.show-staff is on.
mine:
  header: "<prefix><c:text>Your punishments"
  no-mute: " <c:success><sym:check></c:success> <c:text>You're not muted."
  mute: " <c:error><sym:cross></c:error> <c:text>Muted: <c:value><reason></c:value> <c:muted>(#<id>)</c:muted><c:text>, ends in <c:value><left></c:value>. <click:run_command:'/appeal'><hover:show_text:'<c:text>Appeal this mute in-game (/appeal)'><c:action>[Appeal]</c:action></hover></click>"
  warnings: " <c:text>Warnings: <c:value><count> / <next>"
  warning: "   <c:ember><sym:bullet></c:ember> <c:text><reason> <c:muted>(<date>, stops counting <expires>)"
  ack: " <c:warning><sym:cross></c:warning> <c:text>You have a warning to confirm: <ack>"
  recent-header: " <c:text>Last <count>:"
  none: "   <c:success><sym:check></c:success> <c:text>Nothing on record."
  entry: "   <c:ember><sym:bullet></c:ember> <type> <c:text><reason> <c:muted>(<date>, <status>)"
  entry-staff: "   <c:ember><sym:bullet></c:ember> <type> <c:text><reason> <c:muted>(<date>, <status>, by <staff>)"

# Discord log embeds (12.11). Plain text only (no colour tags). Off until a webhook is set up (docs/LATER.md).
discord:
  titles:
    ban: "Ban"
