# Moderation (punishments) texts. MiniMessage + style tags. Reload: /skyblock reload moderation
# Common placeholders: <player> target, <staff> issuer (or "Staff" when announce.show-staff is off), <staff_real> issuer,
# <reason>, <id>, <type>, <length> (total), <expires> (time left), <date>, <appeal> (link), <target> (for clicks).
# Phase P: every text of punishments.yml lives here (reason names, warn buttons, /p menu, warn rules, config errors);
# punishments.yml only holds ids, slots, icons, ladders and rules.

words:
  permanent: "permanent"
  staff: "Staff"
  no-reason: "No reason given"
  silent: "[silent]"
  ip-wide: "IP-wide"
  account: "account"
  removed-by: "Removed by"
  alt-of: "Alt account of"
  system: "System"
  system-auto: "System (auto)"
  never: "never"
  "yes": "yes"
  "no": "no"

# How a ladder step / rule action reads ("Next step: Mute 1h"). <length> = time or "permanent".
steps:
  warn: "Warning"
  kick: "Kick"
  mute: "Mute <length>"
  ban: "Ban <length>"
  ipban: "IP-ban <length>"

# Reason names (ids from punishments.yml → categories). Also the reason text stored with the punishment.
categories:
  cheating: "Cheating"
  chat: "Chat"
  gameplay: "Gameplay"
  other: "Name / build / skin"
reasons:
  hacking: "Hacked client"
  xray: "X-ray / ESP"
  macro: "Macros / auto-clicker"
  alt-abuse: "Ban evasion"
  toxicity: "Toxicity / harassment"
  spam: "Spam / flooding"
  advertising: "Advertising"
  hate: "Hate speech / slurs"
  personal-info: "Sharing personal info"
  disrespect-staff: "Disrespecting staff"
  exploiting: "Exploiting bugs / duping"
  scamming: "Scamming"
  griefing: "Griefing (coop abuse)"
  afk-farming: "Illegal AFK farming"
  rmt: "Real-money trading"
  inappropriate-name: "Inappropriate name or nickname"
  inappropriate-build: "Inappropriate build"
  inappropriate-skin: "Inappropriate skin"

# Plain warn buttons of the /p menu (ids from punishments.yml → menu.warns). name = button, reason = stored text.
warn-buttons:
  warn-language:
    name: "Language"
    reason: "Inappropriate language"
  warn-caps-spam:
    name: "Caps / light spam"
    reason: "Caps or light spam"
  warn-rules:
    name: "Rule reminder"
    reason: "Not following the rules"
  warn-other:
    name: "Other warning"
    reason: "Staff warning"

# Reason text stored with punishments from the automatic warn rules. <count> = the rule's warn count, <window> = repeat-window.
warn-rules:
  reason: "Automatic rule: <count> warnings"
  repeat-reason: "Automatic rule: repeated within <window>"

types:
  ban: "<c:error>Ban</c:error>"
  mute: "<c:warning>Mute</c:warning>"
  warn: "<c:flame>Warning</c:flame>"
  kick: "<c:text>Kick</c:text>"

status:
  active: "Active"
  expired: "Expired"
  removed: "Removed"
  done: "Done"

# Disconnect screens.
screen:
  ban:
    - "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    - ""
    - "<c:error><bold>You are permanently banned.</bold>"
    - ""
    - "<c:text>Reason: <c:value><reason>"
    - "<c:text>Banned by: <c:value><staff>"
    - "<c:text>Ban ID: <c:value>#<id>"
    - ""
    - "<c:text>Appeal on Discord: <c:sky_ice><appeal>"
  tempban:
    - "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    - ""
    - "<c:error><bold>You are banned.</bold>"
    - ""
    - "<c:text>Reason: <c:value><reason>"
    - "<c:text>Banned by: <c:value><staff>"
    - "<c:text>Ends in: <c:value><expires>"
    - "<c:text>Ban ID: <c:value>#<id>"
    - ""
    - "<c:text>Appeal on Discord: <c:sky_ice><appeal>"
  kick:
    - "<grad:phoenix><bold>PHOENIX SKYBLOCK</bold></grad>"
    - ""
    - "<c:warning><bold>You were kicked.</bold>"
    - ""
    - "<c:text>Reason: <c:value><reason>"
    - ""
    - "<c:text>You can rejoin. Please read <c:value>/rules</c:value>."

muted:
  you: "<prefix><c:warning>You have been muted (<c:value><length></c:value>). <c:text>Reason: <c:value><reason>"
  unmuted: "<prefix><c:success><sym:check> You are no longer muted."
  blocked: "<prefix><c:error><sym:cross> You are muted<c:text>: <c:value><reason></c:value> <c:muted>(ends: <expires>, #<id>)"
  # Extra line for mutes from the automatic warn rules (<count> = warnings of the rule).
  auto: "<prefix><c:text>You received <c:value><count> warnings</c:value>, so you are muted for <c:value><length></c:value>."
  auto-repeat: "<prefix><c:text>You were warned again soon after an earlier automatic rule, so you are muted for <c:value><length></c:value>."
  # On join while muted (e.g. muted while offline).
  join: "<prefix><c:warning>You are muted<c:text>: <c:value><reason></c:value> <c:muted>(ends: <expires>, #<id>)"

warned:
  you: "<prefix><c:warning>You have been warned: <c:value><reason></c:value>. <c:text>More warnings lead to mutes or bans."
  title: "<c:warning><bold>WARNING</bold>"
  subtitle: "<c:text><reason>"

# Staff notifications (staff with skyblock.staff.notify). Hover = details, click = /history.
notify:
  ban: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline>Reason: <reason><newline>Length: <length><newline><c:action>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:error>banned</c:error> <c:value><player></c:value> <c:text>for <c:value><reason></c:value> <c:muted><silent></c:muted></click></hover>"
  tempban: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline>Reason: <reason><newline>Length: <length><newline><c:action>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:error>banned</c:error> <c:value><player></c:value> <c:text>for <c:value><length></c:value>: <c:value><reason></c:value> <c:muted><silent></c:muted></click></hover>"
  ipban: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline>Reason: <reason><newline>IP-wide<newline><c:action>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:error>IP-banned</c:error> <c:value><player></c:value> <c:text>for <c:value><reason></c:value> <c:muted><silent></c:muted></click></hover>"
  mute: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline>Reason: <reason><newline><c:action>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:warning>muted</c:warning> <c:value><player></c:value> <c:text>for <c:value><reason></c:value> <c:muted><silent></c:muted></click></hover>"
  tempmute: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline>Reason: <reason><newline>Length: <length><newline><c:action>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:warning>muted</c:warning> <c:value><player></c:value> <c:text>for <c:value><length></c:value>: <c:value><reason></c:value> <c:muted><silent></c:muted></click></hover>"
  ipmute: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline>Reason: <reason><newline>IP-wide<newline><c:action>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:warning>IP-muted</c:warning> <c:value><player></c:value> <c:text>for <c:value><reason></c:value> <c:muted><silent></c:muted></click></hover>"
  warn: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline><c:action>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:flame>warned</c:flame> <c:value><player></c:value><c:text>: <c:value><reason></c:value></click></hover>"
  kick: "<c:muted>[Staff]</c:muted> <hover:show_text:'<c:text>ID #<id><newline><c:action>Click for history'><click:run_command:'/history <target>'><c:value><staff></c:value> <c:text>kicked</c:text> <c:value><player></c:value><c:text>: <c:value><reason></c:value></click></hover>"
  unban: "<c:muted>[Staff]</c:muted> <click:run_command:'/history <target>'><hover:show_text:'<c:action>Click for history'><c:value><staff></c:value> <c:success>unbanned</c:success> <c:value><player></c:value><c:text>: <reason></hover></click>"
  unmute: "<c:muted>[Staff]</c:muted> <click:run_command:'/history <target>'><hover:show_text:'<c:action>Click for history'><c:value><staff></c:value> <c:success>unmuted</c:success> <c:value><player></c:value><c:text>: <reason></hover></click>"
  unwarn: "<c:muted>[Staff]</c:muted> <click:run_command:'/history <target>'><hover:show_text:'<c:action>Click for history'><c:value><staff></c:value> <c:success>removed a warning of</c:success> <c:value><player></c:value><c:text>: <reason></hover></click>"

# Public announcements (not for -s silent punishments; announce.public in moderation.yml).
public:
  ban: "<prefix><c:value><player></c:value> <c:text>was banned: <c:value><reason>"
  mute: "<prefix><c:value><player></c:value> <c:text>was muted: <c:value><reason>"

error:
  no-silent: "<prefix><c:error><sym:cross> You can't punish silently (-s)."
  no-ip: "<prefix><c:error><sym:cross> You can't use IP-wide punishments (-ip)."
  too-long: "<prefix><c:error><sym:cross> That's longer than your rank allows (max <c:value><max></c:value>). <c:text>Ask a higher staff member."
  self: "<prefix><c:error><sym:cross> You can't punish yourself."
  exempt: "<prefix><c:error><sym:cross> <c:value><player></c:value> can't be punished by you."
  unknown: "<prefix><c:error><sym:cross> No player named <c:value><player></c:value> has joined before."
  unknown-template: "<prefix><c:error><sym:cross> Unknown reason <c:value><reason></c:value>. <c:text>Press Tab to see all reasons."
  failed: "<prefix><c:error><sym:cross> Something went wrong. Staff can see the details in the console."
  no-known-ip: "<prefix><c:error><sym:cross> No IP address is known for that player yet (they must join once)."
  not-banned: "<prefix><c:error><sym:cross> <c:value><player></c:value> is not banned."
  not-muted: "<prefix><c:error><sym:cross> <c:value><player></c:value> is not muted."
  not-warned: "<prefix><c:error><sym:cross> <c:value><player></c:value> has no active warnings."
  kick-offline: "<prefix><c:error><sym:cross> <c:value><player></c:value> is offline, so this step (kick) can't be applied now."
  no-permission-type: "<prefix><c:error><sym:cross> You can't give this kind of punishment (<type_name>)."
  no-permission-menu: "<prefix><c:error><sym:cross> You no longer have permission to punish."
  no-permission-suggestion: "<prefix><c:error><sym:cross> You can't handle punishment suggestions."
  already-muted: "<prefix><c:warning>Nothing applied: <c:value><player></c:value> is already muted for longer (<c:value><left></c:value> left, #<id>). <c:text>Use /unmute first to change it."
  already-banned: "<prefix><c:warning>Nothing applied: <c:value><player></c:value> is already banned for longer (<c:value><left></c:value> left, #<id>). <c:text>Use /unban first to change it."
  # Double-punish protection (P2). <staff>, <ago>, <reason>, <id> of the earlier one; <confirm> = extras.duplicate-confirm.
  duplicate: "<prefix><c:warning><c:value><player></c:value> was just punished for <c:value><reason></c:value> by <c:value><staff></c:value> <ago> ago. <c:text>Do it again within <confirm> to apply anyway."
  duplicate-self: "<prefix><c:warning>You just punished <c:value><player></c:value> for <c:value><reason></c:value> <ago> ago. <c:text>Do it again within <confirm> to apply a second one."
  no-force: "<prefix><c:error><sym:cross> You can't use -force."

history:
  header: "<prefix><c:value>History of <player></c:value> <c:muted>(<total>)</c:muted> <c:text><bans> bans <sym:dot> <mutes> mutes <sym:dot> <warns> warnings <sym:dot> <kicks> kicks"
  empty: " <c:success><sym:check> No punishments."
  line: " <c:ember><sym:bullet></c:ember> <hover:show_text:'<c:text>By <staff_real> on <date><newline>Length: <length><newline><removed>'><c:muted>#<id></c:muted> <type> <c:text><reason> <c:muted>(<status>)</c:muted></hover>"
  more: " <click:run_command:'/history <target> menu'><hover:show_text:'<c:action>Open the menu'><c:action>... and <more> more. Click to open the menu.</c:action></hover></click>"

alts:
  header: "<prefix><c:value>Accounts sharing an IP with <player></c:value> <c:muted>(<count>)"
  none: " <c:success><sym:check> No other accounts found."
  line: " <c:ember><sym:bullet></c:ember> <click:run_command:'/history <target>'><hover:show_text:'<c:action>Click for history'><c:value><player></c:value></hover></click> <status> <c:muted>(seen <seen> ago)"
  banned: "<c:error>[banned]</c:error>"
  muted: "<c:warning>[muted]</c:warning>"
  clean: ""
  alert: "<c:muted>[Staff]</c:muted> <c:warning><sym:cross> Alt alert:</c:warning> <click:run_command:'/alts <target>'><hover:show_text:'<c:action>Click to see all alts'><c:value><player></c:value> <c:text>shares an IP with <c:value><count></c:value> punished account(s): <c:value><alts></hover></click>"

menu:
  summary:
    name: "<c:value><player>"
    lore:
      - "<c:text>Banned: <banned>"
      - "<c:text>Muted: <muted>"
      - ""
      - "<c:text>Bans: <c:value><bans></c:value> <c:muted><sym:dot></c:muted> <c:text>Mutes: <c:value><mutes>"
      - "<c:text>Warnings: <c:value><warns></c:value> <c:muted><sym:dot></c:muted> <c:text>Kicks: <c:value><kicks>"
  punish:
    title: "Punish"
    info:
      - "<c:text>Pick a category, then a reason."
      - "<c:text>The reason's ladder decides the punishment:"
      - "<c:text>1st offence, 2nd offence, and so on."
    history-button:
      name: "<c:value>Punishment history"
      lore:
        - "<c:text><total> punishment(s) on record."
        - ""
        - "<c:action><sym:bullet> Click to view"
  category:
    name: "<c:value><category>"
    lore:
      - "<c:text><reasons> reason(s)"
      - ""
      - "<c:action><sym:bullet> Click to choose a reason"
  empty-category:
    name: "<c:text>No reasons here"
    lore:
      - "<c:muted>Add reasons in punishments.yml."
  reason:
    name: "<c:value><reason>"
    lore:
      - "<c:text>This is offence <c:value>#<offence></c:value>."
      - "<c:text>Punishment: <c:flame><step>"
      - ""
      - "<c:muted>Ladder:"
    click: "<c:action><sym:bullet> Click to punish"
    too-long: "<c:error><sym:cross> Your rank can't do this (max <max>)"
  ladder-current: " <c:flame><sym:bullet> <n>. <step></c:flame>"
  ladder-step: " <c:muted><n>. <step>"
  confirm:
    title: "Punish <player>"
    details:
      - "<c:text>Player: <c:value><player>"
      - "<c:text>Reason: <c:value><reason>"
      - "<c:text>Offence: <c:value>#<offence>"
      - "<c:text>Punishment: <c:flame><step>"
  history:
    title: "History"
    info:
      - "<c:text>Every punishment of this player,"
      - "<c:text>newest first. Kept forever."
    empty:
      name: "<c:success><sym:check> Clean record"
      lore:
        - "<c:text>This player was never punished."
    name: "<type> <c:muted>#<id> (<status>)"
    entry:
      - "<c:text>Reason: <c:value><reason>"
      - "<c:text>By: <c:value><staff>"
      - "<c:text>Date: <c:value><date>"
      - "<c:text>Length: <c:value><length></c:value> <c:muted><sym:dot></c:muted> <c:text>Left: <c:value><left>"
      - "<c:text>Template: <c:value><template>"
      - "<c:text>Scope: <c:value><scope>"
    removed:
      - ""
      - "<c:success>Removed by <c:value><by></c:value> on <c:value><removed_date>"
      - "<c:text>Why: <c:value><removed_reason>"

# ---------------------------------------------------------------- /p <player> (single-screen menu, Phase P)
punish:
  title: "Punish"
  info:
    - "<c:text>Left: mutes (top) and warnings (bottom)."
    - "<c:text>Right: bans (top) and small things (bottom)."
    - "<c:text>One click applies the next ladder step."
  kick-reason: "Kicked by staff. Please follow the rules."
  click: "<c:action><sym:bullet> Click to apply"
  # Why a button can't be used right now (same checks as the click).
  blocked:
    self: "<c:error><sym:cross> You can't punish yourself"
    exempt: "<c:error><sym:cross> This player can't be punished by you"
    offline: "<c:error><sym:cross> Player is offline (kick needs them online)"
    permission: "<c:error><sym:cross> Your rank can't give this punishment"
    length-limit: "<c:error><sym:cross> Too long for your rank (max <max>)"
    never-shorten:
      - "<c:warning>Already punished for longer (<left> left)"
      - "<c:muted>Clicking changes nothing (never shortens)"
    # Same player + same reason within extras.duplicate-window (P2). <staff>, <ago>, <confirm>.
    duplicate:
      - "<c:warning>Just punished for this by <staff> (<ago> ago)"
      - "<c:action><sym:bullet> Click, then again within <confirm>, to apply anyway"
  reason:
    name: "<c:value><reason>"
    lore:
      - "<c:text>This is offence <c:value>#<offence></c:value>."
      - "<c:text>Next step: <c:flame><step>"
    after: "<c:muted>Then: <step>"
    after-repeat: "<c:muted>Then: <step> (last step repeats)"
    # Offences older than offence-expire (P2). <older> = how many.
    older-one: "<c:muted>(1 older offence no longer counts)"
    older: "<c:muted>(<older> older offences no longer count)"
  warn-button:
    name: "<c:flame><name>"
    lore:
      - "<c:text>One warning: <c:value><reason>"
      - "<c:muted>Counts toward the automatic rules."
  summary:
    ban-left: "<c:error>Banned: <left> left <c:muted>(<reason>)"
    mute-left: "<c:warning>Muted: <left> left <c:muted>(<reason>)"
    pending:
      - ""
      - "<c:warning>Pending: suggested <action>"
      - "<c:action><sym:bullet> Click to apply or dismiss"
    # [Undo] for Bedrock (P2): your last action on this player while extras.undo-window is open. <type>, <reason>, <id>, <left>.
    undo:
      - ""
      - "<c:text>Last action: <type> <c:muted>(<reason>, #<id>)"
      - "<c:action><sym:bullet> Click to undo <c:muted>(<left> left)"
  counter:
    name: "<c:flame>Warnings: <c:value><count> / <next>"
    "off":
      - "<c:muted>Automatic warn rules are off."
    next: "<c:text>At <c:value><at></c:value> warnings: <c:flame><action>"
    no-next: "<c:muted>No automatic rule left to fire."
    repeat:
      - "<c:warning>Repeat window open until <until>:"
      - "<c:warning>any warning or mute suggests <action>"
    expiries-header: "<c:text>Active warnings expire:"
    expiry: " <c:muted><sym:bullet> <date>"
    mode:
      notify: "<c:muted>Staff decide: [Apply] / [Dismiss]"
      auto: "<c:muted>Mode: applied automatically"
    pending:
      - "<c:warning>Pending: suggested <action>"
      - "<c:action><sym:bullet> Click to apply or dismiss"
  # Bottom row. Sanctions, bulk and dry run arrive in later milestones.
  buttons:
    sanctions:
      name: "<c:muted>Sanctions"
      lore:
        - "<c:muted>Not available yet."
    kick:
      name: "<c:value>Kick"
      lore:
        - "<c:text>Kick with the default reason."
    bulk:
      name: "<c:muted>Bulk punish"
      lore:
        - "<c:muted>Not available yet."
    history:
      name: "<c:value>Punishment history"
      lore:
        - "<c:text><total> punishment(s) on record."
        - ""
        - "<c:action><sym:bullet> Click to view"
    close:
      name: "<c:error>Close"
      lore: []
    more-reasons:
      name: "<c:value>More reasons"
      lore:
        - "<c:text>All <reasons> reasons by category"
        - "<c:muted>(<unplaced> not placed on this screen)"
        - ""
        - "<c:action><sym:bullet> Click to open"
    dry-run:
      name: "<c:muted>Dry run"
      lore:
        - "<c:muted>Not available yet."

# ---------------------------------------------------------------- suggestions from the warn rules
# Placeholders: <player>, <target> (clicks), <sid> (suggestion id), <count>, <action>, <reason>, <window>, <date>,
# <expires>, <staff> (who handled it), <status>, <left> (time left of an existing mute/ban).
suggest:
  notify: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:text>reached <c:value><count> warnings</c:value>. Suggested: <c:flame><action></c:flame>.  <click:run_command:'/warns <target> apply <sid>'><hover:show_text:'<c:action>Apply <action> now'><c:success>[Apply]</c:success></hover></click> <click:run_command:'/warns <target> dismiss <sid>'><hover:show_text:'<c:action>Not too bad: apply nothing'><c:error>[Dismiss]</c:error></hover></click> <click:run_command:'/p <target>'><hover:show_text:'<c:action>Open the punish menu'><c:sky_ice>[Open /p]</c:sky_ice></hover></click>"
  notify-repeat: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:text>was punished again within <c:value><window></c:value> of the last automatic rule. Suggested: <c:flame><action></c:flame>.  <click:run_command:'/warns <target> apply <sid>'><hover:show_text:'<c:action>Apply <action> now'><c:success>[Apply]</c:success></hover></click> <click:run_command:'/warns <target> dismiss <sid>'><hover:show_text:'<c:action>Not too bad: apply nothing'><c:error>[Dismiss]</c:error></hover></click> <click:run_command:'/p <target>'><hover:show_text:'<c:action>Open the punish menu'><c:sky_ice>[Open /p]</c:sky_ice></hover></click>"
  auto: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:text>reached <c:value><count> warnings</c:value>: automatically <c:flame><action></c:flame> <c:muted>(#<id>)</c:muted>. <click:run_command:'/history <target>'><hover:show_text:'<c:action>Click for history'><c:sky_ice>[History]</c:sky_ice></hover></click>"
  auto-repeat: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:text>was punished again within <c:value><window></c:value>: automatically <c:flame><action></c:flame> <c:muted>(#<id>)</c:muted>. <click:run_command:'/history <target>'><hover:show_text:'<c:action>Click for history'><c:sky_ice>[History]</c:sky_ice></hover></click>"
  skipped-exempt: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:text>would have been given <c:flame><action></c:flame> by the warn rules, but is exempt. Nothing applied."
  skipped-already: "<c:muted>[Punish]</c:muted> <c:value><player></c:value> <c:text>is already punished for longer (<c:value><left></c:value> left), so <c:flame><action></c:flame> was skipped (never shortens)."
  applied: "<c:muted>[Punish]</c:muted> <c:value><staff></c:value> <c:success>applied</c:success> <c:text>the suggestion for <c:value><player></c:value>: <c:flame><action></c:flame>"
  dismissed: "<c:muted>[Punish]</c:muted> <c:value><staff></c:value> <c:text>dismissed the suggestion for <c:value><player></c:value> (<action>). The counter restarts."
  already-handled: "<prefix><c:warning>Already handled by <c:value><staff></c:value> <c:muted>(<status>)</c:muted>."
  expired: "<prefix><c:warning>This suggestion expired (nobody handled it in time)."
  not-found: "<prefix><c:error><sym:cross> No such suggestion. <c:text>Type /warns and the player name to see what is waiting."
  status:
    pending: "pending"
    applied: "applied"
    dismissed: "dismissed"
    auto: "applied automatically"
    skipped: "skipped"
    removed: "removed (warning undone)"
  menu:
    title: "Suggestion"
    info:
      name: "<c:flame>Suggested: <action>"
      lore:
        - "<c:text>Player: <c:value><player>"
        - "<c:text>Reason: <c:value><reason>"
        - "<c:text>Warnings: <c:value><count>"
        - "<c:text>Created: <c:value><date>"
        - "<c:text>Disappears in: <c:value><expires>"
    apply:
      name: "<c:success><sym:check> Apply"
      lore:
        - "<c:text>Applies <c:flame><action></c:flame> now, as you."
        - "<c:muted>Undo any time with /unmute or /unban."
    dismiss:
      name: "<c:error><sym:cross> Dismiss"
      lore:
        - "<c:text>Not too bad: apply nothing."
        - "<c:muted>The warning counter still restarts."

# ---------------------------------------------------------------- /warns <player>
warns:
  header: "<prefix><c:value>Warnings of <player></c:value> <c:flame><count> / <next></c:flame>  <click:run_command:'/p <target>'><hover:show_text:'<c:action>Open the punish menu'><c:sky_ice>[Open /p]</c:sky_ice></hover></click>"
  rules-off: " <c:muted>Automatic warn rules are off."
  mode: " <c:text>Mode: <c:value><mode></c:value> <c:muted><sym:dot></c:muted> <c:text>warnings expire after <c:value><expire>"
  modes:
    notify: "staff decide"
    auto: "automatic"
  rule: " <c:text>At <c:value><at></c:value> warnings: <c:flame><action>"
  repeat-rule: " <c:text>Again within <c:value><window></c:value> of a rule: <c:flame><action>"
  none: " <c:success><sym:check> No warnings count right now."
  line: " <c:ember><sym:bullet></c:ember> <hover:show_text:'<c:text>By <staff> on <date>'><c:muted>#<id></c:muted> <c:text><reason></hover> <c:muted>(stops counting <expires>)"
  repeat-open: " <c:warning>Repeat window open until <until>: any warning or mute suggests <action>."
  pending: " <c:warning>Pending: suggested <action> <c:muted>(<reason>, disappears in <expires>)</c:muted>  <click:run_command:'/warns <target> apply <sid>'><c:success>[Apply]</c:success></click> <click:run_command:'/warns <target> dismiss <sid>'><c:error>[Dismiss]</c:error></click>"
  footer: " <click:run_command:'/history <target>'><hover:show_text:'<c:action>All punishments'><c:action>Full history</c:action></hover></click>"

# ---------------------------------------------------------------- punishments.yml validation (console + staff)
# <file>, <line>, <path> are always there; <value>, <other>, <section>, <detail> where it makes sense.
# <hint> = config.hint when a close match exists ("did you mean").
config:
  hint: " (did you mean \"<suggestion>\"?)"
  loaded: "punishments.yml loaded: <reasons> reasons, <rules> warn rule(s), mode <mode>."
  rejected: "<prefix><c:error><sym:cross> punishments.yml has <count> error(s). The previous working config stays active."
  rejected-default: "<prefix><c:error><sym:cross> punishments.yml has <count> error(s). Using the built-in default until it is fixed."
  line: " <c:error><sym:bullet></c:error> <c:text><problem>"
  more: " <c:muted>... and <more> more (see the console)."
  yaml-invalid: "<file> line <line>: not valid YAML: <detail>"
  missing-section: "<file>: missing section '<section>'"
  missing-optional: "<file>: no '<section>' section, using defaults"
  not-a-section: "<file> line <line>: <path>: '<value>' must be a section"
  bad-id: "<file> line <line>: <path>: id '<value>' may only use a-z, 0-9 and -"
  duplicate-id: "<file> line <line>: <path>: id '<value>' is already used at <other>"
  empty-ladder: "<file> line <line>: <path>: needs a list with at least one step, e.g. [\"warn\", \"mute 1h\"]"
  bad-step: "<file> line <line>: <path>: unknown step \"<value>\"<hint>. Steps: warn, kick, mute 1h, ban 7d, ipban perm"
  bad-step-time: "<file> line <line>: <path>: \"<value>\" has a bad time (use 30m, 1h, 7d or perm; warn and kick take no time)"
  bad-icon: "<file> line <line>: <path>: '<value>' is not an item<hint>"
  unknown-reason: "<file> line <line>: <path>: no reason '<value>' in categories<hint>"
  unknown-button: "<file> line <line>: <path>: unknown button '<value>'<hint>"
  reason-placed-twice: "<file> line <line>: <path>: reason '<value>' is already placed at <other>"
  bad-slot: "<file> line <line>: <path>: slot '<value>' must be a number from 0 to 53"
  duplicate-slot: "<file> line <line>: <path>: slot <value> is already used by <other>"
  bad-boolean: "<file> line <line>: <path>: '<value>' must be true or false"
  bad-mode: "<file> line <line>: <path>: mode '<value>' must be notify or auto<hint>"
  bad-duration: "<file> line <line>: <path>: '<value>' is not a time (use 30m, 1h, 7d)"
  bad-rules: "<file> line <line>: <path>: must be a list of rules (- at: 2 / action: \"mute 1h\")"
  bad-rule-at: "<file> line <line>: <path>: 'at' must be a whole number of 1 or more, not '<value>'"
  duplicate-rule-at: "<file> line <line>: <path>: there is already a rule at <value> warnings"
  bad-rule-action: "<file> line <line>: <path>: \"<value>\" is not allowed: automatic actions must be a mute or ban (never warn or kick)"
  repeat-incomplete: "<file> line <line>: <path>: repeat-window and repeat-action go together; the repeat rule is off"
  bad-zone: "<file> line <line>: <path>: '<value>' is not a time zone (example: Europe/Oslo)"
  bad-period: "<file> line <line>: <path>: '<value>' must be 24h, 7d, 30d or all<hint>"
  bad-number: "<file> line <line>: <path>: '<value>' must be a whole number from <min> to <max>"
  confirm-longer: "<file> line <line>: <path>: duplicate-confirm is longer than duplicate-window (it still works)"

# ---------------------------------------------------------------- [Undo] (P2, spec 12.1)
# Placeholders as in notify.* (<player>, <type>, <reason>, <id>, <length>), plus <window> = extras.undo-window.
undo:
  offer: "<c:muted>[Punish]</c:muted> <c:text>Done: <type> for <c:value><player></c:value> <c:muted>(#<id>)</c:muted>. <undo>"
  button: "<c:warning>[Undo]</c:warning>"
  hover: "<c:action>Undo this (mistake). Works for <window>."
  # Stored as the pardon reason. <staff> = who clicked.
  reason: "Undone by <staff> (mistake)"
  notify: "<c:muted>[Staff]</c:muted> <click:run_command:'/history <target>'><hover:show_text:'<c:action>Click for history'><c:value><staff></c:value> <c:success>undid</c:success> <type> <c:muted>#<id></c:muted> <c:text>for <c:value><player></c:value> <c:muted>(given by <by>)</hover></click>"
  expired: "<prefix><c:warning>Too late to undo (<window> passed). <c:text>Use /unmute, /unban or /unwarn."
  not-yours: "<prefix><c:error><sym:cross> You can only undo your own punishments."
  already: "<prefix><c:warning>Already removed by <c:value><by></c:value>."
  not-undoable: "<prefix><c:error><sym:cross> A kick can't be undone."
  not-found: "<prefix><c:error><sym:cross> That punishment doesn't exist."
  # To the player.
  player-mute: "<prefix><c:success><sym:check> Your mute was removed (staff mistake)."
  player-mute-still: "<prefix><c:text>One of your mutes was removed, but another one is still active."
  player-warn: "<prefix><c:success><sym:check> Your last warning was removed (staff mistake)."

# ---------------------------------------------------------------- /pstats (P2, spec 12.10)
stats:
  header: "<prefix><c:value>Punishments by <staff></c:value> <c:muted>(<period>)"
  given: " <c:text>Warns <c:value><warns></c:value> <c:muted><sym:dot></c:muted> Mutes <c:value><mutes></c:value> <c:muted><sym:dot></c:muted> Bans <c:value><bans></c:value> <c:muted><sym:dot></c:muted> Kicks <c:value><kicks></c:value>  <c:text>= <c:value><given></c:value> given"
  reversed: " <c:text>Reversed (undone or pardoned): <c:value><reversed></c:value> <c:muted>(<percent>%)</c:muted>  <c:text>Net: <c:value><net>"
  suggestions: " <c:text>Applied from automatic suggestions: <c:value><applied>"
  top-header: "<prefix><c:value>Top staff</c:value> <c:muted>(<period>)"
  top-empty: " <c:muted>No punishments in this period."
  top-line: " <c:muted><place>.</c:muted> <click:run_command:'/pstats <target>'><hover:show_text:'<c:action>Show details'><c:value><staff></c:value></hover></click> <c:text><given> given <c:muted><sym:dot></c:muted> <reversed> reversed (<percent>%) <c:muted><sym:dot></c:muted> net <net>"
  bad-period: "<prefix><c:error><sym:cross> Unknown period. <c:text>Use one of: <c:value><periods>"
  no-permission-others: "<prefix><c:error><sym:cross> You can only see your own numbers."
  periods:
    24h: "last 24 hours"
    7d: "last 7 days"
    30d: "last 30 days"
    all: "all time"
