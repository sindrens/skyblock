# Staff tools: staff mode, freeze, inspect, reports. MiniMessage + style tags (style.yml).
# Format (docs/UI_STYLE.md §3): success/error marks + gray text, values in <c:value>, clicks in <c:action>.

command-missing: "<prefix><c:error><sym:cross></c:error> <c:value>/<command></c:value> <c:text>isn't available yet."

# --- Staff mode (/staffmode) ---
mode:
  "on": "<prefix><c:success><sym:check></c:success> <c:text>Staff mode <c:value>on</c:value>. <c:muted>Inventory saved. /staffmode to leave."
  "off": "<prefix><c:success><sym:check></c:success> <c:text>Staff mode <c:value>off</c:value>. <c:muted>Inventory is back."
  staff-on: "<c:muted>[Staff]</c:muted> <c:value><staff></c:value> <c:text>entered staff mode."
  staff-off: "<c:muted>[Staff]</c:muted> <c:value><staff></c:value> <c:text>left staff mode."
  save-failed: "<prefix><c:error><sym:cross></c:error> <c:text>Staff mode cancelled: couldn't save your inventory. Nothing was lost."
  recovered: "<prefix><c:success><sym:check></c:success> <c:text>Your inventory is back (the server stopped while you were in staff mode)."
  wait: "<prefix><c:error><sym:cross></c:error> <c:text>One moment, still checking your saved inventory."
  check-failed: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't check your saved inventory. Rejoin to use /staffmode; tell an admin if it repeats."

tool:
  need-target: "<c:error><sym:cross></c:error> <c:text>Look at a player (or right-click one)."
  inspect:
    name: "<c:info><bold>Inspect</bold></c:info> <c:muted><sym:dot> Right-click a player"
    lore: ["<c:text>Profile, inventory, reports and logs.", "", "<bold><c:action>» RIGHT-CLICK</c:action></bold> <c:text>a player"]
  freeze:
    name: "<c:sky_ice><bold>Freeze</bold></c:sky_ice> <c:muted><sym:dot> Right-click a player"
    lore: ["<c:text>Freeze or unfreeze for a check.", "", "<bold><c:action>» RIGHT-CLICK</c:action></bold> <c:text>a player"]
  random-tp:
    name: "<c:flame><bold>Random player</bold></c:flame> <c:muted><sym:dot> Right-click"
    lore: ["<c:text>Teleport to a random player", "<c:text>(other staff are skipped).", "", "<bold><c:action>» RIGHT-CLICK</c:action></bold>"]
    none: "<c:muted>No players to teleport to.</c:muted>"
    done: "<c:text>Teleported to <c:value><player></c:value>"
  logs:
    name: "<c:ember><bold>Logs here</bold></c:ember> <c:muted><sym:dot> Right-click"
    lore: ["<c:text>Recent actions around you.", "", "<bold><c:action>» RIGHT-CLICK</c:action></bold>"]
  vanish:
    "on":
      name: "<c:success><bold>Vanished</bold></c:success> <c:muted><sym:dot> Right-click"
      lore: ["<c:text>Players can't see you.", "", "<bold><c:action>» RIGHT-CLICK</c:action></bold> <c:text>to show yourself"]
    "off":
      name: "<c:muted><bold>Visible</bold></c:muted> <c:muted><sym:dot> Right-click"
      lore: ["<c:warning>Players can see you!", "", "<bold><c:action>» RIGHT-CLICK</c:action></bold> <c:text>to vanish"]
  punish:
    name: "<c:error><bold>Punish</bold></c:error> <c:muted><sym:dot> Right-click a player"
    lore: ["<c:text>Opens the punishment menu.", "", "<bold><c:action>» RIGHT-CLICK</c:action></bold> <c:text>a player"]
  reports:
    name: "<c:parchment><bold>Reports</bold></c:parchment> <c:muted><sym:dot> Right-click"
    lore: ["<c:text>Open player reports.", "", "<bold><c:action>» RIGHT-CLICK</c:action></bold>"]
  exit:
    name: "<c:brand_bright><bold>Leave staff mode</bold></c:brand_bright>"
    lore: ["<c:text>Gives your own inventory back.", "", "<bold><c:action>» RIGHT-CLICK</c:action></bold>"]

# --- Freeze ---
freeze:
  done: "<prefix><c:success><sym:check></c:success> <c:text>Froze <c:value><player></c:value>."
  undone: "<prefix><c:success><sym:check></c:success> <c:text>Unfroze <c:value><player></c:value>."
  released: "<prefix><c:success><sym:check></c:success> <c:text>You're unfrozen <c:muted>(<staff>)</c:muted>. Thanks for waiting!"
  staff-on: "<c:muted>[Staff]</c:muted> <c:value><staff></c:value> <c:text>froze <c:value><player></c:value>."
  staff-off: "<c:muted>[Staff]</c:muted> <c:value><staff></c:value> <c:text>unfroze <c:value><player></c:value>."
  staff-ban-cleared: "<c:muted>[Staff]</c:muted> <c:value><player></c:value> <c:text>was banned, so the freeze was removed."
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't freeze yourself."
  exempt: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>can't be frozen."
  not-frozen: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>is not frozen."
  no-commands: "<prefix><c:error><sym:cross></c:error> <c:text>No commands while frozen. Type in chat to talk to staff."
  save-failed: "<prefix><c:warning><sym:cross></c:warning> <c:text>Done, but not saved: it may not last a restart. Tell an admin if it repeats."
  title:
    title: "<c:sky_ice><bold>FROZEN</bold></c:sky_ice>"
    subtitle: "<c:text>Don't log out <sym:dot> read the chat"
    fade-in: 0
    stay: 220
    fade-out: 10
  instructions:
    - ""
    - "  <c:sky_ice><bold>Staff froze you.</bold></c:sky_ice>"
    - "  <c:text>Don't log out: that counts as refusing the check."
    - "  <c:text>Type in chat to talk to staff, or use Discord:"
    - "  <click:open_url:'https://discord.skybornmc.net'><hover:show_text:'<c:text>Open discord.skybornmc.net'><c:action><u>discord.skybornmc.net</u></c:action></hover></click>"
    - ""
  chat: "<c:sky_ice>[Frozen]</c:sky_ice> <c:value><player></c:value><c:muted>:</c:muted> <c:text><message>"
  logout: "<c:muted>[Staff]</c:muted> <c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>logged out while frozen <c:muted>(action: <action>)"
  rejoined: "<c:muted>[Staff]</c:muted> <c:value><player></c:value> <c:text>came back and is frozen again."

# --- Inspect ---
inspect:
  unknown: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has never joined. Check the spelling."

# --- Reports (players) ---
report:
  unknown: "<prefix><c:error><sym:cross></c:error> <c:value><player></c:value> <c:text>has never joined. Check the spelling."
  self: "<prefix><c:error><sym:cross></c:error> <c:text>You can't report yourself."
  cooldown: "<prefix><c:error><sym:cross></c:error> <c:text>Report again in <c:value><time></c:value>."
  playtime: "<prefix><c:error><sym:cross></c:error> <c:text>Play <c:value><minutes> minutes</c:value> before you can report."
  too-many: "<prefix><c:error><sym:cross></c:error> <c:text>You have <c:value><max></c:value> open reports. Staff will check them soon."
  already: "<prefix><c:error><sym:cross></c:error> <c:text>You already reported them. Staff will check it soon."
  failed: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't save your report. Try again in a moment."
  # Phase P 14.5: a report block (the report-abuse ladder of punishments.yml). <time> = time left.
  blocked: "<prefix><c:error><sym:cross></c:error> <c:text>You can't use /report for <c:value><time></c:value> <c:muted>(too many false reports)</c:muted><c:text>."
  blocked-perm: "<prefix><c:error><sym:cross></c:error> <c:text>You can't use /report anymore <c:muted>(too many false reports)</c:muted><c:text>."
  sent: "<prefix><c:success><sym:check></c:success> <c:text>Report <c:value>#<id></c:value> on <c:value><player></c:value> sent. <c:muted>Thanks! You'll hear the result."
  prompt: "<prefix><c:text>Type what <c:value><player></c:value> did, in one line. <c:muted>(<cancel> to cancel, <seconds>s)"
  staff-alert:
    - "<c:muted>[Report #<id>]</c:muted> <c:value><reporter></c:value> <c:text>reported <c:value><player></c:value> <c:text>for <c:warning><reason></c:warning> <c:muted>(<open> open, <total> total)"
    - "  <c:muted><details></c:muted>"
    - "  <click:run_command:'/tp <player>'><hover:show_text:'<c:text>Teleport to <player>'><c:action>[Teleport]</c:action></hover></click> <click:run_command:'/inspect <player>'><hover:show_text:'<c:text>Inspect <player>'><c:action>[Inspect]</c:action></hover></click> <click:run_command:'/reports claim <id>'><hover:show_text:'<c:text>Claim this report'><c:action>[Claim]</c:action></hover></click>"
  closed-punished: "<prefix><c:success><sym:check></c:success> <c:text>Report <c:value>#<id></c:value> on <c:value><player></c:value>: <c:value>action taken</c:value>. Thank you!"
  closed-warned: "<prefix><c:success><sym:check></c:success> <c:text>Report <c:value>#<id></c:value> on <c:value><player></c:value>: <c:value>player warned</c:value>. Thank you!"
  closed-no-evidence: "<prefix><c:text>Report <c:value>#<id></c:value> on <c:value><player></c:value>: checked, <c:value>no evidence</c:value> found. Thanks anyway!"
  closed-invalid: "<prefix><c:text>Report <c:value>#<id></c:value> on <c:value><player></c:value>: closed, <c:value>no rule broken</c:value>."
  closed-duplicate: "<prefix><c:text>Report <c:value>#<id></c:value> on <c:value><player></c:value>: already handled in another report. Thanks!"

# --- Reports (staff) ---
reports:
  invalid-id: "<prefix><c:error><sym:cross></c:error> <c:value><input></c:value> <c:text>is not a report number."
  not-found: "<prefix><c:error><sym:cross></c:error> <c:text>Report <c:value>#<id></c:value> doesn't exist."
  not-changed: "<prefix><c:error><sym:cross></c:error> <c:text>Couldn't change report <c:value>#<id></c:value>. Closed or claimed by someone else?"
  claimed: "<prefix><c:success><sym:check></c:success> <c:text>Claimed report <c:value>#<id></c:value>."
  unclaimed: "<prefix><c:success><sym:check></c:success> <c:text>Report <c:value>#<id></c:value> is open again."
  staff-claimed: "<c:muted>[Report #<id>]</c:muted> <c:text>claimed by <c:value><staff></c:value>."
  closed: "<prefix><c:success><sym:check></c:success> <c:text>Report <c:value>#<id></c:value> closed: <c:value><outcome></c:value>."
  join-notice: "<prefix><c:value><count></c:value> <c:text>open report(s). <click:run_command:'/reports'><hover:show_text:'<c:text>Open /reports'><c:action>[View]</c:action></hover></click>"
  # Phase P 14.5: after closing a report as invalid (only that outcome counts). <player> = the reporter, <nth> = "3rd",
  # <count>, <window>, <sid> = the suggestion id. The suggestion itself is the usual [Apply] [Dismiss] line from moderation.
  invalid-count: "<prefix><c:text>This is <c:value><player></c:value><c:text>'s <c:value><nth></c:value> <c:text>invalid report in <c:value><window></c:value><c:text>."
  invalid-suggested: "<prefix><c:warning><sym:cross></c:warning> <c:text>That is too many: staff got a suggestion for <c:value><player></c:value> <c:muted>(#<sid>, false reports)</c:muted><c:text>."
  invalid-refreshed: "<prefix><c:text>The waiting false-report suggestion for <c:value><player></c:value> <c:text>was updated <c:muted>(#<sid>)</c:muted><c:text>."
  invalid-capped: "<prefix><c:muted><player> already got a false-report suggestion this week (at most one per week)."
  ordinal:
    st: "st"
    nd: "nd"
    rd: "rd"
    th: "th"

outcome:
  punished:
    name: "<c:success><bold>Punished</bold></c:success>"
    lore: ["<c:text>The report was right and <c:value><player></c:value>", "<c:text>was punished.", "", "<c:muted>Tells <reporter>: action was taken.", "<bold><c:action>» CLICK</c:action></bold> <c:text>to close"]
  warned:
    name: "<c:flame><bold>Warned</bold></c:flame>"
    lore: ["<c:value><player></c:value> <c:text>was warned.", "", "<c:muted>Tells <reporter>: the player was warned.", "<bold><c:action>» CLICK</c:action></bold> <c:text>to close"]
  no-evidence:
    name: "<c:warning><bold>No evidence</bold></c:warning>"
    lore: ["<c:text>Checked, but nothing was found.", "", "<c:muted>Tells <reporter>: no evidence.", "<bold><c:action>» CLICK</c:action></bold> <c:text>to close"]
  invalid:
    name: "<c:error><bold>Invalid</bold></c:error>"
    lore: ["<c:text>No rule was broken.", "", "<c:muted>Tells <reporter>: closed, no rule broken.", "<bold><c:action>» CLICK</c:action></bold> <c:text>to close"]
  duplicate:
    name: "<c:muted><bold>Duplicate</bold></c:muted>"
    lore: ["<c:text>Already handled in another report.", "", "<c:muted>Tells <reporter>: duplicate.", "<bold><c:action>» CLICK</c:action></bold> <c:text>to close"]

# --- Menus ---
menu:
  report:
    title: "Report <player>"
    info: ["<c:text>Pick what this player did.", "<c:text>Staff get your report right away.", "<c:muted>False reports can be punished."]
    target:
      name: "<c:value><bold><player></bold></c:value>"
      lore: ["<c:text>You are reporting this player."]
    reason:
      name: "<c:warning><bold><reason></bold></c:warning>"
      lore: ["<c:text>Report <c:value><player></c:value> for <reason>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to send"]
    other:
      name: "<c:warning><bold><reason></bold></c:warning>"
      lore: ["<c:text>Something else? Describe it", "<c:text>in one line in chat.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to type"]

  reports:
    title: "Reports"
    about: "About <player>"
    info: ["<c:text>Open: waiting for staff.", "<c:text>Claimed: someone is on it.", "<c:text>Closed: handled, with the outcome.", "<c:muted>Click a report to act on it."]
    empty:
      name: "<c:success><bold>Nothing here</bold></c:success>"
      lore: ["<c:text>No reports in this list."]
    tab:
      open:
        name: "Open"
        lore: ["<c:text>Reports nobody has claimed yet.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to show"]
      open-selected:
        name: "<c:value><bold>Open</bold></c:value>"
        lore: ["<c:success>Showing open reports."]
      claimed:
        name: "Claimed"
        lore: ["<c:text>Reports a staff member is handling.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to show"]
      claimed-selected:
        name: "<c:value><bold>Claimed</bold></c:value>"
        lore: ["<c:success>Showing claimed reports."]
      closed:
        name: "Closed"
        lore: ["<c:text>Recently closed reports.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to show"]
      closed-selected:
        name: "<c:value><bold>Closed</bold></c:value>"
        lore: ["<c:success>Showing closed reports."]
    entry:
      open:
        name: "<c:warning><bold>#<id></bold></c:warning> <c:value><player></c:value> <c:muted><sym:dot> <reason>"
        lore:
          - "<c:ember>Reporter</c:ember> <c:value><reporter>"
          - "<c:ember>Details</c:ember> <c:text><details>"
          - "<c:ember>When</c:ember> <c:text><ago> ago"
          - "<c:ember>Where</c:ember> <c:text><where>"
          - ""
          - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
      claimed:
        name: "<c:info><bold>#<id></bold></c:info> <c:value><player></c:value> <c:muted><sym:dot> <reason>"
        lore:
          - "<c:ember>Claimed by</c:ember> <c:value><claimer>"
          - "<c:ember>Reporter</c:ember> <c:value><reporter>"
          - "<c:ember>Details</c:ember> <c:text><details>"
          - "<c:ember>When</c:ember> <c:text><ago> ago"
          - "<c:ember>Where</c:ember> <c:text><where>"
          - ""
          - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"
      closed:
        name: "<c:muted><bold>#<id></bold></c:muted> <c:value><player></c:value> <c:muted><sym:dot> <reason>"
        lore:
          - "<c:ember>Outcome</c:ember> <c:value><outcome>"
          - "<c:ember>Closed by</c:ember> <c:value><closer>"
          - "<c:ember>Reporter</c:ember> <c:value><reporter>"
          - "<c:ember>Details</c:ember> <c:text><details>"
          - "<c:ember>Filed</c:ember> <c:text><ago> ago"
          - ""
          - "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"

  report-view:
    title: "#<id>"
    info: ["<c:text>Claim the report so others know you", "<c:text>are on it, check the player, then", "<c:text>close it with the outcome."]
    claim:
      name: "<c:success><bold>Claim</bold></c:success>"
      lore: ["<c:text>Tell other staff you handle this.", "<c:muted>Current: <claimer>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to claim"]
    unclaim:
      name: "<c:warning><bold>Unclaim</bold></c:warning>"
      lore: ["<c:text>Put the report back in the open list.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to unclaim"]
    teleport:
      name: "<c:value><bold>Teleport</bold></c:value>"
      lore: ["<c:text>Go to <c:value><player></c:value>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to teleport"]
    offline:
      name: "<c:muted><bold>Offline</bold></c:muted>"
      lore: ["<c:text><player> is not online."]
    inspect:
      name: "<c:info><bold>Inspect</bold></c:info>"
      lore: ["<c:text>Profile, inventory, history.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to inspect"]
    punish:
      name: "<c:error><bold>Punish</bold></c:error>"
      lore: ["<c:text>Open the punishment menu.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to punish"]
    close:
      name: "<c:brand_bright><bold>Close report</bold></c:brand_bright>"
      lore: ["<c:text>Choose the outcome.", "<c:muted>The reporter is told the result.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to close"]

  outcome:
    title: "Close #<id>"

  inspect:
    title: "Inspect <player>"
    info: ["<c:text>Everything about this player.", "<c:muted>Opening this is logged."]
    profile:
      name: "<c:value><bold><player></bold></c:value> <c:muted><sym:dot> <status>"
      lore:
        - "<c:ember>Rank</c:ember> <c:value><rank>"
        - "<c:ember>Playtime</c:ember> <c:value><playtime>"
        - "<c:ember>First joined</c:ember> <c:value><first>"
        - "<c:ember>Last seen</c:ember> <c:value><last>"
        - "<c:ember>Platform</c:ember> <c:value><platform>"
        - "<c:ember>Ping</c:ember> <c:value><ping>"
        - "<c:ember>Location</c:ember> <c:value><location>"
        - "<c:ember>Game mode</c:ember> <c:value><gamemode>"
    reports:
      name: "<c:parchment><bold>Reports</bold></c:parchment>"
      lore: ["<c:ember>Open</c:ember> <c:value><open>", "<c:ember>Total</c:ember> <c:value><total>", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to see them"]
    inventory:
      name: "<c:value><bold>Inventory</bold></c:value>"
      lore: ["<c:text>Look into <player>'s inventory.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
    enderchest:
      name: "<c:value><bold>Ender chest</bold></c:value>"
      lore: ["<c:text>Look into <player>'s ender chest.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
    teleport:
      name: "<c:value><bold>Teleport</bold></c:value>"
      lore: ["<c:text>Go to <player>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to teleport"]
    freeze:
      name: "<c:sky_ice><bold>Freeze</bold></c:sky_ice>"
      lore: ["<c:text>Freeze <player> for a check.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to freeze"]
    unfreeze:
      name: "<c:sky_ice><bold>Unfreeze</bold></c:sky_ice>"
      lore: ["<c:warning><player> is frozen.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to unfreeze"]
    offline:
      name: "<c:muted><bold>Offline</bold></c:muted>"
      lore: ["<c:text>Inventory, teleport and freeze", "<c:text>need <player> to be online."]
    punish:
      name: "<c:error><bold>Punish</bold></c:error>"
      lore: ["<c:text>Open the punishment menu.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to punish"]
    logs:
      name: "<c:ember><bold>Logs</bold></c:ember>"
      lore: ["<c:text>Everything <player> did.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]
    wardrobe:
      name: "<c:ember><bold>Wardrobe</bold></c:ember>"
      lore: ["<c:text>Sets and chest of <player>.", "", "<bold><c:action>» CLICK</c:action></bold> <c:text>to open"]

# Profile switch refused by staff rules (round 3 PR4).
profiles:
  frozen: "<prefix><c:error><sym:cross> You can't switch profiles while frozen."
  staff-mode: "<prefix><c:error><sym:cross> Leave staff mode first (<c:action>/staffmode</c:action>)."
