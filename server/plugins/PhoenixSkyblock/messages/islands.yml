    full: "<prefix><c:error><sym:cross> <c:value><island></c:value> is full (<slots> slots)."
    you: "<prefix><c:success><sym:star> <c:text>Staff added you to <c:value><island></c:value>.</c:text> <click:run_command:'/is home'><c:action>[Go there]</c:action></click>"
  kick:
