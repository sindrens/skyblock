# Chat, tab list and nametag texts. The chat/tab line formats themselves are data in chat.yml (format.*).
# MiniMessage + style tags. Player text is never parsed. Reload: /skyblock reload chat
# Format (docs/UI_STYLE.md §3): success/error marks + gray text, values in <c:value>, clicks in <c:action>.

# Hover card on a name in chat.
hover:
  - "<name>"
  - ""
  - "<c:muted>Rank</c:muted> <c:value><rank_name>"
  - "<nick_line>"
  - "<c:muted>Island</c:muted> <c:value><island>"
  - "<c:muted>Played</c:muted> <c:value><playtime>"
  - "<c:muted>Joined</c:muted> <c:value><first>"
  - "<c:muted>Discord</c:muted> <discord>"
  - "<c:muted>Ping</c:muted> <c:value><ping> ms"
  - ""
  - "<c:action><sym:bullet> Click to message"
hover-nick: "<c:muted>Real name</c:muted> <c:value><real_name>"

# Shown before chat lines for players who turned on "Chat timestamps" in /settings.
timestamp: "<c:muted>[<time>]</c:muted> "

# A viewer's own name in someone else's message.
mention: "<c:flame><bold>@<name></bold></c:flame>"

# [item] / [i] in chat. <item> has the item tooltip on hover.
item-show: "<c:muted>[</c:muted><item><c:muted> x<amount>]</c:muted>"

blocked:
  locked: "<prefix><c:error><sym:cross></c:error> <c:text>Chat is locked by staff right now."
  slow: "<prefix><c:error><sym:cross></c:error> <c:text>Slow mode is on. Chat again in <c:value><time></c:value>."
  new-player: "<prefix><c:error><sym:cross></c:error> <c:text>Welcome! You can chat in <c:value><time></c:value>. Look around with <c:value>/menu</c:value>."
  rate: "<prefix><c:error><sym:cross></c:error> <c:text>Too fast. Wait a moment."
  duplicate: "<prefix><c:error><sym:cross></c:error> <c:text>Don't repeat the same message."
  link: "<prefix><c:error><sym:cross></c:error> <c:text>Links to other sites aren't allowed."
  ip: "<prefix><c:error><sym:cross></c:error> <c:text>Server addresses aren't allowed."
  phone: "<prefix><c:error><sym:cross></c:error> <c:text>Phone numbers aren't allowed, for your safety."
  word: "<prefix><c:error><sym:cross></c:error> <c:text>Blocked by the chat filter."

staff-alert: "<c:muted>[Staff]</c:muted> <c:warning>Filter</c:warning> <c:value><player></c:value> <c:text>tried: <c:parchment><message>"

moderation:
  cleared: "<prefix><c:text>Chat cleared by <c:value><staff></c:value>."
  locked: "<prefix><c:text>Chat <c:warning>locked</c:warning> by <c:value><staff></c:value>."
  unlocked: "<prefix><c:success><sym:check></c:success> <c:text>Chat unlocked by <c:value><staff></c:value>."
  slow-on: "<prefix><c:text>Slow mode: one message per <c:value><seconds>s</c:value> <c:muted>(<staff>)"
  slow-off: "<prefix><c:success><sym:check></c:success> <c:text>Slow mode off <c:muted>(<staff>)"

staffchat:
  line: "<c:brand><bold>STAFF</bold></c:brand> <name> <c:muted>»</c:muted> <c:info><message>"
  toggle-on: "<prefix><c:success><sym:check></c:success> <c:text>Staff chat <c:value>on</c:value>. Your messages go to staff only. <c:value>/sc</c:value> to leave."
  toggle-off: "<prefix><c:success><sym:check></c:success> <c:text>Staff chat <c:value>off</c:value>."

# Tab list. Left line in the first letter's color (frost white), right line in the last letter's color (blue "MC"),
# so the lines continue the SKYBORN gradient. Lines are strikethrough spaces (Bedrock shows blank space).
tab:
  header:
    - ""
    - "<c:sky_frost><st>            </st></c:sky_frost>  <bold><grad:skyborn>SKYBORN</grad><c:sky_blue>MC</c:sky_blue></bold>  <c:sky_blue><st>            </st></c:sky_blue>"
    - "<bold><grad:phoenix>Phoenix Skyblock</grad></bold>"
    - ""
    - "<c:value><online></c:value> <c:muted>online <sym:dot> <season>"
    - ""
  footer:
    - ""
    - "<c:sky_blue>»</c:sky_blue> <grad:skyborn>play.skybornmc.net</grad> <c:sky_blue>«</c:sky_blue>"
    - ""
  # Staff only (skyblock.staff.tab), under the footer. <tps> is one of tab.tps.* below.
  footer-staff: "<c:muted>TPS</c:muted> <tps>  <c:muted><sym:dot></c:muted>  <c:muted>Ping</c:muted> <c:value><ping> ms</c:value>"
  tps:
    good: "<c:success><value>"
    ok: "<c:warning><value>"
    bad: "<c:error><value>"
