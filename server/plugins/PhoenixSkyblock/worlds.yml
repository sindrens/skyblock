# Phoenix Skyblock worlds (see docs/WORLD.md).
# Every world listed here is created on startup if it doesn't exist (void, no terrain) and its settings are re-applied
# on every start, so this file is the single source of truth. Edit, then restart or /skyblock reload.
#
# create:      false = the world is made by the server itself (the main world from server.properties level-name)
# biome:       vanilla biome id used for the whole void world
# spawn:       world spawn point; a small platform is placed under it if there is nothing there yet (for builders)
# border:      world border diameter in blocks, centred on 0,0 (0 = no border). Islands/outposts get per-island borders from the plugin
# time:        fixed time of day (0-24000) when advance_time is false; omit to leave as is
# gamerules:   vanilla game rule ids (26.x snake_case names, e.g. advance_weather)

defaults:
  gamerules:
    show_advancement_messages: false   # vanilla advancements are disabled; we have custom achievements
    show_death_messages: false         # custom death messages
    keep_inventory: true               # death rules are handled by the plugin (docs/REVIEW.md B7)
    immediate_respawn: true
    spawn_phantoms: false
    spawn_patrols: false
    spawn_wardens: false
    raids: false
    mob_griefing: false
    command_blocks_work: false
    fire_spread_radius_around_player: 0  # no fire spread (griefing + lag)
    locator_bar: false
    log_admin_commands: true
    send_command_feedback: true

worlds:
  spawn:
    create: false
    biome: the_void
    difficulty: peaceful
    spawn: { x: 0.5, y: 100, z: 0.5, yaw: 180 }   # spawn_base build: on the dais, facing north
    platform: polished_deepslate
    border: 1000
    time: 6000
    gamerules:
      advance_time: false
      advance_weather: false
      spawn_mobs: false
      spawn_monsters: false
      spawn_wandering_traders: false
      pvp: false
      fall_damage: false
      random_tick_speed: 0       # protects the build (no leaf decay, no growth)

  islands:
    create: true
    biome: plains
    difficulty: normal           # must not be peaceful: spawner mobs would despawn
    spawn: { x: 0.5, y: 100, z: 0.5, yaw: 0 }
    platform: stone_bricks
    border: 0
    gamerules:
      advance_time: true
      advance_weather: false       # weather and time are shown per island (/is settings, client-side)
      spawn_mobs: true             # natural spawning on; the islands module turns it off per island (/is settings,
      spawn_monsters: true         #   default: mob spawning off, animal spawning on)
      fire_spread_radius_around_player: 128   # the islands module stops fire spread per island (/is settings, default off)
      spawner_blocks_work: true
      spawn_wandering_traders: true
      pvp: false
      random_tick_speed: 3

  outposts:
    create: true
    biome: plains
    difficulty: normal
    spawn: { x: 0.5, y: 100, z: 0.5, yaw: 0 }
    platform: stone_bricks
    border: 0
    gamerules:
      advance_time: true
      advance_weather: false
      spawn_mobs: false
      spawn_monsters: false
      spawner_blocks_work: true
      spawn_wandering_traders: false
      pvp: false
      random_tick_speed: 3

  depths:
    create: true
    biome: the_void
    difficulty: normal
    spawn: { x: 7.5, y: 100, z: 14.5, yaw: 165 }  # depths_gate build: arrival pad
    platform: tuff_bricks
    border: 2000
    time: 18000                  # night sky over the Depths
    gamerules:
      advance_time: false
      advance_weather: false
      spawn_mobs: false          # mobs are spawned by the plugin per tier
      spawn_monsters: false
      pvp: false
      random_tick_speed: 0

  warzone:
    create: true
    biome: plains
    difficulty: normal
    spawn: { x: 0.5, y: 100, z: 0.5, yaw: 0 }
    platform: cracked_stone_bricks
    border: 1000
    time: 13000                  # dusk battlefield
    gamerules:
      advance_time: false
      advance_weather: false
      spawn_mobs: false
      spawn_monsters: false
      pvp: true
      random_tick_speed: 0

# Finished builds (/skyblock builds, owner/admin): .schem + .yml per build from the builders (BUILDER_BRIEF §3.5/3.6).
builds:
  # Folder with the finished builds (.schem + .yml per build, depths_layout.yml). Relative to the server folder, or an absolute path.
  folder: builds
  # Store of applied build spots (NPC pads, holograms, crates...) in the plugin folder.
  points-file: build-points.yml
  # Which builds were pasted/applied, when and by whom (plugin folder).
  state-file: builds-state.yml
  # Seconds a paste preview stays valid for its confirm.
  confirm-seconds: 60
  # Chunks loaded per tick before a paste (lower = smoother, slower).
  chunks-per-tick: 4
  # Seconds between progress messages while a paste runs.
  progress-seconds: 5
  # A paste running longer than this is reported as failed (FAWE may still finish).
  paste-timeout-minutes: 30
  # Worlds whose builds are templates (the island schematic): never pasted, only applied.
  template-worlds: [islands, outposts]
  # paste-all order: builds whose id starts with an earlier prefix go first.
  paste-order: [spawn_base, spawn_, depths_gate, depths_mine_, depths_forest_, depths_combat_, depths_, warzone_]
  # Folder (plugin folder) the islands module reads its starter schematic from.
  islands-schematics-folder: schematics

# Build portals (PORTALS): players who step into a portal of an applied build travel to its target (instant; a
# combat-tagged player waits combat-delay-seconds inside). Targets: island (create the island on first use, then always
# home), spawn, depths, warzone, world:<name>, point:<category>:<id>. Portals and their targets come from the build
# metadata (build-points.yml); the lists below override them. See docs/commands/worlds.md.
portals:
  # Build portals teleport players who step into them (portals of the applied builds).
  enabled: true
  # Portal id (or build:id) that creates/teleports to the player's island. Empty = from the build metadata (target island, or an id containing island/start).
  island-portal: ""
  # Portal ids that teleport although the build marks them closed (open the gate first).
  force-open: []
  # Portal ids that never teleport.
  disabled: []
  # portal=target entries replacing the metadata target (targets: island, spawn, depths, warzone, world:<name>, point:<category>:<id>).
  target-overrides: []
  # target=world entries: which world a target name leads to.
  world-targets: [spawn=spawn, depths=depths, warzone=warzone]
  # Worlds whose portals open only once a build of that world is applied.
  need-build: [warzone]
  # After a portal teleport, portals ignore the player this long (no bouncing back).
  grace-millis: 1000
  # After a refused portal (closed, frozen...), the next message comes at most this often.
  refusal-cooldown-millis: 2000
  # While the island portal creates/loads the island, portals ignore the player up to this long.
  island-wait-millis: 15000
  # Seconds a combat-tagged player (or anyone in the warzone) waits in the portal (owner rule: instant except in combat).
  combat-delay-seconds: 3
  # Speed a refused player is pushed out of the portal (0 = no push).
  push-back: 0.6
  # Sound key (sounds.yml) played on arrival through a portal.
  sound: teleport
  # Ticks between portal particle puffs (0 = no particles).
  particle-ticks: 10
  # Particles per puff, spread over the portal opening.
  particle-count: 6
  # The warzone world (reachable only through its portal).
  warzone-world: warzone
  # Teleports into the warzone from other worlds are refused except through its portal (staff teleports with the teleport bypass still work).
  warzone-portal-only: true
