# Essentials: teleports (/spawn, /tpa, staff /tp) and staff tools (/gm, /fly, /vanish, /invsee, ...).
# Texts are in messages/essentials.yml. Reload: /skyblock reload essentials

spawn:
  # World that /spawn teleports to (its spawn point is set by worlds.yml).
  world: spawn
  # Seconds to stand still before /spawn teleports (0 = instant, owner decision).
  # Allowed: 0 to 30
  warmup-seconds: 0
  # Seconds between two /spawn uses.
  # Allowed: 0 to 3600
  cooldown-seconds: 5
tpa:
  # Seconds before a /tpa request expires.
  # Allowed: 10 to 600
  request-timeout-seconds: 60
  # Seconds to stand still after a request is accepted (0 = instant).
  # Allowed: 0 to 30
  warmup-seconds: 3
  # Seconds between two /tpa or /tpahere requests.
  # Allowed: 0 to 3600
  cooldown-seconds: 15
  # How many open requests one player can receive at once.
  # Allowed: 1 to 20
  max-pending: 5
warmup:
  # Cancel a teleport warmup when the player moves a block.
  cancel-on-move: true
  # Cancel a teleport warmup when the player takes damage.
  cancel-on-damage: true
back:
  # Staff /back also returns to the last death location.
  remember-death: true
homes:
  # Maximum staff homes per staff member (/sethome).
  # Allowed: 1 to 50
  max: 5
give:
  # Largest amount /i and /give hand out at once.
  # Allowed: 1 to 6400
  max-amount: 2304
clear:
  # Seconds to repeat /clear <player> to confirm clearing someone else.
  # Allowed: 3 to 60
  confirm-seconds: 10
vanish:
  # Give vanished staff night vision.
  night-vision: true
join:
  # Teleport every player to spawn when they join (until islands exist).
  teleport-to-spawn: true
  # Announce new players to everyone with their join number.
  first-join-broadcast: true
  # Show a short 'Welcome back' title to returning players.
  welcome-back-title: true
  # Only players with this permission get a join/quit message (ranks + staff).
  message-permission: skyblock.join.message
respawn:
  # Players respawn at spawn after dying.
  at-spawn: true
protection:
  # Worlds with spawn protection (no building, damage, hunger, drops or mob spawning).
  worlds:
  - spawn
  # Blocks players may still use in protected worlds (* = wildcard).
  interact-allowed:
  - '*_door'
  - '*_button'
  - lever
  - '*_pressure_plate'
  - '*_fence_gate'
  - ender_chest
  - crafting_table
  - '*_sign'
  - '*_hanging_sign'
  # Falling below this Y in a protected world teleports back to spawn.
  # Allowed: -2048 to 320
  void-y: 0
menu-item:
  # Give everyone the menu item (Nether Star) in the hotbar.
  enabled: true
  # Hotbar slot of the menu item (0 = first, 8 = ninth).
  # Allowed: 0 to 8
  slot: 8
  # Command the menu item runs (without /).
  command: menu
config-version: 1
