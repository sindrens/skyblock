  essentials: "<c:ember><bold>Server</bold></c:ember> <c:muted>»</c:muted> "
  profiles: "<c:ember><bold>Profile</bold></c:ember> <c:muted>»</c:muted> "
  shardblock: "<c:ember><bold>Shards</bold></c:ember> <c:muted>»</c:muted> "
  cosmetics: "<c:ember><bold>Cosmetics</bold></c:ember> <c:muted>»</c:muted> "
  wardrobe: "<c:ember><bold>Wardrobe</bold></c:ember> <c:muted>»</c:muted> "
  rewards: "<c:ember><bold>Rewards</bold></c:ember> <c:muted>»</c:muted> "
