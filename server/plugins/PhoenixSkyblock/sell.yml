  # Spawner mob loot. Owner plan 5 Nov 2026 (never shown): one mob is worth about $3 / $6 / $10 / $18 (spawner tiers 1-4),
  # so a spawner pays back its shop price in about 100 h (tier 1) to 150 h (tier 4) before upgrades.
  mob-loot:
    # Spawner tier 1 (pig, cow, chicken, sheep, rabbit): $1 per item, about $3 per mob
    porkchop: 100
    cooked_porkchop: 100
    beef: 100
    cooked_beef: 100
    chicken: 100
    cooked_chicken: 100
    mutton: 100
    cooked_mutton: 100
    rabbit: 100
    cooked_rabbit: 100
    leather: 100
    feather: 100
    rabbit_hide: 100
    rabbit_foot: 100
    # Spawner tier 2 (zombie, skeleton, spider, slime): $5 per item, about $6 per mob. Arrows are not listed: 1 feather crafts 4 arrows.
    rotten_flesh: 500
    bone: 500
    string: 500
    spider_eye: 500
    slime_ball: 500
    # Spawner tier 3 (creeper, witch, drowned, husk): $10 per item
    gunpowder: 1000
    glowstone_dust: 1000
    # Spawner tier 4 (blaze, enderman, guardian, piglin): $36 per item, about $18 per mob (0.5 per kill)
    blaze_rod: 3600
    ender_pearl: 3600
    prismarine_shard: 3600
    prismarine_crystals: 3600
    # Spawner tier 5 (iron golem, wither skeleton, shulker): $180
    shulker_shell: 18000
    wither_skeleton_skull: 18000
    # Iron golems drop iron ingots; an ingot can't sell above raw iron (smelting), so it gets the raw iron price.
    iron_ingot: 1800

