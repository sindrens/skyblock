# Prices of crafted and smelted items come from their parts: price = cheapest recipe (sum of the parts / output count)
# x factor. A recipe with an unpriced part stays unsellable. A listed price above its derived price is lowered (no craft-
# sell loops). Factors never go above 100. economy.yml sell.derive.* switches it off and sets the depth.
derive:
  enabled: true
  factor:
    storage: 100
    shaping: 90
    decorative: 90
    dyeing: 90
    processing: 100
    other: 90
  # Never derived and never sellable (* = any characters). bone_meal: owner price S7 would break the shop x7.5 rule.
  exclude:
  - "bone_meal"
  - "bread"   # owner price decision: bread costs $15 in /shop; selling it above that would be a loop
  - "*_pickaxe"
  - "*_axe"
  - "*_shovel"
  - "*_hoe"
  - "*_sword"
  - "*_helmet"
  - "*_chestplate"
  - "*_leggings"
