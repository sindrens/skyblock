# Server list MOTD (the 2 lines under the server name). Hex colors + animated gradients.
# Text is MiniMessage: https://docs.advntr.dev/minimessage/format.html
#
# Style (owner, 2026-10-29): short, general, loud. Brand left, one big headline, a "Join Now" call to action.
# No gray. Colors:
#   SkybornMC (network, logo) = frost #E4EBF0, ice #9FC6E8, blue #6CA1D6
#   Phoenix (gamemode)        = red #C21F2B, bright red #FF3D2E, ember #FF8A1F, flame #FFD23F
#   white = the important words. Separator lines = <st> on spaces in blue.
#
# Tokens: {brand} = the brand below, {phase} = animation phase (for gradients), {countdown} = time left until
# countdown.target ("2d 1h"). Messages with {countdown} are skipped while countdown.target is empty.
# Animation: every server list refresh shows the next frame, so {phase} gradients "flow".

brand: "<bold><gradient:#E4EBF0:#9FC6E8:#E4EBF0:{phase}>SKYBORN</gradient><#6CA1D6>MC</#6CA1D6></bold>"

# Which messages rotate (ids from 'motds' below), in order.
active: [coming-soon, discord, join, platforms, countdown]

mode: rotate          # rotate = next message every rotate-seconds, random = random each refresh
rotate-seconds: 5

animation:
  enabled: true
  cycle-seconds: 6
  frames: 12

center: true

countdown:
  target: ""          # e.g. "2027-06-01T18:00" -> enables the 'countdown' message
  zone: Europe/Oslo
  finished: "NOW"

# Shown when hovering over the player count (only the 16 classic colors work there).
hover:
  - "<aqua><bold>SkybornMC</bold></aqua> <blue>»</blue> <red><bold>Phoenix Skyblock</bold></red>"
  - ""
  - "<white>Status: <gold>Season 1 coming soon"
  - "<white>Versions: <aqua>Java 1.21.5 - 26.3 <white>+ <aqua>Bedrock"
  - "<white>Discord: <aqua>discord.skybornmc.net"
  - "<white>Website: <aqua>skybornmc.net"

motds:

  # --- Before launch (active now) ---
  coming-soon:
    line1: "{brand}   <bold><gradient:#C21F2B:#FF3D2E:#FF8A1F:#FF3D2E:#C21F2B:{phase}>SKYBLOCK</gradient> <white>COMING SOON!</white></bold>"
    line2: "<st><#6CA1D6>       </#6CA1D6></st> <bold><#FFD23F>Join Now</#FFD23F></bold> <white>and rise from the ashes!</white> <st><#6CA1D6>       </#6CA1D6></st>"

  discord:
    line1: "{brand}   <bold><gradient:#FF3D2E:#FF8A1F:#FFD23F:#FF8A1F:#FF3D2E:{phase}>PHOENIX SKYBLOCK</gradient></bold>"
    line2: "<#9FC6E8>Updates at</#9FC6E8> <white><u>discord.skybornmc.net</u></white><#9FC6E8>!</#9FC6E8>"

  join:
    line1: "{brand}   <bold><gradient:#9FC6E8:#E4EBF0:#9FC6E8:{phase}>A NEW SKYBLOCK</gradient> <white>IS RISING!</white></bold>"
    line2: "<bold><#FF3D2E>Join Now</#FF3D2E></bold> <#6CA1D6>|</#6CA1D6> <white>play.skybornmc.net</white>"

  platforms:
    line1: "{brand}   <bold><#9FC6E8>JAVA</#9FC6E8> <white>&</white> <#9FC6E8>BEDROCK</#9FC6E8></bold>"
    line2: "<st><#6CA1D6>     </#6CA1D6></st> <#FF8A1F>1.21.5 - 26.3</#FF8A1F> <st><#6CA1D6>     </#6CA1D6></st> <bold><#FFD23F>Join Now!</#FFD23F></bold> <st><#6CA1D6>     </#6CA1D6></st>"

  countdown:
    line1: "{brand}   <bold><gradient:#C21F2B:#FF3D2E:#FF8A1F:#FF3D2E:#C21F2B:{phase}>SKYBLOCK RELEASE</gradient> <white>IN {countdown}!</white></bold>"
    line2: "<st><#6CA1D6>     </#6CA1D6></st> <bold><#FFD23F>Join Now</#FFD23F></bold> <white>to be ready on day one!</white> <st><#6CA1D6>     </#6CA1D6></st>"

  # --- Launch / events (put these in 'active' when the time comes) ---
  season-live:
    line1: "{brand}   <bold><gradient:#FF3D2E:#FF8A1F:#FFD23F:#FF8A1F:#FF3D2E:{phase}>SKYBLOCK</gradient> <white>OUT NOW!</white></bold>"
    line2: "<bold><#FFD23F>Join Now</#FFD23F></bold> <#6CA1D6>|</#6CA1D6> <white><u>discord.skybornmc.net</u></white>"

  just-released:
    line1: "{brand}   <bold><gradient:#C21F2B:#FF3D2E:#FF8A1F:#FFD23F:{phase}>SKYBLOCK JUST RELEASED!</gradient></bold>"
    line2: "<st><#6CA1D6>      </#6CA1D6></st> <bold><#FFD23F>Join Now</#FFD23F></bold> <white>and claim your island!</white> <st><#6CA1D6>      </#6CA1D6></st>"

  double-xp:
    line1: "{brand}   <bold><gradient:#FF8A1F:#FFD23F:#FF8A1F:{phase}>DOUBLE XP</gradient> <white>WEEKEND!</white></bold>"
    line2: "<bold><#FF3D2E>Join Now</#FF3D2E></bold> <#6CA1D6>|</#6CA1D6> <white>ends Sunday</white>"
