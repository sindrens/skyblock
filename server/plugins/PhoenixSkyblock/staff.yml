# Staff tools: staff mode (/staff), /freeze, /inspect, /report and /reports.
# Texts are in messages/staff.yml. Reload: /skyblock reload staff

mode:
  # Vanish when entering staff mode.
  vanish: true
  # Night vision in staff mode.
  night-vision: true
  # Random teleport skips other staff members.
  random-tp-skip-staff: true
  # How far the Inspect/Freeze/Punish tools reach when you look at a player (blocks).
  # Allowed: 2 to 64
  inspect-range: 16
  # Item of the Inspect tool. Use one that does nothing on its own: a spyglass zooms on the player's screen and that can't be stopped by the server.
  inspect-tool-material: ender_eye
freeze:
  # Commands a frozen player may still use (without /). Empty = none. Chat always goes to staff only; don't add /msg, /r or /tell unless frozen players may message others.
  allowed-commands: []
  # Teleports that may still move a frozen player (staff /tp, /tphere, plugins). Others (ender-pearl, chorus-fruit, consumable-effect, nether-portal, end-portal, end-gateway, spectate, exit-bed, dismount) are blocked.
  allowed-teleport-causes:
  - command
  - plugin
  # Slowness effect level shown to frozen players as a hint (0 = none). Only visual: the freeze itself holds them in place.
  # Allowed: 0 to 10
  slowness-level: 3
  # Take away the jump of frozen players (visual hint; the freeze itself holds them in place).
  block-jump: true
  # How often (ticks) frozen players are checked: back to the freeze spot, out of vehicles, flight kept. Movement is also stopped on every move.
  # Allowed: 5 to 100
  check-ticks: 10
  # After an unfreeze, fall damage is ignored this long (frozen players hover, so someone frozen in the air would otherwise fall when released).
  # Allowed: 0 to 60
  fall-grace-seconds: 10
  # How often a frozen player gets the title and chat instructions again.
  # Allowed: 3 to 120
  reminder-seconds: 10
  # What happens when a frozen player logs out: alert (staff alert + note) or ban (runs the ban command).
  logout-action: alert
  # Console command for logout-action ban (<player> is replaced).
  ban-command: ban <player> Logged out while frozen
  # A frozen player who logs out is still frozen when they come back (also after a restart). Off: logging out ends the freeze.
  keep-on-rejoin: true
reports:
  # Seconds between two reports from the same player.
  # Allowed: 0 to 3600
  cooldown-seconds: 60
  # How many open reports one player can have at once.
  # Allowed: 1 to 20
  max-open-per-player: 3
  # Minutes a player must have played before they can report (anti-abuse; 0 = no limit).
  # Allowed: 0 to 600
  min-playtime-minutes: 0
  # Maximum length of the free-text details.
  # Allowed: 10 to 255
  details-max-length: 120
  # Report reasons shown in the picker (the last one asks for free text).
  reasons:
  - Hacking
  - X-ray
  - Toxicity
  - Spam
  - Advertising
  - Exploiting
  - Inappropriate build
  - Inappropriate name
  - Other
  # How many recently closed reports /reports shows.
  # Allowed: 10 to 500
  closed-shown: 100
config-version: 1
