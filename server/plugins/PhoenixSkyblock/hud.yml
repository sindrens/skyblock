# HUD: the sidebar scoreboard. "places" picks a layout per place (own island, visiting, The Depths
# and its zones, spawn, warzone); the layouts themselves (title + lines) are in messages/hud.yml.
# Values come from placeholders, so new features (economy, islands) show up without changing this module.
# Reload: /skyblock reload hud

scoreboard:
  # Show the sidebar scoreboard (players can still turn it off for themselves).
  enabled: true
  # How often each player's scoreboard refreshes (20 ticks = 1 second). Players are spread over these ticks.
  # Allowed: 5 to 200
  update-ticks: 20
  # Maximum lines (Bedrock shows at most 15).
  # Allowed: 1 to 15
  max-lines: 15
  # Worlds without a sidebar.
  disabled-worlds: []
values:
  # Placeholder key that gives the formatted money balance (shows a dash while no module provides it).
  money: balance_formatted
  # Placeholder key for the formatted island crystals balance.
  crystals: crystals_formatted
  # Placeholder key for the formatted credits (bought + earned, always exact; C1).
  credits: credits_formatted
  # Placeholder key for the island level.
  island-level: island_level
  # Placeholder key for the island's leaderboard position.
  island-rank: island_rank
  # Placeholder key for the current objective (tutorial/quests).
  objective: objective
places:
  island:
    # Island worlds (only used when the islands module is off; otherwise its world counts).
    worlds:
    - islands
    # Layout (messages/hud.yml scoreboard.<name>) on your own island and in the island world outside any island.
    layout: island
    # Layout on someone else's island (coop players count as visitors). Falls back to the own-island layout.
    visit-layout: island-visit
  depths:
    # Worlds of The Depths.
    worlds:
    - depths
    # Layout in The Depths when no variant below matches.
    layout: depths
    # Placeholder whose plain text picks a Depths variant (depths_tier is 'Mine · Tier 3' in a zone, 'The Gate' at the hub).
    variant-placeholder: depths_tier
    # Depths variants as 'text=layout': the first whose text is in the placeholder value wins (ignoring case). Missing layouts fall back to places.depths.layout.
    variants:
    - The Gate=depths-gate
    - Forest=depths-forest
    - Combat=depths-combat
  spawn:
    # Spawn worlds.
    worlds:
    - spawn
    # Layout at spawn.
    layout: spawn
  warzone:
    # Warzone worlds (placeholder layout until the warzone is built).
    worlds:
    - warzone
    # Layout in the warzone.
    layout: warzone
config-version: 3
