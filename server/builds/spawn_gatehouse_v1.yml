  - Tile entities: 22 / budget 30 (14 banner, 6 campfire, 1 lectern, 1 barrel); max 5 per chunk. Entities: 0.
  - Portals: every trigger is a 3x4x1 AIR cuboid at z -97 inside a 5x6 frame (x c-2..c+2, y 102..107, z -96..-97). Walking line feet 102.0 -> dais (bottom slabs y 102, top 102.5) -> frame threshold (full block y 102, top 103.0): two slab steps up; the trigger is 5 blocks behind the walking line (z -92). Arrivals: teleport to landing_tp (x c+0.5, y 102.5, z -93.5); landing.y / landing_area use the feet block y 102 (the bottom slab). Yaw faces out of the bay toward the gate passage: -67 (to_warzone, x -22), -49 (to_depths, x -11), 0 (to_island), 49 (to_outposts), 67 (to_events). Order west->east: warzone, depths, island, outposts, events (depths sits next to the tutorial's island stop).
  - to_outposts and to_events are CLOSED by a removable gate: 12 iron bars in the frame's front plane z -96 (regions to_outposts_gate / to_events_gate). To open: replace those bars with air (WorldEdit //set air on the region) and enable the portal + its particle in config. Nothing else changes.
  - Text displays: portal_<id> holograms float at y 108.5 in front of a 5x1 polished blackstone nameplate (z -97) right above each lintel; event_board = 9x5 polished blackstone panel on the hall's south wall (x -30..-22, y 103..107, z -83), facing north; the crest sits over the gate arch.
  - Lighting: chandeliers (7 x 9 lanterns), sconces on pilasters / walls / tower backs, 6 braziers, lit copper bulbs, shroomlight glowing behind the warzone + island triggers, lanterns at the bays; 6 invisible light[level=15] blocks fill the gaps between fixtures; the black depths recess has one light[level=13] (black concrete still reads black). Every reachable feet cell in the plot >= 8 (noon).
  - 47 invisible light[level=0] blocks cover base grass tufts / base wall remnants inside carved spaces (this schematic pastes without air). They emit no light and have no collision.
  - Vanilla interactables to lock in spawn (WorldGuard): lectern (nook), barrel (winch room), composter (outposts bay), 2 grindstones (winch), campfires (deny item placement / extinguishing). The farmland under the wheat sample sits at y 108 on the lintel shelf, out of reach (no trampling); random tick 0 keeps it.
