notes: |
  - Entrance (south, z -193): 7-wide forecourt x -11..-5 (open sky) between two pylons; tier gate opening x -10..-6, y 100..104, z -197 is EMPTY (the gate passage z -198 too).
  - Arrival pad 3x3 x -9..-7 z -201..-199 (feet -8,100,-200, yaw 180) in the narthex. The narthex opens only through two doors in the ossuary screen (x -13..-11 / -5..-3, z -204) into the gallery z -207..-205, which reaches the hall through the corner entrances x -29..-27 / 11..13 (z -209..-208). Two right angles: no straight line from the hall reaches the pad (ray check in the build log).
  - Mob barriers: plain rails (rail[shape=north_south]) x -29..-27 and 11..13, z -209..-205 (hall entrances) and x -10..-6, z -261..-259 (north door), y 100, plus rail rows in both narthex doors (z -204) and in the exit cutting (z -271). Vanilla pathing never plans onto a rail for a mob that is NOT standing on a rail, so walking skeletons stay in the hall. A mob already on a rail (knockback, crowding) treats every rail as walkable, so the rails do not hold displaced mobs: containment of those is the code rule below (hard requirement, not a backstop).
  - DEV REQUIREMENT 1 (hard): leash check on region 'arena' every <= 10 ticks; a tier mob outside it (e.g. on a rail band) is teleported to its nearest spawn point.
  - DEV REQUIREMENT 2 (hard): tier mobs never acquire or keep a target that stands inside arrival_safe* or exit_path (no crowding at the band edges, no shooting into the narthex).
  - DEV REQUIREMENT 3 (hard): players deal no PvE damage ONLY on the three rail bands (regions no_pve_damage_band_w/e/n: x -29..-27 and 11..13, z -209..-205; x -10..-6, z -261..-259). Elsewhere (gallery, exit cutting) PvE damage stays on so a stray mob can be killed.
  - DEV REQUIREMENT 4 (mandatory): block ender pearls and wind charges in this zone (the forecourt and exit cutting are open to the sky; the hill above is decoration and must stay unreachable).
  - Ossuary grille at z -202 (bone posts x -11 / -5, connected iron bars x -10..-6, y 100..103, bone lintel y 104): a collision plane that blocks mob sight and arrows while players see through it; with it no gallery, band or arena cell has a line of sight to the pad (ray proof in the build log).
  - Crypt Archer: stays leashed to region 'miniboss_arena' (bone ring on the floor at r 11, 8 columns around).
  - Mini-boss pad: 3x3 chiseled tuff bricks x -9..-7 z -235..-233, bone-block border with 4 ember corners (shroomlight at y 98 under waxed copper grates); r <= 11 around it is clear floor, open to the sky.
  - Spawn points: 11 floor spots (feet y 100) with 3 air above, all inside 'arena', >= 14 blocks from the hall entrances and >= 12 from the north door.
  - Light: visible sources only - lanterns set flush into every column face and the wall niches (y 101), candle clusters in niches and on the loculi stacks, lanterns hanging from the beam crossings, the light shafts and the coffers (bottom y 104), floor embers (shroomlight at y 98 under waxed copper grates at y 99 - a grille over embers, not lava tiles); no hidden light blocks.
  - Unlock level 'Combat 5' on the tier signs is an ASSUMPTION (not stated in the brief/WORLD.md): tier 1 is Combat 0 and the other wings step by 5.
