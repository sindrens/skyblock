notes: |
  - Entrance (south, z -81): 7-wide clear passage x -11..-5 (feet y 100..104, open sky above the vestibule); tier gate opening x -10..-6, y 100..104, z -83 is EMPTY.
  - Arrival pad 3x3 x -9..-7 z -90..-88 (feet -8,100,-89, yaw 180 = facing the arena). It sits in a walled yard: the only connection to the arena is the lychgate (x -10..-6, z -94..-92).
  - Mob barriers: plain rails (rail[shape=east_west]) on the paving at the lychgate x -10..-6 z -94..-92 (themed as a corpse-road bier track) and at the back gate x 9..13 z -144..-142, y 100. Vanilla mob pathing never steps onto a rail (PathType UNPASSABLE_RAIL), so zombies cannot walk to the arrival pad or out of the zone; players walk over rails freely. Backstop: keep the code leash on region 'arena' (a mob knocked onto a rail could otherwise walk along it).
  - DEV FLAG (needed): players deal no PvE damage inside arrival_safe / arrival_safe_lychgate / exit_path - a player standing in the middle of a 3-deep rail band can reach a zombie at the band's edge while the zombie cannot reach him (melee strip).
  - DEV FLAG: block ender pearls and wind charges in combat zones (they could lift players onto fence pillars, crypt roofs or the chapel ruin).
  - Grave Warden: stays leashed to region 'miniboss_arena' (owner decision).
  - Exit (north, z -160): 7-wide opening x -11..-5, reached via the back gate (x 9..13, z -142) and the path behind the chapel; hidden from the arrival pad by the chapel (line-of-sight checked).
  - Mini-boss pad: 3x3 chiseled stone bricks x -9..-7 z -130..-128, red nether brick border with 4 shroomlight corners (flush floor light). r <= 7.9 around it is clear paving.
  - Spawn points: 10 floor spots (feet y 100) with 3 air above, all inside 'arena', >= 15 blocks from the lychgate.
  - Light: visible sources first (fence-pillar lanterns, crooked-post lanterns hung at y 102, carved pumpkins at plot feet, candle clusters on headstones, shroomlight pad corners); a few hidden light blocks (light[level=15], head height) fill what is left; no torches anywhere.
