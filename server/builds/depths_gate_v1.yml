  - World spawn / arrival = player_spawn (7.5, 100, 14.5), yaw 165 (north-north-west: the midpoint between the Mine gate at yaw 117 and the Forest gate at yaw 212; Minecraft yaw 180 = north, 90 = west). Set the depths world spawn there (or teleport arrivals to it). The pad sits 15 east of the court axis so the brazier tower does not hide the Combat gate.
