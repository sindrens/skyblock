  - Lighting is static: waxed copper bulbs (lit, never oxidise) flush in the floors, lanterns, campfires, shroomlight behind orange glass. No redstone. All copper is waxed. Glow berries are age 25 (do not grow). Leaves persistent.
  - Biome: forest on every column (oak leaves, grass, moss and vines get a warm green tint; nothing shows the gray the_void tint). Change to the_void outside x>15 if the owner prefers void ambience; the court has no tinted blocks except moss carpets/vines on the rim.
  - Rails at the Mine gate are decoration (no minecarts). Water: one water cauldron (forge). No fluids flow.
  - Invisible light blocks (level 15, head height) top up every reachable cell to light >= 11 at midnight; visible sources (72 copper bulbs, lanterns, campfires, glowing windows) carry the look. Do not remove them when editing.
  - Forest gate trees (oak + birch, 2x2 trunks bent into an arch, crowns to y ~124) are generated: candidates for an Axiom polish pass (branch shapes, leaf silhouettes) - keep the opening x 20..29, z -12..-4, y 100..111 clear.
